[project]
name = "devexhq-dovo"
dynamic = ["version"]
authors = [
    { name = "DevEx HQ Team", email = "team@devexhq.com" }
]
description = "Isolated Git worktrees for developer and AI agent automated workflow management.."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.9.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.13.0",
    "pre-commit>=4.6.2",
]

[project.urls]
Homepage = "https://devexhq.github.io/dovo/"
Repository = "https://github.com/devexhq/dovo"
"Bug Tracker" = "https://github.com/devexhq/dovo/issues"

[project.optional-dependencies]
dev = [
    "freezegun>=1.5.5",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-env>=1.1.0",
    "ruff>=0.6.0",
    "invoke>=2.0.0",
    "complexipy>=6.2.0",
    "basedpyright>=1.39.10",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
dovo = "dovo.cli.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Installable import package lives at src/dovo (src-layout).
[tool.hatch.build.targets.wheel]
packages = ["src/dovo"]
# Editable: add src/ to sys.path via .pth only (avoid copying into site-packages).
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

# Hatchling replacement for your dynamic GitHub Actions version script
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Ensures git tags like v1.0.0b1 map perfectly to PyPI version standards
local_scheme = "no-local-version"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config -n auto"
testpaths = ["tests"]
# Repo root must be importable so `tests.*` helpers resolve when invoked via the
# `pytest` console script (sys.path[0] is not cwd in that mode).
pythonpath = ["."]
python_classes = ["Test*", "*Tests"]
markers = [
    "slow: Long-running tests involving process group signal escalation, locks, or timeouts",
]
filterwarnings = [
    "error",
]

[tool.pytest_env]
COLUMNS = "160"
PYTHONIOENCODING = "utf-8"

[tool.coverage.run]
source = ["dovo"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".git",
    ".dovo",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "bin",
    "docs/agents/PLANNER_RULES.md",
    "**/docs/RULES.md",
]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, C4 comprehensions,
# UP pyupgrade, RUF ruff, FA future-annotations, D pydocstyle (Google),
# S101 assert ban in prod, PGH scoped ignore/noqa, SLF001 private member ban,
# PLR0913 max args <= 5, PLC0415 top-level imports only.
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "RUF", "FA", "D", "T20", "TID",
    "S101", "PGH", "SLF001", "PLR0913", "PLC0415"
]
# E501 handled by formatter; FA100 allow missing future annotations;
# D100/D101/D104/D105/D107 skip noisy docstring requirements.
ignore = ["E501", "FA100", "D100", "D104", "D105", "D107", "D101"]
dummy-variable-rgx = "^_$"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Do not use cast() to silence the type checker; fix the type or model properly."
"rich".msg = "Direct 'rich' imports are prohibited outside of 'src/dovo/cli/ui/'."
"typer.echo".msg = "Direct console output via typer.echo is prohibited. Route output through ui_dispatcher.dispatch()."
"typer.secho".msg = "Direct console output via typer.secho is prohibited. Route output through ui_dispatcher.dispatch()."
"click.echo".msg = "Direct console output via click.echo is prohibited. Route output through ui_dispatcher.dispatch()."
"click.secho".msg = "Direct console output via click.secho is prohibited. Route output through ui_dispatcher.dispatch()."

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["D", "T201", "T203", "TID251", "S101", "SLF001", "PLR0913", "PLC0415"]
"tasks.py" = ["T201", "PLR0913"]
"scripts/*" = ["PLR0913"]
"src/dovo/cli/ui/**" = ["TID251"]
"src/dovo/cli/ui/dispatcher.py" = ["TID251", "T201", "PLC0415"]
"src/dovo/cli/run/observer.py" = ["TID251"]

# Legacy exceptions scoped for follow-up refactoring:
"src/dovo/cli/cli.py" = ["SLF001"]
"src/dovo/cli/context.py" = ["SLF001"]
"src/dovo/cli/run/app.py" = ["SLF001", "PLR0913"]
"src/dovo/core/db/db.py" = ["SLF001"]
"src/dovo/engine/engine.py" = ["PLR0913"]
"src/dovo/engine/session.py" = ["PLR0913"]
"src/dovo/cli/diff/commands/root.py" = ["PLR0913"]
"src/dovo/cli/init/app.py" = ["PLR0913"]
"src/dovo/cli/init/commands/root.py" = ["PLR0913"]
"src/dovo/cli/logs/app.py" = ["PLR0913"]
"src/dovo/cli/logs/commands/show.py" = ["PLR0913"]
"src/dovo/cli/run/commands/root.py" = ["PLR0913"]
"src/dovo/cli/worktree/app.py" = ["PLR0913"]
"src/dovo/cli/worktree/commands/worktree_apply.py" = ["PLR0913"]
"src/dovo/cli/ui/formatters/common.py" = ["PLR0913"]
"src/dovo/common/process.py" = ["PLR0913"]
"src/dovo/core/bootstrap/services/initialize.py" = ["PLR0913"]
"src/dovo/core/db/repositories/*.py" = ["PLR0913"]
"src/dovo/engine/step_coordinator.py" = ["PLR0913"]
"src/dovo/core/worktree/facade.py" = ["PLR0913"]
"src/dovo/core/worktree/services/patch.py" = ["PLR0913"]
"src/dovo/engine/executors/**/*.py" = ["PLR0913"]
"src/dovo/core/artifacts/**/*.py" = ["PLR0913"]
"src/dovo/core/config/facade.py" = ["PLC0415"]
"src/dovo/core/config/validate.py" = ["PLC0415"]
"src/dovo/core/status/facade.py" = ["PLC0415"]
"src/dovo/core/sessions/history/services/reconcile.py" = ["PLC0415"]
"src/dovo/core/db/alembic/env.py" = ["PLC0415"]
"src/dovo/core/catalog/services/inventory.py" = ["TID251"]
"src/dovo/core/catalog/services/validate.py" = ["PLR0913"]
"src/dovo/common/types.py" = ["TID251"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["dovo"]
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
]

[tool.complexipy]
max-complexity-allowed = 10       # Fails the hook if any function is over 12 (default is 15)
output-format = "json"            # Change reporting style
check-script = true               # Score module-level/top-level logic, not just functions
suggest-refactors = false          # Show deterministic Rust AST-based refactor plans
failed = true

[tool.basedpyright]
# Source and test suites type-checked under recommended mode.
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "site",
    "scratch",
]
pythonVersion = "3.13"
pythonPlatform = "Linux"
typeCheckingMode = "recommended"
venvPath = "."
venv = ".venv"

# Framework / Pydantic noise that dominates first-run volume without catching
# real package bugs. Keep true type errors as errors; leave most unknown/Any
# rules at recommended defaults so they remain visible as warnings.
reportCallInDefaultInitializer = "none"  # Typer Option()/Argument() defaults
reportUnusedParameter = "none"  # Typer ctx and callback-required params
reportUnannotatedClassAttribute = "none"  # Pydantic model_config / ClassVar flood
reportUnusedCallResult = "none"  # Path.mkdir, list.append-style intentional discards
reportUninitializedInstanceVariable = "none"  # Pytest fixture-initialized instance attributes
reportMissingTypeStubs = false
