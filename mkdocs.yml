site_name: Worktree CLI Documentation
site_description: Documentation for Worktree CLI (wt) - isolated Git worktrees and AI agent workspaces
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart Tutorial: getting-started/quickstart.md
      - Workspace Configuration: getting-started/workspace-config.md
  - How-To Guides:
      - Core Concepts: guides/concepts.md
      - Authoring Blueprints: guides/authoring-blueprints.md
      - Working with Steps: guides/working-with-steps.md
      - Parameter Inputs & Expressions: guides/passing-inputs.md
      - Failure Policies & Resumption: guides/failure-handling-and-resume.md
      - AI Agent Providers: guides/agent-providers.md
  - Reference:
      - Blueprint Schema (YAML): reference/blueprint-schema.md
      - Step Schema & Types: reference/step-schema.md
      - Inputs & Placeholders: reference/inputs-schema.md
      - Assertions & Verification: reference/assertions-schema.md
      - Project Config (.worktree/config.json): reference/config-schema.md
  - Recipes & Examples:
      - TDD Loop: recipes/tdd-loop.md
      - AI Code Patcher: recipes/ai-code-patcher.md
      - CI/CD Automation: recipes/ci-cd-automation.md
  - CLI Reference:
      - Workspace Init (wt init): cli/init.md
      - Status (wt status): cli/status.md
      - Diff (wt diff): cli/diff.md
      - Config (wt config): cli/config.md
      - Run (wt run): cli/run.md
      - Resume (wt resume): cli/resume.md
      - History (wt history): cli/history.md
      - Logs (wt logs): cli/logs.md
      - Sandbox (wt sandbox): cli/sandbox.md
exclude_docs: |
  agents/*
  agents/**/*
