site_name: Dovo CLI Documentation
site_description: Documentation for Dovo CLI (dovo) - isolated Git worktrees and AI agent workspaces
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart Tutorial: getting-started/quickstart.md
      - Workspace Configuration: getting-started/workspace-config.md
  - How-To Guides:
      - Core Concepts: guides/concepts.md
      - Authoring Blueprints: guides/authoring-blueprints.md
      - Working with Steps: guides/working-with-steps.md
      - Parameter Inputs & Expressions: guides/passing-inputs.md
      - Failure Policies & Resumption: guides/failure-handling-and-resume.md
      - AI Agent Providers: guides/agent-providers.md
  - Reference:
      - Blueprint Schema (YAML): reference/blueprint-schema.md
      - Step Schema & Types: reference/step-schema.md
      - Inputs & Placeholders: reference/inputs-schema.md
      - Assertions & Verification: reference/assertions-schema.md
      - Project Config (.dovo/config.json): reference/config-schema.md
  - Recipes & Examples:
      - Feature Development Loop: recipes/feature-development-loop.md
      - AI Code Patcher: recipes/ai-code-patcher.md
      - CI/CD Automation: recipes/ci-cd-automation.md
  - CLI Reference:
      - Workspace Init (dovo init): cli/init.md
      - Status (dovo status): cli/status.md
      - Diff (dovo diff): cli/diff.md
      - Config (dovo config): cli/config.md
      - Run (dovo run): cli/run.md
      - Resume (dovo resume): cli/resume.md
      - History (dovo history): cli/history.md
      - Logs (dovo logs): cli/logs.md
      - Worktree (dovo worktree): cli/worktree.md
      - Blueprint (dovo blueprint): cli/blueprint.md
      - Step (dovo step): cli/step.md
      - Artifacts (dovo artifacts): cli/artifacts.md
      - Doctor (dovo doctor): cli/doctor.md
exclude_docs: |
  agents/*
  agents/**/*
