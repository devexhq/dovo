# Rule shapes accepted by scripts/compile_rules.py.
#
# Legacy rule:   id, title, severity, category, domain, scope, guideline, evaluation_criteria,
#                positive_example, negative_example, citation.
#
# Migrated rule: the same identity fields plus `intent` and `criteria`, and none of guideline,
#                evaluation_criteria, positive_example or negative_example (those move into the criteria).
#   intent:      one or two sentences, 40 words or fewer, saying what the rule protects.
#   criteria:    a non-empty list; ids are <rule id>.Q01, .Q02, ... in order. Each item has
#     question:  one yes/no sentence ending in '?', starting with Does, Do, Is, Are, Was, Were, Has or Have,
#                phrased so that YES means compliant.
#     kind:      mechanical or judgment. A mechanical criterion names `enforced_by`, a repo path that exists.
#     na_when:   optional condition under which the criterion does not apply.
#     positive_example, negative_example: both keys on the criterion, or instead the single key
#                example_not_applicable holding a reason specific to that criterion.
# A rule is migrated when it has `criteria`; validation errors fail the compile. See DRY-001 for a worked example.
rules:
- id: ARCH-001
  title: Strict Layered Import Flow
  severity: BLOCKER
  category: Architecture
  domain: all
  scope: src/dovo/
  intent: Imports flow one way through the layers, so a lower layer never depends on a higher one and each package can be
    understood, tested and changed without pulling in the code that sits above it.
  criteria:
  - id: ARCH-001.Q01
    question: Does common/ import nothing from core/, engine/ or cli/, other than the imports listed in LAYER_EXCEPTIONS in tests/lint/test_layer_direction.py?
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.common.exceptions import DefinitionError  # in core/catalog/'
    negative_example: 'from dovo.core.catalog.models import CatalogTier  # at runtime in common/ (hypothetical; the one real import of it, under TYPE_CHECKING in common/filesystem/models.py, is allowlisted)'
  - id: ARCH-001.Q02
    question: Does core/ import nothing from engine/ or cli/?
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.core.sessions import SessionLogEvent  # in engine/'
    negative_example: 'from dovo.engine.engine import Engine  # upward import in core/sessions/'
  - id: ARCH-001.Q03
    question: Does core/ import nothing from rich?
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: core/ returns models and leaves rendering to cli/ui/
    negative_example: 'from rich.console import Console  # in core/status/'
  - id: ARCH-001.Q04
    question: Does engine/ import nothing from cli/?
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.core.sessions import SessionLogEvent  # in engine/'
    negative_example: 'from dovo.cli.context import CliContext  # in engine/ (hypothetical module path)'
  - id: ARCH-001.Q05
    question: Does git/ import nothing from any other core/ package?
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.common.process import is_process_group_alive  # in core/git/ (hypothetical import)'
    negative_example: 'from dovo.core.project import ProjectIdentity  # in core/git/ (hypothetical import)'
  - id: ARCH-001.Q06
    question: Does inputs/ import nothing from catalog or agents?
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.core.project import ProjectIdentity  # in core/inputs/ (hypothetical import)'
    negative_example: 'from dovo.core.catalog.models import CatalogTier  # in core/inputs/ (hypothetical import)'
  - id: ARCH-001.Q07
    question: Does catalog/ import nothing from agents, sessions, engine or cli?
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.core.inputs import ParameterInput  # in core/catalog/ (hypothetical import)'
    negative_example: 'from dovo.core.sessions import SessionLogEvent  # in core/catalog/'
  - id: ARCH-001.Q08
    question: Does artifacts/ import nothing from engine?
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.core.sessions import SessionLogEvent  # in core/artifacts/ (hypothetical import)'
    negative_example: 'from dovo.engine.engine import Engine  # in core/artifacts/'
  - id: ARCH-001.Q09
    question: Does agents/ import nothing from engine?
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.core.sessions import SessionLogEvent  # in core/agents/ (hypothetical import)'
    negative_example: 'from dovo.engine.engine import Engine  # in core/agents/'
  - id: ARCH-001.Q10
    question: Does sessions/ import nothing from agents, worktree, catalog, engine or cli?
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.core.db import get_session  # in core/sessions/ (hypothetical import)'
    negative_example: 'from dovo.core.agents import BaseAgentProvider  # in core/sessions/ (hypothetical import)'
  - id: ARCH-001.Q11
    question: Does each core/ package named in the chain project/ -> {db, git, worktree, catalog, inputs, sessions, status,
      artifacts, interaction}/ -> agents/ -> diagnostics/ import only from packages at or before its own position in that chain?
    kind: judgment
    positive_example: 'from dovo.core.sessions import SessionLogEvent  # in core/diagnostics/ (hypothetical import)'
    negative_example: 'from dovo.core.diagnostics import DiagnosticsReport  # in core/project/ (hypothetical import)'
  citation: docs/agents/architecture.md#package-boundaries-import-direction
- id: ARCH-002
  title: CLI Logic Purity
  severity: BLOCKER
  category: Architecture
  domain: cli
  scope: src/dovo/cli/
  intent: Command handlers stay thin adapters over the domain layer, so business behavior lives in one place where it can be reused and tested without the CLI.
  criteria:
  - id: ARCH-002.Q01
    question: Does each CLI command handler take a CliContext as its context parameter?
    kind: judgment
    na_when: The change adds or modifies no CLI command handler.
    positive_example: 'def status_command(context: CliContext, output_format: str = "terminal") -> DovoStatusResult  # in cli/status/commands/root.py'
    negative_example: '# hypothetical: def status_command(path: Path) -> DovoStatusResult that rebuilds its own paths and database handle instead of receiving a CliContext'
  - id: ARCH-002.Q02
    question: Does each CLI command handler invoke an underlying domain service or domain entrypoint to do its work?
    kind: judgment
    na_when: The change adds or modifies no CLI command handler.
    positive_example: 'result = Status(context.paths).collect()  # in cli/status/commands/root.py'
    negative_example: '# hypothetical: a handler computes the status fields itself from raw git and config reads instead of calling Status(...).collect()'
  - id: ARCH-002.Q03
    question: Does each CLI command handler return a BaseResult model?
    kind: judgment
    na_when: The change adds or modifies no CLI command handler.
    positive_example: 'return result  # DovoStatusResult, a BaseResult subclass (core/status/models.py), in cli/status/commands/root.py'
    negative_example: '# hypothetical: a handler returns a plain dict or tuple assembled from several domain calls instead of a BaseResult model'
  - id: ARCH-002.Q04
    question: Is the CLI package free of business logic and domain orchestration, so that handlers only delegate to the domain layer and dispatch the result?
    kind: judgment
    na_when: The change adds or modifies no code under src/dovo/cli/.
    positive_example: 'result = Status(context.paths).collect(); ui_dispatcher.dispatch(result)'
    negative_example: '# hypothetical: a handler loops over worktrees, decides which to prune and calls several core services in a sequence it owns'
  - id: ARCH-002.Q05
    question: Is the CLI package free of direct SQLite queries or SQL execution?
    kind: judgment
    na_when: The change adds or modifies no code under src/dovo/cli/.
    positive_example: 'reconcile_stale_sessions(context.db.sessions, path=context.paths.root_dir)  # in cli/status/commands/root.py, goes through a core service'
    negative_example: "# hypothetical: rows = context.db.connection.execute('SELECT * FROM worktrees').fetchall() in a command handler"
  - id: ARCH-002.Q06
    question: Is the CLI package free of direct filesystem scans?
    kind: judgment
    na_when: The change adds or modifies no code under src/dovo/cli/.
    positive_example: 'Status(context.paths).collect()  # the domain layer inspects the filesystem, the handler does not'
    negative_example: "# hypothetical: a handler calls context.paths.root_dir.rglob('*.yml') to discover blueprints itself"
  citation: docs/agents/architecture.md#adding-a-new-command
- id: ARCH-003
  title: Domain Fact Origin Invariant
  severity: BLOCKER
  category: Architecture
  domain: cli
  scope: src/dovo/cli/ui/
  intent: Every domain fact the user sees is decided in one place, core/ or common/, so the display layer cannot drift from
    or contradict what the domain actually determined.
  criteria:
  - id: ARCH-003.Q01
    question: Does every status or outcome that cli/ui/ displays come from a field of a core/ or common/ model, rather than being invented in cli/ui/?
    kind: judgment
    positive_example: 'config_status=data.config.status  # in DovoStatusFormatter.transform, a ConfigLoadStatus copied unchanged from the domain result'
    negative_example: 'view.status = "partially_initialized"  # hypothetical: a new status value that no core/ or common/ model defines'
  - id: ARCH-003.Q02
    question: Does every error category that cli/ui/ displays come from a core/ or common/ model, rather than being invented in cli/ui/?
    kind: judgment
    positive_example: 'errors=list(data.errors)  # in StatusView construction, copied from the domain result'
    negative_example: 'errors.append("GitUnavailableError")  # hypothetical: cli/ui/ coins an error category the domain never reported'
  - id: ARCH-003.Q03
    question: Does every warning that cli/ui/ displays come from a core/ or common/ model, rather than being appended in cli/ui/?
    kind: judgment
    positive_example: 'warnings=list(data.warnings)  # in DovoStatusFormatter.transform, copied from the domain result'
    negative_example: 'if not result.git_status: result.warnings.append(''Git not found'')  # hypothetical: cli/ui/ originates the fact'
  - id: ARCH-003.Q04
    question: Does every remediation that cli/ui/ displays come from a core/ or common/ model, rather than being written in cli/ui/?
    kind: judgment
    positive_example: 'remediations=list(data.fixes)  # in DovoStatusFormatter.transform, copied from the domain result'
    negative_example: 'view.remediations.append("Run git init")  # hypothetical: cli/ui/ writes a remediation the domain never supplied'
  - id: ARCH-003.Q05
    question: Is every domain rule that formatters apply (for example deciding what counts as healthy or failed) defined in core/ or common/ rather than in cli/ui/?
    kind: judgment
    na_when: The formatter only maps or copies existing domain fields and applies no condition of its own.
    positive_example: 'A formatter renders result.ok as supplied by the domain result'
    negative_example: 'A formatter decides that more than three uncommitted files makes the workspace unhealthy'
  - id: ARCH-003.Q06
    question: Does cli/ui/ limit itself to deriving presentation views from existing domain fields, without adding new domain facts?
    kind: judgment
    positive_example: 'A view field such as project_name or git_branch that is read from existing DovoStatusResult fields and reformatted only for display'
    negative_example: 'A view field populated from a check that cli/ui/ runs itself, such as probing the filesystem'
  citation: docs/agents/architecture.md#package-boundaries-import-direction
- id: ARCH-004
  title: Standard Core Package Layout (Domain-Named Entrypoint)
  severity: BLOCKER
  category: Architecture
  domain: [core, engine]
  scope: src/dovo/core/, src/dovo/engine/
  intent: New domain code follows one predictable package layout with a domain-named entrypoint, so a reader finds types, errors, coordination and operations in the same places in every domain.
  criteria:
  - id: ARCH-004.Q01
    question: Does each new domain package under core/ define its types in a models.py module?
    kind: judgment
    na_when: The change adds no new domain package under core/.
    positive_example: 'src/dovo/core/worktree/models.py holds WorktreeListResult and the other worktree types'
    negative_example: 'src/dovo/core/prune/ holds a single prune.py mixing types and logic  # hypothetical: no prune/ package exists today'
  - id: ARCH-004.Q02
    question: Does each new domain package under core/ that raises its own errors define them in an exceptions.py module?
    kind: judgment
    na_when: The change adds no new domain package under core/, or the new domain raises no errors of its own.
    positive_example: 'src/dovo/core/worktree/exceptions.py'
    negative_example: 'class PruneError(Exception) defined inside src/dovo/core/prune/prune.py  # hypothetical: no prune/ package exists today'
  - id: ARCH-004.Q03
    question: Is the entrypoint coordinator or service of each new domain package named after the domain rather than generically?
    kind: judgment
    na_when: The change adds no new domain package under core/.
    positive_example: 'src/dovo/core/sessions/sessions.py  # entrypoint named after the sessions domain'
    negative_example: 'src/dovo/core/prune/facade.py  # hypothetical: generic facade.py instead of prune.py; no facade.py exists in src/ today'
  - id: ARCH-004.Q04
    question: Does each new domain package under core/ keep its imperative operations in a services/ package?
    kind: judgment
    na_when: The change adds no new domain package under core/, or the new domain has no imperative operations.
    positive_example: 'src/dovo/core/worktree/services/ contains list.py, delete.py and show.py'
    negative_example: 'src/dovo/core/prune/ with its operations written in prune.py and no services/ directory  # hypothetical'
  - id: ARCH-004.Q05
    question: Is each new imperative operation of a domain placed in its own services/<verb>.py module rather than directly in the package root?
    kind: judgment
    na_when: The change adds no new imperative operation to a domain package.
    positive_example: 'src/dovo/core/sessions/services/read_logs.py'
    negative_example: 'A new archive() function defined in src/dovo/core/sessions/__init__.py  # hypothetical: no archive operation exists; logic in the package root without a structured module'
  - id: ARCH-004.Q06
    question: Are all public models of a new domain package defined in its models.py rather than in services/?
    kind: judgment
    na_when: The change adds no public model to a domain package.
    positive_example: 'class WorktreeListResult(BaseResult) defined in src/dovo/core/worktree/models.py'
    negative_example: 'A public result model class defined inside services/prune.py  # hypothetical: public models belong in models.py'
  - id: ARCH-004.Q07
    question: Does new domain code avoid extending a legacy flat layout (a domain package or module that lacks the standard structure)?
    kind: judgment
    na_when: The change adds no code to a domain package that predates the standard layout.
    positive_example: 'New domain code gets its own package laid out like src/dovo/core/worktree/ (models.py, exceptions.py, worktree.py, services/)'
    negative_example: 'New domain logic appended to an existing flat module that has no models.py, exceptions.py or services/  # hypothetical'
  citation: docs/agents/architecture.md#adding-a-new-catalog-backed-domain
- id: ARCH-006
  title: Secrets Environment Resolution
  severity: BLOCKER
  category: Architecture
  domain: core
  scope: src/dovo/core/agents/, src/dovo/core/config/, src/dovo/core/db/
  intent: Secrets exist only in the process environment and only while a call needs them, so they never leak into stored
    configuration, the database or prompts.
  criteria:
  - id: ARCH-006.Q01
    question: Is every API key or secret read from environment variables at call time through a module-level resolve helper?
    kind: judgment
    positive_example: 'def resolve_copilot_token() -> str | None: return resolve_credential(COPILOT_TOKEN_ENVS)  # in core/agents/copilot.py, reads os.environ on each call'
    negative_example: 'TOKEN = os.environ["COPILOT_TOKEN"]  # hypothetical: captured once at import time instead of resolved at call time'
  - id: ARCH-006.Q02
    question: Is every secret absent from config.json, including the fields of DovoConfig?
    kind: judgment
    positive_example: DovoConfig in core/config/models.py declares no api_key, token or secret field
    negative_example: 'copilot_token: str = ""  # hypothetical: a secret-bearing field added to DovoConfig'
  - id: ARCH-006.Q03
    question: Is every secret absent from data.db, including the SQLite record models?
    kind: judgment
    positive_example: The SQLModel record classes in core/db/models.py declare no credential column
    negative_example: 'api_key: str  # hypothetical: a credential column added to a SQLModel record class'
  - id: ARCH-006.Q04
    question: Is every secret kept out of the arguments passed into prompt builders?
    kind: judgment
    na_when: The change adds or modifies no prompt builder and no call to one.
    positive_example: 'build_mutation_prompt(request: AgentRequest) in core/agents/cli_mutation.py receives the whole request, but _prompt_body copies only mode, worktree_path, agent_scratch_path, instruction and payload and never reads request.env'
    negative_example: 'build_prompt(task, api_key=resolve_credential(envs))  # hypothetical: a secret passed into a prompt builder'
  citation: docs/agents/architecture.md#secrets-handling
- id: RENDER-001
  title: Stateful Builder Pattern for RichOutput
  severity: BLOCKER
  category: Rendering
  domain: cli
  scope: src/dovo/cli/, src/dovo/core/
  guideline: Terminal output routes through ui_dispatcher.dispatch(result). Direct print(), rich imports, typer.echo, and
    console writes belong only in src/dovo/cli/ui/.
  evaluation_criteria: Ensure core services never instantiate RichOutput or Console. Verify .print() is only called at the
    CLI command/orchestrator level, not inside core services.
  positive_example: 'self.output.add_error(''failed'')  # cli edge calls context.output.print()'
  negative_example: output = RichOutput(); output.console.print('failed')
  citation: docs/agents/code-conventions.md#console-output-and-terminal-formatting
- id: RENDER-002
  title: Pure Layout in to_rich
  severity: BLOCKER
  category: Rendering
  domain: cli
  scope: src/dovo/cli/ui/formatters/
  guideline: to_rich(data) derives nothing. It calls transform(data) and lays out the resulting view model into Rich renderables.
  evaluation_criteria: Inspect to_rich() implementations. Flag any business logic, status calculations, or string manipulations
    that do not come directly from the view model.
  positive_example: view = self.transform(data); return Panel(Text(view.project_name))
  negative_example: color = 'green' if len(data.errors) == 0 else 'red'; return Panel(Text(color))
  citation: docs/agents/code-conventions.md#console-output-and-terminal-formatting
- id: RENDER-003
  title: Inline Error and Warning String Construction
  severity: SUGGESTION
  category: Rendering
  domain: all
  scope: src/dovo/
  guideline: Construct errors, warnings, and fixes strings using inline f-strings or literals at call sites. Do not create
    private single-message formatting wrappers.
  evaluation_criteria: Flag private helper functions whose sole purpose is formatting a single error or warning string.
  positive_example: 'errors.append(f"Blueprint ''{path}'' invalid: {err}")'
  negative_example: errors.append(self._format_validation_error(path, err))
  citation: docs/agents/code-conventions.md#console-output-and-terminal-formatting
- id: RENDER-004
  title: Domain Shared Table Builders in common.py
  severity: WARNING
  category: Rendering
  domain: cli
  scope: src/dovo/cli/ui/formatters/
  guideline: A table-building helper shared by more than one formatter within a domain lives in that domain's
    cli/ui/formatters/<domain>/common.py, not duplicated per formatter module and not hoisted into the
    package-wide cli/ui/formatters/common.py unless it is genuinely shared across domains.
  evaluation_criteria: When a new or changed formatter defines a table-construction helper, check whether another
    formatter in the same domain needs the same table shape. Flag a helper duplicated across sibling formatter
    modules instead of factored into that domain's common.py, and flag a domain-specific helper placed in the
    package-wide common.py.
  positive_example: 'src/dovo/cli/ui/formatters/worktree/common.py -> build_worktree_table(), reused by list.py
    and status.py'
  negative_example: '# Nearly identical build_table() duplicated in both worktree/list.py and worktree/status.py'
  citation: docs/agents/code-conventions.md#console-output-and-terminal-formatting
- id: MODEL-001
  title: Scoped Model Exceptions with Justifying Comment
  severity: BLOCKER
  category: Models
  domain: all
  scope: src/dovo/
  intent: Models are strict by default so unexpected data is rejected early; the few hand-authored YAML models that tolerate unknown keys are a named exception, and each explains why in a comment so the leniency stays deliberate.
  criteria:
  - id: MODEL-001.Q01
    question: Is extra='ignore' used only by the approved hand-authored YAML models, BlueprintDefinition and LoopStepBlock?
    kind: judgment
    na_when: The change adds or modifies no model configuration.
    positive_example: 'model_config = {"extra": "ignore", "populate_by_name": True}  # in BlueprintDefinition, core/catalog/definitions/blueprint.py'
    negative_example: 'model_config = {"extra": "ignore"}  # hypothetical: on a result model such as a BaseResult subclass, which is not an approved model'
  - id: MODEL-001.Q02
    question: Does every model that uses extra='ignore' carry a comment justifying it?
    kind: judgment
    na_when: The change adds or modifies no model that uses extra='ignore'.
    positive_example: '# Hand-authored YAML loop blocks permit forward-compatible extra keys.  (directly above model_config in LoopStepBlock, core/catalog/definitions/step.py)'
    negative_example: 'model_config = {"extra": "ignore"}  # hypothetical: no justifying comment above or beside it'
  - id: MODEL-001.Q03
    question: Does every model outside the approved list set strict=True in its configuration?
    kind: judgment
    na_when: The change adds or modifies no model configuration.
    positive_example: 'model_config = {"extra": "forbid", "strict": True}  # in common/mcp_servers.py'
    negative_example: 'model_config = {"extra": "forbid"}  # hypothetical for a new model: strict=True omitted'
  citation: docs/agents/code-conventions.md#pydantic-models
- id: MODEL-002
  title: Result/Outcome Pattern over Exceptions
  severity: BLOCKER
  category: Models
  domain: [core, engine]
  scope: src/dovo/core/, src/dovo/engine/
  intent: Callers must learn about business and operational failures from a result they can inspect and render, not from exceptions they must remember to catch.
  criteria:
  - id: MODEL-002.Q01
    question: Does the operation report a business or operational failure by returning a result instead of raising an exception?
    kind: judgment
    na_when: The change adds or modifies no operation that can fail for business or operational reasons.
    positive_example: 'return WorktreeDeleteResult(status=WorktreeDeleteStatus.NOT_FOUND, errors=[...])  # in core/worktree/services/delete.py'
    negative_example: "raise WorktreeNotFoundError('Worktree does not exist')  # hypothetical: no such exception exists in src/"
  - id: MODEL-002.Q02
    question: Does an operation whose outcome reaches a domain entrypoint, a command handler, a formatter or the wire format return a Pydantic result object subclassing BaseResult?
    kind: judgment
    na_when: The change adds or modifies no operation whose outcome reaches a domain entrypoint, command handler, formatter or the wire format.
    positive_example: 'def delete(self, worktree_id: str) -> WorktreeDeleteResult  # in core/worktree/worktree.py; WorktreeDeleteResult subclasses BaseResult'
    negative_example: 'def delete(...) -> bool  # hypothetical: a domain-entrypoint operation returning a plain value'
  - id: MODEL-002.Q03
    question: Do callers of a result-returning operation check .ok rather than catching exceptions to learn the outcome?
    kind: judgment
    na_when: The change adds or modifies no caller of a result-returning operation.
    positive_example: 'if not result.ok: ...  # hypothetical caller that inspects the result'
    negative_example: 'try: service.delete(...) except WorktreeNotFoundError: ...  # hypothetical: caller catches an exception to learn the outcome'
  - id: MODEL-002.Q04
    question: Do callers that report a failure to the user render the result .errors and .warnings rather than the text of a caught exception?
    kind: judgment
    na_when: The change adds or modifies no caller that reports a result-returning operation's failure to the user.
    positive_example: 'for message in result.errors: render(message)  # hypothetical caller that renders the result'
    negative_example: 'except Exception as exc: render(str(exc))  # hypothetical: failure text taken from a caught exception'
  - id: MODEL-002.Q05
    question: Does an internal helper that returns a plain value or an error message (str | None) serve a single in-layer caller that only branches on success?
    kind: judgment
    na_when: The change adds or modifies no internal helper that returns a plain value or str | None.
    positive_example: 'BaseAgentProvider._tool_policy_preflight returns str | None; its only caller in core/agents/base.py wraps a non-None message in provider_error_response(...)'
    negative_example: 'A hypothetical helper returning str | None that is called from several modules, or whose result reaches a command handler or the wire format'
  citation: docs/agents/code-conventions.md#resultoutcome-pattern
- id: MODEL-003
  title: Reachable and Tested Status Enums
  severity: BLOCKER
  category: Models
  domain: [core, engine]
  scope: src/dovo/core/*/models.py, src/dovo/engine/**/models.py
  intent: A status a result can report must be one the program really produces and the tests really check, so callers never branch on outcomes that cannot happen or that nobody has verified.
  criteria:
  - id: MODEL-003.Q01
    question: Is every variant emitted by production code in src/, for each status StrEnum defined in a core/*/models.py or engine/**/models.py file and used by a BaseResult model?
    kind: judgment
    na_when: The change adds or modifies no status StrEnum, used by a BaseResult model, in a core/*/models.py or engine/**/models.py file.
    positive_example: 'ArtifactsPruneStatus.LOCKED is returned by `status=ArtifactsPruneStatus.LOCKED` in src/dovo/core/artifacts/services/prune.py'
    negative_example: 'class PruneStatus(StrEnum): UNKNOWN = "unknown"  # hypothetical: no code in src/ ever assigns PruneStatus.UNKNOWN to a result'
  - id: MODEL-003.Q02
    question: Is every variant asserted in a test under tests/, for each status StrEnum defined in a core/*/models.py or engine/**/models.py file and used by a BaseResult model?
    kind: judgment
    na_when: The change adds or modifies no status StrEnum, used by a BaseResult model, in a core/*/models.py or engine/**/models.py file.
    positive_example: 'ArtifactsPruneStatus.LOCKED is asserted by `assert result.status == ArtifactsPruneStatus.LOCKED` in tests/core/artifacts/services/test_prune.py'
    negative_example: 'class PruneStatus(StrEnum): FAILED = "failed"  # hypothetical: emitted in src/ but no test under tests/ asserts PruneStatus.FAILED'
  citation: docs/agents/code-conventions.md#resultoutcome-pattern
- id: MODEL-004
  title: Definition Exception Hierarchy
  severity: BLOCKER
  category: Models
  domain: core
  scope: src/dovo/core/catalog/exceptions.py
  intent: Failures about catalog definitions must be catchable through one shared error family, so callers can handle any definition problem uniformly instead of chasing unrelated base types.
  criteria:
  - id: MODEL-004.Q01
    question: Does every exception class in src/dovo/core/catalog/exceptions.py, which covers locating, loading, validating and writing catalog definitions, descend from DefinitionError, DefinitionNotFoundError, DefinitionLoadError or DefinitionValidationError in common/exceptions.py, rather than having Exception or ValueError as its only base?
    kind: judgment
    na_when: The change adds or modifies no exception class in src/dovo/core/catalog/exceptions.py.
    positive_example: 'class BlueprintLoadError(DefinitionLoadError): """Raised when blueprint YAML syntax is invalid or unreadable."""  # in core/catalog/exceptions.py; an intermediate base such as CatalogError(DefinitionError) also counts, and an extra base is fine as in AskStepInvalidError(DefinitionValidationError, ValueError)'
    negative_example: 'class BlueprintLoadError(Exception): """Raised when blueprint YAML syntax is invalid or unreadable."""  # hypothetical: inherits directly from Exception; class StepValidationError(ValueError) would fail the same way'
  citation: docs/agents/schemas.md#1-exception-hierarchy-and-domain-errors
- id: CODE-001
  title: Full-Word Identifiers
  severity: BLOCKER
  category: Code Conventions
  domain: all
  scope: src/, tests/
  intent: Identifiers read as plain words so a reader never has to decode an invented abbreviation.
  criteria:
  - id: CODE-001.Q01
    question: Is every new or modified variable, parameter, attribute and function name spelled in full rather than shortened by dropping letters, even for familiar shortenings (exceptions are checked by Q02 and Q03)?
    kind: judgment
    na_when: The change adds or modifies no variable, parameter, attribute or function name.
    positive_example: 'validation_result = validator.validate(document)  # hypothetical: every word spelled out'
    negative_example: 'val_res = validator.validate(document); acc = []  # hypothetical: val_res and acc drop letters; other shortenings to flag include res, req, msg, val, idx, tmp, rel_path, fs, exc, err, cfg, resp'
  - id: CODE-001.Q02
    question: Is every new or modified single-letter name confined to a comprehension, a generator expression or a one-line loop?
    kind: judgment
    na_when: The change adds or modifies no single-letter name.
    positive_example: 'any(a in ("--help", "-h") for a in raw_args)  # in cli/cli.py'
    negative_example: 'e = load_entry(path); return e.name  # hypothetical: single-letter variable outside a comprehension, generator expression or one-line loop'
  - id: CODE-001.Q03
    question: Is every shortened name that remains in new or modified code either an initialism that is itself the domain term (db, cwd, ctx, id, url, cli, sha, ttl) or a framework-dictated name?
    kind: judgment
    na_when: The change adds or modifies no shortened name.
    positive_example: 'def invoke(self, ctx: Any) -> Any:  # in cli/cli.py, ctx dictated by Click; likewise tmp_path and monkeypatch dictated by pytest'
    negative_example: 'cfg = load_config(path)  # hypothetical: cfg is not a domain-term initialism and no framework dictates it'
  citation: docs/agents/code-conventions.md#variable-naming
- id: CODE-002
  title: Logical Blank Lines Separation
  severity: NIT
  category: Code Conventions
  domain: all
  scope: src/
  intent: Blank lines mark where a function moves from one phase to the next, so a reader can see its structure at a glance; spacing that does not follow the logic hides that structure.
  criteria:
  - id: CODE-002.Q01
    question: Are distinct logical phases of a function body (setup, validate, persist, return) separated by a blank line?
    kind: judgment
    na_when: The function body is a single phase or too short to contain more than one phase.
    positive_example: 'In Engine._finalize_row (src/dovo/engine/engine.py), the load phase and its early-return branch are followed by a blank line before the "saved = store.save(...)" phase.'
    negative_example: 'record = WorktreeRecord(...), a save call and "return result" on consecutive lines with no blank line between them (hypothetical: building, persisting and returning run together as one dense block)'
  - id: CODE-002.Q02
    question: Is every blank line in a function body free of separating two adjacent lines that work on the same value within one phase?
    kind: judgment
    na_when: The function body contains no blank lines.
    positive_example: 'In Engine._finalize_row (src/dovo/engine/engine.py), the blank line at line 211 sits between the early "return" at line 210 and "saved = store.save(" at line 212, which starts a new phase and does not work on the value the "return" line ended, so the blank line is correctly placed.'
    negative_example: 'store = SessionStateStore(self.db, self.paths, session_id), then a blank line, then loaded = store.load(), then a blank line, then "if not loaded.ok" (hypothetical: blank lines inserted between tightly coupled lines of one step)'
  citation: docs/agents/code-conventions.md#blank-lines-in-function-bodies
- id: CODE-003
  title: Terse Docstrings, Description Only for Hidden Contracts
  severity: SUGGESTION
  category: Code Conventions
  domain: all
  scope: src/
  intent: Docstrings stay short so a reader gets the title at a glance and finds a description only where it carries a fact the code cannot show and whose absence would cause wrong code.
  criteria:
  - id: CODE-003.Q01
    question: Does the docstring open with a one-line title stating what the thing is or does?
    kind: judgment
    na_when: The change adds or modifies no docstring.
    positive_example: '"""Base for providers that edit the worktree directly instead of returning a diff."""  # title of the class in core/agents/cli_mutation.py'
    negative_example: |-
      """Run the provider. Then resolve the baseline
      and build the prompt before diffing the worktree."""  # hypothetical: the opening wraps over two lines and holds two sentences, so there is no one-line title
  - id: CODE-003.Q02
    question: Is the title free of outcome, failure-path and side-effect clauses, with a comma used only to enumerate a distinct list?
    kind: judgment
    na_when: The change adds or modifies no docstring.
    positive_example: '"""Base for providers that edit the worktree directly instead of returning a diff."""  # outcomes live in the description'
    negative_example: '"""Return the roots a whole-root read/write rule grants for read or write, or why a rule cannot be preserved."""  # outcome clause in the title, as in core/agents/copilot.py'
  - id: CODE-003.Q03
    question: Does a unit with a hidden contract, a data-loss or safety behavior, a non-obvious ordering constraint or a deliberate oddity carry a description stating it?
    kind: judgment
    na_when: The change adds or modifies no unit with a hidden contract, safety behavior, non-obvious ordering constraint or deliberate oddity.
    positive_example: |-
      """Base for providers that edit the worktree directly instead of returning a diff.

      Edits that fail patch validation are discarded from the worktree; a failed discard is reported in the response errors."""  # CliDirectMutationAdapter in core/agents/cli_mutation.py: the discard is a safety behavior the code does not make obvious
    negative_example: '"""Base for providers that edit the worktree directly instead of returning a diff."""  # hypothetical: title only, although edits that fail validation are silently discarded from the worktree'
  - id: CODE-003.Q04
    question: Does every description state a fact the code cannot show, rather than something a reader can already see in the code?
    kind: judgment
    na_when: The change adds or modifies no docstring with a description.
    positive_example: |-
      """Base for providers that edit the worktree directly instead of returning a diff.

      Edits that fail patch validation are discarded from the worktree; a failed discard is reported in the response errors."""  # the discard behavior is not visible from the signature or the title
    negative_example: |-
      """Return the roots a rule grants.

      Uses a dict for lookup."""  # hypothetical: true, but the dict is plain to see in the body
  - id: CODE-003.Q05
    question: Is every description free of step-by-step narration of the body?
    kind: judgment
    na_when: The change adds or modifies no docstring with a description.
    positive_example: |-
      """Base for providers that edit the worktree directly instead of returning a diff.

      Edits that fail patch validation are discarded from the worktree; a failed discard is reported in the response errors."""  # states a consequence, not the steps
    negative_example: |-
      """Run the provider.

      First resolve the baseline, then build the prompt, then run the tool."""  # hypothetical: the description retells the body step by step
  - id: CODE-003.Q06
    question: Is every description free of text that restates the parameters, types or return annotation, or repeats the title in other words?
    kind: judgment
    na_when: The change adds or modifies no docstring with a description.
    positive_example: |-
      """Base for providers that edit the worktree directly instead of returning a diff.

      Edits that fail patch validation are discarded from the worktree; a failed discard is reported in the response errors."""  # adds a fact beyond the title and signature
    negative_example: |-
      """Return the session id.

      This returns the identifier of the session."""  # hypothetical: the description repeats the title in other words
  citation: docs/agents/code-conventions.md#docstrings
- id: CODE-004
  title: Docstrings Describe Only the Documented Unit
  severity: WARNING
  category: Code Conventions
  domain: all
  scope: src/
  intent: A docstring states only behavior the documented unit itself implements, so it cannot go stale when other code changes without any sign in the diff.
  criteria:
  - id: CODE-004.Q01
    question: Does each new or modified docstring avoid describing what a caller does with the unit's result?
    kind: judgment
    na_when: The change adds or modifies no docstring.
    positive_example: |-
      """Render a restricted policy's allow and deny rules as dontAsk flags.

      A rule Claude Code cannot express yields its reason as a string."""  # _render_restricted in core/agents/claude_policy.py
    negative_example: |-
      """Render a restricted policy's allow and deny rules as dontAsk flags.

      The adapter surfaces a returned reason as an unsupported-policy error before the process is spawned."""  # hypothetical: describes what the caller does with the returned reason
  - id: CODE-004.Q02
    question: Does each new or modified docstring avoid describing logic that lives in another module or class, other than a reference to a sibling in the same module?
    kind: judgment
    na_when: The change adds or modifies no docstring.
    positive_example: '"""Return items without duplicates, in first-seen order."""  # _unique in core/agents/claude_policy.py, which describes only its own behavior'
    negative_example: '"""Return items without duplicates; the Copilot adapter relies on this to reject repeated flags."""  # hypothetical: states behavior of another module'
  citation: docs/agents/code-conventions.md#docstrings
- id: CODE-005
  title: One Docstring per Unit
  severity: WARNING
  category: Code Conventions
  domain: all
  scope: src/
  intent: A unit's documentation must be a single docstring, because a second bare string reads as documentation but is dead code. Extra text belongs in the docstring or nowhere.
  criteria:
  - id: CODE-005.Q01
    question: Is every new or modified module, class and function body free of a bare string statement after its first statement?
    kind: judgment
    na_when: The change adds or modifies no module, class or function.
    positive_example: '"""Render a restricted policy as dontAsk flags."""  # hypothetical: the only string statement in the function body'
    negative_example: '"""Return dontAsk flags for the rules."""  # hypothetical: followed by a second """...""" string statement that should be merged into the docstring or deleted'
  citation: docs/agents/code-conventions.md#docstrings
- id: TYPE-001
  title: Ban on -> Any Return Annotations
  severity: BLOCKER
  category: Typing
  domain: all
  scope: src/, tests/
  guideline: -> Any on a public function is treated as a defect because it disables type checking transitively at every call
    site. Prefer object when values are only stored, compared, or passed through.
  evaluation_criteria: Scan function signatures for `-> Any`. Flag any occurrence on public functions.
  positive_example: 'def get_payload(self) -> object: ...'
  negative_example: 'def get_payload(self) -> Any: ...'
  citation: docs/agents/code-conventions.md#type-annotations-and-any
- id: TYPE-002
  title: Strict Scoping of Permitted Any
  severity: BLOCKER
  category: Typing
  domain: all
  scope: src/dovo/
  guideline: 'Any is permitted strictly in: (1) Pydantic mode=''before'' validators, (2) dict[str, Any] at serialization boundaries,
    (3) values read from user documents and compared, and (4) **kwargs: Any pass-throughs.'
  evaluation_criteria: Audit Any occurrences. Flag any usage outside the four permitted boundaries.
  positive_example: '@field_validator(''pattern'', mode=''before'')

    def _val(cls, v: Any) -> Any: ...'
  negative_example: 'def execute_step(step: Any) -> StepResult: ...'
  citation: docs/agents/code-conventions.md#permitted-do-not-fix-these
- id: TYPE-003
  title: Banned Uses of Any
  severity: BLOCKER
  category: Typing
  domain: all
  scope: src/, tests/
  guideline: 'Banned: Any dodging import boundaries, Any as a test seam, Any where a model already exists, Any in third-party
    overrides (e.g. ctx: Any for click.Context), and Any filling a known generic (e.g. Popen[Any]).'
  evaluation_criteria: Scan for Any annotations that match the five banned categories.
  positive_example: 'proc: subprocess.Popen[str] = ...'
  negative_example: 'proc: subprocess.Popen[Any] = ...'
  citation: docs/agents/code-conventions.md#banned
- id: TYPE-004
  title: Explicit ClassVar Typing for Table Names and Constants
  severity: NIT
  category: Typing
  domain: core
  scope: src/dovo/core/db/models.py
  guideline: Typing table names or string constants as Any or bare string instead of explicit ClassVar[str] causes type checker
    ambiguity. Declare class-level SQL constants explicitly.
  evaluation_criteria: Inspect SQLModel definitions. Verify __tablename__ and table constants are annotated as ClassVar[str].
  positive_example: '__tablename__: ClassVar[str] = ''worktrees'''
  negative_example: __tablename__ = 'worktrees'
  citation: docs/agents/code-conventions.md#type-checker-suppressions
- id: TYPE-005
  title: Precise Parameterization for Generator Types
  severity: NIT
  category: Typing
  domain: all
  scope: src/, tests/
  guideline: Avoid overly broad generic type annotations like Generator[Session] without complete yield/send/return parameterization.
    Specify all three generic parameters.
  evaluation_criteria: Scan typing annotations for `Generator[...]`. Verify all three parameters are specified (e.g. `Generator[YieldType,
    SendType, ReturnType]`).
  positive_example: 'def get_session() -> Generator[Session, None, None]: ...'
  negative_example: 'def get_session() -> Generator[Session]: ...'
  citation: docs/agents/code-conventions.md#type-annotations-and-any
- id: TYPE-006
  title: Scoped Pyright Suppressions With Reason
  severity: BLOCKER
  category: Typing
  domain: all
  scope: src/, tests/
  guideline: >-
    A bare `# type: ignore` is not honored by this repo's basedpyright config and suppresses nothing. Only
    `# pyright: ignore[reportRuleName]` suppresses an error, and only for one of three permitted cases, each
    with a one-line reason naming which applies: an intentional ill-typed test input whose subject is the
    raised error, a third-party stub conflict our code cannot name correctly (the SQLModel `__tablename__`
    case), or a platform-gated import. `reportCallIssue` and `reportArgumentType` silencing a wrong-shaped
    test double or fixture, and `reportIncompatibleVariableOverride` outside the SQLModel `__tablename__`
    stub, are never permitted suppressions: the fixture, annotation, or override is the defect to fix, not
    the error to hide.
  evaluation_criteria: >-
    Grep changed hunks for `# type: ignore` and `# pyright: ignore`. Flag every bare `# type: ignore`. For each
    `# pyright: ignore[...]`, verify a one-line reason is present and that the case matches one of the three
    permitted categories; flag any suppression of `reportCallIssue`, `reportArgumentType`, or
    `reportIncompatibleVariableOverride` that does not match its named exception.
  positive_example: 'import msvcrt  # pyright: ignore[reportMissingImports]  # platform-gated: msvcrt does not exist on Linux'
  negative_example: 'queue: Queue = mock_queue  # type: ignore  # bare ignore, suppresses nothing and hides a fixable fixture type'
  citation: docs/agents/code-conventions.md#type-checker-suppressions
- id: ENCAP-001
  title: Expose Public Query Properties
  severity: BLOCKER
  category: Encapsulation
  domain: all
  scope: src/dovo/
  intent: Protects a class's freedom to change its internal representation. Callers learn its state through a public
    interface, so a refactor stays local instead of breaking every caller that reached inside.
  criteria:
  - id: ENCAP-001.Q01
    question: Is every access to an underscore-prefixed, non-dunder member in src/dovo/ made on self, cls or mcs rather than on another object?
    kind: mechanical
    enforced_by: pyproject.toml
    positive_example: 'if runner.is_running: ...  # caller uses the public query property'
    negative_example: 'if runner._process is not None: ...  # caller inspecting private state'
  - id: ENCAP-001.Q02
    question: Does each class that callers query for boolean state expose that state as a public property?
    kind: judgment
    na_when: No new or modified code in src/dovo/ checks the boolean state of another class.
    positive_example: 'if runner.is_running: ...  # public @property on the class, backed by self._proc'
    negative_example: 'if runner.get_process() is not None: ...  # caller re-derives boolean state from an exposed internal handle'
  citation: docs/agents/code-conventions.md#encapsulation-and-private-members
- id: ENCAP-002
  title: No Test Seams in Production Signatures
  severity: BLOCKER
  category: Encapsulation
  domain: all
  scope: src/dovo/
  intent: Keeps production signatures free of dead code written for tests. Every parameter exists because a production
    caller needs it, so the public surface reflects real behavior and tests do not shape production APIs.
  criteria:
  - id: ENCAP-002.Q01
    question: Is every parameter, kwarg or callback with a default value in a new or modified function in src/dovo/ passed by at least one production caller?
    kind: judgment
    na_when: No new or modified function in src/dovo/ has a parameter with a default value.
    positive_example: 'def run(self, cwd: Path) -> RunOutcome: ...  # tests monkeypatch at boundary'
    negative_example: 'def run(self, cwd: Path, _runner: GitRunner | None = None) -> RunOutcome: ...  # only tests pass _runner'
  citation: docs/agents/testing.md#core-testing-rules
- id: PERF-001
  title: No Ad-Hoc DB Instantiations in Loops
  severity: BLOCKER
  category: Performance
  domain: all
  scope: All source and test files
  intent: Database access reuses one pre-initialized instance, so repeated work does not pay for a new SQLite connection
    and migration check each time.
  criteria:
  - id: PERF-001.Q01
    question: Is every repository or DovoDb used inside a for or while loop created outside that loop?
    kind: judgment
    na_when: No for or while loop in the changed code uses a repository or DovoDb.
    positive_example: 'db = DovoDb(paths.database_file, project_id=paths.project_id)

      for item in items: db.sessions.create(...)  # illustrative; create() takes more arguments'
    negative_example: 'for item in items: db = DovoDb(paths.database_file, project_id=paths.project_id); db.sessions.create(...)  # illustrative; create() takes more arguments'
  - id: PERF-001.Q02
    question: Does every helper function, including every test helper, receive its repository or DovoDb as an argument instead of instantiating one?
    kind: judgment
    na_when: No helper function in the changed code uses a repository or DovoDb.
    positive_example: 'def seed_sessions(db: DovoDb, items: list[str]) -> None: ...  # illustrative helper that takes the instance'
    negative_example: 'def seed_session(paths: WorkspacePaths) -> None: DovoDb(paths.database_file, project_id=paths.project_id).sessions.create(...)  # illustrative helper that builds its own instance on every call'
  citation: docs/agents/schemas.md#7-database
- id: PERF-002
  title: Database Migration Hygiene and Consumer Call Sites
  severity: BLOCKER
  category: Performance
  domain: core
  scope: src/dovo/core/db/
  guideline: Every new table or column must have real caller sites in src/ in the same PR. One-time data backfills must be
    versioned Alembic revisions (op.execute()), not ad-hoc raw SQL in models.
  evaluation_criteria: Check Alembic migrations. Verify added columns/tables are actively queried and written by production
    services in the same PR.
  positive_example: '# Migration adds a column and a repository method reads and writes it'
  negative_example: '# Migration adds column future_flag with zero callers in src/'
  citation: docs/agents/ci-and-tooling.md#database-migration-hygiene
- id: PERF-003
  title: Indexed Column Queries vs O(n) In-Memory Lookups
  severity: WARNING
  category: Performance
  domain: [core, engine]
  scope: src/dovo/core/db/, src/dovo/core/*/services/, src/dovo/engine/services/
  guideline: Do not perform O(n) in-memory list comprehensions or linear scans over repository records when an indexed database
    column exists (e.g., querying _record_for_rel_path). Query the repository slice directly with filtered SQL.
  evaluation_criteria: Scan for in-memory list comprehensions or filter loops over full table fetches when an indexed query
    method could be used.
  positive_example: record = repo.get_by_path(relative_path)
  negative_example: record = next((r for r in repo.list() if r.path == relative_path), None)
  citation: docs/agents/schemas.md#7-database
- id: API-001
  title: Sibling Repository CRUD Method Naming Consistency
  severity: WARNING
  category: Architecture
  domain: core
  scope: src/dovo/core/db/repositories/
  intent: Sibling repositories name the same operation with the same verb, so a caller who knows one repository can use the
    others without reading each class, and a divergent name reads as a different behavior.
  criteria:
  - id: API-001.Q01
    question: Does every repository class that inserts a new record expose that operation as a public create() method?
    kind: judgment
    na_when: The repository class has no method that inserts a new record.
    positive_example: 'WorktreesRepository.create(...) and SessionsRepository.create(...)'
    negative_example: 'CostsRepository.record_token_usage(...) inserting a CostRecord while sibling repositories use create()'
  - id: API-001.Q02
    question: Does every repository method that returns at most one record looked up by its identifying key have the name get?
    kind: judgment
    na_when: The repository class has no method that looks up a single record by its identifying key.
    positive_example: 'def get(self, id: str) -> WorktreeRecord | None:'
    negative_example: 'def find(self, id: str) -> WorktreeRecord | None:  # siblings use get()'
  - id: API-001.Q03
    question: Does every repository method that returns a collection of records of one entity have the name list?
    kind: judgment
    na_when: The repository class has no method that returns a collection of records.
    positive_example: 'def list(self, status: WorktreeStatus | None = None) -> list[WorktreeRecord]:'
    negative_example: 'def all(self) -> list[WorktreeRecord]:  # siblings use list()'
  - id: API-001.Q04
    question: Does every repository method that removes a record have the name delete?
    kind: judgment
    na_when: The repository class has no method that removes a record.
    positive_example: 'def delete(self, id: str) -> bool:'
    negative_example: 'def remove(self, id: str) -> bool:  # siblings use delete()'
  - id: API-001.Q05
    question: Does every repository method that persists changes to a whole existing record have the name save?
    kind: judgment
    na_when: No repository method persists changes to a whole existing record; partial updates such as update_status do not count.
    positive_example: 'def save(self, record: SessionRecord) -> SessionRecord:'
    negative_example: 'def store(self, record: SessionRecord) -> SessionRecord:  # whole-record persist not named save()'
  - id: API-001.Q06
    question: Does every repository method named insert, add or upsert have a docstring or comment stating why a canonical verb does not fit?
    kind: judgment
    na_when: No repository method is named insert, add or upsert.
    positive_example: 'def upsert(self, ...) -> ...:  with the docstring "Not save(): replaces the row only when the revision matches."'
    negative_example: 'def insert(self, record: WorktreeRecord) -> WorktreeRecord:  # no stated reason; siblings use create()'
  - id: API-001.Q07
    question: Do all repository classes that expose the same non-CRUD operation give it the same method name?
    kind: judgment
    na_when: No two repository classes expose the same non-CRUD operation.
    positive_example: 'WorktreesRepository.update_status(...) and SessionsRepository.update_status(...)'
    negative_example: 'WorktreesRepository.update_status(...) next to SessionsRepository.set_state(...) for the same status change'
  citation: docs/agents/schemas.md#7-database
- id: API-002
  title: Consistent Error Semantics Across Queries
  severity: WARNING
  category: Architecture
  domain: [core, engine]
  scope: src/dovo/core/db/, src/dovo/core/*/services/, src/dovo/engine/services/
  intent: Query paths that read the same data report bad rows the same way, so a caller never mistakes a silently swallowed
    failure in one path for an empty result while a sibling path reports it.
  criteria:
  - id: API-002.Q01
    question: Does every query method that reads an entity report an invalid enum value or corrupt row, by raising or by returning a BaseResult error, whenever a sibling query method that reads that entity reports it?
    kind: judgment
    na_when: No two query methods read the same entity.
    positive_example: 'get() and list() both raise ValueError for a row with an invalid status'
    negative_example: 'list() raises on a row with an invalid status while get() returns None for the same row'
  - id: API-002.Q02
    question: Does every except block in a query method re-raise or convert the caught error into a BaseResult error, instead of returning None or an empty value?
    kind: judgment
    na_when: The query method contains no except block.
    positive_example: 'except ValidationError as error: return RecordResult.from_error(error)'
    negative_example: 'except ValidationError: return None  # swallows the error'
  citation: docs/agents/code-conventions.md#resultoutcome-pattern
- id: DRY-001
  title: Shared Repository Transaction Logic in BaseRepository
  severity: SUGGESTION
  category: Code Conventions
  domain: core
  scope: src/dovo/core/db/repositories/
  intent: Transaction handling for repository writes lives once in BaseRepository, so commit, rollback, deletion and session
    behavior stay identical across repositories and a fix is made in one place instead of in every sibling.
  criteria:
  - id: DRY-001.Q01
    question: Does every repository method that persists a record commit through BaseRepository._commit?
    kind: judgment
    positive_example: return self._commit(session, record, f"Worktree with id '{id}' already exists")
    negative_example: 'session.add(record); session.commit()  # in a repository subclass'
  - id: DRY-001.Q02
    question: Does every repository method that deletes a single record delete it through BaseRepository._delete_where?
    kind: judgment
    positive_example: return self._delete_where(session, select(WorktreeRecord).where(WorktreeRecord.id == id))
    negative_example: 'session.delete(record); session.commit()  # in a repository subclass'
  - id: DRY-001.Q03
    question: Is the rollback after a failed commit written only in BaseRepository?
    kind: judgment
    positive_example: 'No try/except IntegrityError and no session.rollback() in worktrees.py, sessions.py, artifacts.py or costs.py'
    negative_example: 'except IntegrityError: session.rollback(); raise ValueError(...)  # in a repository subclass'
  - id: DRY-001.Q04
    question: Does every repository method obtain its session from BaseRepository.session()?
    kind: judgment
    positive_example: 'with self.session() as session:'
    negative_example: 'with get_session(self.db_engine) as session:  # in a repository subclass'
  - id: DRY-001.Q05
    question: Is every other transaction block shared by two or more repository classes defined once in BaseRepository?
    kind: judgment
    na_when: No repository class other than BaseRepository contains transaction-handling code beyond calls to BaseRepository helpers.
    positive_example: 'Two repositories both call self._delete_where(...) for single-record deletes'
    negative_example: 'The same try/commit/rollback/refresh block copied into both SessionsRepository and WorktreesRepository'
  citation: docs/agents/code-conventions.md#structure-and-complexity
- id: DB-001
  title: Redundant Index Declaration on Unique Columns
  severity: NIT
  category: Database
  domain: core
  scope: src/dovo/core/db/models.py
  intent: A unique constraint already gets a backing index in SQLite, so a column declares uniqueness or an extra index, never both, and the database does not carry a second index that does nothing.
  criteria:
  - id: DB-001.Q01
    question: Is every SQLModel Field that declares unique=True free of an index=True declaration?
    kind: judgment
    na_when: The change adds or modifies no SQLModel Field in src/dovo/core/db/models.py.
    positive_example: 'session_id: str = Field(unique=True)  # in SessionRecord, src/dovo/core/db/models.py'
    negative_example: 'session_id: str = Field(unique=True, index=True)  # hypothetical: no field in models.py declares both'
  citation: docs/agents/ci-and-tooling.md#database-migration-hygiene
- id: DB-002
  title: Released Migrations Are Immutable and Reversible
  severity: BLOCKER
  category: Database
  domain: core
  scope: src/dovo/core/db/alembic/versions/
  intent: Databases that users already upgraded can always be reached from, and returned to, a known schema, because a
    revision that shipped never changes and every revision can be undone on any supported database.
  criteria:
  - id: DB-002.Q01
    question: Is every revision file that exists in the latest v* tag left unedited, unrenamed and undeleted?
    kind: judgment
    na_when: The change touches no revision file that exists in the latest v* tag.
    positive_example: 'A schema fix for a released column ships as a new file, 0005_fix_discard_default.py (hypothetical), and 0001_initial_schema.py is untouched'
    negative_example: 'Editing 0001_initial_schema.py, which exists in the v0.6.0 tag, to change a column definition'
  - id: DB-002.Q02
    question: Does every new revision define both upgrade() and a downgrade() that has a real body rather than a bare `pass`?
    kind: judgment
    na_when: The change adds no new revision.
    positive_example: '0004_session_discard.py defines downgrade() that drops the discard column from sessions inside op.batch_alter_table'
    negative_example: 'A revision whose downgrade() is `pass`'
  - id: DB-002.Q03
    question: Does every new revision avoid PRAGMA and sqlite_master?
    kind: judgment
    na_when: The change adds no new revision.
    positive_example: '0004_session_discard.py contains no PRAGMA statement and no reference to sqlite_master'
    negative_example: 'op.execute("PRAGMA foreign_keys=OFF")  # or a query against sqlite_master, in a revision'
  - id: DB-002.Q04
    question: Does every new revision make its column and constraint changes through op.batch_alter_table?
    kind: judgment
    na_when: The new revision makes no column or constraint changes.
    positive_example: 'with op.batch_alter_table("sessions") as batch_op: batch_op.drop_column("discard")'
    negative_example: 'op.add_column("sessions", sa.Column("discard", sa.Boolean()))  # outside a batch_alter_table block (hypothetical revision)'
  - id: DB-002.Q05
    question: Does every new revision have both an upgrade test and a downgrade test in tests/core/db/test_migrations.py?
    kind: judgment
    na_when: The change adds no new revision.
    positive_example: 'SessionDiscardMigrationTests has test_upgrade_adds_discard_column_defaulting_existing_rows_false and test_downgrade_drops_discard_column_and_keeps_rows'
    negative_example: 'A new revision 0005 (hypothetical) with no test class for it in test_migrations.py, or one that tests only the upgrade'
  citation: docs/agents/ci-and-tooling.md#migration-lifecycle
- id: FS-001
  title: Atomic File Writes via Temporary Sibling
  severity: BLOCKER
  category: Filesystem
  domain: all
  scope: src/dovo/
  intent: Config and state files are never left half-written, because they are written atomically instead of in-place.
  criteria:
  - id: FS-001.Q01
    question: Is every write to a config or state file made through Filesystem.atomic_write_json or Filesystem.atomic_write_text?
    kind: judgment
    positive_example: Filesystem.atomic_write_json(config_path, data)
    negative_example: 'with open(config_path, ''w'') as f: json.dump(data, f)  # hypothetical in-place write'
  - id: FS-001.Q02
    question: Is every config or state file write free of a direct open(..., 'w') call?
    kind: judgment
    na_when: The code writes no config or state file.
    positive_example: 'Filesystem.atomic_write_text(state_path, text)  # hypothetical caller; no open() call at the call site'
    negative_example: 'with open(state_path, ''w'') as f: f.write(text)  # hypothetical in-place write'
  - id: FS-001.Q03
    question: Is every config or state file write free of a direct Path.write_text call?
    kind: judgment
    na_when: The code writes no config or state file.
    positive_example: 'Filesystem.atomic_write_text(config_path, text)  # hypothetical caller'
    negative_example: 'config_path.write_text(text)  # hypothetical in-place write'
  - id: FS-001.Q04
    question: Does each atomic write helper write to a .tmp sibling of the target and swap it into place with Path.replace?
    kind: judgment
    na_when: The change adds or modifies no atomic write helper.
    positive_example: 'atomic_write_text in src/dovo/common/filesystem/services/operations.py writes to path.with_name(f"{path.name}.tmp") and then calls tmp_path.replace(path)'
    negative_example: 'A hypothetical helper that opens the target path directly in ''w'' mode and never calls Path.replace'
  - id: FS-001.Q05
    question: Does each atomic write helper flush and call os.fsync on the temporary file before swapping it into place?
    kind: judgment
    na_when: The change adds or modifies no atomic write helper.
    positive_example: 'atomic_write_text in src/dovo/common/filesystem/services/operations.py calls f.flush() and os.fsync(f.fileno()) before tmp_path.replace(path)'
    negative_example: 'A hypothetical helper that calls tmp_path.replace(path) without flushing or calling os.fsync first'
  citation: docs/agents/code-conventions.md#atomic-file-writes
- id: FS-002
  title: Advisory Cross-Process Locking
  severity: BLOCKER
  category: Filesystem
  domain: all
  scope: src/dovo/
  intent: Concurrent dovo processes must not corrupt shared worktree, catalog or state data, so mutations are serialized by the shared advisory workspace lock and a failure to obtain it is reported rather than ignored.
  criteria:
  - id: FS-002.Q01
    question: Is every worktree, catalog or state mutation that can run in more than one process at once performed while holding the .dovo/.lock advisory lock?
    kind: judgment
    na_when: The change does not mutate worktree, catalog or state data that more than one process can touch.
    positive_example: 'with WorkspaceLock(self.paths.lock_file): return self.lifecycle.create(...)  # in core/worktree/worktree.py'
    negative_example: 'self.lifecycle.create(...)  # hypothetical: mutates the shared .dovo directory without acquiring the lock'
  - id: FS-002.Q02
    question: Is the lock acquired through WorkspaceLock from common/lock.py?
    kind: judgment
    na_when: The change acquires no workspace lock.
    positive_example: 'from dovo.common.lock import WorkspaceLock  # then: with WorkspaceLock(paths.lock_file):'
    negative_example: 'fcntl.flock(open(lock_path, "w"), fcntl.LOCK_EX)  # hypothetical: hand-rolled locking outside common/lock.py'
  - id: FS-002.Q03
    question: Is LockTimeoutError handled where the lock is acquired or by a caller that reports it?
    kind: judgment
    na_when: The change acquires no workspace lock.
    positive_example: 'except LockTimeoutError as exc: return ArtifactsPruneResult(status=ArtifactsPruneStatus.LOCKED, ..., errors=[f"Failed to acquire workspace lock: {exc}"])  # in core/artifacts/services/prune.py'
    negative_example: 'except LockTimeoutError: pass  # hypothetical: timeout swallowed, caller sees no failure'
  citation: docs/agents/architecture.md#the-dovo-directory
- id: COMPAT-001
  title: Strict Public-Only Backwards Compatibility
  severity: BLOCKER
  category: Compatibility
  domain: all
  scope: src/dovo/
  intent: Users and scripts depend on the surfaces they interact with directly, so those surfaces keep working across changes. Compatibility is kept only for them, and nowhere else.
  criteria:
  - id: COMPAT-001.Q01
    question: Does the change leave every existing CLI command, subcommand, argument and flag usable as before, with no breaking rename or removal?
    kind: judgment
    na_when: The change does not touch the CLI command surface (commands, subcommands, arguments or flags).
    positive_example: '"--path", "-p" on the global callback in cli/cli.py  # option name and short form left unchanged'
    negative_example: '# hypothetical: renaming the --path option to --workspace without keeping --path as an alias'
  - id: COMPAT-001.Q02
    question: Does the change leave existing configuration files and blueprint YAML definitions (such as config.json keys and values) readable with the same meaning as before?
    kind: judgment
    na_when: The change does not touch configuration keys or values, or the blueprint YAML schema.
    positive_example: '# hypothetical: a new optional config.json key added with a default, so existing config files load unchanged'
    negative_example: '# hypothetical: renaming an existing config.json key so that files written before the change no longer load'
  - id: COMPAT-001.Q03
    question: Does the change leave the stable machine-readable output formats, such as the JSON event envelope, with the same field names and meaning as before?
    kind: judgment
    na_when: The change does not touch machine-readable output formats.
    positive_example: 'envelope = {"event_type": data_type.__name__, "payload": formatter.to_json_serializable(data)}  # in cli/ui/dispatcher.py, envelope keys unchanged'
    negative_example: '# hypothetical: renaming the envelope key "event_type" to "type" in the JSON output'
  citation: docs/agents/code-conventions.md#backwards-compatibility
- id: COMPAT-002
  title: Ban on Internal Compatibility Shims and Aliases
  severity: BLOCKER
  category: Compatibility
  domain: all
  scope: src/dovo/common/, src/dovo/core/, internal src/dovo/cli/
  intent: Internal refactors must not leave old names behind, so internal code carries one name per symbol and no dead compatibility layers; callers and tests are updated to the new name instead.
  criteria:
  - id: COMPAT-002.Q01
    question: Is the change free of backwards-compatibility aliases that keep an old internal name pointing at a renamed symbol?
    kind: judgment
    na_when: The change renames no internal symbol in common/, core/ or internal CLI modules.
    positive_example: 'Hypothetical: a helper is renamed from _unlock_fd to unlock_file_descriptor and the old name no longer exists anywhere in the module.'
    negative_example: 'Hypothetical: after renaming _unlock_fd, the module keeps the line "_unlock = _unlock_fd  # internal shim alias".'
  - id: COMPAT-002.Q02
    question: Is the change free of deprecated or compatibility properties, wrapper methods and shim layers that exist only to keep an old internal interface working?
    kind: judgment
    na_when: The change renames or restructures no internal class, method or module in common/, core/ or internal CLI modules.
    positive_example: 'Hypothetical: a renamed internal property replaces the old one outright, with no forwarding property left on the class.'
    negative_example: 'Hypothetical: a class keeps "@property def old_name(self): return self.new_name" only so existing internal callers keep working.'
  - id: COMPAT-002.Q03
    question: Were all internal callers and tests updated directly to the new name when an internal symbol was renamed?
    kind: judgment
    na_when: The change renames no internal symbol in common/, core/ or internal CLI modules.
    positive_example: 'Hypothetical: a rename of _unlock_fd comes with edits to every internal call site and test that referenced it.'
    negative_example: 'Hypothetical: a rename leaves internal callers on the old name and adds an alias so they keep working instead of editing them.'
  citation: docs/agents/code-conventions.md#backwards-compatibility
- id: COMPAT-003
  title: Greenfield Architecture Default
  severity: BLOCKER
  category: Compatibility
  domain: all
  scope: src/dovo/
  intent: The repository is treated as greenfield, so superseded code is replaced rather than carried alongside its replacement, unless an issue explicitly demands otherwise. This keeps one implementation of each behavior.
  criteria:
  - id: COMPAT-003.Q01
    question: Does the change leave a single implementation of the behavior it replaces, with no superseded implementation kept alongside the new one?
    kind: judgment
    na_when: The change replaces no existing behavior, or the issue explicitly demands a dual code path.
    positive_example: '# hypothetical: the legacy loader is deleted and its callers now use the new unified loader'
    negative_example: '# hypothetical: LegacyLoader stays in the tree beside UnifiedLoader and both remain reachable'
  - id: COMPAT-003.Q02
    question: Does the change avoid adding a fallback branch or fallback adapter that routes to a superseded path?
    kind: judgment
    na_when: The issue explicitly demands a fallback adapter or branch.
    positive_example: '# hypothetical: return UnifiedLoader().load()  # directly replaces the legacy loader'
    negative_example: 'if config.use_legacy: return LegacyLoader().load()  # hypothetical: unnecessary compatibility branch'
  - id: COMPAT-003.Q03
    question: Does the change avoid planning a deprecation window for a superseded path?
    kind: judgment
    na_when: The issue explicitly demands a deprecation window.
    positive_example: '# hypothetical: the old path is removed in this change set, with no warning period'
    negative_example: '# hypothetical: warnings.warn("load_legacy is deprecated, removed in 2 releases"); the old path keeps working'
  - id: COMPAT-003.Q04
    question: Are all callers of a superseded path updated in the same change set that replaces it?
    kind: judgment
    na_when: The change supersedes no existing path.
    positive_example: '# hypothetical: the loader is replaced and every call site is switched to the new one in the same change set'
    negative_example: '# hypothetical: the new loader is added, and callers are left on the old one to migrate later'
  citation: docs/agents/planning.md#step-1-extract-the-contract-from-the-issue
- id: TEST-001
  title: Test at Contracts, Not Implementation
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  guideline: Assert on deliberate contracts (BaseResult object, exact JSON dict, exit code, file on disk, git ref), never
    implementation details (rendered layout, private helpers, call ordering, constructor assignments).
  evaluation_criteria: Inspect test assertions. Flag assertions checking internal mock call counts or private attributes.
  positive_example: assert result == BlueprintLoadResult(status=BlueprintLoadStatus.OK, blueprint=expected_bp)
  negative_example: assert service._internal_cache_size == 1; assert mock_parser.call_count == 1
  citation: docs/agents/testing.md#the-rule-that-matters-most
- id: TEST-002
  title: 1:1 Source Parity Layout
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  guideline: >-
    Test structure mirrors src/dovo/ 1:1 under tests/, one test file per source module, and every test
    directory carries an __init__.py because basenames repeat across the tree. Five mappings are fixed:
    src/dovo/common/<m>.py to tests/common/test_<m>.py, src/dovo/core/<domain>/<m>.py to
    tests/core/<domain>/test_<m>.py, src/dovo/cli/ui/formatters/<domain>/<name>.py to
    tests/cli/ui/formatters/<domain>/test_<name>.py, and src/dovo/cli/<command>/commands/<action>.py to
    tests/cli/<command>/test_<command>_<action>.py — a subdirectory per CLI command domain, mirroring
    src/dovo/cli/<command>/ (the commands/ subpackage level collapses; a per-domain conftest.py holds
    fixtures that domain's test files share, never fixtures another domain needs). The fifth is src/dovo/engine/<m>.py to tests/engine/test_<m>.py (executors/ and services/ subpackages mirror as tests/engine/executors/ and tests/engine/services/). One test file per CLI
    command action, not one file per command domain. Every source module must have a corresponding test
    file; there is no exemption list. Grouping several formatters, domains, or command actions into one part-numbered or collapsed file is
    prohibited.
  evaluation_criteria: >-
    Check every test file path against its source module using the fixed mappings. Flag part-numbered or
    grab-bag files (for example test_command_formatters_part1.py or a single test_<command>.py holding more
    than one command action), a CLI command test file left flat under tests/cli/ instead of nested under its
    own tests/cli/<command>/ subdirectory, missing __init__.py files, and source modules with no test
    file.
  positive_example: src/dovo/cli/worktree/commands/worktree_create.py -> tests/cli/worktree/test_worktree_create.py
  negative_example: 'tests/cli/commands/test_worktree_create.py  # flat under tests/cli/commands/, not nested under tests/cli/worktree/'
  citation: docs/agents/testing.md#11-source-parity-layout
- id: TEST-003
  title: Standardized Test Naming and Vague Name Ban
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  guideline: 'Test classes must be named *Tests. Methods must follow test_<condition>_<outcome>. Banned vague names with no
    outcome: test_ok, test_success, test_present, test_missing, test_blank, test_basic, test_default, test_works, test_timeout,
    test_no_op, test_help. No ''should'' prefix.'
  evaluation_criteria: Check test class and method names against the banned list and naming pattern.
  positive_example: "class ConfigLoaderTests:\n    def test_missing_config_returns_not_found_status(self): ..."
  negative_example: "class TestConfig:\n    def test_ok(self): ...\n    def test_should_timeout(self): ..."
  citation: docs/agents/testing.md#naming-conventions
- id: TEST-004
  title: CLI Tier Matrix and Handler Test Necessity
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/cli/
  guideline: >-
    Every CLI command action requires at least one real *CliIntegrationTests suite invoking
    runner.invoke to pin option and argument binding, exit codes, and dispatcher output. The suite
    must cover five scenario classes: (1) happy path exit 0 with default arguments, (2) option and
    argument binding, ensuring every declared Typer option, flag, and argument is exercised in at
    least one invocation to verify CLI input binding and propagation to the domain layer without
    duplicating domain branch matrices, (3) failure path with the expected non-zero exit code when
    the domain returns a non-ok result, (4) --format json emitting the wire schema, and (5) any
    interactive confirmation or abort branch. *RootTests calling the handler directly with a
    CliContext are added only when an author judges the handler owns logic the domain layer does
    not: input coercion, branch selection across services, result composition from more than one
    call, or an interactive abort path. A pass-through handler is fully compliant with zero root
    tests; a root test is never required per action. A root test may never restate a contract
    already asserted under tests/core/ for the same result type.
  evaluation_criteria: >-
    For each command action, verify at least one runner integration test exists and covers the
    scenario classes: exit 0, option and argument binding for every declared option or flag,
    non-zero exit, --format json, and interactive flows if present. A command action with no
    *RootTests suite is not itself a violation. Flag *RootTests whose assertions duplicate an
    expected result object already asserted in tests/core/.
  positive_example: 'class ConfigSetRootTests: ...  # handler owns string-to-bool coercion, so it earns a root test'
  negative_example: 'class ConfigShowRootTests: ...  # pass-through handler re-asserting the ConfigLoadResult from tests/core/config/'
  citation: docs/agents/testing.md#tier-3---cli-wiring-runner-required-root-tests-when-earned
- id: TEST-005
  title: Formatter Presentation Contract Protocol
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/cli/ui/formatters/
  guideline: >-
    Every formatter under cli/ui/formatters/<domain>/ is tested in its own file at
    tests/cli/ui/formatters/<domain>/test_<name>.py against three contracts built from FormatterCase: view model
    transform equality, JSON wire format as an exact literal dict pinned at both a fully populated and an
    empty or sparse boundary state, and a Rich render at pinned width 160 asserting only semantic values taken
    from case.view. Where the formatter has no derived view model, meaning transform is provably the identity
    and the declared view type is the input event type, the transform test is omitted and the remaining two
    contracts are mandatory; an alias such as SomeView = SomeEvent must not be introduced to manufacture a third
    test. Never assert to_json_serializable(data) == transform(data).model_dump(), and never assert a label,
    border, glyph, padding, or full sentence in the render test.
  evaluation_criteria: >-
    Inspect each formatter test file. Flag missing wire-format boundary cases, model_dump comparisons standing in
    for a literal dict, identity view aliases added to satisfy the count, and render assertions on labels or
    layout rather than view values.
  positive_example: 'assert formatter.to_json_serializable(data) == {"health": "ok", "warnings": []}  # exact literal'
  negative_example: 'ErrorPanelView = ErrorPanelEvent  # alias so an identity transform can be asserted'
  citation: docs/agents/testing.md#tier-2---presentation-contracts-three-tests-per-formatter-never-one
- id: TEST-006
  title: Parameterization-First for Sibling Variations
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  guideline: Parameterization is the primary approach for testing variations of the same contract or function. Never duplicate test functions across input variants, polymorphic target types (e.g. BaseModel vs dict), or invalid payload permutations. Never use `for` loops or stacked assertions over scenarios. Use `@pytest.mark.parametrize` with explicit `pytest.param(..., id="...")` labels. Separate `def test_*` methods are reserved for fundamentally distinct lifecycles, differing fixture requirements, or divergent assertion contracts.
  evaluation_criteria: Flag copy-pasted or near-identical sibling test methods differing only by input parameters or expected outcomes. Scan test bodies for `for item in items:` loops over test cases.
  positive_example: '@pytest.mark.parametrize("target", [pytest.param(model, id="model"), pytest.param(dict, id="dict")])'
  negative_example: 'def test_eval_model(self): ...; def test_eval_dict(self): ...  # duplicate sibling methods'
  citation: docs/agents/testing.md#parameterization-as-primary-approach
- id: TEST-007
  title: Assert Domain Invariants on Results; Pin Schemas in Dedicated Contract Tests
  severity: SUGGESTION
  category: Testing
  domain: tests
  scope: tests/
  intent: Protects tests that fail only when behavior breaks. Assertions target the domain outcome under test, and
    model shapes and defaults are pinned once in contract tests, so unrelated changes do not break scenario tests.
  criteria:
  - id: TEST-007.Q01
    question: Does every field assertion in a scenario test check a field that carries the scenario's domain outcome rather than an incidental envelope field or default?
    kind: judgment
    na_when: The test is a dedicated model contract test or a wire payload test.
    positive_example: "assert result.status == WorktreeDiffStatus.NOT_FOUND; assert 'not found' in result.errors[0].lower()"
    negative_example: "assert result.status == WorktreeDiffStatus.NOT_FOUND; assert result.error_code is None; assert result.warnings == []; assert result.fixes == []  # incidental defaults in a not-found scenario"
  - id: TEST-007.Q02
    question: Does each scenario or integration test of a specific behavior or error condition use targeted field assertions instead of whole-model equality?
    kind: judgment
    na_when: The test is a wire payload test, or the entire entity is the subject under test (its expected model may then rely on schema defaults instead of naming every field in kwargs).
    positive_example: "assert result.status == WorktreeDiffStatus.NOT_FOUND; assert result.worktree_id == 'wt-1'"
    negative_example: "assert result == WorktreeDiffResult(status=WorktreeDiffStatus.NOT_FOUND, worktree_id='wt-1')  # whole-model equality for a status check"
  - id: TEST-007.Q03
    question: Does each new or modified model with defaults or a serialization contract have a dedicated contract test in tests/common/ or tests/core/*/test_models.py that asserts them?
    kind: judgment
    na_when: The change adds or modifies no model that has defaults or a serialization contract.
    positive_example: "tests/core/interaction/test_models.py::test_serialized_shape_and_defaults_are_pinned pins the shape and defaults of the interaction models"
    negative_example: "A new BaseResult subclass with default_factory fields and no test in tests/core/*/test_models.py asserting its defaults"
  - id: TEST-007.Q04
    question: Are model shape, default values and serialization asserted only in dedicated contract tests rather than in scenario or integration tests?
    kind: judgment
    na_when: No new or modified scenario or integration test asserts a model's shape, default values or serialization.
    positive_example: "A diff scenario test in tests/core/worktree/test_worktree.py asserts only result.status, while defaults are pinned in a test_models.py contract test"
    negative_example: "A variant of that diff test that also asserts result.warnings == [] and result.fixes == [] to pin the model defaults"
  - id: TEST-007.Q05
    question: Does each model have at most two dedicated contract tests?
    kind: judgment
    na_when: The change adds or modifies no dedicated model contract test.
    positive_example: "tests/core/interaction/test_models.py::test_serialized_shape_and_defaults_are_pinned is the single test pinning shape and defaults for its model"
    negative_example: "A test_models.py file with three or more separate tests that each re-pin the defaults of the same model"
  - id: TEST-007.Q06
    question: Does each test of a wire payload with a published schema contract, such as a CLI JSON formatter, verify the exact wire payload?
    kind: judgment
    na_when: No new or modified test covers a wire payload with a published schema contract.
    positive_example: "assert_json_payload_matches_published_shape(WorktreeDiffFormatter, case.data, expected_payload)  # tests/cli/ui/formatters/worktree/test_worktree_diff.py"
    negative_example: "assert json.loads(output)['status'] == 'not_found'  # the rest of the published payload goes unverified"
  - id: TEST-007.Q07
    question: Does each test avoid faux-matchers such as ANY_TIMESTAMP and ANY_UUID where their only purpose is to satisfy whole-object matching on database records or unowned system state?
    kind: judgment
    na_when: The test uses no faux-matcher.
    positive_example: "assert record.branch_name == 'feature-x'; assert record.status == WorktreeStatus.ACTIVE  # deterministic business fields asserted directly"
    negative_example: "assert record == expected  # expected substitutes the ANY_TIMESTAMP faux-matcher for created_at and updated_at only to allow whole-object matching"
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-008
  title: Test Double Realism and Production Types
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  guideline: Test doubles must be types production actually passes or implement a Protocol production is typed against. Never
    build a stub whose interface is the union of every branch in a hasattr chain.
  evaluation_criteria: Inspect test doubles and stubs. Verify they inherit from production types or satisfy typing.Protocol.
  positive_example: 'class FakeBaseAgentProvider(BaseAgentProvider): def _invoke(self, request: AgentRequest) -> AgentResponse: ...'
  negative_example: 'class MockAdapter: def __getattr__(self, name): return MagicMock()'
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-009
  title: Ban on Negative Existence Tests for Deleted Symbols
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  guideline: Tests prove what the live codebase does, never the historical outcome of a refactor. When dead or obsolete functions,
    classes, or aliases are removed from production, delete the tests that called them. Never write assert not hasattr(mod,
    'old_fn').
  evaluation_criteria: Grep for `assert not hasattr` in tests/. Flag any occurrence.
  positive_example: '# Deleted test_old_helper when old_helper was removed from production'
  negative_example: 'assert not hasattr(filesystem, ''old_helper'')  # negative existence test'
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-010
  title: Complete Assertions Invariant
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  guideline: assert obj is not None is not an assertion; if it is the only assert, the test is unfinished. Use isinstance
    only when it distinguishes two real code paths (basedpyright already proves the rest).
  evaluation_criteria: Flag tests where the sole check is `assert result is not None` or redundant `isinstance` checks.
  positive_example: assert result.session_id == 'wf_abcdef12'
  negative_example: assert result is not None; assert isinstance(result, RunOutcome)
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-011
  title: Determinism and Clock Virtualization
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  guideline: >-
    No hardcoded sleeps in test bodies. Retry and backoff intervals use VirtualClock or monkeypatch the clock at
    the module boundary (time.monotonic, asyncio.sleep), and a retry test asserts the resulting schedule rather
    than that a retry eventually happened. Inject the clock and the id factory anywhere their output reaches a
    result field, so timestamps and generated ids are literals a test can state when asserting time-dependent contracts. Waiting on an operating system event that has no virtual equivalent,
    such as a process group being reaped after SIGKILL, is permitted only through a shared harness helper that
    owns the poll interval and deadline; tests must not open-code a poll loop. Registering spawned processes with
    the harness process registry is mandatory so a failing test cannot leak a process group.
  evaluation_criteria: >-
    Grep for time.sleep in tests/. Permit occurrences inside the shared harness poll helper only, and flag every
    open-coded poll loop or bare sleep in a test module. Flag subprocess-spawning tests that do not register with
    the process registry.
  positive_example: assert wait_pid_dead(child_pid) is True  # harness helper owns the poll interval
  negative_example: "while time.monotonic() < deadline:\n    time.sleep(0.05)  # open-coded poll loop in a test module"
  citation: docs/agents/testing.md#determinism--process-isolation-strategy
- id: TEST-012
  title: Rich Render Width Pinning
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  guideline: >-
    render_rich(renderable, width=160) is the only supported way to capture rendered output, and console width for
    rendered assertions is authoritatively pinned to 160. Tests must not rely on ambient terminal size or
    in-process os.environ['COLUMNS'] mutations. A render assertion checks semantic values carried by the view
    model, such as an identifier, count, or status token; it never checks a panel title, field caption, border
    glyph, padding, or prose sentence, because those are layout and change without any contract changing.
  evaluation_criteria: >-
    Scan for console render captures and ensure render_rich with width=160 is used. Flag ambient-width captures,
    and flag render assertions whose expected string is a caption or label rather than a value taken from
    case.view.
  positive_example: "rendered = render_rich(formatter.to_rich(data))\nassert 'wf_abcdef12' in rendered  # view value, not a caption"
  negative_example: "assert 'Session ID' in rendered  # panel caption, changes with layout and pins no contract"
  citation: docs/agents/testing.md#rich-render-assertions
- id: TEST-013
  title: No Sole Consumer Tests
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: src/, tests/harness/, tests/
  guideline: >-
    No test may be the sole consumer of a production symbol. If deleting the test would make production code
    unreachable, the production code is dead and both go. The same applies to the test harness: a builder method,
    fixture, or assertion helper whose only caller is its own verification test is dead harness. Delete the
    capability rather than testing it, and prove harness behavior through the first domain test that needs it.
  evaluation_criteria: >-
    Verify every touched production function has a real caller in src/. Verify every harness symbol has at least
    one caller outside tests/harness/. Flag harness verification suites that exhaustively permute options no
    domain test uses.
  positive_example: '# WorkspaceBuilder.with_git() used by tests/core/worktree/test_services.py'
  negative_example: '# StepBuilder.with_retry() exercised only by tests/harness/test_builders.py'
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-014
  title: Strict Typing on Test Helpers and Fixtures
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  guideline: Annotate test helpers and fixtures as tightly as production code. Give fixtures real return types and type helper
    parameters against what production passes. No MagicMock in helper signatures.
  evaluation_criteria: Inspect type annotations in tests/helpers/ and fixture functions. Flag missing types or MagicMock in
    signatures.
  positive_example: 'def create_test_session(db: DovoDb, session_id: str) -> SessionRecord: ...'
  negative_example: 'def create_test_session(db: Any, mock_obj: MagicMock) -> Any: ...'
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-015
  title: Orchestration Path Test Coverage
  severity: WARNING
  category: Testing
  domain: tests
  scope: tests/cli/, tests/engine/
  guideline: Modified command orchestration paths and multi-step dispatch workflows must include covering integration tests.
    Merging changes with gaps in end-to-end orchestration tests leaves regression risks.
  evaluation_criteria: Verify that PRs modifying command routing or multi-step orchestration include a test exercising the
    updated execution branch.
  positive_example: 'class ResumeCommandCliIntegrationTests: def test_resume_executes_remaining_steps(self): ...'
  negative_example: '# PR modifying Engine.resume() without integration tests for resumed step loop'
  citation: docs/agents/testing.md#pr-review-hygiene-and-testing-documentation-review-rule
- id: TEST-016
  title: Public Function Happy and Unhappy Path Coverage
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  guideline: >-
    Every public function and method (no leading underscore) in a production module
    requires at least one happy-path test (valid inputs producing the expected
    successful outcome) and at least one unhappy-path test (invalid input, missing
    dependency, boundary condition, or failure state producing the expected error
    result, exception, or classified non-ok outcome). Private functions and methods
    (leading underscore) are covered exclusively as byproducts of their public
    callers and never receive dedicated test methods. The coverage gate (CI-001)
    validates that private paths are reached. Properties containing no branching
    logic beyond a single field return are exempt from the unhappy-path requirement;
    their happy path is satisfied by any test that reads them. Dunder methods are
    exempt unless they contain domain validation (e.g. a __init__ that coerces or
    rejects values). When a public method has multiple independent failure modes,
    TEST-006 parameterization is the primary tool for covering them; a separate
    test method per failure mode is reserved for cases with divergent fixture
    requirements.
  evaluation_criteria: >-
    For each public function or method in a changed production module, verify its
    corresponding test file (per TEST-002) contains at least one test exercising a
    success path and at least one test exercising a failure or boundary path. Flag
    any public function with only happy-path tests, any dedicated test method
    targeting a private (underscore-prefixed) function, and any public function
    with zero covering tests. Trivial properties (single field return, no branch)
    require only a happy-path read.
  positive_example: |-
    class SessionStateStoreTests:
        def test_save_persists_state_and_increments_revision(self): ...
        def test_save_with_stale_revision_returns_conflict_error(self): ...
        def test_load_returns_persisted_state(self): ...
        def test_load_with_corrupt_json_returns_classified_failure(self): ...
  negative_example: |-
    class SessionStateStoreTests:
        def test__validate_schema_version(self): ...  # dedicated test for private method
        def test_save_persists_state(self): ...  # happy path only, no unhappy path for save()
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-017
  title: CLI Runner Assertion Boundary
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/cli/
  guideline: >-
    CLI runner tests assert wiring and observable behavior: exit codes, --format json payloads as exact literal
    dicts, resulting disk or git state, and rendered CLI output. A rendered-output assertion is not restricted to
    a published error code token; asserting a literal status label, panel line, or full rendered string is
    permitted, ideally pinned via snapshot testing so the assertion cannot drift silently. Never assert help text
    wording; assert command registration and option names through Click metadata instead.
  evaluation_criteria: >-
    Scan each CLI command domain's test directory under tests/cli/<command>/ for containment or equality checks
    against stdout or rendered output; any literal assertion, including a snapshot comparison, is permitted. Flag
    only assertions against help text wording, and name the Click metadata check that should replace them.
  positive_example: "assert result.exit_code == 1\nassert \"Status: valid with warnings\" in result.stdout  # literal rendered output, not restricted to an error-code token"
  negative_example: 'assert "Show the current configuration value" in result.output  # help text wording; assert Click metadata instead'
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-018
  title: Test Layer Import Boundary
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/core/
  guideline: tests/core/** must never import dovo.cli.*. A core test proves the domain layer's contract
    independent of any presentation concern, and an import of the CLI package from a core test either leaks a
    presentation dependency into the domain suite or signals the test belongs under tests/cli/ instead.
  evaluation_criteria: Scan import statements in changed files under tests/core/. Flag any import of
    dovo.cli or a submodule of it.
  positive_example: 'from dovo.core.worktree.prune import prune_worktrees  # tests/core/worktree/test_prune.py'
  negative_example: 'from dovo.cli.worktree.commands.prune import prune_command  # imported from tests/core/worktree/test_prune.py'
  citation: docs/agents/testing.md#11-source-parity-layout
- id: TEST-019
  title: Command Result DTO Spy Scope for CLI Integration Tests
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/cli/
  guideline: >-
    A *CliIntegrationTests suite may pin the exact domain DTO a command handler produces, beyond what --format
    json's wire payload already proves, with a call-through spy fixture on ui_dispatcher.dispatch that still
    exercises the real formatter and render path (never a replacement stub, so this does not trip TEST-008). What
    that spy may be asserted against is scoped to one thing: the command action's own terminal BaseResult — the
    same type its domain entrypoint or service call returns and the JSON envelope wraps (WorktreeCreateResult for dovo worktree
    create, DovoStatusResult for dovo status). It is never used to assert on other objects the same invocation
    dispatches — MessageEvent, WarningEvent, PromptEvent, or a lifecycle/progress event — even when the spy's
    fixture captures them incidentally. A command action known to dispatch only its own terminal result per
    invocation may assert the spy's sole captured item directly; a command action that also dispatches other
    event types must first isolate the captured instance of its own Result type rather than assume position or
    length. This is a genuine contract comparison against a BaseResult (TEST-001's good pattern), not a call-count
    check on a mocked collaborator, because the spy calls through to production and the assertion targets the
    DTO's fields, not the fact that dispatch fired.
  evaluation_criteria: >-
    Inspect any dispatch-spy fixture use under tests/cli/. Verify every assertion made against a
    captured item is an instance of that command action's own declared Result type. Flag an assertion against any
    other dispatched event type captured by the same spy, and flag spy[0]/len(spy) == 1 relied on without
    isolating the command's own Result type for a command action that can plausibly dispatch more than its
    terminal result in the same invocation.
  positive_example: 'assert len(dispatch_spy) == 1; assert isinstance(dispatch_spy[0], WorktreeCreateResult)  # worktree create dispatches only its own terminal result'
  negative_example: 'assert isinstance(dispatch_spy[-1], MessageEvent)  # asserting an incidental progress event through the result spy'
  citation: docs/agents/testing.md#tier-3---cli-wiring-runner-required-root-tests-when-earned
- id: TEST-020
  title: Test-Layer Docstrings Are Terse Contracts Without Tags
  severity: WARNING
  category: Testing
  domain: tests
  scope: tests/
  guideline: >-
    A test method docstring exists only when it adds a fact the test name and assertions do not, such as an exact literal,
    an ordering contract, or the inputs behind a parametrized case. It is one imperative sentence stating the outcome, with
    no `[tier-N/type]` tag, no `<symbol>:` or `dovo <command>:` prefix, and every line within 120 columns. The execution
    tier follows from the test file path. A docstring on any other unit under tests/ (helper, fixture, test double, class,
    module) opens with a one-line title stating what the unit is or does, with no outcome clause and no list of steps. It
    adds a description only for a hidden contract, a safety behavior, or a non-obvious ordering constraint. It does not
    retell the body, restate parameters, types, or the return annotation, or describe how another module or caller
    behaves. Every unit carries exactly one docstring, so a bare string statement after it is dead code.
  evaluation_criteria: >-
    Inspect new or modified docstrings under tests/. On a test method, flag a docstring that carries a tier tag, opens
    with a non-imperative word, exceeds 120 columns, or only rewords the test name. On any other unit, flag a title that
    carries an outcome clause or lists steps, a description that retells the body, restates the signature, or adds no
    fact the title lacks, a sentence describing another unit's behavior, and a bare string statement after the
    docstring.
  positive_example: |-
    """Exit 1 with 'Maximum active worktrees reached' in stdout when 3 worktrees already exist."""
    """Build the registered provider with its winning credential set and a fake finished-stream runner."""  # helper
  negative_example: |-
    """[tier-3/integration] dovo worktree create: 3 prior worktrees exist -> exit 1, 'Maximum active worktrees reached' in stdout."""
    """Give the provider's winning credential 'test-token', patch a finished-stream runner, and return both."""  # helper: lists steps and restates the return type
  citation: docs/agents/testing.md#naming-conventions
- id: DOC-001
  title: Architecture Doc Structural Gate
  severity: BLOCKER
  category: Documentation
  domain: all
  scope: docs/agents/architecture.md
  guideline: Update docs/agents/architecture.md structure sections ONLY when package layout, domain ownership, or import boundaries
    change. Do not append feature behavior essays there. Pure refactors need no architecture diff.
  evaluation_criteria: Verify diff in docs/agents/architecture.md only modifies structure sections (layers tree, package
    boundaries), and only when a package is added, removed, or moved or an import boundary changes. A new boundary also needs
    a row in LAYER_RULES in tests/lint/test_layer_direction.py.
  positive_example: '# Updating layers tree in architecture.md for new core/prune/ domain'
  negative_example: '# 100 lines of narrative prose explaining pruning heuristics in architecture.md'
  citation: docs/agents/documentation.md
- id: DOC-002
  title: User-Visible Behavior Documentation Scope
  severity: BLOCKER
  category: Documentation
  domain: cli
  scope: docs/cli/
  guideline: User-visible CLI behavior, subcommands, and flags belong in docs/cli/<command>.md, never in docs/agents/architecture.md.
  evaluation_criteria: Verify new CLI options or behavioral changes are documented in docs/cli/.
  positive_example: '# Updating docs/cli/run.md with new --keep-on-failure flag'
  negative_example: '# Documenting user CLI flag --keep-on-failure inside architecture.md'
  citation: docs/agents/documentation.md
- id: DOC-003
  title: Schema and Entity Documentation Gate
  severity: BLOCKER
  category: Documentation
  domain: all
  scope: docs/agents/schemas.md
  guideline: Update docs/agents/schemas.md only when a cross-cutting contract changes (config tier merge rules, path ownership,
    persistence authority, secrets handling, catalog or database scoping). Adding or changing config keys, blueprint fields,
    DTOs, enum members, exceptions, entrypoint methods, or commands needs no schemas.md edit.
  evaluation_criteria: Verify schemas.md changes only when a stated contract changes, and flag schemas.md edits that add field
    lists, enum members, exception names, or method lists.
  positive_example: '# Updating schemas.md because a config key switched from replace to union merge across tiers'
  negative_example: '# Listing a new Result model''s fields in schemas.md'
  citation: docs/agents/documentation.md
- id: DOC-004
  title: Ban on Duplicating Source in Docs
  severity: SUGGESTION
  category: Documentation
  domain: all
  scope: docs/agents/
  guideline: Docs must not hand-copy Pydantic model signatures, field tables, or enum lists that a Read of the source already
    gives unambiguously. Link to the model file and document only unexpressed behavior (validators, resolution order).
  evaluation_criteria: Flag doc changes that copy-paste field lists or enum members from source models without adding context.
  positive_example: See [`WorktreeSession`](src/dovo/core/worktree/models.py). Worktrees live under .dovo/worktrees/.
  negative_example: '| Field | Type | Default |

    | session_id | str | required |'
  citation: docs/agents/documentation.md
- id: DOC-005
  title: Unavoidable Spec Tables Require Parity Tests
  severity: BLOCKER
  category: Documentation
  domain: tests
  scope: tests/lint/
  guideline: >-
    When a field table is genuinely unavoidable, meaning it is the specification for an external JSON Schema or a
    stable CLI output format, add or extend an automated test under tests/lint/ that fails when the table and the
    source disagree. The test must exist in the tree at the moment the doc claim lands, and the doc must name it
    by path. Citing a parity test that has not been written is a DOC-008 breach, not a pending task.
  evaluation_criteria: >-
    Verify every specification table in docs has a named automated test under tests/lint/ asserting parity, and
    resolve the named path to a file that exists. Flag manual tables of CLI flags or schema fields with no parity
    test, and flag doc sentences naming a parity test that is absent from the tree.
  positive_example: '# tests/lint/test_import_boundaries.py exists and is named by the doc claim it backs'
  negative_example: '# "enforced by tests/lint/test_doc_parity.py" where that module is nowhere in the tree'
  citation: docs/agents/documentation.md
- id: DOC-006
  title: Prefer Deletion Over Accretion
  severity: SUGGESTION
  category: Documentation
  domain: all
  scope: docs/
  guideline: When updating docs, replace or delete stale bullets rather than appending parallel conflicting truths. Flag any
    doc that states contradictory rules.
  evaluation_criteria: Review doc edits for conflicting old vs new statements.
  positive_example: '# Replaced outdated formatters.py reference with cli/ui/formatters/'
  negative_example: '# Appended new rule while leaving old formatters.py text intact'
  citation: docs/agents/documentation.md
- id: DOC-007
  title: Canonical Terminology Invariant
  severity: SUGGESTION
  category: Documentation
  domain: all
  scope: docs/, src/
  guideline: Adhere strictly to the Terminology table in docs/agents/architecture.md. Use only the terms it defines (Blueprint,
    Step, Loop step, Catalog, Run, Session, Worktree, Checkpoint), and keep each to its stated meaning.
  evaluation_criteria: Check doc prose and code comments for terms the Terminology table does not define, or defined terms used
    outside their meaning (e.g. calling a session a 'run').
  positive_example: '''A blueprint containing a loop step.'''
  negative_example: '''A session executes the blueprint.''  # the act of executing is a run; the session is what it leaves behind'
  citation: docs/agents/architecture.md#terminology
- id: DOC-008
  title: Verifiable Doc and Rule Claims
  severity: BLOCKER
  category: Documentation
  domain: all
  scope: AGENTS.md, docs/, .agents/skills/, docs/agents/rules_spec.yaml, src/ docstrings
  guideline: >-
    A doc, skill, rule, or docstring sentence asserting that something is enforced, gated, or checked must name the
    enforcing artifact by path, and that path must resolve to a file in the tree. The same applies to any helper,
    fixture, builder, or assertion function a doc instructs an implementer to use: the symbol exists before the
    instruction ships. Documentation of behavior that is planned rather than built is prohibited, including in
    rule examples, because an exemplar is copied more often than the guideline is read. When a claim becomes
    false, the fix is to delete or correct the sentence in the same change, never to leave it as aspiration.
    A change that alters the behavior a docstring describes owns that docstring: it re-reads it against the new code
    and corrects or deletes any sentence the change made false.
  evaluation_criteria: >-
    For each doc claim of the form "enforced by", "gated by", or "see <path>", resolve the path. For each
    documented helper or fixture name, resolve the symbol. Flag unresolvable claims, rule examples naming
    nonexistent modules, and doc paragraphs describing behavior absent from the tree. For each docstring in the
    diff, and each docstring of a function whose behavior the diff changes, re-read it against the code and flag
    any sentence the change made false.
  positive_example: '# "COLUMNS is pinned to 160 by [tool.pytest_env] in pyproject.toml" - resolvable and true'
  negative_example: '# "enforced by tests/lint/test_doc_parity.py" in AGENTS.md, where the module does not exist'
  citation: docs/agents/documentation.md
- id: CI-001
  title: Pre-Commit Quality Suite Gate
  severity: BLOCKER
  category: CI/Tooling
  domain: all
  scope: Whole repository
  guideline: >-
    Before committing, `dovo run quality` must pass: ruff format, ruff check, basedpyright src tests --level error
    with zero errors, mkdocs build --strict, complexity at or under 10 on changed files, and the test suite meeting the
    coverage floor configured in pyproject.toml under [tool.coverage.report] fail_under. That floor is the contract, it ratchets
    upward only as real contract tests land, and it is never lowered to make a commit pass. Coverage is a
    regression backstop, not a target: do not add tests to raise the percentage, and read a coverage drop caused
    by deleting duplicated or dead tests as a success.
  evaluation_criteria: >-
    Verify `dovo run quality` succeeds before any commit. Verify the fail_under value in pyproject.toml is greater
    than or equal to the previous committed value. Flag any PR that lowers fail_under, and flag test additions
    whose stated justification is raising coverage.
  positive_example: uv run ruff format . && uv run dovo run quality
  negative_example: '# fail_under lowered so a commit can pass, or tests added purely to reach a percentage'
  citation: AGENTS.md#essential-commands
- id: CI-002
  title: Git and Pull Request Attribution Hygiene
  severity: BLOCKER
  category: CI/Tooling
  domain: all
  scope: Git commits & PRs
  guideline: 'Commit messages must be semantic, imperative, and contain NO AI trailers (Co-authored-by: Cursor, Co-authored-by:
    ...). PRs must have single responsibility and contain concise Why, Approach, and Linkage sections.'
  evaluation_criteria: Inspect commit message trailers and PR descriptions. Flag AI co-author trailers.
  positive_example: 'feat(worktree): add prune subcommand for stale worktrees'
  negative_example: 'feat: prune worktrees


    Co-authored-by: Cursor <cursor@cursor.sh>'
  citation: docs/agents/git-and-pr-conventions.md#commit-and-pr-attribution
- id: CI-003
  title: Agentic Process State Declaration
  severity: WARNING
  category: CI/Tooling
  domain: all
  scope: Agent interactions
  guideline: 'Before executing commands or editing files, the agent must state: (1) The specific directive/doc governing this
    action, and (2) The target scope (e.g. specific test package or module).'
  evaluation_criteria: Check agent turns prior to tool execution for stated directive and scope. Flag tool execution lacking
    state declaration as advisory warning.
  positive_example: 'Governing directive: docs/agents/testing.md

    Target scope: tests/core/worktree/test_lifecycle.py'
  negative_example: Running write_to_file without stating governing directive or target scope
  citation: AGENTS.md#agentic-process
- id: CI-004
  title: Mechanical Enforcement Parity
  severity: BLOCKER
  category: CI/Tooling
  domain: all
  scope: tests/lint/, prek.toml, .github/workflows/, pyproject.toml
  guideline: >-
    A BLOCKER rule that can be checked mechanically must have an executing check: an invariant test under
    tests/lint/, a prek hook, or a CI step. A declared gate whose configuration disables it, such as a coverage
    floor of zero or a type checker present in no hook and no workflow, counts as unenforced and must be either
    wired up or downgraded to a review-time WARNING. An invariant check must prove its own scope with a
    regression test shaped like the code it polices, and lands green by carrying an explicit burn-down allowlist
    of known violators; allowlist entries shrink and are never added to.
  evaluation_criteria: >-
    For each BLOCKER rule, identify its executing check or its explicit review-only classification. Verify
    invariant checks include a regression test matching the suite's real shape, such as assertions inside a
    *Tests class rather than a module-level function. Flag configuration that disables a declared gate and
    allowlists that grew.
  positive_example: '# ARCH-001 enforced by tests/lint/test_import_boundaries.py'
  negative_example: '# Scanner walks only tree.body functions, so class-based tests are never inspected'
  citation: docs/agents/ci-and-tooling.md
planner_rules:
- id: PLAN-001
  title: Read-Only Planning Discipline
  category: Planning
  phase: Reset & Prereqs
  scope: Agent session & filesystem
  requirement: While planning, the agent is strictly read-only. Never edit src/ or tests/, never run tests or tooling (dovo
    run tests, dovo run quality, pytest, ruff, basedpyright), and never commit, push, or touch PR state. Read-only git and gh commands
    are the only commands permitted.
  deliverable_contract: No source files edited. The plan document in .agentic/plan.md is the entire deliverable.
  validation_check: Verify git status after planning shows only .agentic/plan.md created.
  positive_example: '# Agent reads files and gh issues, then writes only to .agentic/plan.md

    '
  negative_example: '# Agent runs `dovo run tests` or edits `src/dovo/cli/app.py` while planning

    '
  citation: docs/agents/planning.md#planning-before-implementation
- id: PLAN-002
  title: Workspace Reset and State Isolation
  category: Planning
  phase: Reset & Prereqs
  scope: .agentic/ directory
  requirement: >-
    Before anything else, clear the previous cycle's artifacts so a stale review, plan, or master plan can never
    be read as current: `rm -rf .agentic && mkdir -p .agentic`. Use -rf and remove the directory itself; `rm -f`
    on a directory exits non-zero and short-circuits the chained mkdir, leaving every stale artifact in place
    while appearing to have reset. Per-file removal is insufficient because it leaves master-plan.md behind.
  deliverable_contract: An empty .agentic/ directory prior to writing the new plan.
  validation_check: >-
    Check that .agentic/ contains no plan.md, master-plan.md, review.md, or review.json when a new plan is
    generated.
  positive_example: 'rm -rf .agentic && mkdir -p .agentic'
  negative_example: 'rm -f .agentic && mkdir -p .agentic  # fails on a directory, mkdir never runs, nothing is cleared'
  citation: .agents/skills/dovo-plan/SKILL.md#1-discovery-and-boundary-auditing
- id: PLAN-003
  title: Verbatim Contract Extraction
  category: Planning
  phase: Contract Extraction
  scope: '## Contract section in .agentic/plan.md'
  requirement: Extract the contract from the issue body without summarizing. Copy every FR-* and NFR-* verbatim with its ID.
    Paraphrasing requirements is strictly prohibited.
  deliverable_contract: Section '## Contract' containing exact FR/NFR IDs and verbatim requirement text.
  validation_check: Diff issue text against plan contract section. Flag any dropped clause or paraphrase.
  positive_example: '## Contract

    - **FR-1**: Add `dovo worktree prune` command to remove unreferenced worktrees.

    - **FR-2**: Prune operation must delete worktree branches matching `dovo/dovo_*`.

    '
  negative_example: '## Contract

    We will implement worktree pruning for stale directories.

    '
  citation: docs/agents/planning.md#step-1-extract-the-contract-from-the-issue
- id: PLAN-004
  title: Normative Pre-Determined Data Preservation
  category: Planning
  phase: Contract Extraction
  scope: '## Contract section in .agentic/plan.md'
  requirement: Copy Pre-determined data exactly from the issue. Field names, types, defaults, file paths, constants, error
    codes, and template bodies stated there are normative. You may not invent, rename, or 'improve' them.
  deliverable_contract: Pre-determined data reproduced identically under '## Contract'.
  validation_check: Verify all field names, types, and defaults in code samples match the issue's Pre-determined data.
  positive_example: '### Pre-determined data

    - Model: `WorktreePruneResult`

    - Field: `pruned_items: list[str] = []`

    - Exit code on error: `1`

    '
  negative_example: '# Plan renames `pruned_items` to `deleted_worktrees` because it sounds "better"

    '
  citation: docs/agents/planning.md#step-1-extract-the-contract-from-the-issue
- id: PLAN-005
  title: Out-of-Scope Guardrails
  category: Planning
  phase: Contract Extraction
  scope: '### Out of scope section in .agentic/plan.md'
  requirement: Copy Out of scope verbatim from the issue into the plan's guardrail section. Treat it as a strict stop sign,
    not a hint.
  deliverable_contract: Subsection '### Out of scope (verbatim from the issue)' containing exact bullet points.
  validation_check: Verify that all items marked out of scope are explicitly listed and omitted from artifact inventory.
  positive_example: '### Out of scope (verbatim from the issue)

    - Interactive confirmation prompt before pruning

    - Pruning worktrees on remote git repositories

    '
  negative_example: '# Omitting Out of scope section or planning an interactive confirmation prompt

    '
  citation: docs/agents/planning.md#step-1-extract-the-contract-from-the-issue
- id: PLAN-006
  title: Greenfield Architecture Default
  category: Planning
  phase: Contract Extraction
  scope: Entire plan
  requirement: Plan zero compatibility shims, aliases, dual code paths, or deprecation windows unless the issue explicitly
    states a compatibility constraint. Plan to replace superseded paths and update callers in the same change set.
  deliverable_contract: Direct replacements planned; zero shims or legacy fallback adapters in artifact inventory.
  validation_check: Check artifact inventory for compatibility wrappers or fallback flags.
  positive_example: '# Plan directly replaces WorktreeService.delete() with unified lifecycle pruner

    '
  negative_example: '# Plan introduces `LegacyWorktreeService` and adds deprecation warning shims

    '
  citation: docs/agents/planning.md#step-1-extract-the-contract-from-the-issue
- id: PLAN-007
  title: Tree Grounding and Neighbor Mirroring
  category: Planning
  phase: Grounding & Traps
  scope: '## Ground truth section in .agentic/plan.md'
  requirement: 'Never plan from memory: read live domain source and name the closest existing implementation to mirror with
    exact file:line citations. In the ground-truth table, write at most one clause per cell. Reproduce a mirrored symbol''s
    shape as signature + docstring only, never its full body.'
  deliverable_contract: 'Ground-truth table with columns | Surface | Location | What exists | (one clause per cell), plus explicit ''Pattern
    to mirror: <path:line>'', with any reproduced symbol shown as signature + docstring only.'
  validation_check: Verify cited file:line citations exist and match cited functionality; flag any quoted body, helper
    internals, or file dump beyond a signature and docstring.
  positive_example: '## Ground truth

    | Surface | Location | What exists |

    | CLI app | `src/dovo/cli/worktree/app.py:24` | Typer app registering worktree subcommands |

    | Lifecycle | `src/dovo/core/worktree/services/lifecycle.py:80` | `delete_worktree` method |


    **Pattern to mirror:** `src/dovo/cli/config/commands/config_set.py:30`

    ```python

    def config_set_command(context: CliContext, key: str, value: str) -> ConfigSetResult:
    """Set a single config key and persist it to the active scope."""

    ```

    '
  negative_example: '# Plan pastes the full 40-line body of config_set_command instead of its signature + docstring

    '
  citation: docs/agents/planning.md#step-2-ground-yourself-in-the-current-code
- id: PLAN-008
  title: Trap Identification and Isolation
  category: Planning
  phase: Grounding & Traps
  scope: '## Current state section in .agentic/plan.md'
  requirement: 'Explicitly name every trap a lower-context implementer could fall into: dead code, similarly-named-but-unrelated
    symbols, duplicate implementations, or stale docs. Mark each explicitly out of scope.'
  deliverable_contract: Subsection '**Traps (explicitly not touched):**' naming specific symbols and paths.
  validation_check: Verify known hazards (e.g. similarly-named-but-unrelated modules across sibling packages) are trapped
    when touched.
  positive_example: '**Traps (explicitly not touched):**

    - Stale doc claim in `schemas.md` §4 mentioning `renderers.py`: Do not create `renderers.py`.

    '
  negative_example: '# Plan fails to warn implementer about known naming collision or dead code

    '
  citation: docs/agents/planning.md#step-2-ground-yourself-in-the-current-code
- id: PLAN-009
  title: Complete Artifact Inventory and Deletion Ledger
  category: Planning
  phase: Artifact Inventory
  scope: '## Artifact inventory section in .agentic/plan.md'
  requirement: >-
    Produce an inventory (Artifact | Kind | Path | New or changed | Requirement), one row per touched file, writing
    'none' explicitly for every untouched kind. Follow it with a deletion ledger (Path or symbol | Why it goes |
    Replaced by) covering superseded paths (COMPAT-002), duplicate tests (TEST-004), and dead harness symbols
    (TEST-013), executed in the same change set — or state 'Deletes nothing: greenfield'.
  deliverable_contract: >-
    Markdown inventory table followed by 'Not needed for this issue: <kinds>', then a deletion ledger table or
    the explicit 'Deletes nothing: greenfield' line.
  validation_check: >-
    Check every touched file maps to a requirement, every unused artifact kind is listed under 'Not needed', and
    the deletion ledger has rows or the explicit greenfield line.
  positive_example: |
    ## Deletion ledger
    | Path or symbol | Why it goes | Replaced by |
    | `tests/cli/config/test_config_show.py::ConfigShowRootTests` | pass-through handler restating a domain contract | `tests/core/config/test_loader.py` |
  negative_example: '# Inventory lists 9 new files and says nothing about what they supersede'
  citation: docs/agents/planning.md#step-3-enumerate-every-artifact
- id: PLAN-010
  title: Literal Final Code for Contracts
  category: Planning
  phase: Specification & Samples
  scope: '### Code section in .agentic/plan.md'
  requirement: 'Write literal, production-ready code for anything that is a contract: models with model_config, enum definitions,
    function/method signatures with full type hints and docstrings, Typer argument/option declarations, exact JSON dicts,
    and error/warning strings.'
  deliverable_contract: Fully typed models, signatures, and literal dictionaries in code blocks.
  validation_check: Verify contract code blocks leave no ambiguous types, missing defaults, or unspecified flags.
  positive_example: "```python\nclass WorktreePruneStatus(StrEnum):\n    OK = \"ok\"\n    NOTHING_TO_PRUNE = \"nothing_to_prune\"\
    \n    FAILED = \"failed\"\n\nclass WorktreePruneResult(BaseResult):\n    model_config = {\"extra\": \"forbid\", \"strict\"\
    : True}\n    status: WorktreePruneStatus\n    pruned_items: list[str] = []\n```\n"
  negative_example: "```python\n# Plan writes vague sketch:\nclass WorktreePruneResult:\n    # fields for status and pruned\
    \ items\n    pass\n```\n"
  citation: docs/agents/planning.md#code-sample-rules
- id: PLAN-011
  title: Signature Plus Intent Docstring for Production Stubs
  category: Planning
  phase: Specification & Samples
  scope: '### Code section in .agentic/plan.md'
  requirement: 'Write only a real signature and a one-line docstring stating intent for every planned production
    function, ending with `raise NotImplementedError`. No numbered steps, no body code — the docstring says what the
    function does, not how, and adds nothing beyond what the signature and name don''t already say.'
  deliverable_contract: 'Signature + one-line intent docstring + `raise NotImplementedError` — no steps, no body.'
  validation_check: 'Flag any production stub with numbered steps, setup comments, or body code beyond the docstring,
    and any docstring that narrates implementation steps instead of stating intent.'
  positive_example: "```python\ndef prune_worktrees(db: WorktreesRepository, cwd: Path) -> WorktreePruneResult:\n    \"\"\"Delete unreferenced worktrees and branches under cwd.\"\"\"\n    raise NotImplementedError\n```\n"
  negative_example: "```python\ndef prune_worktrees(db: WorktreesRepository, cwd: Path) -> WorktreePruneResult:\n    \"\"\"Prune worktrees.\n\n    1. Query active worktrees from db\n    2. Diff against on-disk worktrees\n    3. Delete unreferenced ones\n    \"\"\"\n    raise NotImplementedError\n```\n"
  citation: docs/agents/planning.md#code-sample-rules
- id: PLAN-018
  title: Test Stubs with Imperative Contract Docstrings
  category: Planning
  phase: Specification & Samples
  scope: '### Tests section in .agentic/plan.md'
  requirement: 'Write a signature and, where the test name does not already say it, a single-line imperative contract docstring for every
    planned test stub, ending with `raise NotImplementedError`. The docstring states the exact outcome contract asserted and does not
    repeat the public symbol, which the class and test name carry; the execution tier follows from the test file path
    (docs/agents/testing.md#the-four-execution-tiers). The `### Tests` table acts as a concise summary index.'
  deliverable_contract: 'Signature + single-line imperative docstring with the outcome contract (when the name does not say it) + `raise NotImplementedError`.'
  validation_check: 'Flag any test stub whose docstring is not imperative, repeats its test name without adding a contract, carries a tier/type tag, or contains numbered steps/body code.'
  positive_example: |
    ### Tests

    | Test | Outcome |
    |---|---|
    | `WorktreeCreateCliIntegrationTests::test_create_cli_capacity_exceeded_exits_one` | exit 1; capacity exceeded error |

    ```python
    class WorktreeCreateCliIntegrationTests:
        def test_create_cli_capacity_exceeded_exits_one(
            self, cli_runner: CliRunner, worktree_workspace: Path
        ) -> None:
            """Exit 1 with 'Maximum active worktrees reached' in stdout when 3 worktrees already exist."""
            raise NotImplementedError
    ```
  negative_example: |
    # Test stub with a tier tag, a symbol prefix and a non-imperative, non-specific contract
    def test_create_cli_capacity_exceeded_exits_one(self, cli_runner, worktree_workspace):
        """[tier-3/integration] dovo worktree create: verifies create fails when capacity exceeded."""
        raise NotImplementedError
  citation: docs/agents/planning.md#code-sample-rules
- id: PLAN-012
  title: Pre-Decomposed Complexity
  category: Planning
  phase: Specification & Samples
  scope: '### Code section in .agentic/plan.md'
  requirement: Decompose complex workflows into named helper functions in the plan itself so that every planned function holds
    cognitive complexity <= 10.
  deliverable_contract: Multiple focused function signatures with single responsibilities rather than one large function.
  validation_check: Verify no single planned function contains more than 3 branching levels or complex nested loops.
  positive_example: 'def prune_stale_records(db: WorktreesRepository) -> list[str]: ...

    def prune_orphaned_directories(worktrees_dir: Path) -> list[str]: ...

    def prune_worktrees(...) -> WorktreePruneResult: ...

    '
  negative_example: '# Single 80-line function planned to do querying, directory diffing, git branch deleting, and error handling

    '
  citation: docs/agents/planning.md#step-3-enumerate-every-artifact
- id: PLAN-014
  title: Flagging Unspecified Decisions with 🚨
  category: Planning
  phase: Cross-Cutting & Validation
  scope: '### Decisions & ## Cross-cutting in .agentic/plan.md'
  requirement: 'When an issue leaves a detail genuinely unspecified, do not stall or invent product behavior: choose the option
    consistent with nearest neighbor patterns, record the choice and rejected alternative, and append 🚨 so human reviewers
    catch it.'
  deliverable_contract: 'Decision bullet: - **<point>:** <choice>, because <reason>. Rejected: <alt>. 🚨.'
  validation_check: Verify all unspecified assumptions are flagged with 🚨 in the plan and restated in the agent handoff message.
  positive_example: '- **Prune branch deletion policy:** Delete local branches matching `dovo/dovo_*` automatically,
    because active worktrees track branches 1:1. Rejected: prompt user for each branch. 🚨

    '
  negative_example: '# Silent design choice made without recording alternative or flagging with 🚨

    '
  citation: docs/agents/planning.md#step-1-extract-the-contract-from-the-issue
- id: PLAN-015
  title: Plan Target Path and Human Handoff Protocol
  category: Planning
  phase: Self-Check & Handoff
  scope: Deliverable file & Chat response
  requirement: 'Write the plan to .agentic/plan.md. Run the 9-item self-check before handing off. In chat, report the path,
    a one-paragraph summary, all 🚨 decisions and open questions, and state plainly that this was planning only: nothing was
    implemented, tested, committed, or pushed. Stop and wait for human review.'
  deliverable_contract: File written to .agentic/plan.md. Agent turn terminates without executing implementation commands.
  validation_check: Ensure the agent does not immediately proceed to invoke /dovo-code or edit production files.
  positive_example: '"Plan saved to .agentic/plan.md. Planning only; nothing was implemented or committed.

    Open decisions requiring confirmation:

    - 🚨 Prune branch deletion policy: auto-delete dovo/dovo_* branches."

    '
  negative_example: '"Plan written. Now I will start writing the code..."

    '
  citation: docs/agents/planning.md#step-5-save-and-hand-off
- id: PLAN-016
  title: Pre-Handoff Checklist Compliance Sweep
  category: Planning
  phase: Pre-Handoff Self-Audit
  scope: Entire .agentic/plan.md, checked before saving
  requirement: 'Before finalizing .agentic/plan.md, sweep docs/agents/REVIEW_CHECKLIST.json for every rule matching the
    touched paths or domains and verify the plan itself satisfies every applicable BLOCKER clause — reread the actual
    planned imports, paths, and stubs against each clause, not a restatement of the rule. Fix any violation in the plan
    before saving. This is a save gate, not a written report: no compliance table belongs in .agentic/plan.md.'
  deliverable_contract: 'Zero BLOCKER-severity violations in the saved plan. No Rule Evaluation Matrix or other
    compliance table in .agentic/plan.md — the plan''s own content is the evidence.'
  validation_check: 'Re-derive which REVIEW_CHECKLIST.json rules match the touched paths and spot-check the saved plan
    against each BLOCKER clause directly (e.g. reread Phase 2 imports for ARCH-001, reread ledger paths for TEST-002).
    Flag anything the agent could only justify by restating the rule rather than pointing at the plan''s own text.'
  positive_example: 'Before saving, reread the Phase 2 service stub and confirmed it imports only from common/ and
    core/worktree/ (ARCH-001), and reread the ledger path against the TEST-002 mapping — no BLOCKER violated, plan
    saved with no compliance table.'
  negative_example: '# Plan asserts "Complies with ARCH-001, TEST-002" without rereading the actual planned imports or
    paths'
  citation: docs/agents/planning.md#step-5-save-and-hand-off
- id: PLAN-017
  title: Test Ticket Scope Contract
  category: Planning
  phase: Test Strategy
  scope: Any issue whose deliverable is test files
  requirement: >-
    A ticket delivering tests must declare, before implementation, the exact test file paths per the TEST-002
    mapping, a line budget of 100–250 with a split plan if exceeded, and the rule IDs it's graded against. A list
    of test method names without paths is not a specification.
  deliverable_contract: >-
    In scope lists one bullet per test file (path + estimated lines + contracts asserted); Definition of Done
    cites the graded rule IDs and names what's deliberately not covered here.
  validation_check: >-
    Every declared path resolves under the TEST-002 mapping for its source module, and the summed line
    estimate stays within budget or carries a split plan.
  positive_example: |
    ### In scope
    - `tests/core/bootstrap/test_initialize.py` (~120 lines): preflight failure modes,
      zero-side-effect abort, idempotent rerun
    - `tests/cli/init/test_init.py` (~90 lines): runner exit codes, `--format json` payload, `--force`

    ### Rules
    TEST-002, TEST-004, TEST-017
  negative_example: |
    ### In scope
    - Create tests for init covering the happy path and some failure cases
    - Add CLI tests for every action with RootTests and CliIntegrationTests
