# Rule shapes accepted by scripts/compile_rules.py.
#
# Legacy rule:   id, title, severity, category, domain, scope, guideline, evaluation_criteria,
#                positive_example, negative_example, citation.
#
# Migrated rule: the same identity fields plus `intent` and `criteria` (assertions), and none of guideline,
#                evaluation_criteria, positive_example or negative_example (those move into the criteria).
#   intent:      one or two sentences, 40 words or fewer, saying what the rule protects.
#   criteria:    a non-empty list; ids are <rule id>.Q01, .Q02, ... in order. Each item has
#     statement: one declarative sentence ending in '.', not starting with Does, Do, Is, Are, Was, Were, Has or
#                Have, that is true when the change is compliant. A reviewer records PASS, FAIL or N/A.
#     kind:      mechanical or judgment. A mechanical criterion names `enforced_by`, a repo path that exists.
#     na_when:   optional condition under which the criterion does not apply.
#     positive_example, negative_example: both keys on the criterion, or instead the single key
#                example_not_applicable holding a reason specific to that criterion.
# A rule is migrated when it has `criteria`; validation errors fail the compile. See DRY-001 for a worked example.
rules:
- id: ARCH-001
  title: Strict Layered Import Flow
  severity: BLOCKER
  category: Architecture
  domain: all
  scope: src/dovo/
  intent: Imports flow one way through the layers, so a lower layer never depends on a higher one and each package can be
    understood, tested and changed without pulling in the code that sits above it.
  criteria:
  - id: ARCH-001.Q01
    statement: common/ imports nothing from core/, engine/ or cli/, other than the imports listed in LAYER_EXCEPTIONS in tests/lint/test_layer_direction.py.
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.common.exceptions import DefinitionError  # in core/catalog/'
    negative_example: 'from dovo.core.catalog.models import CatalogTier  # at runtime in common/ (hypothetical; the one real import of it, under TYPE_CHECKING in common/filesystem/models.py, is allowlisted)'
  - id: ARCH-001.Q02
    statement: core/ imports nothing from engine/ or cli/.
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.core.sessions import SessionLogEvent  # in engine/'
    negative_example: 'from dovo.engine.engine import Engine  # upward import in core/sessions/'
  - id: ARCH-001.Q03
    statement: core/ imports nothing from rich.
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: core/ returns models and leaves rendering to cli/ui/
    negative_example: 'from rich.console import Console  # in core/status/'
  - id: ARCH-001.Q04
    statement: engine/ imports nothing from cli/.
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.core.sessions import SessionLogEvent  # in engine/'
    negative_example: 'from dovo.cli.context import CliContext  # in engine/ (hypothetical module path)'
  - id: ARCH-001.Q05
    statement: git/ imports nothing from any other core/ package.
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.common.process import is_process_group_alive  # in core/git/ (hypothetical import)'
    negative_example: 'from dovo.core.project import ProjectIdentity  # in core/git/ (hypothetical import)'
  - id: ARCH-001.Q06
    statement: inputs/ imports nothing from catalog or agents.
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.core.project import ProjectIdentity  # in core/inputs/ (hypothetical import)'
    negative_example: 'from dovo.core.catalog.models import CatalogTier  # in core/inputs/ (hypothetical import)'
  - id: ARCH-001.Q07
    statement: catalog/ imports nothing from agents, sessions, engine or cli.
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.core.inputs import ParameterInput  # in core/catalog/ (hypothetical import)'
    negative_example: 'from dovo.core.sessions import SessionLogEvent  # in core/catalog/'
  - id: ARCH-001.Q08
    statement: artifacts/ imports nothing from engine.
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.core.sessions import SessionLogEvent  # in core/artifacts/ (hypothetical import)'
    negative_example: 'from dovo.engine.engine import Engine  # in core/artifacts/'
  - id: ARCH-001.Q09
    statement: agents/ imports nothing from engine.
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.core.sessions import SessionLogEvent  # in core/agents/ (hypothetical import)'
    negative_example: 'from dovo.engine.engine import Engine  # in core/agents/'
  - id: ARCH-001.Q10
    statement: sessions/ imports nothing from agents, worktree, catalog, engine or cli.
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    positive_example: 'from dovo.core.db import get_session  # in core/sessions/ (hypothetical import)'
    negative_example: 'from dovo.core.agents import BaseAgentProvider  # in core/sessions/ (hypothetical import)'
  - id: ARCH-001.Q11
    statement: Each core/ package named in the chain project/ -> {db, git, worktree, catalog, inputs, sessions, status, artifacts, interaction}/ -> agents/ -> diagnostics/ imports only from packages at or before its own position in that chain.
    kind: judgment
    positive_example: 'from dovo.core.sessions import SessionLogEvent  # in core/diagnostics/ (hypothetical import)'
    negative_example: 'from dovo.core.diagnostics import DiagnosticsReport  # in core/project/ (hypothetical import)'
  citation: docs/agents/architecture.md#package-boundaries-import-direction
- id: ARCH-002
  title: CLI Logic Purity
  severity: BLOCKER
  category: Architecture
  domain: cli
  scope: src/dovo/cli/
  intent: Command handlers stay thin adapters over the domain layer, so business behavior lives in one place where it can be reused and tested without the CLI.
  criteria:
  - id: ARCH-002.Q01
    statement: Each CLI command handler takes a CliContext as its context parameter.
    kind: judgment
    na_when: The change adds or modifies no CLI command handler.
    positive_example: 'def status_command(context: CliContext, output_format: str = "terminal") -> DovoStatusResult  # in cli/status/commands/root.py'
    negative_example: '# hypothetical: def status_command(path: Path) -> DovoStatusResult that rebuilds its own paths and database handle instead of receiving a CliContext'
  - id: ARCH-002.Q02
    statement: Each CLI command handler invokes an underlying domain service or domain entrypoint to do its work.
    kind: judgment
    na_when: The change adds or modifies no CLI command handler.
    positive_example: 'result = Status(context.paths).collect()  # in cli/status/commands/root.py'
    negative_example: '# hypothetical: a handler computes the status fields itself from raw git and config reads instead of calling Status(...).collect()'
  - id: ARCH-002.Q03
    statement: Each CLI command handler returns a BaseResult model.
    kind: judgment
    na_when: The change adds or modifies no CLI command handler.
    positive_example: 'return result  # DovoStatusResult, a BaseResult subclass (core/status/models.py), in cli/status/commands/root.py'
    negative_example: '# hypothetical: a handler returns a plain dict or tuple assembled from several domain calls instead of a BaseResult model'
  - id: ARCH-002.Q04
    statement: The CLI package is free of business logic and domain orchestration, so that handlers only delegate to the domain layer and dispatch the result.
    kind: judgment
    na_when: The change adds or modifies no code under src/dovo/cli/.
    positive_example: 'result = Status(context.paths).collect(); ui_dispatcher.dispatch(result)'
    negative_example: '# hypothetical: a handler loops over worktrees, decides which to prune and calls several core services in a sequence it owns'
  - id: ARCH-002.Q05
    statement: The CLI package is free of direct SQLite queries or SQL execution.
    kind: judgment
    na_when: The change adds or modifies no code under src/dovo/cli/.
    positive_example: 'reconcile_stale_sessions(context.db.sessions, path=context.paths.root_dir)  # in cli/status/commands/root.py, goes through a core service'
    negative_example: "# hypothetical: rows = context.db.connection.execute('SELECT * FROM worktrees').fetchall() in a command handler"
  - id: ARCH-002.Q06
    statement: The CLI package is free of direct filesystem scans.
    kind: judgment
    na_when: The change adds or modifies no code under src/dovo/cli/.
    positive_example: 'Status(context.paths).collect()  # the domain layer inspects the filesystem, the handler does not'
    negative_example: "# hypothetical: a handler calls context.paths.root_dir.rglob('*.yml') to discover blueprints itself"
  citation: docs/agents/architecture.md#adding-a-new-command
- id: ARCH-003
  title: Domain Fact Origin Invariant
  severity: BLOCKER
  category: Architecture
  domain: cli
  scope: src/dovo/cli/ui/
  intent: Every domain fact the user sees is decided in one place, core/ or common/, so the display layer cannot drift from
    or contradict what the domain actually determined.
  criteria:
  - id: ARCH-003.Q01
    statement: Every status or outcome that cli/ui/ displays comes from a field of a core/ or common/ model, rather than being invented in cli/ui/.
    kind: judgment
    positive_example: 'config_status=data.config.status  # in DovoStatusFormatter.transform, a ConfigLoadStatus copied unchanged from the domain result'
    negative_example: 'view.status = "partially_initialized"  # hypothetical: a new status value that no core/ or common/ model defines'
  - id: ARCH-003.Q02
    statement: Every error category that cli/ui/ displays comes from a core/ or common/ model, rather than being invented in cli/ui/.
    kind: judgment
    positive_example: 'errors=list(data.errors)  # in StatusView construction, copied from the domain result'
    negative_example: 'errors.append("GitUnavailableError")  # hypothetical: cli/ui/ coins an error category the domain never reported'
  - id: ARCH-003.Q03
    statement: Every warning that cli/ui/ displays comes from a core/ or common/ model, rather than being appended in cli/ui/.
    kind: judgment
    positive_example: 'warnings=list(data.warnings)  # in DovoStatusFormatter.transform, copied from the domain result'
    negative_example: 'if not result.git_status: result.warnings.append(''Git not found'')  # hypothetical: cli/ui/ originates the fact'
  - id: ARCH-003.Q04
    statement: Every remediation that cli/ui/ displays comes from a core/ or common/ model, rather than being written in cli/ui/.
    kind: judgment
    positive_example: 'remediations=list(data.fixes)  # in DovoStatusFormatter.transform, copied from the domain result'
    negative_example: 'view.remediations.append("Run git init")  # hypothetical: cli/ui/ writes a remediation the domain never supplied'
  - id: ARCH-003.Q05
    statement: Every domain rule that formatters apply (for example deciding what counts as healthy or failed) is defined in core/ or common/ rather than in cli/ui/.
    kind: judgment
    na_when: The formatter only maps or copies existing domain fields and applies no condition of its own.
    positive_example: 'A formatter renders result.ok as supplied by the domain result'
    negative_example: 'A formatter decides that more than three uncommitted files makes the workspace unhealthy'
  - id: ARCH-003.Q06
    statement: cli/ui/ limits itself to deriving presentation views from existing domain fields, without adding new domain facts.
    kind: judgment
    positive_example: 'A view field such as project_name or git_branch that is read from existing DovoStatusResult fields and reformatted only for display'
    negative_example: 'A view field populated from a check that cli/ui/ runs itself, such as probing the filesystem'
  citation: docs/agents/architecture.md#package-boundaries-import-direction
- id: ARCH-004
  title: Standard Core Package Layout (Domain-Named Entrypoint)
  severity: BLOCKER
  category: Architecture
  domain: [core, engine]
  scope: src/dovo/core/, src/dovo/engine/
  intent: New domain code follows one predictable package layout with a domain-named entrypoint, so a reader finds types, errors, coordination and operations in the same places in every domain.
  criteria:
  - id: ARCH-004.Q01
    statement: Each new domain package under core/ defines its types in a models.py module.
    kind: judgment
    na_when: The change adds no new domain package under core/.
    positive_example: 'src/dovo/core/worktree/models.py holds WorktreeListResult and the other worktree types'
    negative_example: 'src/dovo/core/prune/ holds a single prune.py mixing types and logic  # hypothetical: no prune/ package exists today'
  - id: ARCH-004.Q02
    statement: Each new domain package under core/ that raises its own errors defines them in an exceptions.py module.
    kind: judgment
    na_when: The change adds no new domain package under core/, or the new domain raises no errors of its own.
    positive_example: 'src/dovo/core/worktree/exceptions.py'
    negative_example: 'class PruneError(Exception) defined inside src/dovo/core/prune/prune.py  # hypothetical: no prune/ package exists today'
  - id: ARCH-004.Q03
    statement: The entrypoint coordinator or service of each new domain package is named after the domain rather than generically.
    kind: judgment
    na_when: The change adds no new domain package under core/.
    positive_example: 'src/dovo/core/sessions/sessions.py  # entrypoint named after the sessions domain'
    negative_example: 'src/dovo/core/prune/facade.py  # hypothetical: generic facade.py instead of prune.py; no facade.py exists in src/ today'
  - id: ARCH-004.Q04
    statement: Each new domain package under core/ keeps its imperative operations in a services/ package.
    kind: judgment
    na_when: The change adds no new domain package under core/, or the new domain has no imperative operations.
    positive_example: 'src/dovo/core/worktree/services/ contains list.py, delete.py and show.py'
    negative_example: 'src/dovo/core/prune/ with its operations written in prune.py and no services/ directory  # hypothetical'
  - id: ARCH-004.Q05
    statement: Each new imperative operation of a domain is placed in its own services/<verb>.py module rather than directly in the package root.
    kind: judgment
    na_when: The change adds no new imperative operation to a domain package.
    positive_example: 'src/dovo/core/sessions/services/read_logs.py'
    negative_example: 'A new archive() function defined in src/dovo/core/sessions/__init__.py  # hypothetical: no archive operation exists; logic in the package root without a structured module'
  - id: ARCH-004.Q06
    statement: All public models of a new domain package are defined in its models.py rather than in services/.
    kind: judgment
    na_when: The change adds no public model to a domain package.
    positive_example: 'class WorktreeListResult(BaseResult) defined in src/dovo/core/worktree/models.py'
    negative_example: 'A public result model class defined inside services/prune.py  # hypothetical: public models belong in models.py'
  - id: ARCH-004.Q07
    statement: New domain code avoids extending a legacy flat layout (a domain package or module that lacks the standard structure).
    kind: judgment
    na_when: The change adds no code to a domain package that predates the standard layout.
    positive_example: 'New domain code gets its own package laid out like src/dovo/core/worktree/ (models.py, exceptions.py, worktree.py, services/)'
    negative_example: 'New domain logic appended to an existing flat module that has no models.py, exceptions.py or services/  # hypothetical'
  citation: docs/agents/code-conventions.md#core-package-layout
- id: ARCH-006
  title: Secrets Environment Resolution
  severity: BLOCKER
  category: Architecture
  domain: core
  scope: src/dovo/core/agents/, src/dovo/core/config/, src/dovo/core/db/
  intent: Secrets exist only in the process environment and only while a call needs them, so they never leak into stored
    configuration, the database or prompts.
  criteria:
  - id: ARCH-006.Q01
    statement: Every API key or secret is read from environment variables at call time through a module-level resolve helper.
    kind: judgment
    positive_example: 'def resolve_copilot_token() -> str | None: return resolve_credential(COPILOT_TOKEN_ENVS)  # in core/agents/copilot.py, reads os.environ on each call'
    negative_example: 'TOKEN = os.environ["COPILOT_TOKEN"]  # hypothetical: captured once at import time instead of resolved at call time'
  - id: ARCH-006.Q02
    statement: Every secret is absent from config.json, including the fields of DovoConfig.
    kind: judgment
    positive_example: DovoConfig in core/config/models.py declares no api_key, token or secret field
    negative_example: 'copilot_token: str = ""  # hypothetical: a secret-bearing field added to DovoConfig'
  - id: ARCH-006.Q03
    statement: Every secret is absent from data.db, including the SQLite record models.
    kind: judgment
    positive_example: The SQLModel record classes in core/db/models.py declare no credential column
    negative_example: 'api_key: str  # hypothetical: a credential column added to a SQLModel record class'
  - id: ARCH-006.Q04
    statement: Every secret is kept out of the arguments passed into prompt builders.
    kind: judgment
    na_when: The change adds or modifies no prompt builder and no call to one.
    positive_example: 'build_mutation_prompt(request: AgentRequest) in core/agents/cli_mutation.py receives the whole request, but _prompt_body copies only mode, worktree_path, agent_scratch_path, instruction and payload and never reads request.env'
    negative_example: 'build_prompt(task, api_key=resolve_credential(envs))  # hypothetical: a secret passed into a prompt builder'
  citation: docs/agents/architecture.md#secrets-handling
- id: RENDER-001
  title: Single Dispatcher Route for Terminal Output
  severity: BLOCKER
  category: Rendering
  domain: cli
  scope: src/dovo/cli/, src/dovo/core/
  intent: Terminal output has one route through the CLI's UI layer, so core services stay free of presentation concerns
    and every output format is rendered in one place.
  criteria:
  - id: RENDER-001.Q01
    statement: All terminal output from src/dovo/cli/ and src/dovo/core/ leaves the program through ui_dispatcher.dispatch(result).
    kind: judgment
    na_when: The change adds or modifies no code that produces terminal output.
    positive_example: 'ui_dispatcher.dispatch(result, output_format=output_format)  # in cli/session/commands/show.py'
    negative_example: 'print(result.session_id)  # hypothetical: in a command module, bypassing the dispatcher'
  - id: RENDER-001.Q02
    statement: Direct print() and typer.echo calls are absent from src/dovo/cli/ and src/dovo/core/ outside src/dovo/cli/ui/.
    kind: mechanical
    enforced_by: tests/lint/test_output_routing.py
    na_when: The change adds or modifies no print() or typer.echo call.
    positive_example: 'ui_dispatcher.dispatch(MessageEvent(message=ctx.get_help()))  # in cli/cli.py. The test is stricter than the question: it scans all of src/dovo/ and allows these calls only in cli/ui/dispatcher.py'
    negative_example: 'typer.echo("failed")  # hypothetical: in a command module'
  - id: RENDER-001.Q03
    statement: rich imports in src/dovo/cli/ are confined to files under src/dovo/cli/ui/.
    kind: judgment
    na_when: The change adds or modifies no import in src/dovo/cli/.
    positive_example: 'cli/session/commands/show.py imports ui_dispatcher from dovo.cli.ui.dispatcher and imports nothing from rich'
    negative_example: 'from rich.table import Table  # hypothetical: in cli/session/commands/show.py'
  - id: RENDER-001.Q04
    statement: Console .print() calls in src/dovo/cli/ and src/dovo/core/ are made only in files under src/dovo/cli/ui/ (check with grep -rn "\.print(" src/dovo/cli src/dovo/core).
    kind: judgment
    na_when: The change adds or modifies no .print() call.
    positive_example: 'self._console.print(rich_renderable)  # in cli/ui/dispatcher.py'
    negative_example: 'self.console.print("failed")  # hypothetical: in a core service method or a command module'
  - id: RENDER-001.Q05
    statement: The files under src/dovo/core/ import nothing from rich.
    kind: mechanical
    enforced_by: tests/lint/test_layer_direction.py
    na_when: The change adds or modifies no import in src/dovo/core/.
    positive_example: 'A core service returns its result model, and the CLI command passes it to ui_dispatcher.dispatch (hypothetical service)'
    negative_example: 'from rich.console import Console  # hypothetical: in core/status/'
  - id: RENDER-001.Q06
    statement: Every core service is free of Console instantiation.
    kind: judgment
    na_when: The change adds or modifies no code under src/dovo/core/.
    positive_example: 'A core service returns a model and holds no console attribute (hypothetical service)'
    negative_example: 'console = Console(); console.print("failed")  # hypothetical: in a core service'
  citation: docs/agents/code-conventions.md#console-output-and-terminal-formatting
- id: RENDER-002
  title: Pure Layout in to_rich
  severity: BLOCKER
  category: Rendering
  domain: cli
  scope: src/dovo/cli/ui/formatters/
  intent: Deriving what to show happens in one place, transform(), so to_rich() only lays out a ready view model and the
    presentation logic can be tested without rendering anything.
  criteria:
  - id: RENDER-002.Q01
    statement: Every to_rich() implementation gets its presentation data by calling transform(data).
    kind: judgment
    na_when: The change adds or modifies no to_rich() implementation.
    positive_example: 'SessionListFormatter.to_rich in session/session_list.py starts with view = self.transform(data) and then reads only view.errors, view.fixes and the view passed to _render_list_runs'
    negative_example: 'def to_rich(self, data): return Panel(Text(data.project_name))  # hypothetical: lays out the raw result without calling transform'
  - id: RENDER-002.Q02
    statement: Every business rule and status calculation that decides what to show is performed in transform() rather than in to_rich().
    kind: judgment
    na_when: The change adds or modifies no to_rich() implementation.
    positive_example: 'SessionListFormatter.transform in session/session_list.py computes total_sessions and the session summaries, and to_rich only reads them from the view'
    negative_example: color = 'green' if len(data.errors) == 0 else 'red'; return Panel(Text(color))
  - id: RENDER-002.Q03
    statement: Every string that to_rich() renders comes directly from the view model, without string manipulation inside to_rich().
    kind: judgment
    na_when: The change adds or modifies no to_rich() implementation.
    positive_example: view = self.transform(data); return Panel(Text(view.project_name))
    negative_example: 'view = self.transform(data); return Panel(Text(view.project_name.upper() + " (" + str(len(view.items)) + ")"))  # hypothetical: derived text built inside to_rich'
  citation: docs/agents/code-conventions.md#console-output-and-terminal-formatting
- id: RENDER-003
  title: Inline Error and Warning String Construction
  severity: SUGGESTION
  category: Rendering
  domain: all
  scope: src/dovo/
  intent: Error, warning and fix messages stay readable where they are raised, so a reader sees the whole message at the call site instead of chasing a one-use wrapper.
  criteria:
  - id: RENDER-003.Q01
    statement: Error, warning and fix strings are built inline with f-strings or literals at their call sites, with no private helper whose sole purpose is formatting a single error or warning string.
    kind: judgment
    na_when: The change builds no error, warning or fix strings.
    positive_example: 'message = f"Project identity at ''{path}'' is invalid: {exc} (PROJECT_IDENTITY_INVALID_SCHEMA)."  # in core/project/services/identity.py'
    negative_example: 'errors.append(self._format_validation_error(path, err))  # hypothetical: a private wrapper that only formats one message'
  citation: docs/agents/code-conventions.md#console-output-and-terminal-formatting
- id: RENDER-004
  title: Domain Shared Table Builders in common.py
  severity: WARNING
  category: Rendering
  domain: cli
  scope: src/dovo/cli/ui/formatters/
  intent: Table layouts stay consistent and are fixed in one place, so a helper that several formatters of one domain need has a single home next to them, and the package-wide module holds only what every domain shares.
  criteria:
  - id: RENDER-004.Q01
    statement: Every table-building helper that more than one formatter in a domain needs is defined once in that domain's cli/ui/formatters/<domain>/common.py rather than duplicated across sibling formatter modules.
    kind: judgment
    na_when: The change adds or modifies no table-building helper in a formatter module.
    positive_example: 'build_session_table() defined once in cli/ui/formatters/session/common.py and imported by session_list.py'
    negative_example: 'A nearly identical build_table() defined in both worktree/worktree_list.py and worktree/worktree_show.py (hypothetical; the real worktree builders live in worktree/common.py)'
  - id: RENDER-004.Q02
    statement: A table-building helper is placed in the package-wide cli/ui/formatters/common.py only when it is genuinely shared across domains.
    kind: judgment
    na_when: The change adds or moves no table-building helper into the package-wide cli/ui/formatters/common.py.
    positive_example: 'A table-building helper placed in cli/ui/formatters/common.py because formatters in both the session and worktree domains need it (hypothetical; that module currently contains no table builder)'
    negative_example: 'build_worktree_table() moved into cli/ui/formatters/common.py (hypothetical; it is worktree-specific and really lives in worktree/common.py)'
  citation: docs/agents/code-conventions.md#console-output-and-terminal-formatting
- id: MODEL-001
  title: Scoped Model Exceptions with Justifying Comment
  severity: BLOCKER
  category: Models
  domain: all
  scope: src/dovo/
  intent: Models are strict by default so unexpected data is rejected early; the few hand-authored YAML models that tolerate unknown keys are a named exception, and each explains why in a comment so the leniency stays deliberate.
  criteria:
  - id: MODEL-001.Q01
    statement: extra='ignore' is used only by the approved hand-authored YAML models, BlueprintDefinition and LoopStepBlock.
    kind: judgment
    na_when: The change adds or modifies no model configuration.
    positive_example: 'model_config = {"extra": "ignore", "populate_by_name": True}  # in BlueprintDefinition, core/catalog/definitions/blueprint.py'
    negative_example: 'model_config = {"extra": "ignore"}  # hypothetical: on a result model such as a BaseResult subclass, which is not an approved model'
  - id: MODEL-001.Q02
    statement: Every model that uses extra='ignore' carries a comment justifying it.
    kind: judgment
    na_when: The change adds or modifies no model that uses extra='ignore'.
    positive_example: '# Hand-authored YAML loop blocks permit forward-compatible extra keys.  (directly above model_config in LoopStepBlock, core/catalog/definitions/step.py)'
    negative_example: 'model_config = {"extra": "ignore"}  # hypothetical: no justifying comment above or beside it'
  - id: MODEL-001.Q03
    statement: Every model outside the approved list sets strict=True in its configuration.
    kind: judgment
    na_when: The change adds or modifies no model configuration.
    positive_example: 'model_config = {"extra": "forbid", "strict": True}  # in common/mcp_servers.py'
    negative_example: 'model_config = {"extra": "forbid"}  # hypothetical for a new model: strict=True omitted'
  citation: docs/agents/code-conventions.md#pydantic-models
- id: MODEL-002
  title: Result/Outcome Pattern over Exceptions
  severity: BLOCKER
  category: Models
  domain: [core, engine]
  scope: src/dovo/core/, src/dovo/engine/
  intent: Callers must learn about business and operational failures from a result they can inspect and render, not from exceptions they must remember to catch.
  criteria:
  - id: MODEL-002.Q01
    statement: The operation reports a business or operational failure by returning a result instead of raising an exception.
    kind: judgment
    na_when: The change adds or modifies no operation that can fail for business or operational reasons.
    positive_example: 'return WorktreeDeleteResult(status=WorktreeDeleteStatus.NOT_FOUND, errors=[...])  # in core/worktree/services/delete.py'
    negative_example: "raise WorktreeNotFoundError('Worktree does not exist')  # hypothetical: no such exception exists in src/"
  - id: MODEL-002.Q02
    statement: An operation whose outcome reaches a domain entrypoint, a command handler, a formatter or the wire format returns a Pydantic result object subclassing BaseResult.
    kind: judgment
    na_when: The change adds or modifies no operation whose outcome reaches a domain entrypoint, command handler, formatter or the wire format.
    positive_example: 'def delete(self, worktree_id: str) -> WorktreeDeleteResult  # in core/worktree/worktree.py; WorktreeDeleteResult subclasses BaseResult'
    negative_example: 'def delete(...) -> bool  # hypothetical: a domain-entrypoint operation returning a plain value'
  - id: MODEL-002.Q03
    statement: Callers of a result-returning operation check .ok rather than catching exceptions to learn the outcome.
    kind: judgment
    na_when: The change adds or modifies no caller of a result-returning operation.
    positive_example: 'if not result.ok: ...  # hypothetical caller that inspects the result'
    negative_example: 'try: service.delete(...) except WorktreeNotFoundError: ...  # hypothetical: caller catches an exception to learn the outcome'
  - id: MODEL-002.Q04
    statement: Callers that report a failure to the user render the result .errors and .warnings rather than the text of a caught exception.
    kind: judgment
    na_when: The change adds or modifies no caller that reports a result-returning operation's failure to the user.
    positive_example: 'for message in result.errors: render(message)  # hypothetical caller that renders the result'
    negative_example: 'except Exception as exc: render(str(exc))  # hypothetical: failure text taken from a caught exception'
  - id: MODEL-002.Q05
    statement: An internal helper that returns a plain value or an error message (str | None) serves a single in-layer caller that only branches on success.
    kind: judgment
    na_when: The change adds or modifies no internal helper that returns a plain value or str | None.
    positive_example: 'BaseAgentProvider._tool_policy_preflight returns str | None; its only caller in core/agents/base.py wraps a non-None message in provider_error_response(...)'
    negative_example: 'A hypothetical helper returning str | None that is called from several modules, or whose result reaches a command handler or the wire format'
  citation: docs/agents/code-conventions.md#resultoutcome-pattern
- id: MODEL-003
  title: Reachable and Tested Status Enums
  severity: BLOCKER
  category: Models
  domain: [core, engine]
  scope: src/dovo/core/*/models.py, src/dovo/engine/**/models.py
  intent: A status a result can report must be one the program really produces and the tests really check, so callers never branch on outcomes that cannot happen or that nobody has verified.
  criteria:
  - id: MODEL-003.Q01
    statement: For each status StrEnum defined in a core/*/models.py or engine/**/models.py file and used by a BaseResult model, every variant is emitted by production code in src/.
    kind: judgment
    na_when: The change adds or modifies no status StrEnum, used by a BaseResult model, in a core/*/models.py or engine/**/models.py file.
    positive_example: 'ArtifactsPruneStatus.LOCKED is returned by `status=ArtifactsPruneStatus.LOCKED` in src/dovo/core/artifacts/services/prune.py'
    negative_example: 'class PruneStatus(StrEnum): UNKNOWN = "unknown"  # hypothetical: no code in src/ ever assigns PruneStatus.UNKNOWN to a result'
  - id: MODEL-003.Q02
    statement: For each status StrEnum defined in a core/*/models.py or engine/**/models.py file and used by a BaseResult model, every variant is asserted in a test under tests/.
    kind: judgment
    na_when: The change adds or modifies no status StrEnum, used by a BaseResult model, in a core/*/models.py or engine/**/models.py file.
    positive_example: 'ArtifactsPruneStatus.LOCKED is asserted by `assert result.status == ArtifactsPruneStatus.LOCKED` in tests/core/artifacts/services/test_prune.py'
    negative_example: 'class PruneStatus(StrEnum): FAILED = "failed"  # hypothetical: emitted in src/ but no test under tests/ asserts PruneStatus.FAILED'
  citation: docs/agents/code-conventions.md#resultoutcome-pattern
- id: MODEL-004
  title: Definition Exception Hierarchy
  severity: BLOCKER
  category: Models
  domain: core
  scope: src/dovo/core/catalog/exceptions.py
  intent: Failures about catalog definitions must be catchable through one shared error family, so callers can handle any definition problem uniformly instead of chasing unrelated base types.
  criteria:
  - id: MODEL-004.Q01
    statement: Every exception class in src/dovo/core/catalog/exceptions.py, which covers locating, loading, validating and writing catalog definitions, descends from DefinitionError, DefinitionNotFoundError, DefinitionLoadError or DefinitionValidationError in common/exceptions.py, rather than having Exception or ValueError as its only base.
    kind: judgment
    na_when: The change adds or modifies no exception class in src/dovo/core/catalog/exceptions.py.
    positive_example: 'class BlueprintLoadError(DefinitionLoadError): """Raised when blueprint YAML syntax is invalid or unreadable."""  # in core/catalog/exceptions.py; an intermediate base such as CatalogError(DefinitionError) also counts, and an extra base is fine as in AskStepInvalidError(DefinitionValidationError, ValueError)'
    negative_example: 'class BlueprintLoadError(Exception): """Raised when blueprint YAML syntax is invalid or unreadable."""  # hypothetical: inherits directly from Exception; class StepValidationError(ValueError) would fail the same way'
  citation: docs/agents/architecture.md#adding-a-new-catalog-backed-domain
- id: CODE-001
  title: Full-Word Identifiers
  severity: BLOCKER
  category: Code Conventions
  domain: all
  scope: src/, tests/
  intent: Identifiers read as plain words so a reader never has to decode an invented abbreviation.
  criteria:
  - id: CODE-001.Q01
    statement: Every new or modified variable, parameter, attribute and function name is spelled in full rather than shortened by dropping letters, even for familiar shortenings (exceptions are checked by Q02 and Q03).
    kind: judgment
    na_when: The change adds or modifies no variable, parameter, attribute or function name.
    positive_example: 'validation_result = validator.validate(document)  # hypothetical: every word spelled out'
    negative_example: 'val_res = validator.validate(document); acc = []  # hypothetical: val_res and acc drop letters; other shortenings to flag include res, req, msg, val, idx, tmp, rel_path, fs, exc, err, cfg, resp'
  - id: CODE-001.Q02
    statement: Every new or modified single-letter name is confined to a comprehension, a generator expression or a one-line loop.
    kind: judgment
    na_when: The change adds or modifies no single-letter name.
    positive_example: 'any(a in ("--help", "-h") for a in raw_args)  # in cli/cli.py'
    negative_example: 'e = load_entry(path); return e.name  # hypothetical: single-letter variable outside a comprehension, generator expression or one-line loop'
  - id: CODE-001.Q03
    statement: Every shortened name that remains in new or modified code is either an initialism that is itself the domain term (db, cwd, ctx, id, url, cli, sha, ttl) or a framework-dictated name.
    kind: judgment
    na_when: The change adds or modifies no shortened name.
    positive_example: 'def invoke(self, ctx: click.Context) -> object: ...  # hypothetical Click override, ctx dictated by Click; likewise tmp_path and monkeypatch dictated by pytest'
    negative_example: 'cfg = load_config(path)  # hypothetical: cfg is not a domain-term initialism and no framework dictates it'
  citation: docs/agents/code-conventions.md#variable-naming
- id: CODE-002
  title: Logical Blank Lines Separation
  severity: NIT
  category: Code Conventions
  domain: all
  scope: src/
  intent: Blank lines mark where a function moves from one phase to the next, so a reader can see its structure at a glance; spacing that does not follow the logic hides that structure.
  criteria:
  - id: CODE-002.Q01
    statement: Distinct logical phases of a function body (setup, validate, persist, return) are separated by a blank line.
    kind: judgment
    na_when: The function body is a single phase or too short to contain more than one phase.
    positive_example: 'In Engine._finalize_row (src/dovo/engine/engine.py), the load phase and its early-return branch are followed by a blank line before the "saved = store.save(...)" phase.'
    negative_example: 'record = WorktreeRecord(...), a save call and "return result" on consecutive lines with no blank line between them (hypothetical: building, persisting and returning run together as one dense block)'
  - id: CODE-002.Q02
    statement: No blank line in a function body separates two adjacent lines that work on the same value within one phase.
    kind: judgment
    na_when: The function body contains no blank lines.
    positive_example: 'In Engine._finalize_row (src/dovo/engine/engine.py), the blank line at line 211 sits between the early "return" at line 210 and "saved = store.save(" at line 212, which starts a new phase and does not work on the value the "return" line ended, so the blank line is correctly placed.'
    negative_example: 'store = SessionStateStore(self.db, self.paths, session_id), then a blank line, then loaded = store.load(), then a blank line, then "if not loaded.ok" (hypothetical: blank lines inserted between tightly coupled lines of one step)'
  citation: docs/agents/code-conventions.md#blank-lines-in-function-bodies
- id: CODE-003
  title: Terse Docstrings, Description Only for Hidden Contracts
  severity: SUGGESTION
  category: Code Conventions
  domain: all
  scope: src/
  intent: Docstrings stay short so a reader gets the title at a glance and finds a description only where it carries a fact the code cannot show and whose absence would cause wrong code.
  criteria:
  - id: CODE-003.Q01
    statement: The docstring opens with a one-line title stating what the thing is or does.
    kind: judgment
    na_when: The change adds or modifies no docstring.
    positive_example: '"""Base for providers that edit the worktree directly instead of returning a diff."""  # title of the class in core/agents/cli_mutation.py'
    negative_example: |-
      """Run the provider. Then resolve the baseline
      and build the prompt before diffing the worktree."""  # hypothetical: the opening wraps over two lines and holds two sentences, so there is no one-line title
  - id: CODE-003.Q02
    statement: The title is free of outcome, failure-path and side-effect clauses, with a comma used only to enumerate a distinct list.
    kind: judgment
    na_when: The change adds or modifies no docstring.
    positive_example: '"""Base for providers that edit the worktree directly instead of returning a diff."""  # outcomes live in the description'
    negative_example: '"""Return the roots a whole-root read/write rule grants for read or write, or why a rule cannot be preserved."""  # outcome clause in the title, as in core/agents/copilot.py'
  - id: CODE-003.Q03
    statement: A unit with a hidden contract, a data-loss or safety behavior, a non-obvious ordering constraint or a deliberate oddity carries a description stating it.
    kind: judgment
    na_when: The change adds or modifies no unit with a hidden contract, safety behavior, non-obvious ordering constraint or deliberate oddity.
    positive_example: |-
      """Base for providers that edit the worktree directly instead of returning a diff.

      Edits that fail patch validation are discarded from the worktree; a failed discard is reported in the response errors."""  # CliDirectMutationAdapter in core/agents/cli_mutation.py: the discard is a safety behavior the code does not make obvious
    negative_example: '"""Base for providers that edit the worktree directly instead of returning a diff."""  # hypothetical: title only, although edits that fail validation are silently discarded from the worktree'
  - id: CODE-003.Q04
    statement: Every description states a fact the code cannot show, rather than something a reader can already see in the code.
    kind: judgment
    na_when: The change adds or modifies no docstring with a description.
    positive_example: |-
      """Base for providers that edit the worktree directly instead of returning a diff.

      Edits that fail patch validation are discarded from the worktree; a failed discard is reported in the response errors."""  # the discard behavior is not visible from the signature or the title
    negative_example: |-
      """Return the roots a rule grants.

      Uses a dict for lookup."""  # hypothetical: true, but the dict is plain to see in the body
  - id: CODE-003.Q05
    statement: Every description is free of step-by-step narration of the body.
    kind: judgment
    na_when: The change adds or modifies no docstring with a description.
    positive_example: |-
      """Base for providers that edit the worktree directly instead of returning a diff.

      Edits that fail patch validation are discarded from the worktree; a failed discard is reported in the response errors."""  # states a consequence, not the steps
    negative_example: |-
      """Run the provider.

      First resolve the baseline, then build the prompt, then run the tool."""  # hypothetical: the description retells the body step by step
  - id: CODE-003.Q06
    statement: Every description is free of text that restates the parameters, types or return annotation, or repeats the title in other words.
    kind: judgment
    na_when: The change adds or modifies no docstring with a description.
    positive_example: |-
      """Base for providers that edit the worktree directly instead of returning a diff.

      Edits that fail patch validation are discarded from the worktree; a failed discard is reported in the response errors."""  # adds a fact beyond the title and signature
    negative_example: |-
      """Return the session id.

      This returns the identifier of the session."""  # hypothetical: the description repeats the title in other words
  citation: docs/agents/code-conventions.md#docstrings
- id: CODE-004
  title: Docstrings Describe Only the Documented Unit
  severity: WARNING
  category: Code Conventions
  domain: all
  scope: src/
  intent: A docstring states only behavior the documented unit itself implements, so it cannot go stale when other code changes without any sign in the diff.
  criteria:
  - id: CODE-004.Q01
    statement: Each new or modified docstring avoids describing what a caller does with the unit's result.
    kind: judgment
    na_when: The change adds or modifies no docstring.
    positive_example: |-
      """Render a restricted policy's allow and deny rules as dontAsk flags.

      A rule Claude Code cannot express yields its reason as a string."""  # _render_restricted in core/agents/claude_policy.py
    negative_example: |-
      """Render a restricted policy's allow and deny rules as dontAsk flags.

      The adapter surfaces a returned reason as an unsupported-policy error before the process is spawned."""  # hypothetical: describes what the caller does with the returned reason
  - id: CODE-004.Q02
    statement: Each new or modified docstring avoids describing logic that lives in another module or class, other than a reference to a sibling in the same module.
    kind: judgment
    na_when: The change adds or modifies no docstring.
    positive_example: '"""Return items without duplicates, in first-seen order."""  # _unique in core/agents/claude_policy.py, which describes only its own behavior'
    negative_example: '"""Return items without duplicates; the Copilot adapter relies on this to reject repeated flags."""  # hypothetical: states behavior of another module'
  citation: docs/agents/code-conventions.md#docstrings
- id: CODE-005
  title: One Docstring per Unit
  severity: WARNING
  category: Code Conventions
  domain: all
  scope: src/
  intent: A unit's documentation must be a single docstring, because a second bare string reads as documentation but is dead code. Extra text belongs in the docstring or nowhere.
  criteria:
  - id: CODE-005.Q01
    statement: Every new or modified module, class and function body is free of a bare string statement after its first statement.
    kind: judgment
    na_when: The change adds or modifies no module, class or function.
    positive_example: '"""Render a restricted policy as dontAsk flags."""  # hypothetical: the only string statement in the function body'
    negative_example: '"""Return dontAsk flags for the rules."""  # hypothetical: followed by a second """...""" string statement that should be merged into the docstring or deleted'
  citation: docs/agents/code-conventions.md#docstrings
- id: TYPE-001
  title: Ban on -> Any Return Annotations
  severity: BLOCKER
  category: Typing
  domain: all
  scope: src/, tests/
  intent: A public function's return type keeps type checking intact at every call site instead of switching it off for
    each caller. Where a value is only stored, compared or passed through, object is preferred to Any.
  criteria:
  - id: TYPE-001.Q01
    statement: The return annotation of every public function (a module-level function or a method whose name does not start with an underscore) is not Any, except on a Pydantic mode="before" validator permitted by TYPE-002.Q01.
    kind: judgment
    na_when: The code under review contains no public function.
    positive_example: 'def get_payload(self) -> object: ...  # hypothetical: callers must narrow the value before using it'
    negative_example: 'def to_rich(self, data: T) -> Any:  # public abstract method of the formatter base class in src/dovo/common/types.py'
  citation: docs/agents/code-conventions.md#type-annotations-and-any
- id: TYPE-002
  title: Strict Scoping of Permitted Any
  severity: BLOCKER
  category: Typing
  domain: all
  scope: src/dovo/
  intent: Any switches off type checking wherever it appears, so it is confined to the few boundaries where the value really is unconstrained, and everywhere else the type checker keeps working.
  criteria:
  - id: TYPE-002.Q01
    statement: 'Every use of Any in the change is confined to one of four boundaries, namely a Pydantic mode="before" validator, a dict[str, Any] at a serialization boundary, a value read from a user document and compared, or a **kwargs: Any pass-through.'
    kind: judgment
    na_when: The change adds or modifies no use of Any.
    positive_example: '@field_validator("capability", mode="before") then def coerce_capability(cls, val: Any) -> Any  # in common/tool_policy.py; a pre-validator receives whatever the user wrote'
    negative_example: 'def execute_step(step: Any) -> StepResult: ...  # hypothetical: step is not a permitted boundary, so it should be typed as the step model'
  citation: docs/agents/code-conventions.md#permitted-do-not-fix-these
- id: TYPE-003
  title: Banned Uses of Any
  severity: BLOCKER
  category: Typing
  domain: all
  scope: src/, tests/
  intent: Any switches off the type checker, so it is not used to hide misplaced code, a test seam, a type that already exists or a type the code already knows.
  criteria:
  - id: TYPE-003.Q01
    statement: Every annotation is free of Any that exists only because the real type cannot be imported from the current package.
    kind: judgment
    na_when: The change adds or modifies no Any annotation.
    positive_example: 'def run(step: StepDefinition) -> None: ...  # hypothetical: the code that needs StepDefinition was moved to a package that can import it'
    negative_example: 'def run(step: Any) -> None: ...  # hypothetical: Any used because StepDefinition cannot be imported from this package'
  - id: TYPE-003.Q02
    statement: Every parameter is free of an Any annotation that exists only so a test can pass a stub.
    kind: judgment
    na_when: The change adds or modifies no Any annotation.
    positive_example: 'def run(self) -> None: ...  # hypothetical: no extra parameter, the test patches at the boundary instead'
    negative_example: 'def run(self, output: Any = None) -> None: ...  # hypothetical: output is never read in production and exists for tests'
  - id: TYPE-003.Q03
    statement: Every annotation is free of Any where a model that describes the value already exists.
    kind: judgment
    na_when: The change adds or modifies no Any annotation.
    positive_example: 'def render(step: StepDefinition) -> str: ...  # hypothetical signature naming the existing model'
    negative_example: 'def render(step: Any, metadata: Any) -> str: ...  # hypothetical: StepDefinition already describes step'
  - id: TYPE-003.Q04
    statement: Every override of a third-party method names the third-party type instead of Any.
    kind: judgment
    na_when: The change adds or modifies no override of a third-party method.
    positive_example: 'def invoke(self, ctx: click.Context) -> object: ...  # hypothetical override of a Click method'
    negative_example: 'def invoke(self, ctx: Any) -> Any: ...  # hypothetical override of a Click method'
  - id: TYPE-003.Q05
    statement: Every generic type is parameterized with the concrete type the code already knows, rather than Any.
    kind: judgment
    na_when: The change adds or modifies no generic type annotation.
    positive_example: 'proc: subprocess.Popen[str] = ...'
    negative_example: 'proc: subprocess.Popen[Any] = ...  # hypothetical: the process is started with text=True, so Popen[str] is known'
  citation: docs/agents/code-conventions.md#banned
- id: TYPE-004
  title: Explicit ClassVar Typing for Table Names and Constants
  severity: NIT
  category: Typing
  domain: core
  scope: src/dovo/core/db/models.py
  intent: The type checker should see class-level SQL names and constants as exactly what they are, so it never has to guess between Any, a bare string and a class attribute.
  criteria:
  - id: TYPE-004.Q01
    statement: Every SQLModel __tablename__ is annotated as ClassVar[str].
    kind: judgment
    na_when: The change defines no SQLModel table class.
    positive_example: '__tablename__: ClassVar[str] = "worktrees"  # in WorktreeRecord, core/db/models.py (the real line also carries a pyright ignore for the SQLModel stub conflict, omitted here)'
    negative_example: '__tablename__ = "worktrees"  # hypothetical: unannotated, so the type checker has to infer it'
  - id: TYPE-004.Q02
    statement: Every other class-level SQL string constant is annotated explicitly as ClassVar[str] rather than Any or a bare str.
    kind: judgment
    na_when: The change adds no class-level SQL string constant besides __tablename__.
    positive_example: 'INDEX_NAME: ClassVar[str] = "ix_worktrees_status"  # hypothetical constant on a table class'
    negative_example: 'INDEX_NAME: Any = "ix_worktrees_status"  # hypothetical: Any leaves the constant ambiguous to the type checker'
  citation: docs/agents/code-conventions.md#type-checker-suppressions
- id: TYPE-005
  title: Precise Parameterization for Generator Types
  severity: NIT
  category: Typing
  domain: all
  scope: src/, tests/
  intent: Generator annotations state the full contract of what a generator yields, accepts and returns, so readers and the type checker never have to infer the omitted parts.
  criteria:
  - id: TYPE-005.Q01
    statement: Every Generator[...] annotation names the yield type, the send type when it is not None and the return type when it is not None, and drops trailing None defaults as ruff UP043 requires.
    kind: judgment
    na_when: The change adds or modifies no Generator[...] annotation.
    positive_example: 'def get_session(engine: Engine) -> Generator[Session]: ...  # in core/db/connection.py, send and return are None, so ruff UP043 requires the short form'
    negative_example: 'def read_lines(path: Path) -> Generator[str]: ...  # hypothetical: the generator returns a line count, so the return type must be named as Generator[str, None, int]'
  citation: docs/agents/code-conventions.md#type-annotations-and-any
- id: TYPE-006
  title: Scoped Pyright Suppressions With Reason
  severity: BLOCKER
  category: Typing
  domain: all
  scope: src/, tests/, e2e/
  intent: A type error is silenced only where the code is correct and the checker cannot express it, never to hide a defect,
    so every suppression is one the checker honors, is narrow, and says why it exists.
  criteria:
  - id: TYPE-006.Q01
    statement: 'The code uses no bare `# type: ignore`, which this repo''s basedpyright config does not honor and which suppresses nothing.'
    kind: judgment
    positive_example: >-
      self.value = compute()  # pyright: ignore[reportAttributeAccessIssue]  # stub conflict: third-party stub cannot
      name the attribute (hypothetical line)
    negative_example: >-
      queue: Queue = mock_queue  # type: ignore  # bare ignore, suppresses nothing and hides a fixable fixture type
      (hypothetical line)
  - id: TYPE-006.Q02
    statement: 'Every `# pyright: ignore[reportRuleName]` names the specific rule it silences in brackets.'
    kind: judgment
    na_when: "The change adds no `# pyright: ignore` comment."
    positive_example: >-
      _IncompleteProvider()  # pyright: ignore[reportAbstractUsage]  # intentional ill-typed input: the subject is the
      raised TypeError  (tests/core/agents/test_base.py)
    negative_example: >-
      value = call()  # pyright: ignore  # silences every rule on the line (hypothetical line)
  - id: TYPE-006.Q03
    statement: 'Every `# pyright: ignore[...]` carries a one-line reason that names which permitted case applies.'
    kind: judgment
    na_when: "The change adds no `# pyright: ignore` comment."
    positive_example: >-
      _IncompleteProvider()  # pyright: ignore[reportAbstractUsage]  # intentional ill-typed input: the subject is the
      raised TypeError  (tests/core/agents/test_base.py)
    negative_example: >-
      resume = command.commands["resume"]  # pyright: ignore[reportAttributeAccessIssue]  (tests/lint/test_step_schema_parity.py;
      an existing line with no reason after the ignore)
  - id: TYPE-006.Q04
    statement: 'Every `# pyright: ignore[...]` is one of the three permitted cases: an intentional ill-typed test input whose subject is the raised error, a third-party stub conflict our code cannot name correctly, or a platform-gated import.'
    kind: judgment
    na_when: "The change adds no `# pyright: ignore` comment."
    positive_example: >-
      import msvcrt  # pyright: ignore[reportMissingImports]  # platform-gated: msvcrt does not exist on Linux
      (src/dovo/common/lock.py has this import and ignore; the reason text is a hypothetical addition)
    negative_example: >-
      result = parse(raw)  # pyright: ignore[reportReturnType]  # inconvenient to annotate (hypothetical line; fix the
      annotation instead)
  - id: TYPE-006.Q05
    statement: '`reportCallIssue` or `reportArgumentType` is never suppressed to silence a wrong-shaped test double or fixture.'
    kind: judgment
    na_when: The change adds no ignore of `reportCallIssue` or `reportArgumentType`.
    positive_example: >-
      CostRecord(...)  # pyright: ignore[reportCallIssue] # intentional: omitted project_id is this test's subject
      (tests/core/db/test_models.py; the call is the ill-typed input under test)
    negative_example: >-
      service = Service(queue=fake_queue)  # pyright: ignore[reportArgumentType]  # the fake does not match the Queue
      type (hypothetical line; fix the fixture type instead)
  - id: TYPE-006.Q06
    statement: '`reportIncompatibleVariableOverride` is suppressed only on the SQLModel `__tablename__` stub conflict.'
    kind: judgment
    na_when: The change adds no ignore of `reportIncompatibleVariableOverride`.
    positive_example: >-
      __tablename__: ClassVar[str] = "worktrees"  # pyright: ignore[reportIncompatibleVariableOverride]
      (src/dovo/core/db/models.py, WorktreeRecord)
    negative_example: >-
      name: str = "x"  # pyright: ignore[reportIncompatibleVariableOverride]  # in a subclass whose base declares
      name: int (hypothetical line; fix the override instead)
  citation: docs/agents/code-conventions.md#type-checker-suppressions
- id: ENCAP-001
  title: Expose Public Query Properties
  severity: BLOCKER
  category: Encapsulation
  domain: all
  scope: src/dovo/
  intent: Protects a class's freedom to change its internal representation. Callers learn its state through a public
    interface, so a refactor stays local instead of breaking every caller that reached inside.
  criteria:
  - id: ENCAP-001.Q01
    statement: Every access to an underscore-prefixed, non-dunder member in src/dovo/ is made on self, cls or mcs rather than on another object.
    kind: mechanical
    enforced_by: pyproject.toml
    positive_example: 'if runner.is_running: ...  # caller uses the public query property'
    negative_example: 'if runner._process is not None: ...  # caller inspecting private state'
  - id: ENCAP-001.Q02
    statement: Each class that callers query for boolean state exposes that state as a public property.
    kind: judgment
    na_when: No new or modified code in src/dovo/ checks the boolean state of another class.
    positive_example: 'if runner.is_running: ...  # public @property on the class, backed by self._proc'
    negative_example: 'if runner.get_process() is not None: ...  # caller re-derives boolean state from an exposed internal handle'
  citation: docs/agents/code-conventions.md#encapsulation-and-private-members
- id: ENCAP-002
  title: No Test Seams in Production Signatures
  severity: BLOCKER
  category: Encapsulation
  domain: all
  scope: src/dovo/
  intent: Keeps production signatures free of dead code written for tests. Every parameter exists because a production
    caller needs it, so the public surface reflects real behavior and tests do not shape production APIs.
  criteria:
  - id: ENCAP-002.Q01
    statement: Every parameter, kwarg or callback with a default value in a new or modified function in src/dovo/ is passed by at least one production caller.
    kind: judgment
    na_when: No new or modified function in src/dovo/ has a parameter with a default value.
    positive_example: 'def run(self, cwd: Path) -> RunOutcome: ...  # tests monkeypatch at boundary'
    negative_example: 'def run(self, cwd: Path, _runner: GitRunner | None = None) -> RunOutcome: ...  # only tests pass _runner'
  citation: docs/agents/testing.md#core-testing-rules
- id: PERF-001
  title: No Ad-Hoc DB Instantiations in Loops
  severity: BLOCKER
  category: Performance
  domain: all
  scope: All source and test files
  intent: Database access reuses one pre-initialized instance, so repeated work does not pay for a new SQLite connection
    and migration check each time.
  criteria:
  - id: PERF-001.Q01
    statement: Every repository or DovoDb used inside a for or while loop is created outside that loop.
    kind: judgment
    na_when: No for or while loop in the changed code uses a repository or DovoDb.
    positive_example: 'db = DovoDb(paths.database_file, project_id=paths.project_id)

      for item in items: db.sessions.create(...)  # illustrative; create() takes more arguments'
    negative_example: 'for item in items: db = DovoDb(paths.database_file, project_id=paths.project_id); db.sessions.create(...)  # illustrative; create() takes more arguments'
  - id: PERF-001.Q02
    statement: Every helper function, including every test helper, receives its repository or DovoDb as an argument instead of instantiating one.
    kind: judgment
    na_when: No helper function in the changed code uses a repository or DovoDb.
    positive_example: 'def seed_sessions(db: DovoDb, items: list[str]) -> None: ...  # illustrative helper that takes the instance'
    negative_example: 'def seed_session(paths: WorkspacePaths) -> None: DovoDb(paths.database_file, project_id=paths.project_id).sessions.create(...)  # illustrative helper that builds its own instance on every call'
  citation: docs/agents/schemas.md#7-database
- id: PERF-002
  title: Database Migration Hygiene and Consumer Call Sites
  severity: BLOCKER
  category: Performance
  domain: core
  scope: src/dovo/core/db/
  intent: The schema holds only what production code uses, and data changes ship as versioned revisions, so every
    installed database upgrades the same way and no dead columns accumulate.
  criteria:
  - id: PERF-002.Q01
    statement: Every table or column added by a migration in the change is written by production code in src/ in the same PR.
    kind: judgment
    na_when: The change adds no table or column.
    positive_example: 'Migration 0003_artifact_revisions adds the digest column, and ArtifactsRepository.create() in src/dovo/core/db/repositories/artifacts.py accepts and stores digest'
    negative_example: '# Hypothetical: a migration adds column future_flag to sessions and no code under src/ ever sets it'
  - id: PERF-002.Q02
    statement: Every table or column added by a migration in the change is queried by production code in src/ in the same PR.
    kind: judgment
    na_when: The change adds no table or column.
    positive_example: 'Migration 0004_session_discard adds sessions.discard, and the session settings builder in src/dovo/engine/session.py reads it back with discard=row.discard'
    negative_example: '# Hypothetical: a migration adds column future_flag to sessions and no code under src/ ever reads or filters on it'
  - id: PERF-002.Q03
    statement: Every one-time data backfill is shipped as a versioned Alembic revision that runs it with op.execute().
    kind: judgment
    na_when: The change performs no one-time data backfill.
    positive_example: 'A new revision file under src/dovo/core/db/alembic/versions/ calls op.execute("UPDATE ...") to backfill existing rows (the existing op.execute call in 0003_artifact_revisions is a downgrade data cleanup, used here as the pattern)'
    negative_example: '# Hypothetical: a model or repository in src/dovo/core/db/ runs a raw UPDATE at startup to backfill old rows, outside any Alembic revision'
  citation: docs/agents/ci-and-tooling.md#database-migration-hygiene
- id: PERF-003
  title: Indexed Column Queries vs O(n) In-Memory Lookups
  severity: WARNING
  category: Performance
  domain: [core, engine]
  scope: src/dovo/core/db/, src/dovo/core/*/services/, src/dovo/engine/services/
  intent: Lookups use the database's filtering and indexes, so the cost of finding a record does not grow with the number of rows fetched and scanned in Python.
  criteria:
  - id: PERF-003.Q01
    statement: Code that needs a subset of repository records gets it with a filtered repository query instead of filtering a full fetch in memory, whenever an indexed query method or column exists.
    kind: judgment
    na_when: The changed code does not select records from a repository, or no indexed query method or column exists for the lookup.
    positive_example: 'paused = db.sessions.list(status=SessionStatus.PAUSED)  # status is an indexed column; list() filters it in SQL'
    negative_example: 'paused = [s for s in db.sessions.list() if s.status == SessionStatus.PAUSED]  # fetches every session, then filters in Python although list(status=...) exists'
  citation: docs/agents/schemas.md#7-database
- id: API-001
  title: Sibling Repository CRUD Method Naming Consistency
  severity: WARNING
  category: Architecture
  domain: core
  scope: src/dovo/core/db/repositories/
  intent: Sibling repositories name the same operation with the same verb, so a caller who knows one repository can use the
    others without reading each class, and a divergent name reads as a different behavior.
  criteria:
  - id: API-001.Q01
    statement: Every repository class that inserts a new record exposes that operation as a public create() method.
    kind: judgment
    na_when: The repository class has no method that inserts a new record.
    positive_example: 'WorktreesRepository.create(...) and SessionsRepository.create(...)'
    negative_example: 'CostsRepository.record_token_usage(...) inserting a CostRecord while sibling repositories use create()'
  - id: API-001.Q02
    statement: Every repository method that returns at most one record looked up by its identifying key has the name get.
    kind: judgment
    na_when: The repository class has no method that looks up a single record by its identifying key.
    positive_example: 'def get(self, id: str) -> WorktreeRecord | None:'
    negative_example: 'def find(self, id: str) -> WorktreeRecord | None:  # siblings use get()'
  - id: API-001.Q03
    statement: Every repository method that returns a collection of records of one entity has the name list.
    kind: judgment
    na_when: The repository class has no method that returns a collection of records.
    positive_example: 'def list(self, status: WorktreeStatus | None = None) -> list[WorktreeRecord]:'
    negative_example: 'def all(self) -> list[WorktreeRecord]:  # siblings use list()'
  - id: API-001.Q04
    statement: Every repository method that removes a record has the name delete.
    kind: judgment
    na_when: The repository class has no method that removes a record.
    positive_example: 'def delete(self, id: str) -> bool:'
    negative_example: 'def remove(self, id: str) -> bool:  # siblings use delete()'
  - id: API-001.Q05
    statement: Every repository method that persists changes to a whole existing record has the name save.
    kind: judgment
    na_when: No repository method persists changes to a whole existing record; partial updates such as update_status do not count.
    positive_example: 'def save(self, record: SessionRecord) -> SessionRecord:'
    negative_example: 'def store(self, record: SessionRecord) -> SessionRecord:  # whole-record persist not named save()'
  - id: API-001.Q06
    statement: Every repository method named insert, add or upsert has a docstring or comment stating why a canonical verb does not fit.
    kind: judgment
    na_when: No repository method is named insert, add or upsert.
    positive_example: 'def upsert(self, ...) -> ...:  with the docstring "Not save(): replaces the row only when the revision matches."'
    negative_example: 'def insert(self, record: WorktreeRecord) -> WorktreeRecord:  # no stated reason; siblings use create()'
  - id: API-001.Q07
    statement: All repository classes that expose the same non-CRUD operation give it the same method name.
    kind: judgment
    na_when: No two repository classes expose the same non-CRUD operation.
    positive_example: 'WorktreesRepository.update_status(...) and SessionsRepository.update_status(...)'
    negative_example: 'WorktreesRepository.update_status(...) next to SessionsRepository.set_state(...) for the same status change'
  citation: docs/agents/schemas.md#7-database
- id: API-002
  title: Consistent Error Semantics Across Queries
  severity: WARNING
  category: Architecture
  domain: [core, engine]
  scope: src/dovo/core/db/, src/dovo/core/*/services/, src/dovo/engine/services/
  intent: Query paths that read the same data report bad rows the same way, so a caller never mistakes a silently swallowed
    failure in one path for an empty result while a sibling path reports it.
  criteria:
  - id: API-002.Q01
    statement: Every query method that reads an entity reports an invalid enum value or corrupt row as a BaseResult error, whenever a sibling query method that reads that entity reports it.
    kind: judgment
    na_when: No two query methods read the same entity.
    positive_example: 'get() and list() both return a BaseResult error for a row with an invalid status'
    negative_example: 'list() raises on a row with an invalid status while get() returns None for the same row'
  - id: API-002.Q02
    statement: Every except block in a query method re-raises or converts the caught error into a BaseResult error, instead of returning None or an empty value.
    kind: judgment
    na_when: The query method contains no except block.
    positive_example: 'except ValidationError as error: return RecordResult.from_error(error)'
    negative_example: 'except ValidationError: return None  # swallows the error'
  citation: docs/agents/code-conventions.md#resultoutcome-pattern
- id: DRY-001
  title: Shared Repository Transaction Logic in BaseRepository
  severity: SUGGESTION
  category: Code Conventions
  domain: core
  scope: src/dovo/core/db/repositories/
  intent: Transaction handling for repository writes lives once in BaseRepository, so commit, rollback, deletion and session
    behavior stay identical across repositories and a fix is made in one place instead of in every sibling.
  criteria:
  - id: DRY-001.Q01
    statement: Every repository method that persists a record commits through BaseRepository._commit.
    kind: judgment
    positive_example: return self._commit(session, record, f"Worktree with id '{id}' already exists")
    negative_example: 'session.add(record); session.commit()  # in a repository subclass'
  - id: DRY-001.Q02
    statement: Every repository method that deletes a single record deletes it through BaseRepository._delete_where.
    kind: judgment
    positive_example: return self._delete_where(session, select(WorktreeRecord).where(WorktreeRecord.id == id))
    negative_example: 'session.delete(record); session.commit()  # in a repository subclass'
  - id: DRY-001.Q03
    statement: The rollback after a failed commit is written only in BaseRepository.
    kind: judgment
    positive_example: 'No try/except IntegrityError and no session.rollback() in worktrees.py, sessions.py, artifacts.py or costs.py'
    negative_example: 'except IntegrityError: session.rollback(); raise ValueError(...)  # in a repository subclass'
  - id: DRY-001.Q04
    statement: Every repository method obtains its session from BaseRepository.session().
    kind: judgment
    positive_example: 'with self.session() as session:'
    negative_example: 'with get_session(self.db_engine) as session:  # in a repository subclass'
  - id: DRY-001.Q05
    statement: Every other transaction block shared by two or more repository classes is defined once in BaseRepository.
    kind: judgment
    na_when: No repository class other than BaseRepository contains transaction-handling code beyond calls to BaseRepository helpers.
    positive_example: 'Two repositories both call self._delete_where(...) for single-record deletes'
    negative_example: 'The same try/commit/rollback/refresh block copied into both SessionsRepository and WorktreesRepository'
  citation: docs/agents/code-conventions.md#structure-and-complexity
- id: DB-001
  title: Redundant Index Declaration on Unique Columns
  severity: NIT
  category: Database
  domain: core
  scope: src/dovo/core/db/models.py
  intent: A unique constraint already gets a backing index in SQLite, so a column declares uniqueness or an extra index, never both, and the database does not carry a second index that does nothing.
  criteria:
  - id: DB-001.Q01
    statement: Every SQLModel Field that declares unique=True is free of an index=True declaration.
    kind: judgment
    na_when: The change adds or modifies no SQLModel Field in src/dovo/core/db/models.py.
    positive_example: 'session_id: str = Field(unique=True)  # in SessionRecord, src/dovo/core/db/models.py'
    negative_example: 'session_id: str = Field(unique=True, index=True)  # hypothetical: no field in models.py declares both'
  citation: docs/agents/ci-and-tooling.md#database-migration-hygiene
- id: DB-002
  title: Released Migrations Are Immutable and Reversible
  severity: BLOCKER
  category: Database
  domain: core
  scope: src/dovo/core/db/alembic/versions/
  intent: Databases that users already upgraded can always be reached from, and returned to, a known schema, because a
    revision that shipped never changes and every revision can be undone on any supported database.
  criteria:
  - id: DB-002.Q01
    statement: Every revision file that exists in the latest v* tag is left unedited, unrenamed and undeleted.
    kind: judgment
    na_when: The change touches no revision file that exists in the latest v* tag.
    positive_example: 'A schema fix for a released column ships as a new file, 0005_fix_discard_default.py (hypothetical), and 0001_initial_schema.py is untouched'
    negative_example: 'Editing 0001_initial_schema.py, which exists in the v0.6.0 tag, to change a column definition'
  - id: DB-002.Q02
    statement: Every new revision defines both upgrade() and a downgrade() that has a real body rather than a bare `pass`.
    kind: judgment
    na_when: The change adds no new revision.
    positive_example: '0004_session_discard.py defines downgrade() that drops the discard column from sessions inside op.batch_alter_table'
    negative_example: 'A revision whose downgrade() is `pass`'
  - id: DB-002.Q03
    statement: Every new revision avoids PRAGMA and sqlite_master.
    kind: judgment
    na_when: The change adds no new revision.
    positive_example: '0004_session_discard.py contains no PRAGMA statement and no reference to sqlite_master'
    negative_example: 'op.execute("PRAGMA foreign_keys=OFF")  # or a query against sqlite_master, in a revision'
  - id: DB-002.Q04
    statement: Every new revision makes its column and constraint changes through op.batch_alter_table.
    kind: judgment
    na_when: The new revision makes no column or constraint changes.
    positive_example: 'with op.batch_alter_table("sessions") as batch_op: batch_op.drop_column("discard")'
    negative_example: 'op.add_column("sessions", sa.Column("discard", sa.Boolean()))  # outside a batch_alter_table block (hypothetical revision)'
  - id: DB-002.Q05
    statement: Every new revision has both an upgrade test and a downgrade test in tests/core/db/test_migrations.py.
    kind: judgment
    na_when: The change adds no new revision.
    positive_example: 'SessionDiscardMigrationTests has test_upgrade_adds_discard_column_defaulting_existing_rows_false and test_downgrade_drops_discard_column_and_keeps_rows'
    negative_example: 'A new revision 0005 (hypothetical) with no test class for it in test_migrations.py, or one that tests only the upgrade'
  citation: docs/agents/ci-and-tooling.md#migration-lifecycle
- id: FS-001
  title: Atomic File Writes via Temporary Sibling
  severity: BLOCKER
  category: Filesystem
  domain: all
  scope: src/dovo/
  intent: Config and state files are never left half-written, because they are written atomically instead of in-place.
  criteria:
  - id: FS-001.Q01
    statement: Every write to a config or state file is made through Filesystem.atomic_write_json or Filesystem.atomic_write_text.
    kind: judgment
    positive_example: Filesystem.atomic_write_json(config_path, data)
    negative_example: 'with open(config_path, ''w'') as f: json.dump(data, f)  # hypothetical in-place write'
  - id: FS-001.Q02
    statement: Every config or state file write is free of a direct open(..., 'w') call.
    kind: judgment
    na_when: The code writes no config or state file.
    positive_example: 'Filesystem.atomic_write_text(state_path, text)  # hypothetical caller; no open() call at the call site'
    negative_example: 'with open(state_path, ''w'') as f: f.write(text)  # hypothetical in-place write'
  - id: FS-001.Q03
    statement: Every config or state file write is free of a direct Path.write_text call.
    kind: judgment
    na_when: The code writes no config or state file.
    positive_example: 'Filesystem.atomic_write_text(config_path, text)  # hypothetical caller'
    negative_example: 'config_path.write_text(text)  # hypothetical in-place write'
  - id: FS-001.Q04
    statement: Each atomic write helper writes to a .tmp sibling of the target and swaps it into place with Path.replace.
    kind: judgment
    na_when: The change adds or modifies no atomic write helper.
    positive_example: 'atomic_write_text in src/dovo/common/filesystem/services/operations.py writes to path.with_name(f"{path.name}.tmp") and then calls tmp_path.replace(path)'
    negative_example: 'A hypothetical helper that opens the target path directly in ''w'' mode and never calls Path.replace'
  - id: FS-001.Q05
    statement: Each atomic write helper flushes and calls os.fsync on the temporary file before swapping it into place.
    kind: judgment
    na_when: The change adds or modifies no atomic write helper.
    positive_example: 'atomic_write_text in src/dovo/common/filesystem/services/operations.py calls f.flush() and os.fsync(f.fileno()) before tmp_path.replace(path)'
    negative_example: 'A hypothetical helper that calls tmp_path.replace(path) without flushing or calling os.fsync first'
  citation: docs/agents/code-conventions.md#atomic-file-writes
- id: FS-002
  title: Advisory Cross-Process Locking
  severity: BLOCKER
  category: Filesystem
  domain: all
  scope: src/dovo/
  intent: Concurrent dovo processes must not corrupt shared worktree, catalog or state data, so mutations are serialized by the shared advisory workspace lock and a failure to obtain it is reported rather than ignored.
  criteria:
  - id: FS-002.Q01
    statement: Every worktree, catalog or state mutation that can run in more than one process at once is performed while holding the .dovo/.lock advisory lock.
    kind: judgment
    na_when: The change does not mutate worktree, catalog or state data that more than one process can touch.
    positive_example: 'with WorkspaceLock(self.paths.lock_file): return self.lifecycle.create(...)  # in core/worktree/worktree.py'
    negative_example: 'self.lifecycle.create(...)  # hypothetical: mutates the shared .dovo directory without acquiring the lock'
  - id: FS-002.Q02
    statement: The lock is acquired through WorkspaceLock from common/lock.py.
    kind: judgment
    na_when: The change acquires no workspace lock.
    positive_example: 'from dovo.common.lock import WorkspaceLock  # then: with WorkspaceLock(paths.lock_file):'
    negative_example: 'fcntl.flock(open(lock_path, "w"), fcntl.LOCK_EX)  # hypothetical: hand-rolled locking outside common/lock.py'
  - id: FS-002.Q03
    statement: LockTimeoutError is handled where the lock is acquired or by a caller that reports it.
    kind: judgment
    na_when: The change acquires no workspace lock.
    positive_example: 'except LockTimeoutError as exc: return ArtifactsPruneResult(status=ArtifactsPruneStatus.LOCKED, ..., errors=[f"Failed to acquire workspace lock: {exc}"])  # in core/artifacts/services/prune.py'
    negative_example: 'except LockTimeoutError: pass  # hypothetical: timeout swallowed, caller sees no failure'
  citation: docs/agents/architecture.md#the-dovo-directory
- id: COMPAT-001
  title: Strict Public-Only Backwards Compatibility
  severity: BLOCKER
  category: Compatibility
  domain: all
  scope: src/dovo/
  intent: Users and scripts depend on the surfaces they interact with directly, so those surfaces keep working across changes. Compatibility is kept only for them, and nowhere else.
  criteria:
  - id: COMPAT-001.Q01
    statement: The change leaves every existing CLI command, subcommand, argument and flag usable as before, with no breaking rename or removal.
    kind: judgment
    na_when: The change does not touch the CLI command surface (commands, subcommands, arguments or flags).
    positive_example: '"--path", "-p" on the global callback in cli/cli.py  # option name and short form left unchanged'
    negative_example: '# hypothetical: renaming the --path option to --workspace without keeping --path as an alias'
  - id: COMPAT-001.Q02
    statement: The change leaves existing configuration files and blueprint YAML definitions (such as config.json keys and values) readable with the same meaning as before.
    kind: judgment
    na_when: The change does not touch configuration keys or values, or the blueprint YAML schema.
    positive_example: '# hypothetical: a new optional config.json key added with a default, so existing config files load unchanged'
    negative_example: '# hypothetical: renaming an existing config.json key so that files written before the change no longer load'
  - id: COMPAT-001.Q03
    statement: The change leaves the stable machine-readable output formats, such as the JSON event envelope, with the same field names and meaning as before.
    kind: judgment
    na_when: The change does not touch machine-readable output formats.
    positive_example: 'envelope = {"event_type": data_type.__name__, "payload": formatter.to_json_serializable(data)}  # in cli/ui/dispatcher.py, envelope keys unchanged'
    negative_example: '# hypothetical: renaming the envelope key "event_type" to "type" in the JSON output'
  citation: docs/agents/code-conventions.md#backwards-compatibility
- id: COMPAT-002
  title: Ban on Internal Compatibility Shims and Aliases
  severity: BLOCKER
  category: Compatibility
  domain: all
  scope: src/dovo/common/, src/dovo/core/, internal src/dovo/cli/
  intent: Internal refactors must not leave old names behind, so internal code carries one name per symbol and no dead compatibility layers; callers and tests are updated to the new name instead.
  criteria:
  - id: COMPAT-002.Q01
    statement: The change is free of backwards-compatibility aliases that keep an old internal name pointing at a renamed symbol.
    kind: judgment
    na_when: The change renames no internal symbol in common/, core/ or internal CLI modules.
    positive_example: 'Hypothetical: a helper is renamed from _unlock_fd to unlock_file_descriptor and the old name no longer exists anywhere in the module.'
    negative_example: 'Hypothetical: after renaming _unlock_fd, the module keeps the line "_unlock = _unlock_fd  # internal shim alias".'
  - id: COMPAT-002.Q02
    statement: The change is free of deprecated or compatibility properties, wrapper methods and shim layers that exist only to keep an old internal interface working.
    kind: judgment
    na_when: The change renames or restructures no internal class, method or module in common/, core/ or internal CLI modules.
    positive_example: 'Hypothetical: a renamed internal property replaces the old one outright, with no forwarding property left on the class.'
    negative_example: 'Hypothetical: a class keeps "@property def old_name(self): return self.new_name" only so existing internal callers keep working.'
  - id: COMPAT-002.Q03
    statement: All internal callers and tests were updated directly to the new name when an internal symbol was renamed.
    kind: judgment
    na_when: The change renames no internal symbol in common/, core/ or internal CLI modules.
    positive_example: 'Hypothetical: a rename of _unlock_fd comes with edits to every internal call site and test that referenced it.'
    negative_example: 'Hypothetical: a rename leaves internal callers on the old name and adds an alias so they keep working instead of editing them.'
  citation: docs/agents/code-conventions.md#backwards-compatibility
- id: COMPAT-003
  title: Greenfield Architecture Default
  severity: BLOCKER
  category: Compatibility
  domain: all
  scope: src/dovo/
  intent: The repository is treated as greenfield, so superseded code is replaced rather than carried alongside its replacement, unless an issue explicitly demands otherwise. This keeps one implementation of each behavior.
  criteria:
  - id: COMPAT-003.Q01
    statement: The change leaves a single implementation of the behavior it replaces, with no superseded implementation kept alongside the new one.
    kind: judgment
    na_when: The change replaces no existing behavior, or the issue explicitly demands a dual code path, or the superseded path is a public surface that COMPAT-001 protects (a CLI command or flag, a config key, a machine-readable output field).
    positive_example: '# hypothetical: the legacy loader is deleted and its callers now use the new unified loader'
    negative_example: '# hypothetical: LegacyLoader stays in the tree beside UnifiedLoader and both remain reachable'
  - id: COMPAT-003.Q02
    statement: The change avoids adding a fallback branch or fallback adapter that routes to a superseded path.
    kind: judgment
    na_when: The issue explicitly demands a fallback adapter or branch, or the superseded path is a public surface that COMPAT-001 protects (a CLI command or flag, a config key, a machine-readable output field).
    positive_example: '# hypothetical: return UnifiedLoader().load()  # directly replaces the legacy loader'
    negative_example: 'if config.use_legacy: return LegacyLoader().load()  # hypothetical: unnecessary compatibility branch'
  - id: COMPAT-003.Q03
    statement: The change avoids planning a deprecation window for a superseded path.
    kind: judgment
    na_when: The issue explicitly demands a deprecation window.
    positive_example: '# hypothetical: the old path is removed in this change set, with no warning period'
    negative_example: '# hypothetical: warnings.warn("load_legacy is deprecated, removed in 2 releases"); the old path keeps working'
  - id: COMPAT-003.Q04
    statement: All callers of a superseded path are updated in the same change set that replaces it.
    kind: judgment
    na_when: The change supersedes no existing path.
    positive_example: '# hypothetical: the loader is replaced and every call site is switched to the new one in the same change set'
    negative_example: '# hypothetical: the new loader is added, and callers are left on the old one to migrate later'
  citation: docs/agents/planning.md#step-1-extract-the-contract-from-the-issue
- id: TEST-001
  title: Test at Contracts, Not Implementation
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  intent: Tests pin the behavior callers and users depend on, so a refactor that keeps that behavior never breaks a test
    and a test that fails always points at a real change in what the code promises.
  criteria:
  - id: TEST-001.Q01
    statement: Every assertion checks a deliberate contract, such as a BaseResult object, an exact JSON dict, an exit code, a file on disk or a git ref.
    kind: judgment
    na_when: The change adds or modifies no assertions.
    positive_example: 'assert result == ReconciliationResult(reconciled=[], warning=None)  # in tests/core/sessions/services/test_reconcile.py; ReconciliationResult is a BaseResult'
    negative_example: 'assert service._internal_cache_size == 1  # hypothetical: an internal cache is not a contract'
  - id: TEST-001.Q02
    statement: The assertions avoid reading private helpers and private attributes of the code under test.
    kind: judgment
    na_when: The change adds or modifies no assertions.
    positive_example: 'assert result.exit_code == 0  # in tests/cli/session/test_session_logs.py, observed through the CLI'
    negative_example: 'assert service._internal_cache_size == 1  # hypothetical: reads a private attribute'
  - id: TEST-001.Q03
    statement: The assertions avoid asserting mock call counts and call ordering.
    kind: judgment
    na_when: The change adds or modifies no assertions.
    positive_example: 'assert result == ReconciliationResult(reconciled=[], warning=None)  # the outcome is asserted, not how it was reached'
    negative_example: 'assert mock_parser.call_count == 1  # hypothetical: counts calls on a mock'
  - id: TEST-001.Q04
    statement: The assertions avoid pinning rendered layout, such as exact spacing, column widths or box-drawing.
    kind: judgment
    na_when: The change adds or modifies no assertions on rendered output, or only CLI runner tests under tests/cli/ that TEST-017 governs.
    positive_example: 'assert "iteration 3/5" in rendered  # in tests/cli/ui/test_live.py: checks a fact in the rendered panel, not its layout'
    negative_example: 'assert output == "| name  | status |\n|-------|--------|"  # hypothetical: pins table layout'
  - id: TEST-001.Q05
    statement: The assertions avoid checking how a constructor assigned its arguments to attributes.
    kind: judgment
    na_when: The change adds or modifies no assertions.
    positive_example: 'assert loader.load(path) == expected_config  # hypothetical: checks what the constructed object does'
    negative_example: 'assert loader.path == path  # hypothetical: only checks the constructor stored its argument'
  citation: docs/agents/testing.md#the-rule-that-matters-most
- id: TEST-002
  title: 1:1 Source Parity Layout
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  intent: A test's location is predictable from the source module it covers, so no module goes untested or hides in a catch-all file. No exemption list excuses a module, and tests may split into files named for the behavior.
  criteria:
  - id: TEST-002.Q01
    statement: Each src/dovo/common/<m>.py module has its tests in tests/common/test_<m>.py.
    kind: judgment
    na_when: The change adds, moves or renames no module under src/dovo/common/ and no test file under tests/common/.
    positive_example: src/dovo/common/lock.py -> tests/common/test_lock.py
    negative_example: 'tests/common/test_locking_helpers.py  # hypothetical: covers src/dovo/common/lock.py under a name that does not mirror the module'
  - id: TEST-002.Q02
    statement: Each src/dovo/core/<domain>/<m>.py module has its tests in tests/core/<domain>/test_<m>.py.
    kind: judgment
    na_when: The change adds, moves or renames no module under src/dovo/core/ and no test file under tests/core/.
    positive_example: src/dovo/core/git/runner.py -> tests/core/git/test_runner.py
    negative_example: 'tests/core/test_runner.py  # hypothetical: covers src/dovo/core/git/runner.py but skips the git/ domain directory'
  - id: TEST-002.Q03
    statement: Each src/dovo/engine/<m>.py module has its tests in tests/engine/test_<m>.py, with the executors/ and services/ subpackages mirrored as tests/engine/executors/ and tests/engine/services/.
    kind: judgment
    na_when: The change adds, moves or renames no module under src/dovo/engine/ and no test file under tests/engine/.
    positive_example: src/dovo/engine/executors/conditions.py -> tests/engine/executors/test_conditions.py
    negative_example: 'tests/engine/test_conditions.py  # hypothetical: covers src/dovo/engine/executors/conditions.py but drops the executors/ subpackage level'
  - id: TEST-002.Q04
    statement: Each src/dovo/cli/ui/formatters/<domain>/<name>.py module has its tests in tests/cli/ui/formatters/<domain>/test_<name>.py.
    kind: judgment
    na_when: The change adds, moves or renames no formatter module under src/dovo/cli/ui/formatters/ and no test file under tests/cli/ui/formatters/.
    positive_example: src/dovo/cli/ui/formatters/worktree/worktree_create.py -> tests/cli/ui/formatters/worktree/test_worktree_create.py
    negative_example: 'tests/cli/ui/formatters/test_worktree_create.py  # hypothetical: omits the worktree/ domain directory'
  - id: TEST-002.Q05
    statement: Each src/dovo/cli/<command>/commands/<action>.py module has its tests in tests/cli/<command>/test_<command>_<action>.py, nested under its own tests/cli/<command>/ subdirectory with the commands/ level collapsed.
    kind: judgment
    na_when: The change adds, moves or renames no command module under src/dovo/cli/<command>/commands/ and no test file under tests/cli/.
    positive_example: src/dovo/cli/worktree/commands/worktree_create.py -> tests/cli/worktree/test_worktree_create.py
    negative_example: 'tests/cli/commands/test_worktree_create.py  # flat under tests/cli/commands/, not nested under tests/cli/worktree/'
  - id: TEST-002.Q06
    statement: There is one test file per CLI command action, rather than one file per command domain.
    kind: judgment
    na_when: The change adds or edits no tests for CLI command actions.
    positive_example: 'tests/cli/worktree/ holds test_worktree_create.py, test_worktree_delete.py and test_worktree_list.py, one per action'
    negative_example: 'tests/cli/test_worktree.py  # hypothetical: a single file holding the tests for create, delete and list'
  - id: TEST-002.Q07
    statement: No test file groups several formatters or several domains into one part-numbered or collapsed file.
    kind: judgment
    na_when: The change adds or edits no formatter or cross-domain test files.
    positive_example: 'Each formatter has its own file, for example tests/cli/ui/formatters/worktree/test_worktree_apply.py and test_worktree_show.py.'
    negative_example: 'tests/cli/ui/test_command_formatters_part1.py  # hypothetical: part-numbered grab-bag covering several formatters'
  - id: TEST-002.Q08
    statement: Every test directory carries an __init__.py.
    kind: judgment
    na_when: The change adds no test directory.
    positive_example: 'tests/cli/worktree/__init__.py exists next to tests/cli/worktree/test_worktree_create.py'
    negative_example: 'tests/cli/newcmd/test_newcmd_run.py with no tests/cli/newcmd/__init__.py  # hypothetical: basenames repeat across the tree, so the missing package file risks module-name collisions'
  - id: TEST-002.Q09
    statement: Each per-domain conftest.py holds only fixtures that its own domain's test files share, and none that another domain needs.
    kind: judgment
    na_when: The change adds or edits no per-domain conftest.py under tests/cli/<command>/.
    positive_example: 'tests/cli/worktree/conftest.py holds fixtures shared by the worktree command tests'
    negative_example: 'A fixture in tests/cli/worktree/conftest.py that tests/cli/session/ also imports  # hypothetical: a fixture another domain needs belongs in a shared conftest'
  citation: docs/agents/testing.md#11-source-parity-layout
- id: TEST-003
  title: Standardized Test Naming and Vague Name Ban
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  intent: A test's name alone should tell a reader which behavior it pins and what is expected, so failures are legible without opening the test.
  criteria:
  - id: TEST-003.Q01
    statement: Every test class is named with the suffix Tests.
    kind: judgment
    na_when: The change adds or renames no test class.
    positive_example: 'class ConfigLoaderTests:  # in tests/core/config/test_loader.py'
    negative_example: 'class TestConfig:  # hypothetical: prefix naming instead of the *Tests suffix'
  - id: TEST-003.Q02
    statement: Every test method follows the test_<condition>_<outcome> pattern, naming both the condition and the expected outcome.
    kind: judgment
    na_when: The change adds or renames no test method.
    positive_example: 'def test_load_missing_config_returns_failure_result(self, workspace_paths): ...  # in ConfigLoaderTests, tests/core/config/test_loader.py'
    negative_example: 'def test_config(self): ...  # hypothetical: no outcome in the name'
  - id: TEST-003.Q03
    statement: Every test method name is free of the banned vague names test_ok, test_success, test_present, test_missing, test_blank, test_basic, test_default, test_works, test_timeout, test_no_op and test_help.
    kind: judgment
    na_when: The change adds or renames no test method.
    positive_example: 'def test_load_missing_config_returns_failure_result(self, workspace_paths): ...  # in ConfigLoaderTests, tests/core/config/test_loader.py'
    negative_example: 'def test_ok(self): ...  # hypothetical: banned name with no outcome'
  - id: TEST-003.Q04
    statement: Every test method name is free of a should prefix.
    kind: judgment
    na_when: The change adds or renames no test method.
    positive_example: 'def test_load_missing_config_returns_failure_result(self, workspace_paths): ...  # in ConfigLoaderTests, tests/core/config/test_loader.py'
    negative_example: 'def test_should_timeout(self): ...  # hypothetical: should prefix and no outcome'
  citation: docs/agents/testing.md#naming-conventions
- id: TEST-004
  title: CLI Tier Matrix and Handler Test Necessity
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/cli/
  intent: CLI wiring is proven through the real runner, so option binding, exit codes and output cannot silently break. Handler-level tests exist only where the handler owns logic of its own, and never repeat what the domain tests pin.
  criteria:
  - id: TEST-004.Q01
    statement: Every CLI command action has at least one *CliIntegrationTests suite that invokes the command through runner.invoke.
    kind: judgment
    na_when: The change adds or modifies no CLI command action.
    positive_example: 'class ConfigShowCliIntegrationTests: ...  # in tests/cli/config/test_config_show.py, calls cli_runner.invoke(app, ["-p", ..., "config", "show"])'
    negative_example: 'A command action whose only tests are a *RootTests suite calling the handler directly (hypothetical: no runner.invoke suite exists for it)'
  - id: TEST-004.Q02
    statement: The integration suite includes a happy-path test with default arguments that asserts exit code 0.
    kind: judgment
    na_when: The change adds or modifies no CLI command action.
    positive_example: 'res = cli_runner.invoke(app, ["-p", str(isolated_workspace), "config", "show"])  # then asserts res.exit_code == 0 (hypothetical assertion shown; the invocation is in test_config_show.py)'
    negative_example: 'A suite that only invokes the command with non-default options and never runs the plain command (hypothetical)'
  - id: TEST-004.Q03
    statement: Every declared Typer option, flag and argument of the command is exercised in at least one invocation, verifying input binding and propagation to the domain layer.
    kind: judgment
    na_when: The command declares no options, flags or arguments.
    positive_example: 'One invocation passes "--format", "json" and another passes the positional key and value of config set, so each declared parameter is bound at least once (hypothetical combination)'
    negative_example: 'A command that declares a --force flag where no invocation in its integration suite passes --force (hypothetical)'
  - id: TEST-004.Q04
    statement: The integration suite avoids duplicating domain branch matrices, limiting its binding checks to what the CLI layer adds.
    kind: judgment
    na_when: The change adds or modifies no CLI command action.
    positive_example: 'The CLI suite checks that an option reaches the domain call; the branch outcomes of that option are asserted under tests/core/ (hypothetical)'
    negative_example: 'A CLI integration suite that re-runs every domain status branch of the result through runner.invoke (hypothetical)'
  - id: TEST-004.Q05
    statement: The integration suite includes a failure-path test that asserts the expected non-zero exit code when the domain returns a non-ok result.
    kind: judgment
    na_when: The command's domain call cannot return a non-ok result.
    positive_example: 'A test invokes "config show" in a workspace with no config.json and asserts a non-zero exit code (hypothetical assertion; the NOT_FOUND status is real, ConfigLoadStatus.NOT_FOUND)'
    negative_example: 'A suite where every test asserts exit code 0 even though the domain can return an error status (hypothetical)'
  - id: TEST-004.Q06
    statement: The integration suite includes a test invoking the command with --format json that asserts the emitted payload matches the wire schema.
    kind: judgment
    na_when: The command does not support --format json.
    positive_example: 'res = cli_runner.invoke(app, ["-p", str(isolated_workspace), "config", "show", "--format", "json"])  # in tests/cli/config/test_config_show.py'
    negative_example: 'A command that supports --format json whose suite never passes --format json (hypothetical)'
  - id: TEST-004.Q07
    statement: Every interactive confirmation or abort branch of the command is exercised by the integration suite.
    kind: judgment
    na_when: The command has no interactive confirmation or abort branch.
    positive_example: 'A test supplies "n" as input to the confirmation prompt and asserts the abort exit code and that nothing was changed (hypothetical)'
    negative_example: 'A command that prompts for confirmation where every test bypasses the prompt with a skip flag (hypothetical)'
  - id: TEST-004.Q08
    statement: Every *RootTests suite is written for a handler that owns logic the domain layer does not, such as input coercion, branch selection across services, result composition from more than one call, or an interactive abort path.
    kind: judgment
    na_when: The command action has no *RootTests suite; a pass-through handler with zero root tests is fully compliant and a root test is never required per action.
    positive_example: 'class DemoRootTests: ...  # hypothetical: the handler picks between two services depending on its arguments, so it earns a root test'
    negative_example: 'class ConfigShowRootTests: ...  # in tests/cli/config/test_config_show.py; config_show_command only calls the domain and dispatches the result'
  - id: TEST-004.Q09
    statement: Every *RootTests suite avoids restating a contract already asserted under tests/core/ for the same result type.
    kind: judgment
    na_when: The command action has no *RootTests suite.
    positive_example: 'A root test asserts only what the handler itself decides, leaving the result fields to tests/core/ (hypothetical)'
    negative_example: 'test_config_show_missing_config_returns_not_found in ConfigShowRootTests re-asserts the CONFIG_NOT_FOUND errors already asserted in tests/core/config/test_loader.py'
  citation: docs/agents/testing.md#tier-3---cli-wiring-runner-required-root-tests-when-earned
- id: TEST-005
  title: Formatter Presentation Contract Protocol
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/cli/ui/formatters/
  intent: A formatter's view model, JSON wire format and rendered content are separate published contracts, so each is tested independently and fails only when that contract changes, not when styling does.
  criteria:
  - id: TEST-005.Q01
    statement: Every formatter under cli/ui/formatters/<domain>/ is tested in its own file at tests/cli/ui/formatters/<domain>/test_<name>.py.
    kind: judgment
    na_when: The change adds or modifies no formatter under cli/ui/formatters/.
    positive_example: 'tests/cli/ui/formatters/status/test_dovo_status.py tests DovoStatusFormatter from src/dovo/cli/ui/formatters/status/dovo_status.py'
    negative_example: 'DovoStatusFormatter tested only inside a shared tests/cli/ui/formatters/test_all_formatters.py (hypothetical file)'
  - id: TEST-005.Q02
    statement: The formatter is tested through cases built from FormatterCase, each holding the input data, the expected view and the render expectations.
    kind: judgment
    na_when: The change adds or modifies no formatter under cli/ui/formatters/.
    positive_example: 'HEALTHY = FormatterCase(data=..., view=_make_status_view(...), render_expectations=[...])  # in tests/cli/ui/formatters/status/test_dovo_status.py'
    negative_example: 'a test that builds the formatter input and expected strings inline in the test body, bypassing FormatterCase (hypothetical)'
  - id: TEST-005.Q03
    statement: A test asserts that transform equals the expected view for a formatter that derives a view model from its input.
    kind: judgment
    na_when: The formatter has no derived view model, meaning transform is provably the identity and the declared view type is the input event type.
    positive_example: 'assert_transform_derives_expected_view(DovoStatusFormatter, case.data, case.view)  # in DovoStatusFormatterTests.test_transform_derives_expected_view'
    negative_example: 'a DovoStatusFormatter test file with only JSON and render tests, leaving StatusView derivation unpinned (hypothetical)'
  - id: TEST-005.Q04
    statement: The JSON wire format is asserted as an exact literal dict.
    kind: judgment
    na_when: The change adds or modifies no formatter under cli/ui/formatters/.
    positive_example: 'assert_json_payload_matches_published_shape(DovoStatusFormatter, case.data, {"health": "ok", "root_dir": "/workspace/my-repo", ...})  # in tests/cli/ui/formatters/status/test_dovo_status.py'
    negative_example: 'assert formatter.to_json_serializable(data) == {...} replaced by a comparison against a value computed by the code under test (hypothetical)'
  - id: TEST-005.Q05
    statement: The JSON wire format is pinned at both a fully populated state and an empty or sparse boundary state.
    kind: judgment
    na_when: The change adds or modifies no formatter under cli/ui/formatters/.
    positive_example: 'STATUS_PAYLOAD_CASES pins HEALTHY (fully populated) and UNINITIALIZED_NON_GIT (null fields, empty lists) in tests/cli/ui/formatters/status/test_dovo_status.py'
    negative_example: 'a payload test parametrized only with HEALTHY, so null and empty-list output is never pinned (hypothetical)'
  - id: TEST-005.Q06
    statement: The Rich render is asserted at the pinned width of 160 columns.
    kind: judgment
    na_when: The change adds or modifies no formatter under cli/ui/formatters/.
    positive_example: 'assert_rich_render_shows_every_view_value(DovoStatusFormatter, case.data, case.render_expectations)  # renders through render_rich with width=160 from tests/harness/formatter.py'
    negative_example: 'rendering through a Console(width=80) built inside the test, so wrapping differs from the pinned width (hypothetical)'
  - id: TEST-005.Q07
    statement: Every expected string in the render test is a semantic value taken from case.view, and never a label, border, glyph, padding or full sentence.
    kind: judgment
    na_when: The change adds or modifies no formatter under cli/ui/formatters/.
    positive_example: 'render_expectations=["raw-project", "feature/status-cmd", "Invalid schema"]  # view values only, in DEGRADED_RAW_CONFIG_PROJECT'
    negative_example: 'assert "Project:" in rendered and "╭" in rendered  # hypothetical: asserts a label and a border glyph'
  - id: TEST-005.Q08
    statement: A formatter with no derived view model omits the transform test while keeping both the JSON and the render test.
    kind: judgment
    na_when: The formatter has a derived view model, so transform is not the identity.
    positive_example: 'WarningFormatterTests in tests/cli/ui/formatters/events/test_warning.py has only test_json_payload_matches_published_shape and test_rich_render_shows_every_view_value'
    negative_example: 'a WarningFormatter test file with a transform test that only checks WarningEvent equals itself (hypothetical)'
  - id: TEST-005.Q09
    statement: The change is free of an alias such as SomeView = SomeEvent introduced to manufacture a third test for an identity formatter.
    kind: judgment
    na_when: The change adds or modifies no formatter under cli/ui/formatters/.
    positive_example: 'WarningFormatter(ComponentFormatter[WarningEvent]) declares no separate view type'
    negative_example: 'ErrorPanelView = ErrorPanelEvent  # alias so an identity transform can be asserted (hypothetical)'
  - id: TEST-005.Q10
    statement: The change is free of an assertion that to_json_serializable(data) equals transform(data).model_dump().
    kind: judgment
    na_when: The change adds or modifies no formatter under cli/ui/formatters/.
    positive_example: 'assert_json_payload_matches_published_shape(DovoStatusFormatter, case.data, expected_payload)  # expected_payload is a literal dict'
    negative_example: 'assert formatter.to_json_serializable(data) == formatter.transform(data).model_dump()  # hypothetical: compares code to itself'
  citation: docs/agents/testing.md#tier-2---presentation-contracts-three-tests-per-formatter-never-one
- id: TEST-006
  title: Parameterization-First for Sibling Variations
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  intent: Variations of one contract are tested through a single parameterized test, so each case is named and reported separately and a new case costs one line instead of a copied test.
  criteria:
  - id: TEST-006.Q01
    statement: Variations of the same contract or function (input variants, polymorphic target types, invalid payload permutations) are covered by one parameterized test rather than by copy-pasted or near-identical sibling test methods.
    kind: judgment
    na_when: The change adds or modifies no tests that exercise more than one variation of the same contract.
    positive_example: '@pytest.mark.parametrize("target", [pytest.param(model, id="model"), pytest.param(dict, id="dict")])  # hypothetical: one test covers both target types'
    negative_example: 'def test_eval_model(self): ...; def test_eval_dict(self): ...  # hypothetical: duplicate sibling methods that differ only by target type'
  - id: TEST-006.Q02
    statement: Each test is free of `for` loops and stacked assertions that iterate over scenarios.
    kind: judgment
    na_when: The change adds or modifies no tests.
    positive_example: '@pytest.mark.parametrize("pattern", [pytest.param("../x", id="dotdot"), pytest.param("/etc/**", id="absolute")])  # shape used in tests/common/test_tool_policy.py'
    negative_example: 'for pattern in ["../x", "/etc/**"]: assert not is_valid(pattern)  # hypothetical: the loop hides which scenario failed'
  - id: TEST-006.Q03
    statement: Every parameterized case uses pytest.param with an explicit, readable id label.
    kind: judgment
    na_when: The change adds or modifies no parameterized tests.
    positive_example: 'pytest.param("ghp_" + "a" * 36, id="github-classic")  # in tests/common/test_redact.py'
    negative_example: '@pytest.mark.parametrize("token", ["ghp_aaa", "sk-ant-aaa"])  # hypothetical: bare values, so failures report auto-generated ids'
  - id: TEST-006.Q04
    statement: Separate test methods are used only where the cases have fundamentally distinct lifecycles, differing fixture requirements or divergent assertion contracts.
    kind: judgment
    na_when: The change adds or modifies no tests that sit next to a sibling test of the same function.
    positive_example: 'def test_create_rolls_back_on_failure(self, failing_git): ...; def test_create_returns_path(self, tmp_repo): ...  # hypothetical: different fixtures and assertion contracts justify separate methods'
    negative_example: 'def test_rejects_empty_name(self): ...; def test_rejects_blank_name(self): ...  # hypothetical: same fixtures and same assertion, split only by input'
  citation: docs/agents/testing.md#parameterization-as-primary-approach
- id: TEST-007
  title: Assert Domain Invariants on Results; Pin Schemas in Dedicated Contract Tests
  severity: SUGGESTION
  category: Testing
  domain: tests
  scope: tests/
  intent: Protects tests that fail only when behavior breaks. Assertions target the domain outcome under test, and
    model shapes and defaults are pinned once in contract tests, so unrelated changes do not break scenario tests.
  criteria:
  - id: TEST-007.Q01
    statement: Every field assertion in a scenario test checks a field that carries the scenario's domain outcome rather than an incidental envelope field or default.
    kind: judgment
    na_when: The test is a dedicated model contract test or a wire payload test.
    positive_example: "assert result.status == WorktreeDiffStatus.NOT_FOUND; assert 'not found' in result.errors[0].lower()"
    negative_example: "assert result.status == WorktreeDiffStatus.NOT_FOUND; assert result.error_code is None; assert result.warnings == []; assert result.fixes == []  # incidental defaults in a not-found scenario"
  - id: TEST-007.Q02
    statement: Each scenario or integration test of a specific behavior or error condition uses targeted field assertions instead of whole-model equality.
    kind: judgment
    na_when: The test is a wire payload test, or the entire entity is the subject under test (its expected model may then rely on schema defaults instead of naming every field in kwargs).
    positive_example: "assert result.status == WorktreeDiffStatus.NOT_FOUND; assert result.worktree_id == 'wt-1'"
    negative_example: "assert result == WorktreeDiffResult(status=WorktreeDiffStatus.NOT_FOUND, worktree_id='wt-1')  # whole-model equality for a status check"
  - id: TEST-007.Q03
    statement: Each new or modified model with defaults or a serialization contract has a dedicated contract test in tests/common/ or tests/core/*/test_models.py that asserts them.
    kind: judgment
    na_when: The change adds or modifies no model that has defaults or a serialization contract.
    positive_example: "tests/core/interaction/test_models.py::test_serialized_shape_and_defaults_are_pinned pins the shape and defaults of the interaction models"
    negative_example: "A new BaseResult subclass with default_factory fields and no test in tests/core/*/test_models.py asserting its defaults"
  - id: TEST-007.Q04
    statement: Model shape, default values and serialization are asserted only in dedicated contract tests rather than in scenario or integration tests.
    kind: judgment
    na_when: No new or modified scenario or integration test asserts a model's shape, default values or serialization.
    positive_example: "A diff scenario test in tests/core/worktree/test_worktree.py asserts only result.status, while defaults are pinned in a test_models.py contract test"
    negative_example: "A variant of that diff test that also asserts result.warnings == [] and result.fixes == [] to pin the model defaults"
  - id: TEST-007.Q05
    statement: Each model has at most two dedicated contract tests.
    kind: judgment
    na_when: The change adds or modifies no dedicated model contract test.
    positive_example: "tests/core/interaction/test_models.py::test_serialized_shape_and_defaults_are_pinned is the single test pinning shape and defaults for its model"
    negative_example: "A test_models.py file with three or more separate tests that each re-pin the defaults of the same model"
  - id: TEST-007.Q06
    statement: Each test of a wire payload with a published schema contract, such as a CLI JSON formatter, verifies the exact wire payload.
    kind: judgment
    na_when: No new or modified test covers a wire payload with a published schema contract.
    positive_example: "assert_json_payload_matches_published_shape(WorktreeDiffFormatter, case.data, expected_payload)  # tests/cli/ui/formatters/worktree/test_worktree_diff.py"
    negative_example: "assert json.loads(output)['status'] == 'not_found'  # the rest of the published payload goes unverified"
  - id: TEST-007.Q07
    statement: Each test avoids faux-matchers such as ANY_TIMESTAMP and ANY_UUID where their only purpose is to satisfy whole-object matching on database records or unowned system state.
    kind: judgment
    na_when: The test uses no faux-matcher.
    positive_example: "assert record.branch_name == 'feature-x'; assert record.status == WorktreeStatus.ACTIVE  # deterministic business fields asserted directly"
    negative_example: "assert record == expected  # expected substitutes the ANY_TIMESTAMP faux-matcher for created_at and updated_at only to allow whole-object matching"
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-008
  title: Test Double Realism and Production Types
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  intent: A test double must stand in for something production really uses, so tests fail when production contracts change instead of passing against an invented interface.
  criteria:
  - id: TEST-008.Q01
    statement: Every test double or stub inherits from a type production actually passes or satisfies a typing.Protocol production is typed against.
    kind: judgment
    na_when: The change adds or edits no test double or stub.
    positive_example: 'class FakeAgentProvider(BaseAgentProvider): ...  # in tests/harness/fakes.py, subclassing the production base class'
    negative_example: 'class MockAdapter: def __getattr__(self, name): return MagicMock()  # hypothetical: matches no production type or Protocol'
  - id: TEST-008.Q02
    statement: Every test double is free of an interface built as the union of the attributes from every branch of a hasattr chain.
    kind: judgment
    na_when: The change adds or edits no test double or stub.
    positive_example: 'class FakeRunObserver: def on_worktree_ready(self, path, active): ...  # hypothetical: implements only the RunObserver Protocol in engine/models.py'
    negative_example: 'class StubTarget: ...  # hypothetical: defines every attribute that any branch of production hasattr(target, ...) checks, so it matches no single production type'
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-009
  title: Ban on Negative Existence Tests for Deleted Symbols
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  intent: Tests prove what the live codebase does, never the historical outcome of a refactor, so a removed symbol leaves no trace in the test suite.
  criteria:
  - id: TEST-009.Q01
    statement: The test suite is free of negative existence assertions such as assert not hasattr(module, name).
    kind: judgment
    positive_example: 'assert result.session_id == "wf_abcdef12"  # asserts live behavior (hypothetical test)'
    negative_example: 'assert not hasattr(filesystem, "old_helper")  # hypothetical: proves a removed helper stays removed'
  - id: TEST-009.Q02
    statement: The tests that called a function, class or alias were deleted in the same change that removed it from production.
    kind: judgment
    na_when: The change removes no function, class or alias from production.
    positive_example: '# hypothetical: test_old_helper deleted when old_helper was removed from production'
    negative_example: '# hypothetical: test_old_helper kept after old_helper was removed, rewritten to expect AttributeError or a missing attribute'
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-010
  title: Complete Assertions Invariant
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  intent: A test must check the behavior it exists for, so a passing run shows the code did the right thing and not merely that it returned something.
  criteria:
  - id: TEST-010.Q01
    statement: Every test checks a concrete value or effect beyond `assert x is not None`, so that `assert x is not None` is never its only assertion.
    kind: judgment
    na_when: The test contains no assertions on a returned object, for example a test that only checks that a call raises.
    positive_example: 'assert outcome.session_id == seen[0]  # in tests/engine/test_engine.py, RunOutcome.session_id is str | None'
    negative_example: 'assert outcome is not None  # hypothetical: the only assertion in the test, so the test is unfinished'
  - id: TEST-010.Q02
    statement: isinstance is used in a test only where it distinguishes two real code paths, rather than repeating what basedpyright already proves.
    kind: judgment
    na_when: The test uses no isinstance check.
    positive_example: 'assert isinstance(result, ErrorResult)  # hypothetical: the call can return either a success or an error model and the test must tell which'
    negative_example: 'assert isinstance(outcome, RunOutcome)  # hypothetical: engine.run is already typed to return RunOutcome, so the check proves nothing'
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-011
  title: Determinism and Clock Virtualization
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  intent: Tests must give the same result on every run and every machine, so they do not depend on real elapsed time or on leftover processes, and a failing test cannot leak anything into later ones.
  criteria:
  - id: TEST-011.Q01
    statement: Every test body is free of hardcoded sleeps, other than a sleep inside the shared harness poll helper.
    kind: judgment
    na_when: The change adds or edits no test code.
    positive_example: 'monkeypatch.setattr("dovo.common.lock.time.monotonic", fake_monotonic)  # hypothetical: the test advances a fake clock instead of waiting'
    negative_example: "time.sleep(0.05)  # bare sleep in a test body, as in _sync_and_interrupt in tests/engine/executors/test_process_group.py"
  - id: TEST-011.Q02
    statement: Tests of retry or backoff intervals drive time through VirtualClock or a monkeypatched clock at the module boundary (time.monotonic, asyncio.sleep).
    kind: judgment
    na_when: The change adds or edits no test of a retry or backoff interval.
    positive_example: 'monkeypatch.setattr("dovo.engine.executors.step_executor.time.monotonic", clock.now)  # hypothetical: VirtualClock does not exist in the repo yet; the patch targets time.monotonic as imported by step_executor'
    negative_example: 'time.sleep(backoff_seconds)  # hypothetical: the test waits out the real backoff interval'
  - id: TEST-011.Q03
    statement: A retry test asserts the resulting schedule rather than only that a retry eventually happened.
    kind: judgment
    na_when: The change adds or edits no retry test.
    positive_example: 'assert sleeps == [1.0, 2.0, 4.0]  # hypothetical: the recorded backoff schedule'
    negative_example: 'assert attempts == 3  # hypothetical: proves a retry happened but not when'
  - id: TEST-011.Q04
    statement: The clock is injected anywhere its output reaches a result field, so a time-dependent test asserts literal timestamps.
    kind: judgment
    na_when: The code under test has no timestamp that reaches a result field.
    positive_example: 'service = Service(clock=lambda: datetime(2026, 1, 1, tzinfo=UTC)); assert result.started_at == datetime(2026, 1, 1, tzinfo=UTC)  # hypothetical constructor parameter'
    negative_example: 'assert result.started_at is not None  # hypothetical: the real clock fed the field, so the test cannot state the value'
  - id: TEST-011.Q05
    statement: Generated ids are injected anywhere their output reaches a result field, so a test asserts literal ids.
    kind: judgment
    na_when: The code under test has no generated id that reaches a result field.
    positive_example: 'assert result.run_id == "run-1"  # hypothetical: the test supplied the id source, so it states the literal'
    negative_example: 'assert len(result.run_id) == 32  # hypothetical: the id was generated internally, so the test can only check its shape'
  - id: TEST-011.Q06
    statement: Every wait on an operating system event with no virtual equivalent, such as a process group reaped after SIGKILL, is done through a shared harness helper owning the poll interval and deadline, with no open-coded poll loop.
    kind: judgment
    na_when: The change waits on no operating system event.
    positive_example: 'assert wait_pid_dead(child_pid) is True  # harness helper owns the poll interval (hypothetical: today _wait_pid_dead is private to tests/engine/executors/test_process_group.py, not a shared helper in tests/harness/)'
    negative_example: "while not (pid_dir / 'child.pid').exists():\n    threading.Event().wait(0.05)  # hypothetical: poll loop written inside the test module"
  - id: TEST-011.Q07
    statement: Every test that spawns a process registers it with the harness process registry, so a failing test cannot leak a process group.
    kind: judgment
    na_when: The change adds or edits no test that spawns a process.
    positive_example: 'process_registry.register(proc, pgid=pgid)  # ProcessRegistry in src/dovo/common/process.py; stream_isolated_process registers its child this way'
    negative_example: 'subprocess.Popen([sys.executable, "-c", script])  # hypothetical: spawned in a test and never registered, so a failure leaves it running'
  citation: docs/agents/testing.md#determinism--process-isolation-strategy
- id: TEST-012
  title: Rich Render Width Pinning
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  intent: Rendered-output tests must give the same result on every machine and keep failing only when a real contract changes, not when layout, terminal size or wording shifts.
  criteria:
  - id: TEST-012.Q01
    statement: Every capture of rendered Rich output in a test is made through render_rich from tests/harness/formatter.py.
    kind: judgment
    na_when: The test does not capture rendered Rich output.
    positive_example: 'rendered = render_rich(LoopLifecycleFormatter().to_rich(CONDITIONS_EVALUATED.data))  # in tests/cli/ui/formatters/events/test_loop.py'
    negative_example: 'console = Console(record=True); console.print(panel); rendered = console.export_text()  # hypothetical: hand-built console instead of render_rich'
  - id: TEST-012.Q02
    statement: The console width used for a rendered assertion is the pinned width of 160, with no other width passed to render_rich.
    kind: judgment
    na_when: The test does not capture rendered Rich output.
    positive_example: 'rendered = render_rich(formatter.to_rich(data))  # in tests/harness/formatter.py; the default width=160 applies'
    negative_example: 'rendered = render_rich(formatter.to_rich(data), width=80)  # hypothetical: width other than 160'
  - id: TEST-012.Q03
    statement: The test avoids relying on the ambient terminal size and on in-process os.environ["COLUMNS"] mutations.
    kind: judgment
    na_when: The test does not capture rendered Rich output.
    positive_example: 'render_rich(renderable)  # width is set explicitly on the Console, independent of the terminal'
    negative_example: 'os.environ["COLUMNS"] = "120"; rendered = Console(record=True)...  # hypothetical: width taken from the environment or ambient terminal'
  - id: TEST-012.Q04
    statement: Every render assertion checks a semantic value carried by the view model, such as an identifier, count or status token, rather than a panel title, field caption, border glyph, padding or prose sentence.
    kind: judgment
    na_when: The test makes no assertion on rendered output, or is a CLI runner test under tests/cli/ that TEST-017 governs.
    positive_example: 'rendered = render_rich(formatter.to_rich(data)); assert "wf_abcdef12" in rendered  # hypothetical: a view value, not a caption'
    negative_example: 'assert "Session ID" in rendered  # hypothetical: a panel caption, changes with layout and pins no contract'
  citation: docs/agents/testing.md#rich-render-assertions
- id: TEST-013
  title: No Sole Consumer Tests
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: src/, tests/harness/, tests/
  intent: Code exists to serve real behavior, so nothing stays alive only because a test exercises it. Unused production or harness code is deleted together with its test, not kept and verified.
  criteria:
  - id: TEST-013.Q01
    statement: Every touched production function has a real caller in src/, so that deleting its tests would not leave it unreachable.
    kind: judgment
    na_when: The change touches no production function in src/.
    positive_example: 'A function in src/ called by another production module, with tests that exercise it through that caller (hypothetical example)'
    negative_example: 'A function in src/ whose only caller is its own unit test; the function is dead, so the function and the test are both deleted (hypothetical example)'
  - id: TEST-013.Q02
    statement: Every harness symbol (builder method, fixture or assertion helper) has at least one caller outside tests/harness/.
    kind: judgment
    na_when: The change adds or touches no symbol under tests/harness/.
    positive_example: 'WorkspaceBuilder.with_git() in tests/harness/builders/workspace.py, called by tests/cli/session/conftest.py and other domain tests'
    negative_example: 'A builder method called only by its own test in tests/harness/test_builders.py (hypothetical; delete the method rather than test it)'
  - id: TEST-013.Q03
    statement: Harness behavior is proven through the first domain test that needs it, rather than through a harness verification suite that exhaustively permutes options no domain test uses.
    kind: judgment
    na_when: The change adds or touches no harness verification test.
    positive_example: 'A new builder option is introduced together with the domain test that needs it, and that test is what proves it works (hypothetical example)'
    negative_example: 'A new parametrized case in tests/harness/test_builders.py for a builder option that no domain test calls (hypothetical example)'
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-014
  title: Strict Typing on Test Helpers and Fixtures
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  intent: Test helpers and fixtures are code that every test leans on, so they are typed as tightly as production code and a wrong call is caught by the type checker instead of surfacing as a confusing test failure.
  criteria:
  - id: TEST-014.Q01
    statement: Every test helper and fixture function is free of missing type annotations.
    kind: judgment
    na_when: The change adds or modifies no test helper or fixture function.
    positive_example: 'def workspace_paths_factory() -> Callable[[Path, Path | None], WorkspacePaths]: ...  # fixture in tests/conftest.py'
    negative_example: 'def make_session(db, session_id): ...  # hypothetical: helper with no parameter or return annotations'
  - id: TEST-014.Q02
    statement: Fixtures declare a real return type rather than Any.
    kind: judgment
    na_when: The change adds or modifies no fixture.
    positive_example: 'def isolated_workspace(tmp_path: Path) -> Path: ...  # fixture in tests/conftest.py'
    negative_example: 'def db_fixture() -> Any: ...  # hypothetical: fixture whose return type says nothing about what it yields'
  - id: TEST-014.Q03
    statement: Helper parameters are typed against the types production code passes, such as DovoDb or SessionRecord, rather than Any.
    kind: judgment
    na_when: The change adds or modifies no test helper that takes parameters.
    positive_example: 'def create_test_session(db: DovoDb, session_id: str) -> SessionRecord: ...  # hypothetical helper; DovoDb and SessionRecord exist in dovo.core.db'
    negative_example: 'def create_test_session(db: Any, mock_obj: MagicMock) -> Any: ...  # hypothetical: untyped db parameter and a mock in the signature'
  - id: TEST-014.Q04
    statement: MagicMock is absent from the signatures of test helpers and fixtures, both their parameters and their return types.
    kind: judgment
    na_when: The change adds or modifies no test helper or fixture function.
    positive_example: 'def build_workspace(root: Path) -> WorkspacePaths: ...  # hypothetical helper taking and returning real types'
    negative_example: 'def build_workspace(root: MagicMock) -> MagicMock: ...  # hypothetical: mock type used in the signature'
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-015
  title: Orchestration Path Test Coverage
  severity: WARNING
  category: Testing
  domain: tests
  scope: tests/cli/, tests/engine/
  intent: Changes to command routing and multi-step dispatch are verified end to end, so a regression in an orchestration branch is caught by a test instead of reaching users.
  criteria:
  - id: TEST-015.Q01
    statement: A test exercises the updated execution branch of every modified command routing or multi-step orchestration path.
    kind: judgment
    na_when: The change modifies no command routing and no multi-step orchestration or dispatch workflow.
    positive_example: 'class SessionResumeCliIntegrationTests: def test_resume_cli_from_paused_state_completes_remaining_steps_exits_zero(self, ...): ...  # in tests/cli/session/test_session_resume.py, covering the resume path'
    negative_example: '# hypothetical: a change to Engine.resume() in engine/engine.py that skips steps already completed, merged with no test that resumes a paused run and checks the remaining steps execute'
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-016
  title: Public Function Happy and Unhappy Path Coverage
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/
  intent: A public function's contract includes how it succeeds and how it fails, so both outcomes are tested directly. Private helpers are verified only through their public callers.
  criteria:
  - id: TEST-016.Q01
    statement: Every public function or method (no leading underscore) in a changed production module has at least one test of a valid input producing the expected successful outcome, in its corresponding test file per TEST-002.
    kind: judgment
    na_when: The change adds or modifies no public function or method in a production module.
    positive_example: 'def test_load_returns_validated_state_when_projection_matches(self, tmp_path: Path) -> None  # in tests/engine/test_state_store.py, covering SessionStateStore.load'
    negative_example: 'SessionStateStore.regenerate_projection() is added to src/dovo/engine/state_store.py with no test calling it (hypothetical: the real method is covered by test_regenerate_projection_writes_payload_json_and_returns_path)'
  - id: TEST-016.Q02
    statement: Every public function or method in a changed production module has, in its TEST-002 test file, at least one test of an invalid input, missing dependency, boundary or failure state producing the expected error or non-ok outcome.
    kind: judgment
    na_when: The member is a property with no branching logic beyond a single field return, or a dunder method with no domain validation (such as a __init__ that neither coerces nor rejects values), or the change touches no public function or method.
    positive_example: 'def test_save_stale_revision_returns_conflict_and_leaves_row_and_projection(self, tmp_path: Path) -> None  # in tests/engine/test_state_store.py, covering SessionStateStore.save'
    negative_example: 'Only test_save_loaded_state_persists_next_revision_in_row_and_projection exists for save() (hypothetical: the real suite also has stale-revision, missing-row and projection-failure tests), so no failure path is covered'
  - id: TEST-016.Q03
    statement: Private functions and methods (leading underscore) are covered only as byproducts of their public callers, with no dedicated test method targeting them.
    kind: judgment
    na_when: The change adds or modifies no test.
    positive_example: 'SessionStateStore._classify_write_failure has no dedicated test; it is reached through the public save() and initialize() by tests such as test_save_stale_revision_returns_conflict_and_leaves_row_and_projection and test_save_missing_row_returns_not_found; the coverage gate (CI-001) checks that private paths are reached'
    negative_example: 'def test__classify_write_failure(self): ...  # hypothetical: dedicated test calling a private method directly'
  - id: TEST-016.Q04
    statement: The independent failure modes of a public method are covered by TEST-006 parameterization, with a separate test method per failure mode used only when the fixture requirements diverge.
    kind: judgment
    na_when: No public method in the change has more than one independent failure mode.
    positive_example: 'One @pytest.mark.parametrize test over several invalid inputs (hypothetical), the failure modes sharing the same fixture'
    negative_example: 'Three near-identical test methods, one per invalid input, all built from the same fixture (hypothetical)'
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-017
  title: CLI Runner Assertion Boundary
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/cli/
  intent: CLI runner tests pin wiring and observable behavior, not help prose. They may assert a literal status line or rendered string of the command's own output.
  criteria:
  - id: TEST-017.Q01
    statement: The CLI runner tests under tests/cli/ avoid asserting help text wording in stdout or rendered output.
    kind: judgment
    na_when: The change adds or modifies no CLI runner test that asserts against stdout or rendered output.
    positive_example: "assert result.exit_code == 0\nassert \"Status: valid with warnings\" in result.stdout  # a literal status line of the command's own output, not help text; from tests/cli/config/test_config_validate.py"
    negative_example: 'assert "Show the current configuration value" in result.output  # hypothetical help text wording; assert Click metadata instead'
  - id: TEST-017.Q02
    statement: A CLI test that checks command registration or option names reads them from Click metadata rather than from rendered help output.
    kind: judgment
    na_when: The change adds or modifies no CLI test that checks command registration or option names.
    positive_example: 'root_callbacks = {command.name: command.callback for command in app.registered_commands}  # from tests/cli/test_cli.py'
    negative_example: 'assert "--format" in result.stdout  # hypothetical: option name checked by scanning --help output'
  citation: docs/agents/testing.md#core-testing-rules
- id: TEST-018
  title: Test Layer Import Boundary
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/core/
  intent: A core test proves the domain layer's contract independent of any presentation concern. Importing the CLI package from a core test leaks a presentation dependency into the domain suite, or shows the test belongs under tests/cli/ instead.
  criteria:
  - id: TEST-018.Q01
    statement: The files under tests/core/ import nothing from dovo.cli or any submodule of it.
    kind: mechanical
    enforced_by: tests/lint/test_import_boundaries.py
    positive_example: 'from dovo.core.worktree.worktree import Worktree  # in tests/core/worktree/test_worktree.py'
    negative_example: 'from dovo.cli.worktree.commands.worktree_prune import worktree_prune_command  # hypothetical: a CLI import in tests/core/worktree/test_services.py'
  citation: docs/agents/testing.md#11-source-parity-layout
- id: TEST-019
  title: Command Result DTO Spy Scope for CLI Integration Tests
  severity: BLOCKER
  category: Testing
  domain: tests
  scope: tests/cli/
  intent: Result assertions in CLI integration tests stay a genuine contract check on the command's own output, while the real formatting and rendering path keeps running so rendering regressions still surface.
  criteria:
  - id: TEST-019.Q01
    statement: Every dispatch spy used in a *CliIntegrationTests suite calls through to the real ui_dispatcher.dispatch, instead of replacing it with a stub.
    kind: judgment
    na_when: The change adds or edits no use of a dispatch spy under tests/cli/.
    positive_example: 'The dispatch_spy fixture in tests/cli/conftest.py appends each DTO to a list and then calls original_dispatch(data, **kwargs), so a test may pin the exact DTO beyond what the --format json payload proves'
    negative_example: 'monkeypatch.setattr(ui_dispatcher, "dispatch", lambda data, **kwargs: None)  # replacement stub; the real formatter never runs (hypothetical)'
  - id: TEST-019.Q02
    statement: Every assertion made against an item captured by the dispatch spy is an assertion on an instance of that command action's own terminal BaseResult type.
    kind: judgment
    na_when: The change adds or edits no use of a dispatch spy under tests/cli/.
    positive_example: 'prune_results = [item for item in dispatch_spy if isinstance(item, ArtifactsPruneResult)]; assert prune_results == [ArtifactsPruneResult(...)]  # compares the DTO''s own fields, a genuine contract comparison rather than a check that dispatch fired'
    negative_example: 'assert isinstance(dispatch_spy[-1], MessageEvent)  # asserting an incidental MessageEvent (or WarningEvent, PromptEvent, lifecycle or progress event) through the result spy'
  - id: TEST-019.Q03
    statement: A spy assertion avoids relying on spy[0], spy[-1] or len(spy) == 1 unless the command action dispatches only its own terminal result per invocation, and otherwise isolates the instance of the command action's own Result type.
    kind: judgment
    na_when: The change adds or edits no spy assertion that reads the spy by position or length.
    positive_example: 'assert len(dispatch_spy) == 1; assert isinstance(dispatch_spy[0], WorktreeCreateResult)  # a command action known to dispatch only its own terminal result may assert the sole captured item directly (the isinstance line is illustrative; test_worktree_create.py reads payload = dispatch_spy[0] directly)'
    negative_example: 'assert isinstance(dispatch_spy[-1], WorktreeCreateResult)  # on a command action that can also dispatch a MessageEvent or WarningEvent, without first filtering for WorktreeCreateResult (hypothetical)'
  citation: docs/agents/testing.md#tier-3---cli-wiring-runner-required-root-tests-when-earned
- id: TEST-020
  title: Test-Layer Docstrings Are Terse Contracts Without Tags
  severity: WARNING
  category: Testing
  domain: tests
  scope: tests/
  intent: Test docstrings stay short and carry only facts the code does not already show, so readers scan names and assertions first and the docstrings never go stale or duplicate the body.
  criteria:
  - id: TEST-020.Q01
    statement: Every test method docstring adds a fact that the test name and assertions do not, such as an exact literal, an ordering contract, or the inputs behind a parametrized case.
    kind: judgment
    na_when: The change adds or modifies no test method docstring under tests/.
    positive_example: 'Hypothetical: """Emit the start event before the first step log line, because the dispatcher streams them in order.""" on a test whose assertions only check that both events were emitted; the ordering contract is a fact the name and assertions do not show.'
    negative_example: 'Hypothetical: """Exit 1 when capacity is exceeded.""" on test_worktree_create_cli_capacity_exceeded_exits_one in tests/cli/worktree/test_worktree_create.py only rewords the test name.'
  - id: TEST-020.Q02
    statement: Every test method docstring is a single sentence.
    kind: judgment
    na_when: The change adds or modifies no test method docstring under tests/.
    positive_example: 'Hypothetical: """Exit 1 with ''Maximum active worktrees reached'' in stdout when 3 worktrees already exist."""'
    negative_example: 'Hypothetical: """Create three worktrees. Then create a fourth and expect exit 1."""  # two sentences'
  - id: TEST-020.Q03
    statement: Every test method docstring opens with an imperative verb.
    kind: judgment
    na_when: The change adds or modifies no test method docstring under tests/.
    positive_example: 'Hypothetical: """Exit 1 with ''Maximum active worktrees reached'' in stdout when 3 worktrees already exist."""'
    negative_example: 'Hypothetical: """This test checks that the command exits 1 when capacity is exceeded."""  # opens with a non-imperative word'
  - id: TEST-020.Q04
    statement: Every test method docstring is free of a `[tier-N/type]` tag.
    kind: judgment
    na_when: The change adds or modifies no test method docstring under tests/.
    positive_example: 'Hypothetical: """Exit 1 with ''Maximum active worktrees reached'' in stdout when 3 worktrees already exist."""  # the tier follows from the file path under tests/cli/'
    negative_example: 'Hypothetical: """[tier-3/integration] Exit 1 with ''Maximum active worktrees reached'' in stdout."""'
  - id: TEST-020.Q05
    statement: Every test method docstring is free of a `<symbol>:` or `dovo <command>:` prefix.
    kind: judgment
    na_when: The change adds or modifies no test method docstring under tests/.
    positive_example: 'Hypothetical: """Exit 1 with ''Maximum active worktrees reached'' in stdout when 3 worktrees already exist."""'
    negative_example: 'Hypothetical: """dovo worktree create: exit 1 with ''Maximum active worktrees reached'' in stdout."""'
  - id: TEST-020.Q06
    statement: Every line of every test method docstring is within 120 columns.
    kind: judgment
    na_when: The change adds or modifies no test method docstring under tests/.
    positive_example: 'Hypothetical: a one-line docstring of 100 characters including indentation and quotes.'
    negative_example: 'Hypothetical: a one-line docstring that runs to 140 columns.'
  - id: TEST-020.Q07
    statement: Every docstring on a non-test unit under tests/ (helper, fixture, test double, class, module) opens with a one-line title.
    kind: judgment
    na_when: The change adds or modifies no docstring on a helper, fixture, test double, class or module under tests/.
    positive_example: '"""Build the registered provider with its winning credential set and a fake finished-stream runner."""  # on _provider_with_fake_runner in tests/core/agents/test_base.py'
    negative_example: 'Hypothetical: a fixture docstring that begins with a multi-line paragraph before any one-line title.'
  - id: TEST-020.Q08
    statement: The title of a non-test unit is free of any outcome clause.
    kind: judgment
    na_when: The change adds or modifies no docstring on a helper, fixture, test double, class or module under tests/.
    positive_example: '"""Build the registered provider with its winning credential set and a fake finished-stream runner."""  # states what the helper does; on _provider_with_fake_runner in tests/core/agents/test_base.py'
    negative_example: 'Hypothetical: """Build a provider, so that the test can assert the run finishes cleanly."""  # carries an outcome clause'
  - id: TEST-020.Q09
    statement: The title of a non-test unit is a single description of the unit rather than a list of steps.
    kind: judgment
    na_when: The change adds or modifies no docstring on a helper, fixture, test double, class or module under tests/.
    positive_example: '"""Build the registered provider with its winning credential set and a fake finished-stream runner."""  # on _provider_with_fake_runner in tests/core/agents/test_base.py'
    negative_example: '"""Give the provider''s winning credential ''test-token'', patch a finished-stream runner, and return both."""  # hypothetical helper docstring: lists steps'
  - id: TEST-020.Q10
    statement: A non-test unit's docstring includes a description beyond its title only to record a hidden contract, a safety behavior, or a non-obvious ordering constraint.
    kind: judgment
    na_when: No docstring on a non-test unit under tests/ is added or modified, or none has a description beyond its title.
    positive_example: 'Hypothetical: a fixture docstring whose second paragraph says the fixture must be requested before the monkeypatched environment, because ordering changes which credential wins.'
    negative_example: 'Hypothetical: a fixture docstring whose second paragraph repeats the title in other words.'
  - id: TEST-020.Q11
    statement: Every docstring on a non-test unit under tests/ is free of text that retells the body.
    kind: judgment
    na_when: The change adds or modifies no docstring on a helper, fixture, test double, class or module under tests/.
    positive_example: 'Hypothetical: """Fake agent runner that replays a canned stdout stream."""'
    negative_example: 'Hypothetical: """Fake agent runner. It reads the canned stdout, splits it by line, and yields each line."""  # retells the body'
  - id: TEST-020.Q12
    statement: Every docstring on a non-test unit under tests/ is free of text that restates parameters, types, or the return annotation.
    kind: judgment
    na_when: The change adds or modifies no docstring on a helper, fixture, test double, class or module under tests/.
    positive_example: 'Hypothetical: """Build a provider wired to a fake finished-stream runner."""  # the signature already shows the arguments and return type'
    negative_example: 'Hypothetical: """Build a provider. Args: token: the provider token. Returns: a tuple of the provider and the runner."""'
  - id: TEST-020.Q13
    statement: Every docstring on a non-test unit under tests/ is free of sentences describing how another module or caller behaves.
    kind: judgment
    na_when: The change adds or modifies no docstring on a helper, fixture, test double, class or module under tests/.
    positive_example: 'Hypothetical: """Fake agent runner that replays a canned stdout stream."""'
    negative_example: 'Hypothetical: """Fake agent runner. The real engine calls it once per step and then parses the stream."""  # describes the engine, not the unit'
  - id: TEST-020.Q14
    statement: Every unit under tests/ carries exactly one docstring, with no bare string statement after it.
    kind: judgment
    na_when: The change adds or modifies no unit with a docstring under tests/.
    positive_example: 'Hypothetical: a helper whose body begins with its docstring and then goes straight to code.'
    negative_example: 'Hypothetical: a helper with a docstring followed by a second bare string literal statement, which is dead code.'
  citation: docs/agents/testing.md#naming-conventions
- id: DOC-001
  title: Architecture Doc Structural Gate
  severity: BLOCKER
  category: Documentation
  domain: all
  scope: docs/agents/architecture.md
  intent: The architecture doc stays a short, trustworthy map of how the code is laid out, so readers find structure there and never have to dig it out from feature narrative or churn from refactors.
  criteria:
  - id: DOC-001.Q01
    statement: The diff to docs/agents/architecture.md modifies only structure sections (the layers tree and the package boundaries).
    kind: judgment
    na_when: The change does not touch docs/agents/architecture.md.
    positive_example: '# Hypothetical: adding a core/prune/ line to the layers tree under "## Layers" in architecture.md'
    negative_example: '# Hypothetical: adding a new section to architecture.md that explains how pruning picks which sessions to remove'
  - id: DOC-001.Q02
    statement: Each structure-section edit to docs/agents/architecture.md is made because a package was added, removed or moved, domain ownership changed, or an import boundary changed.
    kind: judgment
    na_when: The change does not touch docs/agents/architecture.md.
    positive_example: '# Hypothetical: a new core/prune/ package is added and the layers tree gains a core/prune/ entry'
    negative_example: '# Hypothetical: a pure refactor splits one module into two inside core/artifacts/ and architecture.md is edited to match'
  - id: DOC-001.Q03
    statement: The diff to docs/agents/architecture.md is free of feature behavior essays.
    kind: judgment
    na_when: The change does not touch docs/agents/architecture.md.
    positive_example: '# Hypothetical: a one-line layers-tree entry "prune/   Session artifact pruning" for a new package'
    negative_example: '# Hypothetical: 100 lines of narrative prose explaining pruning heuristics in architecture.md'
  - id: DOC-001.Q04
    statement: Each new import boundary described in docs/agents/architecture.md also has a row in LAYER_RULES in tests/lint/test_layer_direction.py.
    kind: judgment
    na_when: The change adds no new import boundary.
    positive_example: '# Hypothetical: a new boundary "prune/ imports nothing from engine/" is added to the package boundaries section and as a new entry in LAYER_RULES'
    negative_example: '# Hypothetical: the package boundaries section gains a new boundary but LAYER_RULES in tests/lint/test_layer_direction.py is left unchanged'
  citation: docs/agents/documentation.md
- id: DOC-002
  title: User-Visible Behavior Documentation Scope
  severity: BLOCKER
  category: Documentation
  domain: cli
  scope: docs/cli/, docs/agents/architecture.md, src/dovo/cli/
  intent: Users look up commands, subcommands and flags in one place, so the reference for user-visible CLI behavior lives with the per-command docs and stays out of the architecture overview.
  criteria:
  - id: DOC-002.Q01
    statement: Every new or changed CLI subcommand, option or user-visible behavior is documented in the matching docs/cli/<command>.md.
    kind: judgment
    na_when: The change adds or alters no user-visible CLI subcommand, option or behavior.
    positive_example: '# Adding a row for a new --auto-apply style flag to the options table in docs/cli/run.md (the flag is real, the change is illustrative)'
    negative_example: '# Hypothetical: a new flag is added to dovo run, and docs/cli/run.md is left unchanged'
  - id: DOC-002.Q02
    statement: User-visible CLI behavior, subcommand and flag documentation is kept out of docs/agents/architecture.md.
    kind: judgment
    na_when: The change does not touch docs/agents/architecture.md.
    positive_example: '# Hypothetical: architecture.md only gains a layers-tree entry for a new package, and the flag description goes to docs/cli/run.md'
    negative_example: '# Hypothetical: documenting a user CLI flag such as a new --keep-on-failure option inside docs/agents/architecture.md'
  citation: docs/agents/documentation.md
- id: DOC-003
  title: Schema and Entity Documentation Gate
  severity: BLOCKER
  category: Documentation
  domain: all
  scope: docs/agents/schemas.md
  intent: schemas.md records only the cross-cutting contracts that span the codebase, so it stays short and accurate instead
    of becoming a second copy of entity definitions that the source already holds.
  criteria:
  - id: DOC-003.Q01
    statement: Every edit to docs/agents/schemas.md follows a change to a cross-cutting contract (config tier merge rules, path ownership, persistence authority, secrets handling, or catalog or database scoping).
    kind: judgment
    na_when: The change does not edit docs/agents/schemas.md.
    positive_example: '# Updating schemas.md because a config key switched from replace to union merge across tiers (hypothetical). A change that only adds or changes config keys, blueprint fields, DTOs, enum members, exceptions, entrypoint methods or commands needs no schemas.md edit and correctly leaves it untouched.'
    negative_example: '# Editing schemas.md for a change that alters no cross-cutting contract, such as reflowing a section while adding a new config key (hypothetical)'
  - id: DOC-003.Q02
    statement: The edits to schemas.md are free of added field lists, enum members, exception names and method lists.
    kind: judgment
    na_when: The change does not edit docs/agents/schemas.md.
    positive_example: '# A schemas.md edit that states how config tiers merge, with no list of keys or fields (hypothetical)'
    negative_example: '# Listing a new Result model''s fields, a new enum''s members or a new exception''s name in schemas.md (hypothetical)'
  citation: docs/agents/documentation.md
- id: DOC-004
  title: Ban on Duplicating Source in Docs
  severity: SUGGESTION
  category: Documentation
  domain: all
  scope: docs/agents/
  intent: Docs do not restate what the source already says unambiguously, so a model change cannot leave a stale copy behind
    and readers are sent to the one place that is always correct.
  criteria:
  - id: DOC-004.Q01
    statement: The docs avoid hand-copying Pydantic model signatures, field tables or enum lists that a read of the source already gives unambiguously.
    kind: judgment
    positive_example: See [`WorktreeSession`](src/dovo/core/worktree/models.py). Worktrees live under .dovo/worktrees/.
    negative_example: '| Field | Type | Default |

      | session_id | str | required |  (a table copying the fields of WorktreeSession)'
  - id: DOC-004.Q02
    statement: Every doc that refers to a specific Pydantic model links to the file that defines it.
    kind: judgment
    na_when: The doc does not refer to any specific Pydantic model.
    positive_example: See [`WorktreeSession`](src/dovo/core/worktree/models.py).
    negative_example: 'WorktreeSession carries the session id and its paths.  (names the model with no link to src/dovo/core/worktree/models.py; hypothetical sentence)'
  - id: DOC-004.Q03
    statement: A doc that describes a model adds only behavior the source does not express, such as validators or resolution order, rather than field lists or enum members copied without added context.
    kind: judgment
    na_when: The doc does not describe any model.
    positive_example: 'Worktrees live under .dovo/worktrees/.  (a placement fact beside the model link, not a copy of its fields)'
    negative_example: 'A bullet list of every member of an enum, pasted from the source with no note on when each applies (hypothetical doc text)'
  citation: docs/agents/documentation.md
- id: DOC-005
  title: Unavoidable Spec Tables Require Parity Tests
  severity: BLOCKER
  category: Documentation
  domain: tests
  scope: tests/lint/, docs/
  intent: A specification table that cannot be avoided must not drift from the source it describes, so an automated test that exists when the claim is made keeps the two in agreement.
  criteria:
  - id: DOC-005.Q01
    statement: Every unavoidable field table (the specification for an external JSON Schema or a stable CLI output format) has an automated test under tests/lint/ that fails when the table and the source disagree.
    kind: judgment
    na_when: The change adds or edits no field table that specifies an external JSON Schema or a stable CLI output format.
    positive_example: 'docs/reference/step-schema.md has a field table and states it is pinned to the models by tests/lint/test_step_schema_parity.py, which exists in the tree'
    negative_example: 'A hypothetical field table of a stable CLI output format is added to docs/ and no test under tests/lint/ compares it with the source'
  - id: DOC-005.Q02
    statement: The parity test was already in the tree when the doc claim landed.
    kind: judgment
    na_when: The change adds no doc claim that relies on a parity test.
    positive_example: 'The commit that adds a doc sentence naming tests/lint/test_config_schema_parity.py also adds that file, or the file already exists'
    negative_example: 'A doc sentence names a parity test as a follow-up to be written later (hypothetical), so the claim lands before the test'
  - id: DOC-005.Q03
    statement: The doc names the parity test by a path that resolves to a file in the tree.
    kind: judgment
    na_when: The change adds or edits no doc claim that names a parity test.
    positive_example: 'docs/agents/schemas.md names tests/lint/test_config_schema_parity.py, and that file exists'
    negative_example: '"enforced by tests/lint/test_doc_parity.py" where that module is nowhere in the tree (it does not exist today)'
  citation: docs/agents/documentation.md
- id: DOC-006
  title: Prefer Deletion Over Accretion
  severity: SUGGESTION
  category: Documentation
  domain: all
  scope: docs/
  intent: Docs stay a single consistent source of truth, so a reader never has to guess which of two conflicting statements is
    current.
  criteria:
  - id: DOC-006.Q01
    statement: Every doc edit that changes a statement replaces or deletes the stale text instead of appending a new bullet beside it.
    kind: judgment
    na_when: The doc edit adds only statements that no existing text in docs/ covers.
    positive_example: 'Hypothetical edit: a bullet citing the removed formatters.py is replaced by one citing cli/ui/formatters/ (a package that exists in src/dovo/cli/ui/)'
    negative_example: 'Hypothetical edit: a new bullet citing cli/ui/formatters/ is appended while the old bullet citing formatters.py stays'
  - id: DOC-006.Q02
    statement: Every statement the change adds or edits is free of contradiction with other statements in docs/ about the same rule or fact, found by searching docs/ for what it names.
    kind: judgment
    na_when: The change adds or edits no doc statement.
    positive_example: 'Hypothetical: an edit states formatters live in cli/ui/formatters/; searching docs/ for "formatters" finds no other doc naming a different location'
    negative_example: 'Hypothetical: an edit states formatters live in cli/ui/formatters/; searching docs/ for "formatters" finds another doc still saying they live in formatters.py'
  citation: docs/agents/documentation.md
- id: DOC-007
  title: Canonical Terminology Invariant
  severity: SUGGESTION
  category: Documentation
  domain: all
  scope: docs/, src/
  intent: Docs and code comments name the core concepts the same way everywhere, so a reader never has to guess whether two words mean one thing or one word means two.
  criteria:
  - id: DOC-007.Q01
    statement: Doc prose and every code comment name Blueprint, Step, Loop step, Catalog, Run, Session, Worktree and Checkpoint concepts by the term the Terminology table in docs/agents/architecture.md defines, rather than by a term the table does not define.
    kind: judgment
    na_when: The change adds or edits no doc prose and no code comment that refers to these concepts.
    positive_example: '''A blueprint containing a loop step.'''
    negative_example: '''A workflow containing a repeat block.''  # hypothetical: the table defines blueprint and loop step, not workflow or repeat block'
  - id: DOC-007.Q02
    statement: Doc prose and every code comment use each defined term only within its stated meaning in the Terminology table.
    kind: judgment
    na_when: The change adds or edits no doc prose and no code comment that uses a defined term.
    positive_example: '''A run executes the blueprint and leaves a session behind.''  # the run is the act of executing; the session is what it leaves behind'
    negative_example: '''A session executes the blueprint.''  # the act of executing is a run; the session is what it leaves behind'
  citation: docs/agents/architecture.md#terminology
- id: DOC-008
  title: Verifiable Doc and Rule Claims
  severity: BLOCKER
  category: Documentation
  domain: all
  scope: AGENTS.md, docs/, .agents/skills/, docs/agents/rules_spec.yaml, src/ docstrings
  intent: Readers act on what docs, skills, rules and docstrings say, so every claim must be true and checkable today. False or aspirational statements mislead them, and an example is copied more often than the rule is read.
  criteria:
  - id: DOC-008.Q01
    statement: Every doc, skill, rule or docstring sentence that asserts something is enforced, gated or checked names the enforcing artifact by path.
    kind: judgment
    na_when: The change adds or edits no sentence claiming that something is enforced, gated or checked.
    positive_example: '# "COLUMNS is pinned to 160 by [tool.pytest_env] in pyproject.toml" - names the enforcing file, and [tool.pytest_env] there sets COLUMNS = "160"'
    negative_example: '# "Command output width is always pinned in tests." (hypothetical sentence) - claims enforcement and names no artifact'
  - id: DOC-008.Q02
    statement: Every path named as an enforcing artifact, or in a "see <path>" claim, resolves to a file in the tree.
    kind: judgment
    na_when: The change adds or edits no sentence that names a path as an enforcing artifact or a reference.
    positive_example: '# "enforced by tests/lint/test_layer_direction.py" - that file exists in the tree'
    negative_example: '# "enforced by tests/lint/test_doc_parity.py" (hypothetical sentence) - no such file exists under tests/lint/'
  - id: DOC-008.Q03
    statement: Every helper, fixture, builder or assertion function that a doc instructs an implementer to use exists in the tree before the instruction ships.
    kind: judgment
    na_when: The change adds or edits no doc instruction that tells an implementer to use a named helper, fixture, builder or assertion function.
    positive_example: '# "Acquire the lock with WorkspaceLock" - WorkspaceLock is defined in src/dovo/common/lock.py'
    negative_example: '# "Build the input with make_session_fixture()" (hypothetical) - no function of that name is defined anywhere in the tree'
  - id: DOC-008.Q04
    statement: The change documents only behavior that is already built, in prose and in rule examples alike.
    kind: judgment
    na_when: The change adds or edits no documentation, rule text or rule example describing behavior.
    positive_example: '# A rule example that cites core/artifacts/services/prune.py, which exists and does what the example says'
    negative_example: '# A paragraph describing a "dovo sync --all" flag (hypothetical) that is planned but absent from the CLI'
  - id: DOC-008.Q05
    statement: The change deletes or corrects, rather than leaves as aspiration, every doc, skill or rule sentence that it makes false.
    kind: judgment
    na_when: The change makes no existing doc, skill or rule claim false.
    positive_example: '# A change that removes a CLI flag also deletes the sentence in docs/cli/ that described it (hypothetical change)'
    negative_example: '# A change that removes a CLI flag leaves its docs sentence behind with "to be restored later" (hypothetical change)'
  - id: DOC-008.Q06
    statement: Every docstring of a function whose behavior the change alters, or that appears in the diff, is free of sentences the new code makes false.
    kind: judgment
    na_when: The change alters the behavior of no function that has a docstring and adds or edits no docstring.
    positive_example: '# A change makes a function raise on empty input and its docstring "returns an empty list" sentence is updated in the same diff (hypothetical)'
    negative_example: '# A change makes a function raise on empty input but its docstring still says "returns an empty list" (hypothetical)'
  citation: docs/agents/documentation.md
- id: CI-001
  title: Pre-Commit Quality Suite Gate
  severity: BLOCKER
  category: CI/Tooling
  domain: all
  scope: Whole repository
  intent: Every commit passes the full quality gate, and the coverage floor stays a regression backstop, never loosened or chased. A drop from deleting duplicated or dead tests is a success.
  criteria:
  - id: CI-001.Q01
    statement: '`dovo run quality` has passed (ruff format, ruff check, basedpyright src tests --level error with zero errors, mkdocs build --strict, complexity at or under 10 on changed files, and the test suite meeting the coverage floor) before the commit.'
    kind: judgment
    positive_example: uv run ruff format . && uv run dovo run quality
    negative_example: 'git commit after only running a scoped `uv run dovo run tests --path tests/core/` (hypothetical: the full quality gate was never run)'
  - id: CI-001.Q02
    statement: The fail_under value in pyproject.toml under [tool.coverage.report] is greater than or equal to its previous committed value.
    kind: judgment
    na_when: The change does not touch pyproject.toml.
    positive_example: '# fail_under raised from 80 to 82 under [tool.coverage.report] in pyproject.toml in the same change (hypothetical numbers)'
    negative_example: '# fail_under lowered from 80 to 75 so a commit can pass (hypothetical)'
  - id: CI-001.Q03
    statement: The stated justification for each added test is a reason other than raising the coverage percentage.
    kind: judgment
    na_when: The change adds no tests.
    positive_example: 'A new test asserting a public result contract, with a PR description that names the contract'
    negative_example: '# tests added purely to reach a percentage, with a PR description that says "bump coverage to 85%" (hypothetical)'
  citation: AGENTS.md#essential-commands
- id: CI-002
  title: Git and Pull Request Attribution Hygiene
  severity: BLOCKER
  category: CI/Tooling
  domain: all
  scope: Git commits & PRs
  intent: Commit history and pull requests describe the change in the author's own words and stay focused, so they carry no
    tool attribution and each pull request can be reviewed as one concern.
  criteria:
  - id: CI-002.Q01
    statement: 'The commit title starts with a semantic prefix of the form type(scope) or type, followed by a colon, as in "docs(rules): ..." in the commit history.'
    kind: judgment
    positive_example: 'feat(worktree): add prune subcommand for stale worktrees (hypothetical message; the dovo worktree prune command exists)'
    negative_example: 'Updated stuff and fixed things (hypothetical message)'
  - id: CI-002.Q02
    statement: The commit title is written in the imperative mood.
    kind: judgment
    positive_example: 'feat(worktree): add prune subcommand (hypothetical message)'
    negative_example: 'feat(worktree): added prune subcommand (hypothetical message)'
  - id: CI-002.Q03
    statement: 'The commit message is free of AI trailers such as "Co-authored-by: Cursor".'
    kind: judgment
    positive_example: 'feat: prune worktrees, with a body that ends after the description and has no trailer lines (hypothetical message)'
    negative_example: "feat: prune worktrees\n\nCo-authored-by: Cursor <cursor@cursor.sh>  (hypothetical message)"
  - id: CI-002.Q04
    statement: The pull request description is free of AI or tool attribution lines.
    kind: judgment
    na_when: The change is not submitted as a pull request.
    positive_example: 'A PR description whose last line is the Linkage entry "Closes #123" (hypothetical description)'
    negative_example: 'A PR description ending in a "Generated with <tool>" attribution line (hypothetical description)'
  - id: CI-002.Q05
    statement: The pull request addresses a single responsibility.
    kind: judgment
    na_when: The change is not submitted as a pull request.
    positive_example: 'One PR that adds the worktree prune subcommand and its tests (hypothetical PR)'
    negative_example: 'One PR that adds a subcommand and also fixes an unrelated config-loading bug (hypothetical PR)'
  - id: CI-002.Q06
    statement: The pull request description has a Why section of 2-3 sentences giving the context and motivation.
    kind: judgment
    na_when: The change is not submitted as a pull request.
    positive_example: 'A "Why" section of two sentences explaining the problem and why it matters now (hypothetical description)'
    negative_example: 'A description with no Why section, or a Why section of a full page of history (hypothetical description)'
  - id: CI-002.Q07
    statement: The pull request description has an Approach section made of bullets of 1-2 sentences each.
    kind: judgment
    na_when: The change is not submitted as a pull request.
    positive_example: 'An "Approach" section with three bullets, each one or two sentences (hypothetical description)'
    negative_example: 'An "Approach" section written as one long unbroken paragraph (hypothetical description)'
  - id: CI-002.Q08
    statement: 'The pull request description has a Linkage section with an issue cross-reference such as Fixes #N or Closes #N, or a statement that no tracking issue exists.'
    kind: judgment
    na_when: The change is not submitted as a pull request.
    positive_example: 'A "Linkage" section reading "Closes #123", or "Fixes: none (no tracking issue)" (hypothetical description)'
    negative_example: 'A description with no Linkage section (hypothetical description)'
  citation: docs/agents/git-and-pr-conventions.md
- id: CI-003
  title: Agentic Process State Declaration
  severity: WARNING
  category: CI/Tooling
  domain: all
  scope: Agent interactions
  intent: Reviewers can tell what an agent is about to change and which project rule it is following, so each action is announced before it is taken.
  criteria:
  - id: CI-003.Q01
    statement: The agent states the specific directive or doc governing an action before executing commands or editing files.
    kind: judgment
    na_when: The agent turn runs no commands and edits no files.
    positive_example: 'Governing directive: docs/agents/testing.md'
    negative_example: 'Running write_to_file without stating the governing directive (hypothetical agent turn)'
  - id: CI-003.Q02
    statement: The agent states the target scope of an action, such as a specific test package or module, before executing commands or editing files.
    kind: judgment
    na_when: The agent turn runs no commands and edits no files.
    positive_example: 'Target scope: tests/core/worktree/test_worktree.py'
    negative_example: 'Running write_to_file without stating the target scope (hypothetical agent turn)'
  citation: AGENTS.md#agentic-process
- id: CI-004
  title: Mechanical Enforcement Parity
  severity: BLOCKER
  category: CI/Tooling
  domain: all
  scope: tests/lint/, prek.toml, .github/workflows/, pyproject.toml, docs/agents/rules_spec.yaml
  intent: A BLOCKER rule that can be checked by a machine is actually checked by one, so a declared gate cannot silently stop protecting the codebase and an allowlist cannot quietly grow.
  criteria:
  - id: CI-004.Q01
    statement: Every BLOCKER rule that can be checked mechanically has an executing check (an invariant test under tests/lint/, a prek hook or a CI step) or an explicit review-only classification.
    kind: judgment
    na_when: The change adds or alters no BLOCKER rule and removes no enforcing check.
    positive_example: 'ARCH-001 is enforced by tests/lint/test_layer_direction.py, which runs in the test suite'
    negative_example: 'A new BLOCKER rule about import order is added to rules_spec.yaml with no test, hook or CI step behind it (hypothetical)'
  - id: CI-004.Q02
    statement: Every declared gate is configured so that it can fail, with no setting that disables it, such as a coverage floor of zero or a type checker present in no hook and no workflow.
    kind: judgment
    na_when: The change touches no gate configuration in prek.toml, .github/workflows/ or pyproject.toml.
    positive_example: 'fail_under = 80 in pyproject.toml, so the coverage gate fails below 80 percent'
    negative_example: 'fail_under = 0 in pyproject.toml (hypothetical): the coverage gate is declared but can never fail'
  - id: CI-004.Q03
    statement: A gate whose configuration disables it is either wired up or downgraded to a review-time WARNING, rather than left declared as an enforced BLOCKER.
    kind: judgment
    na_when: No declared gate is found to be disabled.
    positive_example: 'A type-check step missing from every hook and workflow is added to .github/workflows/ci.yml, or its rule is downgraded to WARNING (hypothetical)'
    negative_example: 'basedpyright is declared as a BLOCKER gate but appears in no hook and no workflow, and the rule stays BLOCKER (hypothetical)'
  - id: CI-004.Q04
    statement: Every invariant check includes a regression test shaped like the code it polices, such as assertions inside a *Tests class rather than a module-level function.
    kind: judgment
    na_when: The change adds or alters no invariant check under tests/lint/.
    positive_example: 'ImportBoundariesTests.test_unexpected_entries_flags_subpackage_and_ignores_pycache in tests/lint/test_import_boundaries.py builds a sample directory in tmp_path with a stray subpackage and module, then asserts _unexpected_entries flags exactly those entries'
    negative_example: 'A scanner walks only tree.body functions, so test methods inside a *Tests class are never inspected (hypothetical)'
  - id: CI-004.Q05
    statement: An invariant check that lands green carries an explicit burn-down allowlist of known violators, rather than being merged red or left disabled.
    kind: judgment
    na_when: The invariant check lands with no existing violators.
    positive_example: 'LAYER_EXCEPTIONS in tests/lint/test_layer_direction.py lists the known allowed violations, so the check passes today'
    negative_example: 'A new invariant is added with known violators and is skipped or marked xfail instead of carrying an allowlist (hypothetical)'
  - id: CI-004.Q06
    statement: Every allowlist of known violators has only shrunk, with no entry added.
    kind: judgment
    na_when: The change touches no allowlist.
    positive_example: 'test_layer_exception_still_occurs in tests/lint/test_layer_direction.py fails when an allowlisted violation is fixed, forcing its entry to be deleted from LAYER_EXCEPTIONS'
    negative_example: 'A new tuple is added to LAYER_EXCEPTIONS to make a fresh upward import pass (hypothetical)'
  citation: docs/agents/ci-and-tooling.md
planner_rules:
- id: PLAN-001
  title: Read-Only Planning Discipline
  category: Planning
  phase: Reset & Prereqs
  scope: Agent session & filesystem
  requirement: While planning, the agent is strictly read-only. Never edit src/ or tests/, never run tests or tooling (dovo
    run tests, dovo run quality, pytest, ruff, basedpyright), and never commit, push, or touch PR state. Read-only git and gh commands
    are the only commands permitted.
  deliverable_contract: No source files edited. The plan document in .agentic/plan.md is the entire deliverable.
  validation_check: Verify git status after planning shows only .agentic/plan.md created.
  positive_example: '# Agent reads files and gh issues, then writes only to .agentic/plan.md

    '
  negative_example: '# Agent runs `dovo run tests` or edits `src/dovo/cli/app.py` while planning

    '
  citation: docs/agents/planning.md#planning-before-implementation
- id: PLAN-002
  title: Workspace Reset and State Isolation
  category: Planning
  phase: Reset & Prereqs
  scope: .agentic/ directory
  requirement: >-
    Before anything else, clear the previous cycle's artifacts so a stale review, plan, or master plan can never
    be read as current: `rm -rf .agentic && mkdir -p .agentic`. Use -rf and remove the directory itself; `rm -f`
    on a directory exits non-zero and short-circuits the chained mkdir, leaving every stale artifact in place
    while appearing to have reset. Per-file removal is insufficient because it leaves master-plan.md behind.
  deliverable_contract: An empty .agentic/ directory prior to writing the new plan.
  validation_check: >-
    Check that .agentic/ contains no plan.md, master-plan.md, review.md, or review.json when a new plan is
    generated.
  positive_example: 'rm -rf .agentic && mkdir -p .agentic'
  negative_example: 'rm -f .agentic && mkdir -p .agentic  # fails on a directory, mkdir never runs, nothing is cleared'
  citation: .agents/skills/dovo-plan/SKILL.md#1-discovery-and-boundary-auditing
- id: PLAN-003
  title: Verbatim Contract Extraction
  category: Planning
  phase: Contract Extraction
  scope: '## Contract section in .agentic/plan.md'
  requirement: Extract the contract from the issue body without summarizing. Copy every FR-* and NFR-* verbatim with its ID.
    Paraphrasing requirements is strictly prohibited.
  deliverable_contract: Section '## Contract' containing exact FR/NFR IDs and verbatim requirement text.
  validation_check: Diff issue text against plan contract section. Flag any dropped clause or paraphrase.
  positive_example: '## Contract

    - **FR-1**: Add `dovo worktree prune` command to remove unreferenced worktrees.

    - **FR-2**: Prune operation must delete worktree branches matching `dovo/dovo_*`.

    '
  negative_example: '## Contract

    We will implement worktree pruning for stale directories.

    '
  citation: docs/agents/planning.md#step-1-extract-the-contract-from-the-issue
- id: PLAN-004
  title: Normative Pre-Determined Data Preservation
  category: Planning
  phase: Contract Extraction
  scope: '## Contract section in .agentic/plan.md'
  requirement: Copy Pre-determined data exactly from the issue. Field names, types, defaults, file paths, constants, error
    codes, and template bodies stated there are normative. You may not invent, rename, or 'improve' them.
  deliverable_contract: Pre-determined data reproduced identically under '## Contract'.
  validation_check: Verify all field names, types, and defaults in code samples match the issue's Pre-determined data.
  positive_example: '### Pre-determined data

    - Model: `WorktreePruneResult`

    - Field: `pruned_items: list[str] = []`

    - Exit code on error: `1`

    '
  negative_example: '# Plan renames `pruned_items` to `deleted_worktrees` because it sounds "better"

    '
  citation: docs/agents/planning.md#step-1-extract-the-contract-from-the-issue
- id: PLAN-005
  title: Out-of-Scope Guardrails
  category: Planning
  phase: Contract Extraction
  scope: '### Out of scope section in .agentic/plan.md'
  requirement: Copy Out of scope verbatim from the issue into the plan's guardrail section. Treat it as a strict stop sign,
    not a hint.
  deliverable_contract: Subsection '### Out of scope (verbatim from the issue)' containing exact bullet points.
  validation_check: Verify that all items marked out of scope are explicitly listed and omitted from artifact inventory.
  positive_example: '### Out of scope (verbatim from the issue)

    - Interactive confirmation prompt before pruning

    - Pruning worktrees on remote git repositories

    '
  negative_example: '# Omitting Out of scope section or planning an interactive confirmation prompt

    '
  citation: docs/agents/planning.md#step-1-extract-the-contract-from-the-issue
- id: PLAN-006
  title: Greenfield Architecture Default
  category: Planning
  phase: Contract Extraction
  scope: Entire plan
  requirement: Plan zero compatibility shims, aliases, dual code paths, or deprecation windows unless the issue explicitly
    states a compatibility constraint. Plan to replace superseded paths and update callers in the same change set.
  deliverable_contract: Direct replacements planned; zero shims or legacy fallback adapters in artifact inventory.
  validation_check: Check artifact inventory for compatibility wrappers or fallback flags.
  positive_example: '# Plan directly replaces WorktreeService.delete() with unified lifecycle pruner

    '
  negative_example: '# Plan introduces `LegacyWorktreeService` and adds deprecation warning shims

    '
  citation: docs/agents/planning.md#step-1-extract-the-contract-from-the-issue
- id: PLAN-007
  title: Tree Grounding and Neighbor Mirroring
  category: Planning
  phase: Grounding & Traps
  scope: '## Ground truth section in .agentic/plan.md'
  requirement: 'Never plan from memory: read live domain source and name the closest existing implementation to mirror with
    exact file:line citations. In the ground-truth table, write at most one clause per cell. Reproduce a mirrored symbol''s
    shape as signature + docstring only, never its full body.'
  deliverable_contract: 'Ground-truth table with columns | Surface | Location | What exists | (one clause per cell), plus explicit ''Pattern
    to mirror: <path:line>'', with any reproduced symbol shown as signature + docstring only.'
  validation_check: Verify cited file:line citations exist and match cited functionality; flag any quoted body, helper
    internals, or file dump beyond a signature and docstring.
  positive_example: '## Ground truth

    | Surface | Location | What exists |

    | CLI app | `src/dovo/cli/worktree/app.py:24` | Typer app registering worktree subcommands |

    | Lifecycle | `src/dovo/core/worktree/services/lifecycle.py:80` | `delete_worktree` method |


    **Pattern to mirror:** `src/dovo/cli/config/commands/config_set.py:30`

    ```python

    def config_set_command(context: CliContext, key: str, value: str) -> ConfigSetResult:
    """Set a single config key and persist it to the active scope."""

    ```

    '
  negative_example: '# Plan pastes the full 40-line body of config_set_command instead of its signature + docstring

    '
  citation: docs/agents/planning.md#step-2-ground-yourself-in-the-current-code
- id: PLAN-008
  title: Trap Identification and Isolation
  category: Planning
  phase: Grounding & Traps
  scope: '## Current state section in .agentic/plan.md'
  requirement: 'Explicitly name every trap a lower-context implementer could fall into: dead code, similarly-named-but-unrelated
    symbols, duplicate implementations, or stale docs. Mark each explicitly out of scope.'
  deliverable_contract: Subsection '**Traps (explicitly not touched):**' naming specific symbols and paths.
  validation_check: Verify known hazards (e.g. similarly-named-but-unrelated modules across sibling packages) are trapped
    when touched.
  positive_example: '**Traps (explicitly not touched):**

    - Stale doc claim in `schemas.md` §4 mentioning `renderers.py`: Do not create `renderers.py`.

    '
  negative_example: '# Plan fails to warn implementer about known naming collision or dead code

    '
  citation: docs/agents/planning.md#step-2-ground-yourself-in-the-current-code
- id: PLAN-009
  title: Complete Artifact Inventory and Deletion Ledger
  category: Planning
  phase: Artifact Inventory
  scope: '## Artifact inventory section in .agentic/plan.md'
  requirement: >-
    Produce an inventory (Artifact | Kind | Path | New or changed | Requirement), one row per touched file, writing
    'none' explicitly for every untouched kind. Follow it with a deletion ledger (Path or symbol | Why it goes |
    Replaced by) covering superseded paths (COMPAT-003), duplicate tests (TEST-004), and dead harness symbols
    (TEST-013), executed in the same change set — or state 'Deletes nothing: greenfield'.
  deliverable_contract: >-
    Markdown inventory table followed by 'Not needed for this issue: <kinds>', then a deletion ledger table or
    the explicit 'Deletes nothing: greenfield' line.
  validation_check: >-
    Check every touched file maps to a requirement, every unused artifact kind is listed under 'Not needed', and
    the deletion ledger has rows or the explicit greenfield line.
  positive_example: |
    ## Deletion ledger
    | Path or symbol | Why it goes | Replaced by |
    | `tests/cli/config/test_config_show.py::ConfigShowRootTests` | pass-through handler restating a domain contract | `tests/core/config/test_loader.py` |
  negative_example: '# Inventory lists 9 new files and says nothing about what they supersede'
  citation: docs/agents/planning.md#step-3-enumerate-every-artifact
- id: PLAN-010
  title: Literal Final Code for Contracts
  category: Planning
  phase: Specification & Samples
  scope: '### Code section in .agentic/plan.md'
  requirement: 'Write literal, production-ready code for anything that is a contract: models with model_config, enum definitions,
    function/method signatures with full type hints and docstrings, Typer argument/option declarations, exact JSON dicts,
    and error/warning strings.'
  deliverable_contract: Fully typed models, signatures, and literal dictionaries in code blocks.
  validation_check: Verify contract code blocks leave no ambiguous types, missing defaults, or unspecified flags.
  positive_example: "```python\nclass WorktreePruneStatus(StrEnum):\n    OK = \"ok\"\n    NOTHING_TO_PRUNE = \"nothing_to_prune\"\
    \n    FAILED = \"failed\"\n\nclass WorktreePruneResult(BaseResult):\n    model_config = {\"extra\": \"forbid\", \"strict\"\
    : True}\n    status: WorktreePruneStatus\n    pruned_items: list[str] = []\n```\n"
  negative_example: "```python\n# Plan writes vague sketch:\nclass WorktreePruneResult:\n    # fields for status and pruned\
    \ items\n    pass\n```\n"
  citation: docs/agents/planning.md#code-sample-rules
- id: PLAN-011
  title: Signature Plus Intent Docstring for Production Stubs
  category: Planning
  phase: Specification & Samples
  scope: '### Code section in .agentic/plan.md'
  requirement: 'Write only a real signature and a one-line docstring stating intent for every planned production
    function, ending with `raise NotImplementedError`. No numbered steps, no body code — the docstring says what the
    function does, not how, and adds nothing beyond what the signature and name don''t already say.'
  deliverable_contract: 'Signature + one-line intent docstring + `raise NotImplementedError` — no steps, no body.'
  validation_check: 'Flag any production stub with numbered steps, setup comments, or body code beyond the docstring,
    and any docstring that narrates implementation steps instead of stating intent.'
  positive_example: "```python\ndef prune_worktrees(db: WorktreesRepository, cwd: Path) -> WorktreePruneResult:\n    \"\"\"Delete unreferenced worktrees and branches under cwd.\"\"\"\n    raise NotImplementedError\n```\n"
  negative_example: "```python\ndef prune_worktrees(db: WorktreesRepository, cwd: Path) -> WorktreePruneResult:\n    \"\"\"Prune worktrees.\n\n    1. Query active worktrees from db\n    2. Diff against on-disk worktrees\n    3. Delete unreferenced ones\n    \"\"\"\n    raise NotImplementedError\n```\n"
  citation: docs/agents/planning.md#code-sample-rules
- id: PLAN-018
  title: Test Stubs with Imperative Contract Docstrings
  category: Planning
  phase: Specification & Samples
  scope: '### Tests section in .agentic/plan.md'
  requirement: 'Write a signature and, where the test name does not already say it, a single-line imperative contract docstring for every
    planned test stub, ending with `raise NotImplementedError`. The docstring states the exact outcome contract asserted and does not
    repeat the public symbol, which the class and test name carry; the execution tier follows from the test file path
    (docs/agents/testing.md#the-four-execution-tiers). The `### Tests` table acts as a concise summary index.'
  deliverable_contract: 'Signature + single-line imperative docstring with the outcome contract (when the name does not say it) + `raise NotImplementedError`.'
  validation_check: 'Flag any test stub whose docstring is not imperative, repeats its test name without adding a contract, carries a tier/type tag, or contains numbered steps/body code.'
  positive_example: |
    ### Tests

    | Test | Outcome |
    |---|---|
    | `WorktreeCreateCliIntegrationTests::test_create_cli_capacity_exceeded_exits_one` | exit 1; capacity exceeded error |

    ```python
    class WorktreeCreateCliIntegrationTests:
        def test_create_cli_capacity_exceeded_exits_one(
            self, cli_runner: CliRunner, worktree_workspace: Path
        ) -> None:
            """Exit 1 with 'Maximum active worktrees reached' in stdout when 3 worktrees already exist."""
            raise NotImplementedError
    ```
  negative_example: |
    # Test stub with a tier tag, a symbol prefix and a non-imperative, non-specific contract
    def test_create_cli_capacity_exceeded_exits_one(self, cli_runner, worktree_workspace):
        """[tier-3/integration] dovo worktree create: verifies create fails when capacity exceeded."""
        raise NotImplementedError
  citation: docs/agents/planning.md#code-sample-rules
- id: PLAN-012
  title: Pre-Decomposed Complexity
  category: Planning
  phase: Specification & Samples
  scope: '### Code section in .agentic/plan.md'
  requirement: Decompose complex workflows into named helper functions in the plan itself so that every planned function holds
    cognitive complexity <= 10.
  deliverable_contract: Multiple focused function signatures with single responsibilities rather than one large function.
  validation_check: Verify no single planned function contains more than 3 branching levels or complex nested loops.
  positive_example: 'def prune_stale_records(db: WorktreesRepository) -> list[str]: ...

    def prune_orphaned_directories(worktrees_dir: Path) -> list[str]: ...

    def prune_worktrees(...) -> WorktreePruneResult: ...

    '
  negative_example: '# Single 80-line function planned to do querying, directory diffing, git branch deleting, and error handling

    '
  citation: docs/agents/planning.md#step-3-enumerate-every-artifact
- id: PLAN-014
  title: Flagging Unspecified Decisions with 🚨
  category: Planning
  phase: Cross-Cutting & Validation
  scope: '### Decisions & ## Cross-cutting in .agentic/plan.md'
  requirement: 'When an issue leaves a detail genuinely unspecified, do not stall or invent product behavior: choose the option
    consistent with nearest neighbor patterns, record the choice and rejected alternative, and append 🚨 so human reviewers
    catch it.'
  deliverable_contract: 'Decision bullet: - **<point>:** <choice>, because <reason>. Rejected: <alt>. 🚨.'
  validation_check: Verify all unspecified assumptions are flagged with 🚨 in the plan and restated in the agent handoff message.
  positive_example: '- **Prune branch deletion policy:** Delete local branches matching `dovo/dovo_*` automatically,
    because active worktrees track branches 1:1. Rejected: prompt user for each branch. 🚨

    '
  negative_example: '# Silent design choice made without recording alternative or flagging with 🚨

    '
  citation: docs/agents/planning.md#step-1-extract-the-contract-from-the-issue
- id: PLAN-015
  title: Plan Target Path and Human Handoff Protocol
  category: Planning
  phase: Self-Check & Handoff
  scope: Deliverable file & Chat response
  requirement: 'Write the plan to .agentic/plan.md. Run the 9-item self-check before handing off. In chat, report the path,
    a one-paragraph summary, all 🚨 decisions and open questions, and state plainly that this was planning only: nothing was
    implemented, tested, committed, or pushed. Stop and wait for human review.'
  deliverable_contract: File written to .agentic/plan.md. Agent turn terminates without executing implementation commands.
  validation_check: Ensure the agent does not immediately proceed to invoke /dovo-code or edit production files.
  positive_example: '"Plan saved to .agentic/plan.md. Planning only; nothing was implemented or committed.

    Open decisions requiring confirmation:

    - 🚨 Prune branch deletion policy: auto-delete dovo/dovo_* branches."

    '
  negative_example: '"Plan written. Now I will start writing the code..."

    '
  citation: docs/agents/planning.md#step-5-save-and-hand-off
- id: PLAN-016
  title: Pre-Handoff Checklist Compliance Sweep
  category: Planning
  phase: Pre-Handoff Self-Audit
  scope: Entire .agentic/plan.md, checked before saving
  requirement: 'Before finalizing .agentic/plan.md, sweep docs/agents/REVIEW_CHECKLIST.json for every rule matching the
    touched paths or domains and verify the plan itself satisfies every applicable BLOCKER clause — reread the actual
    planned imports, paths, and stubs against each clause, not a restatement of the rule. Fix any violation in the plan
    before saving. This is a save gate, not a written report: no compliance table belongs in .agentic/plan.md.'
  deliverable_contract: 'Zero BLOCKER-severity violations in the saved plan. No Rule Evaluation Matrix or other
    compliance table in .agentic/plan.md — the plan''s own content is the evidence.'
  validation_check: 'Re-derive which REVIEW_CHECKLIST.json rules match the touched paths and spot-check the saved plan
    against each BLOCKER clause directly (e.g. reread Phase 2 imports for ARCH-001, reread ledger paths for TEST-002).
    Flag anything the agent could only justify by restating the rule rather than pointing at the plan''s own text.'
  positive_example: 'Before saving, reread the Phase 2 service stub and confirmed it imports only from common/ and
    core/worktree/ (ARCH-001), and reread the ledger path against the TEST-002 mapping — no BLOCKER violated, plan
    saved with no compliance table.'
  negative_example: '# Plan asserts "Complies with ARCH-001, TEST-002" without rereading the actual planned imports or
    paths'
  citation: docs/agents/planning.md#step-5-save-and-hand-off
- id: PLAN-017
  title: Test Ticket Scope Contract
  category: Planning
  phase: Test Strategy
  scope: Any issue whose deliverable is test files
  requirement: >-
    A ticket delivering tests must declare, before implementation, the exact test file paths per the TEST-002
    mapping, a line budget of 100–250 with a split plan if exceeded, and the rule IDs it's graded against. A list
    of test method names without paths is not a specification.
  deliverable_contract: >-
    In scope lists one bullet per test file (path + estimated lines + contracts asserted); Definition of Done
    cites the graded rule IDs and names what's deliberately not covered here.
  validation_check: >-
    Every declared path resolves under the TEST-002 mapping for its source module, and the summed line
    estimate stays within budget or carries a split plan.
  positive_example: |
    ### In scope
    - `tests/core/bootstrap/test_initialize.py` (~120 lines): preflight failure modes,
      zero-side-effect abort, idempotent rerun
    - `tests/cli/init/test_init.py` (~90 lines): runner exit codes, `--format json` payload, `--force`

    ### Rules
    TEST-002, TEST-004, TEST-017
  negative_example: |
    ### In scope
    - Create tests for init covering the happy path and some failure cases
    - Add CLI tests for every action with RootTests and CliIntegrationTests
