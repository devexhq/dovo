name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      COLUMNS: "160"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          # The quality blueprint diffs against origin/main to find changed files.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python Environment
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run quality gates
        # Format, lint, typecheck, docs build, complexity and tests with coverage
        # (fail_under=80 in pyproject.toml [tool.coverage.report]).
        run: uv run dovo run quality --no-tty

  prek:
    name: Prek
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python Environment
        run: uv python install 3.13

      - name: Run prek
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uvx prek run --from-ref "origin/${GITHUB_BASE_REF}" --to-ref HEAD
          else
            uvx prek run --all-files
          fi

  e2e:
    name: E2E tests
    # Drives the installed `dovo` binary against real fixture repositories, so
    # the terminal and JSON contracts the suite pins change only with a pull
    # request that updates it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COLUMNS: "160"
      PYTHONIOENCODING: "utf-8"
      # fixtures.lock pins an SSH URL; the runner has no SSH key, and the
      # fixture repository is public, so clone it over HTTPS instead.
      DOVO_E2E_FIXTURES_DIR: "https://github.com/devexhq/dovo-e2e-fixtures.git"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python Environment
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run E2E tests
        # Serial (-n 0): the session fixture holds an exclusive lock on
        # /tmp/dovo-e2e.lock, so pytest-xdist workers would collide.
        run: uv run pytest e2e -n 0 --durations=15

  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [prek, test, e2e]
    if: ${{ always() }}
    steps:
      - name: Check upstream job results
        run: |
          echo "prek result: ${{ needs.prek.result }}"
          echo "test result: ${{ needs.test.result }}"
          echo "e2e result: ${{ needs.e2e.result }}"
          if [ "${{ needs.prek.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "CI Gate failed because at least one dependency failed."
            exit 1
          fi
