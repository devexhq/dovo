name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      COLUMNS: "160"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          # The quality blueprint diffs against origin/main to find changed files.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python Environment
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run quality gates
        # Format, lint, typecheck, docs build, complexity and tests with coverage
        # (fail_under=80 in pyproject.toml [tool.coverage.report]).
        run: uv run dovo run quality --no-tty

  prek:
    name: Prek
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python Environment
        run: uv python install 3.13

      - name: Run prek
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uvx prek run --from-ref "origin/${GITHUB_BASE_REF}" --to-ref HEAD
          else
            uvx prek run --all-files
          fi

  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [prek, test]
    if: ${{ always() }}
    steps:
      - name: Check upstream job results
        run: |
          echo "prek result: ${{ needs.prek.result }}"
          echo "test result: ${{ needs.test.result }}"
          if [ "${{ needs.prek.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "CI Gate failed because at least one dependency failed."
            exit 1
          fi
