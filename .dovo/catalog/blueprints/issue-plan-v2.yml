# The in-development v2 of `issue-plan.yml`, run on sdlc v2's prompts and
# scripts (`.dovo/catalog/prompts/sdlc/v2/VERSION.json`). Never run it on an
# issue a v1 run touches: v2 keeps the work plan in a comment v1 never reads.
#
# Forked from `ready-issue.yml` and `feature-dev.yml` at `944de0ce`.
# Temporary: an experimental copy for the slice flow, which replaces
# ready-issue's use before planning, feature-dev and the dovo-* skills once it
# works. Compare fixes to either source against this copy and carry them over.
version: 1
name: issue-plan-v2
id: issue-plan-v2
description: Ready a GitHub issue (rewrite a legacy issue to the short format once a person approves the draft, keeping the old description in a comment, then check it against main, holding for a person and re-checking it while it is not ready, and, once a person approves, label it dovo:ready), slice it into PRs with the sdlc v2 issue-plan prompt (the feature contract and the slice table, each slice with the outcomes it delivers, on an epic, one slice on a plain issue, and no phases), challenge the plan once and fold in every fold-routed challenge, settle every open question as a decision, check that each outcome belongs to one slice, and when the plan has one slice phase it in the same run (plan, review, answer and break down the slice, as issue-code-v2 would), walk the approver through it and ask for one approval, then post the plans' decisions to the issue and write the feature contract and the work plan into the issue's work plan comment, recording a one-slice plan as phased, creating no sub-issues, and label the issue type:epic when it has two or more slices, each of which its own issue-code-v2 run phases just in time
summary: Issue to an approved work plan comment on the ticket, with human gates

inputs:
  issue:
    type: string
    description: GitHub issue number to plan
    required: true
    aliases: ["-i", "--issue"]

steps:
  # --- The rewrite of a legacy issue, one written before the short format
  # (no `## Outcomes` section), the first time it is planned: a draft, a
  # person's approval, then the old description kept in a comment and the
  # description replaced, so only a short issue reaches the ready check. A step
  # cannot be skipped, so on a short issue each passes straight through: the
  # draft writes nothing, no prompt is shown and the apply changes nothing. ---

  # Records the description the draft rewrites, so the apply refuses one a
  # person edited meanwhile.
  - id: rewrite-format
    name: Check whether the issue is in the short format
    run: |
      set -eu
      mkdir -p .agentic
      rm -f .agentic/issue-rewrite*
      uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py issue-format --issue ${{ inputs.issue }} >> "$DOVO_OUTPUT"
    timeout_seconds: 120

  - id: rewrite-draft
    name: Draft the legacy issue's rewrite
    type: agent
    prompt: |
      Issue ${{ inputs.issue }}'s format: {{ steps.rewrite-format.outputs.format }}.

      If it is short, write nothing and stop. Otherwise follow the rewrite mode of
      .dovo/catalog/prompts/sdlc/v2/issue-write.md for issue ${{ inputs.issue }}: write the draft to
      .agentic/issue-rewrite.md and its mapping to .agentic/issue-rewrite-notes.md. Do not edit the
      issue, its labels or its comments.
    tools: { allow_all: true }
    timeout_seconds: 1800

  # Shows the mapping above the draft in one file, the only kind a prompt
  # shows, and offers the one option that approves the rewrite, or none on a
  # short issue.
  - id: rewrite-gate
    name: List the rewrite for approval
    run: |
      set -eu
      if [ "{{ steps.rewrite-format.outputs.format }}" = "short" ]; then
        echo "Issue ${{ inputs.issue }} is in the short format; nothing to rewrite." | tee .agentic/issue-rewrite-review.md
        printf '{"approve": []}\n' > .agentic/issue-rewrite-approve.json
        exit 0
      fi
      for draft in .agentic/issue-rewrite.md .agentic/issue-rewrite-notes.md; do
        [ -s "$draft" ] || { echo "Issue ${{ inputs.issue }} is legacy but $draft is missing or empty; not rewriting."; exit 1; }
      done
      { cat .agentic/issue-rewrite-notes.md; printf '\n## Proposed description\n\n'; cat .agentic/issue-rewrite.md; } > .agentic/issue-rewrite-review.md
      printf '{"approve": [{"id": "approve", "label": "Keep the old description in a comment and replace it with the draft"}]}\n' > .agentic/issue-rewrite-approve.json
    timeout_seconds: 120
    artifacts:
      - { name: issue-rewrite, path: .agentic/issue-rewrite-review.md }
      - { name: issue-rewrite-approve, path: .agentic/issue-rewrite-approve.json }

  # No prompt is shown on a short issue.
  - id: rewrite-approve
    name: Approve the legacy issue's rewrite
    type: ask
    interaction:
      mode: multiselect
      message: >-
        Issue ${{ inputs.issue }} was written before the short issue format. The attached file maps
        each item of its description onto the proposed one below it. Select approve to post the old
        description as a collapsed comment and replace it with the draft; select nothing to stop the
        run with the issue untouched.
      artifact: issue-rewrite
      options_from:
        artifact: issue-rewrite-approve
        file: .agentic/issue-rewrite-approve.json
        items_path: approve
        value_field: id
        label_field: label

  # A command step: the writes to GitHub run exactly as approved, with the
  # host's gh credentials. rewrite-apply posts the old description before it
  # replaces it, so a failed edit loses nothing.
  - id: rewrite-apply
    name: Replace the legacy issue's description with the rewrite
    run: |
      set -eu
      if [ "{{ steps.rewrite-format.outputs.format }}" = "short" ]; then
        echo "Issue ${{ inputs.issue }} is in the short format; nothing to rewrite."
        exit 0
      fi
      case '{{ steps.rewrite-approve.outputs.selected }}' in
        *'"approve"'*) ;;
        *) echo "The rewrite was not approved; issue ${{ inputs.issue }} is left untouched."; exit 1 ;;
      esac
      uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py rewrite-apply --issue ${{ inputs.issue }} --body-file .agentic/issue-rewrite.md --body-sha "{{ steps.rewrite-format.outputs.body_sha }}"
    timeout_seconds: 300

  # --- ready-issue's steps, inlined: a blueprint cannot call another one. ---

  # A not_ready issue needs a person: a size label, a split, a decision or a
  # closed blocker, which no edit here can supply. Rather than failing, the run
  # holds at a prompt that lists the findings, so the person settles them on
  # GitHub and answers (or leaves the run paused and continues it later with
  # `dovo resume`). The loop then re-runs the check, since the gate reads the
  # verdict the check wrote, and ends once the verdict is ready.
  - id: ready-loop
    name: Check the issue until no person needs to settle it
    type: loop
    max_iterations: 5
    until:
      # Workaround for #1141: a failed settled is recorded as ignored with exit
      # code 0, so only its status shows the failure. Revert to
      # `steps.settled.exit_code == 0` when #1141 lands.
      - steps.settled.status == "completed"
    on_max_iterations: prompt_user
    do:
      # The session's own worktree, so moving it loses nothing: each check
      # grounds against main as it is now, including a blocker merged while
      # the run was held.
      - id: base
        name: Check out origin/main
        run: git fetch -q origin main && git switch -q --detach origin/main
        timeout_seconds: 120

      - id: check
        name: Check the issue
        type: agent
        prompt: |
          Follow .dovo/catalog/prompts/sdlc/v2/issue-ready.md for issue ${{ inputs.issue }}, the issue issue-plan-v2 is about to slice. Write .agentic/issue-ready.md, .agentic/issue-ready.json and
          .agentic/issue-ready-comment.md. Do not edit the issue, its labels or its comments.
          Findings of the previous check a person says they settled, if any: {{ steps.hold.outputs.selected }}
          Their notes: {{ steps.hold.outputs.comment }}
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts:
          - { name: issue-ready, path: ".agentic/issue-*" }

      # Any verdict but ready means the current body is stale, so a label left
      # from an earlier run is removed and never vouches for it; apply adds it
      # back. Lists what a person must settle: every finding of a not_ready
      # verdict, and nothing otherwise.
      - id: gate
        name: List what a person must settle
        run: |
          set -eu
          verdict=$(uv run --quiet python -c 'import json; print(json.load(open(".agentic/issue-ready.json"))["verdict"])')
          echo "Verdict: $verdict"
          echo "verdict=$verdict" >> "$DOVO_OUTPUT"
          if [ "$verdict" != "ready" ]; then
            labels=$(gh issue view ${{ inputs.issue }} --json labels --jq '.labels[].name')
            if printf '%s\n' "$labels" | grep -qx 'dovo:ready'; then
              gh issue edit ${{ inputs.issue }} --remove-label dovo:ready
            fi
          fi
          uv run --quiet python - <<'PY'
          import json
          report = json.load(open(".agentic/issue-ready.json"))
          findings = report["findings"] if report["verdict"] == "not_ready" else []
          holds = [{"id": f["id"], "label": f"{f['id']} ({f['kind']}): {f['summary']} Fix: {f['fix']}"} for f in findings]
          if report["verdict"] == "not_ready" and not holds:
              holds = [{"id": "report", "label": "The check is not_ready but lists no finding; read its report."}]
          json.dump({"holds": holds}, open(".agentic/issue-hold.json", "w"), indent=2)
          PY
          if [ "$verdict" = "not_ready" ]; then cat .agentic/issue-ready.md; fi
        timeout_seconds: 120
        artifacts:
          - { name: issue-hold, path: .agentic/issue-hold.json }
          - { name: issue-ready-report, path: .agentic/issue-ready.md }

      # No prompt is shown when the gate lists nothing.
      - id: hold
        name: Wait for a person to settle the findings
        type: ask
        interaction:
          mode: multiselect
          message: >-
            Issue ${{ inputs.issue }} is not ready to plan, and only a person can settle why: the
            check's findings are listed below, and its report is attached. Settle them on GitHub (a
            size label, a split, a decision, a closed blocker), then select the ones you settled to
            re-check the issue. To stop for now, press Ctrl-C: the run stays paused, and
            `dovo resume` asks again.
          artifact: issue-ready-report
          options_from:
            artifact: issue-hold
            file: .agentic/issue-hold.json
            items_path: holds
            value_field: id
            label_field: label
          comment: { policy: optional, message: "What you changed, for the re-check" }

      # Fails, and so repeats the loop, only when the verdict was not_ready.
      - id: settled
        name: Re-check the issue unless no person was needed
        run: test "{{ steps.gate.outputs.verdict }}" != "not_ready"
        timeout_seconds: 60
        on_failure: continue

  # Denying stops the run with the issue as the rewrite left it.
  - id: approve
    name: Approve the label
    type: ask
    interaction:
      mode: confirm
      message: Label issue ${{ inputs.issue }} dovo:ready?
      artifact: issue-ready

  # A command step: the writes to GitHub run exactly as approved, with the
  # host's gh credentials. The comment records the body_sha of the description
  # the check read, and ready-comment refuses, before the label is added, when
  # the description is no longer that one, so issue-code-v2 skips its ready
  # check only while the description it checked is unchanged.
  - id: apply
    name: Label the issue and comment
    run: |
      set -eu
      verdict=$(uv run --quiet python -c 'import json; print(json.load(open(".agentic/issue-ready.json"))["verdict"])')
      checked=$(uv run --quiet python -c 'import json; print(json.load(open(".agentic/issue-ready.json")).get("body_sha", ""))')
      if [ "$verdict" != "ready" ]; then
        echo "Unexpected verdict '$verdict'; not labelling."
        exit 1
      fi
      uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py ready-comment --issue ${{ inputs.issue }} --comment .agentic/issue-ready-comment.md --body-sha "$checked"
      gh label create dovo:ready --color 0e8a16 --description "Re-grounded against main and ready to plan" --force
      gh issue edit ${{ inputs.issue }} --add-label dovo:ready
    timeout_seconds: 300

  # --- feature-dev's planning half, on the sdlc v2 issue-plan prompts. feature-dev's
  # `ready` check is dropped: the steps above have just labelled the issue.
  # The plan slices the issue and writes no phases: issue-code-v2 phases each
  # slice just in time, after the slices before it have landed, unless the
  # plan has one slice, which this run phases below. ---

  # The decisions earlier planning sessions posted to the issue, read live so
  # the planner neither re-asks a settled question nor misses one the
  # description has since changed under. The plan step's reset of .agentic/
  # keeps this file.
  - id: prior-decisions
    name: Read the decisions earlier planning posted
    run: >-
      uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py prior-decisions
      --issue ${{ inputs.issue }} --out .agentic/prior-decisions.json
    timeout_seconds: 120

  - id: plan
    name: Slice the issue
    type: agent
    prompt: |
      Follow .dovo/catalog/prompts/sdlc/v2/issue-plan.md in the mode `/issue-plan ${{ inputs.issue }}`.
      Read the decisions earlier planning posted to the issue from .agentic/prior-decisions.json.
      List under each slice the outcomes (`O-n`) of the issue it delivers.
      Write the plan to .agentic/plan.md and its open questions, contract and slices to
      .agentic/plan.json, with no phases, then stop; do not implement anything.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  # The issue plan has no phases, files or tests to review: check-questions and
  # check-slices below check its mechanics, and the slice's phases are reviewed
  # when the slice is phased. So the only agent pass over it is the challenge,
  # which asks whether the contract and the slicing are the right design.
  # Challenges routed fold are folded below; those routed ask become open
  # questions, so a human settles every trade-off and issue departure.
  - id: plan-challenge
    name: Challenge the plan's design
    type: agent
    prompt: |
      Follow .dovo/catalog/prompts/sdlc/v2/plan-challenge.md.
      Challenge .agentic/plan.md and write challenges to .agentic/plan-challenge.md and
      .agentic/plan-challenge.json.
      The plan splits the issue into slices, one PR each, listed under slices in
      .agentic/plan.json, and writes no phases: each slice is phased and reviewed later, and is
      not challenged again. Each slice lands on its own, so challenge the contract and how the
      work is sliced and ordered, not phases.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan-challenge, path: .agentic/plan-challenge.md }
      - { name: plan-challenges, path: .agentic/plan-challenge.json }

  - id: fold-challenges
    name: Fold the challenges into the plan
    type: agent
    prompt: |
      If .agentic/plan-challenge.json lists no challenges, change nothing and report that you did
      nothing.
      Otherwise update .agentic/plan.md and .agentic/plan.json:
        - Fold every challenge in .agentic/plan-challenge.json routed "fold" by planning its
          alternative.
        - For every challenge routed "ask", add an open question, or rewrite the one it
          concerns, that keeps the plan's current answer as the assumed answer and lists the
          challenge's alternative under alternatives. End its summary with
          "(assumed: <plan's answer>; challenged: <alternative>; recommended: <assumed |
          challenged | none>)" and cite the challenge id and its evidence in why.
        - Write every open question in the bulleted form of the plan template in
          docs/agents/planning.md, one fact per bullet. On each question a challenge raised, add
          its Challenged, Turns on and Recommended bullets:
            - Re-read the code at every `path:line` the plan and the challenge cite, and the
              issue and its comments, before you weigh them. Base the recommendation only on
              what you confirmed, and drop any evidence that does not hold.
            - Turns on names the one fact or preference the choice depends on, so the human
              can dispute the premise rather than the verdict.
            - Recommend "assumed" or "challenged", or "none" when the choice depends on a
              preference the code cannot settle. Give the strongest point for the side you
              do not recommend. The plan being written against its answer is no reason to
              recommend it.
            - Add a Note for an issue sentence the choice reverses, a follow-up it needs, or
              the test that would pin it.
        - Folding a challenge may make an open question moot, change its assumed answer or raise
          a new one: remove, rewrite or add entries under Open questions to match.
        - Keep .agentic/plan.json in the shape the issue-plan prompt defines
          (`.dovo/catalog/prompts/sdlc/v2/issue-plan.md`), including its contract and slices, and in
          agreement with .agentic/plan.md.
      Do not implement any code, commit or push. Change only .agentic/plan.md and .agentic/plan.json.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  # Asked after the challenges are folded in, so every question reflects them.
  - id: answer-questions
    name: Answer the plan's open questions
    type: ask
    interaction:
      mode: multiselect
      message: Which open questions do you want to answer instead of accepting the plan's assumed answer?
      artifact: plan
      options_from:
        artifact: plan-questions
        file: .agentic/plan.json
        items_path: open_questions
        value_field: id
        label_field: summary
      comment: { policy: optional, message: "Your answers, one per selected question (e.g. OQ-1: show them)" }

  # Always runs its fold, ticked or not: every open question leaves as a
  # decision, settled by the human's answer or by the plan's assumed one.
  - id: fold-answers
    name: Settle the plan's open questions as decisions
    type: agent
    prompt: |
      Follow .dovo/catalog/prompts/sdlc/v2/fold-answers.md.
      Open questions the human ticked: {{ steps.answer-questions.outputs.selected }}
      The human's answers: {{ steps.answer-questions.outputs.comment }}
      The plan slices issue ${{ inputs.issue }} in issue mode.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  # Holds the run before the walkthrough when fold-answers left a question
  # open, such as one ticked with no answer, or wrote a malformed decision;
  # the message names which. A failed session cannot resume, so the person
  # settles it in .agentic/plan.json and retries rather than losing the run.
  - id: check-questions
    name: Check that every open question is settled
    run: uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py check-questions --plan .agentic/plan.json
    timeout_seconds: 120
    on_failure: prompt_user

  # The issue's numbered items with their exact text, read live once the plan
  # is settled: the plan step resets .agentic/, and a legacy issue's rewrite
  # above renumbers them.
  - id: requirements
    name: List the issue's numbered items
    run: >-
      uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py requirements
      --issue ${{ inputs.issue }} --out .agentic/requirements.json
    timeout_seconds: 120

  # Holds the run before the walkthrough when an outcome of the issue belongs
  # to no slice, to two without a split marker or to one slice as parts, or a
  # slice lists an outcome the issue does not have; the message names which. A
  # failed session cannot resume, so the person fixes the slices' outcomes in
  # .agentic/plan.json and .agentic/plan.md and retries rather than losing the
  # run. A retry that passes publishes both files again, so the walkthrough,
  # the approval and the work plan read the fixed plan.
  - id: check-slices
    name: Check that each outcome belongs to one slice
    run: >-
      uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py check-slices
      --plan .agentic/plan.json --requirements .agentic/requirements.json
    timeout_seconds: 120
    on_failure: prompt_user
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  # --- A plan of one slice is phased here, so the issue gets one planning
  # chain and one approval: the slice is planned, reviewed (with no challenge,
  # since the issue plan was just challenged), answered and broken down below,
  # and issue-code-v2 later skips its planning steps for it. A plan of two or
  # more slices stops at the slice table: a step cannot be skipped, so each
  # step below passes straight through when the slice output is empty, and
  # each slice is phased in its own issue-code-v2 run. ---

  # The settled issue plan is kept beside the slice plan, as issue-code-v2
  # keeps the downloaded one: slice planning starts from the copy, the review
  # diffs the contract and slices against it, and its decisions are posted
  # with the slice plan's once both are approved. requirements.json above
  # already lists every item, which is the one slice's share.
  - id: one-slice
    name: Keep the issue plan and name its slice when it has one
    run: |
      set -eu
      cp .agentic/plan.md .agentic/epic-plan.md
      cp .agentic/plan.json .agentic/epic-plan.json
      slice=$(uv run --quiet python -c 'import json; s = json.load(open(".agentic/plan.json"))["slices"]; print(s[0]["id"] if len(s) == 1 else "")')
      echo "slice=$slice" >> "$DOVO_OUTPUT"
      if [ -n "$slice" ]; then echo "One slice, $slice: phasing it in this run."; else echo "Two or more slices: each is phased in its own issue-code-v2 run."; fi
    timeout_seconds: 120

  - id: slice-plan
    name: Phase the one slice
    type: agent
    prompt: |
      The plan's one slice: "{{ steps.one-slice.outputs.slice }}".

      If that is empty, the plan has two or more slices: change nothing and report that you did
      nothing. Otherwise:

      Follow .dovo/catalog/prompts/sdlc/v2/issue-plan.md in the mode `/issue-plan --slice {{ steps.one-slice.outputs.slice }}`.
      Phase slice {{ steps.one-slice.outputs.slice }} of issue ${{ inputs.issue }} from the issue plan this
      run has just settled, in .agentic/epic-plan.md and .agentic/epic-plan.json.
      Read the decisions earlier planning posted to the issue from .agentic/prior-decisions.json.
      Read the issue's numbered items from .agentic/requirements.json, and cite each requirement
      by its id there.
      Write its phases to .agentic/plan.md and .agentic/plan.json, keeping the contract and the
      slices as in the issue plan, then stop; do not implement anything.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  # One review, folded in whole without asking; the human weighs the result at
  # the open questions and the plan approval that follow.
  - id: plan-review
    name: Review the slice's plan
    type: agent
    prompt: |
      The plan's one slice: "{{ steps.one-slice.outputs.slice }}".

      If that is empty, write only .agentic/plan-review.md, containing the one line
      "Two or more slices; each slice's plan is reviewed in its own issue-code-v2 run.", and
      .agentic/plan-review.json, containing {"findings": []}, and stop. Otherwise:

      Follow .dovo/catalog/prompts/sdlc/v2/issue-plan-review.md in the mode `/issue-plan-review --slice {{ steps.one-slice.outputs.slice }}`.
      Review .agentic/plan.md and write findings to .agentic/plan-review.md and
      .agentic/plan-review.json.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan-review, path: .agentic/plan-review.md }
      - { name: plan-findings, path: .agentic/plan-review.json }

  - id: fold-findings
    name: Fold the review findings into the slice's plan
    type: agent
    prompt: |
      If .agentic/plan-review.json lists no findings, change nothing and report that you did
      nothing.
      Otherwise update .agentic/plan.md and .agentic/plan.json:
        - Address every finding in .agentic/plan-review.json, by id, as each one describes.
        - Write every open question in the bulleted form of the plan template in
          docs/agents/planning.md, one fact per bullet.
        - Addressing a finding may make an open question moot, change its assumed answer or
          raise a new one: remove, rewrite or add entries under Open questions to match.
        - Keep .agentic/plan.json in the shape the issue-plan prompt defines for slice mode
          (`.dovo/catalog/prompts/sdlc/v2/issue-plan.md`), and in agreement with .agentic/plan.md. Never
          change its contract or slices, or the plan's Feature contract and Slices sections,
          other than slice {{ steps.one-slice.outputs.slice }}'s phases: a finding that needs
          either changed becomes an open question whose assumed answer keeps them.
      Do not implement any code, commit or push. Change only .agentic/plan.md and .agentic/plan.json.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  # No prompt is shown when the slice plan raises no question, nor for a plan
  # of two or more slices, whose questions were all settled above.
  - id: slice-answer-questions
    name: Answer the slice plan's open questions
    type: ask
    interaction:
      mode: multiselect
      message: Which open questions of the slice's plan do you want to answer instead of accepting the plan's assumed answer?
      artifact: plan
      options_from:
        artifact: plan-questions
        file: .agentic/plan.json
        items_path: open_questions
        value_field: id
        label_field: summary
      comment: { policy: optional, message: "Your answers, one per selected question (e.g. OQ-1: show them)" }

  - id: slice-fold-answers
    name: Settle the slice plan's open questions as decisions
    type: agent
    prompt: |
      The plan's one slice: "{{ steps.one-slice.outputs.slice }}".

      If that is empty, change nothing and report that you did nothing. Otherwise:

      Follow .dovo/catalog/prompts/sdlc/v2/fold-answers.md.
      Open questions the human ticked: {{ steps.slice-answer-questions.outputs.selected }}
      The human's answers: {{ steps.slice-answer-questions.outputs.comment }}
      The plan phases slice {{ steps.one-slice.outputs.slice }} of issue ${{ inputs.issue }}, worked
      on issue ${{ inputs.issue }}.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  - id: slice-check-questions
    name: Check that every open question of the slice's plan is settled
    run: |
      set -eu
      slice="{{ steps.one-slice.outputs.slice }}"
      [ -n "$slice" ] || { echo "Two or more slices; no slice plan to check."; exit 0; }
      uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py check-questions --plan .agentic/plan.json --slice "$slice"
    timeout_seconds: 120
    on_failure: prompt_user

  # As in issue-code-v2: the plan cut into one file per phase, which is all
  # each code-loop agent reads, approved with the plan below. A failed check
  # sends the breakdown round again, with the check's message in
  # .agentic/check-breakdown.log. A plan of two or more slices publishes no
  # phases, so the artifact is optional here.
  - id: breakdown-loop
    name: Break the slice's plan into phase files until they pass the check
    type: loop
    max_iterations: 3
    until:
      # Workaround for #1141: a failed check-breakdown is recorded as ignored
      # with exit code 0, so only its status shows the failure. Revert to
      # `steps.check-breakdown.exit_code == 0` when #1141 lands.
      - steps.check-breakdown.status == "completed"
    on_max_iterations: prompt_user
    do:
      - id: breakdown
        name: Break the slice's plan into phase files
        type: agent
        prompt: |
          The plan's one slice: "{{ steps.one-slice.outputs.slice }}".

          If that is empty, change nothing and report that you did nothing. Otherwise:

          Follow .dovo/catalog/prompts/sdlc/v2/breakdown.md.
          Break slice {{ steps.one-slice.outputs.slice }} of .agentic/plan.md into .agentic/phases/phase-<n>.json,
          quoting requirements from .agentic/requirements.json, the numbered items of issue
          ${{ inputs.issue }}.
          Do not change the plan, implement anything, commit or push.
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts:
          - { name: phases, path: ".agentic/phases/phase-*.json", required: false }

      # Writes .agentic/phases/index.json when the files pass.
      - id: check-breakdown
        name: Check the phase files against the plan and the issue's numbered items
        run: |
          set -eu
          slice="{{ steps.one-slice.outputs.slice }}"
          [ -n "$slice" ] || { echo "Two or more slices; no phase files to check."; exit 0; }
          if uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py check-breakdown --slice "$slice" 2> .agentic/check-breakdown.log; then
            rm -f .agentic/check-breakdown.log
          else
            cat .agentic/check-breakdown.log >&2
            exit 1
          fi
        timeout_seconds: 120
        on_failure: continue

  # Written after every answer is folded in, so it explains the plan being
  # approved. The approval prompt shows it rather than the plan, which is cut
  # at 200 lines there; the full plan stays in the plan artifact.
  - id: plan-walkthrough
    name: Walk through the plan for the approver
    type: agent
    prompt: |
      Follow .dovo/catalog/prompts/sdlc/v2/plan-walkthrough.md.
      Explain .agentic/plan.md to the person approving it and write .agentic/plan-walkthrough.md.
      The plan's one slice: "{{ steps.one-slice.outputs.slice }}".
      When that is empty, the plan splits the issue into slices, one PR each, listed under slices
      in .agentic/plan.json: say what each slice delivers, by the outcomes it lists, and the order
      the slices land in, and that each slice's phases are planned and approved in its own
      issue-code-v2 run.
      Otherwise the issue is one slice, one PR, and .agentic/plan.md phases it, within the issue
      plan in .agentic/epic-plan.md: explain the slice's phases, in slice mode, and the decisions
      of both plans. Explain the breakdown too: the phase files in .agentic/phases/, listed in
      .agentic/phases/index.json, the only files each phase's code agent reads. Say that this is
      the slice's only approval: the issue-code-v2 run that codes it skips planning.
      Do not change the plan, implement anything, commit or push.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan-walkthrough, path: .agentic/plan-walkthrough.md }

  - id: approve-plan
    name: Approve the plan
    type: ask
    interaction:
      mode: confirm
      message: >-
        Approve this plan for issue ${{ inputs.issue }}? The full plan is in the plan artifact, and
        for a plan of one slice, the phase files are in the phases artifact.
      artifact: plan-walkthrough
      comment: { policy: optional, message: Instructions for the implementer }

  # feature-dev hands the approver's instructions straight to its code step;
  # here the code runs in later issue-code-v2 sessions, which read only the plan
  # artifacts, so the instructions go into the plan. Passed through env so the
  # comment is never parsed as shell.
  - id: keep-instructions
    name: Add the approver's instructions to the plan
    run: |
      set -eu
      [ -n "$APPROVER_INSTRUCTIONS" ] || exit 0
      printf '\n## Instructions from the approver\n\n%s\n' "$APPROVER_INSTRUCTIONS" >> .agentic/plan.md
    env:
      APPROVER_INSTRUCTIONS: "{{ steps.approve-plan.outputs.comment }}"
    timeout_seconds: 120
    artifacts:
      - { name: plan, path: .agentic/plan.md }

  # Posted once the plan is approved, so the issue records what was decided; a
  # plan with no decisions posts nothing. The comment carries the description's
  # body_sha that prior-decisions read before planning, so an edit made since
  # then marks these decisions to confirm. A plan of two or more slices posts
  # its decisions under the slice `all`, since issue-mode decisions shape the
  # slicing rather than one slice's phases. A plan of one slice posts the issue
  # plan's decisions, then the slice plan's, each under the slice's id.
  - id: decisions-comment
    name: Post the plan's decisions to the issue
    run: |
      set -eu
      slice="{{ steps.one-slice.outputs.slice }}"
      post() {
        uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py decisions-comment --plan "$1" \
          --prior .agentic/prior-decisions.json --issue ${{ inputs.issue }} --slice "$2" --session "$DOVO_SESSION_ID"
      }
      if [ -z "$slice" ]; then
        post .agentic/plan.json all
      else
        post .agentic/epic-plan.json "$slice"
        post .agentic/plan.json "$slice"
      fi
    timeout_seconds: 120

  # A command step: the work plan comment is written by the script alone, with
  # the host's gh credentials; the issue's description is never written. The
  # plan revision is the latest one this session published, which is the plan
  # after every fold, answer and instruction above. A plan of one slice is
  # rendered from the slice plan, which keeps the issue plan's contract and
  # slices, and records the slice as phased in this session, whose plan and
  # phases artifacts issue-code-v2 then codes from.
  - id: publish-workplan
    name: Write the feature contract and the work plan to the issue's work plan comment
    run: |
      set -eu
      phased=""
      [ -z "{{ steps.one-slice.outputs.slice }}" ] || phased="--phased"
      uv run python .dovo/catalog/scripts/sdlc/v2/workplan.py render --issue ${{ inputs.issue }} \
        --plan .agentic/plan.json --session "$DOVO_SESSION_ID" \
        --revision {{ artifacts.plan.revision }} $phased
    timeout_seconds: 120
    on_failure: prompt_user

  # An issue planned into two or more slices is an epic; a one-slice issue
  # stays plain, and its one PR closes it.
  - id: label-epic
    name: Label the issue type:epic when it has two or more slices
    run: |
      set -eu
      slices=$(uv run --quiet python -c 'import json; print(len(json.load(open(".agentic/plan.json"))["slices"]))')
      if [ "$slices" -ge 2 ]; then
        gh issue edit ${{ inputs.issue }} --add-label type:epic
      else
        echo "One slice; issue ${{ inputs.issue }} stays plain."
      fi
    timeout_seconds: 120
