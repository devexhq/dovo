version: 1
name: feature-dev
id: feature-dev
description: Plan a GitHub issue, review and fold findings until none are picked, answer its open questions, implement it after approval, review and fix until approved, then open a PR and post the final review to it
summary: Issue to reviewed PR with human gates

inputs:
  issue:
    type: string
    description: GitHub issue number to implement
    required: true
    aliases: ["-i", "--issue"]

steps:
  - id: reset
    name: Clear declined plan findings from earlier runs
    run: mkdir -p .agentic && rm -f .agentic/plan-review-declined.json

  - id: plan
    name: Plan the issue
    type: agent
    prompt: |
      /dovo-plan ${{ inputs.issue }}

      Follow .agents/skills/dovo-plan/SKILL.md if the slash command is not recognized.
      Write the plan to .agentic/plan.md and its open questions to .agentic/plan.json, then
      stop; do not implement anything.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  # Review, pick findings and fold them in until a round leaves nothing picked
  # (a review with no findings continues with an empty selection), so the loop
  # exits on a plan the last review saw. Declined findings are recorded so the
  # next round does not raise them again.
  - id: plan-review-loop
    name: Review and fold until no findings are picked
    type: loop
    max_iterations: 5
    until:
      - steps.triage-plan.outputs.selected_count == 0
    on_max_iterations: prompt_user
    do:
      - id: plan-review
        name: Review the plan
        type: agent
        prompt: |
          /dovo-plan-review

          Follow .agents/skills/dovo-plan-review/SKILL.md if the slash command is not recognized.
          Review .agentic/plan.md and write findings to .agentic/plan-review.md and
          .agentic/plan-review.json.
          If .agentic/plan-review-declined.json exists, it lists findings the human declined in
          earlier rounds: do not raise them again unless the plan has changed in a way that
          makes them a new problem.
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts:
          - { name: plan-review, path: .agentic/plan-review.md }
          - { name: plan-findings, path: .agentic/plan-review.json }

      - id: triage-plan
        name: Choose the plan review findings to address
        type: ask
        interaction:
          mode: multiselect
          message: Which plan review findings should be folded into the plan for issue ${{ inputs.issue }}? Pick none to finish the review.
          artifact: plan-review
          options_from:
            artifact: plan-findings
            file: .agentic/plan-review.json
            items_path: findings
            value_field: id
            label_field: summary
          comment: { policy: optional, message: Instructions for folding in the findings }

      - id: fold-findings
        name: Fold the chosen findings into the plan
        type: agent
        prompt: |
          Findings to address: {{ steps.triage-plan.outputs.selected }}
          Instructions for the findings: {{ steps.triage-plan.outputs.comment }}

          If the list is empty, change nothing and report that you did nothing.
          Otherwise:
            - Update .agentic/plan.md and .agentic/plan.json to address each listed finding, by
              id, as described in .agentic/plan-review.json.
            - Addressing a finding may make an open question moot, change its assumed answer
              or raise a new one: remove, rewrite or add entries under Open questions to match.
            - Keep .agentic/plan.json in the shape the dovo-plan skill defines
              (.agents/skills/dovo-plan/SKILL.md) and in agreement with .agentic/plan.md.
            - Append every finding in .agentic/plan-review.json that is not listed to
              .agentic/plan-review-declined.json, a JSON object {"declined": [...]} whose
              entries copy each finding's id and summary; create it if it does not exist.
          Do not implement any code, commit or push. Change only .agentic/plan.md,
          .agentic/plan.json and .agentic/plan-review-declined.json.
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts:
          - { name: plan, path: .agentic/plan.md }
          - { name: plan-questions, path: .agentic/plan.json }

  # Asked only after the review settles, so every question reflects the
  # findings folded in above.
  - id: answer-questions
    name: Answer the plan's open questions
    type: ask
    interaction:
      mode: multiselect
      message: Which open questions do you want to answer instead of accepting the plan's assumed answer?
      artifact: plan
      options_from:
        artifact: plan-questions
        file: .agentic/plan.json
        items_path: open_questions
        value_field: id
        label_field: summary
      comment: { policy: optional, message: "Your answers, one per selected question (e.g. OQ-1: show them)" }

  - id: fold-answers
    name: Fold the answers into the plan
    type: agent
    prompt: |
      Open questions answered: {{ steps.answer-questions.outputs.selected }}
      Answers: {{ steps.answer-questions.outputs.comment }}

      If the list is empty, change nothing and report that you did nothing.
      Otherwise update .agentic/plan.md and .agentic/plan.json:
        - For each answered question, rewrite the plan against the human's answer, move the
          question from Open questions into Decisions as answered by the human, and remove it
          from open_questions in .agentic/plan.json.
        - Keep .agentic/plan.json in the shape the dovo-plan skill defines
          (.agents/skills/dovo-plan/SKILL.md) and in agreement with .agentic/plan.md.
      Do not implement any code, commit or push. Change only .agentic/plan.md and .agentic/plan.json.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  - id: approve-plan
    name: Approve the plan
    type: ask
    interaction:
      mode: confirm
      message: Approve this plan for issue ${{ inputs.issue }}?
      artifact: plan
      comment: { policy: optional, message: Instructions for the implementer }

  - id: code-loop
    name: Implement until the quality gate passes
    type: loop
    max_iterations: 5
    until:
      - steps.code.outputs.status != "unfixable"
      - steps.code.outputs.status != "timeout"
      - steps.code.outputs.status != "provider_error"
      - steps.code.outputs.status != "blocked"
      - steps.verify.exit_code == 0
    on_max_iterations: prompt_user
    do:
      - id: code
        name: Implement the plan
        type: agent
        prompt: |
          /dovo-code

          Follow .agents/skills/dovo-code/SKILL.md if the slash command is not recognized.
          Implement .agentic/plan.md. Do not commit, stage or push.
          Instructions from the approver: {{ steps.approve-plan.outputs.comment }}
          If .agentic/gate.log exists, a previous attempt left the working tree in a failing
          state: read it, keep the existing work and fix what it reports.
        tools: { allow_all: true }
        timeout_seconds: 3600

      - id: verify
        name: Run the quality gate
        run: uv run dovo run quality > .agentic/gate.log 2>&1
        timeout_seconds: 1800
        on_failure: continue

  - id: pr-prep
    name: Draft the commit message and branch name
    type: agent
    prompt: |
      Run /pr-prep (follow .agents/skills/pr-prep/SKILL.md if the slash
      command is not recognized). The change implements issue ${{ inputs.issue }}.
      Read the change with `git status` and `git diff`, and ignore `.dovo/run` and `.agentic/`.
      The commit message and branch name are used now; `pr-describe` rewrites the PR title and
      description after review. Also write .agentic/pr-branch: one line, a new branch name
      `<username>/<short-description>`, with the username your own branches use.
    tools: { allow_all: true }
    timeout_seconds: 900

  # A command step: it commits the implementation so each review round
  # reviews, and stamps, a real commit. Nothing is squashed later.
  - id: commit
    name: Commit the implementation
    run: |
      set -eu
      git fetch -q origin main
      git switch -q -c "$(head -n 1 .agentic/pr-branch)"
      git rm -r -q --cached --ignore-unmatch .dovo/run
      git add -A
      git commit -q -F .agentic/commit-msg
    timeout_seconds: 300

  - id: review-loop
    name: Review and fix until approved
    type: loop
    max_iterations: 5
    until:
      - steps.verdict.exit_code == 0
      - steps.triage.outputs.selected_count == 0
    on_max_iterations: prompt_user
    do:
      - id: review
        name: Review the change
        type: agent
        prompt: |
          /dovo-review

          Follow .agents/skills/dovo-review/SKILL.md if the slash command is not recognized.
          Review the commits on this branch against origin/main and write .agentic/review.md, .agentic/review.json
          and .agentic/verdict.txt.
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts: [{ name: review, path: .agentic/review.json }]

      - id: verdict
        name: Check the review verdict
        run: grep -qx APPROVE .agentic/verdict.txt
        on_failure: continue

      - id: triage
        name: Choose the findings to fix
        type: ask
        interaction:
          mode: multiselect
          message: Which findings should be fixed?
          options_from:
            artifact: review
            file: .agentic/review.json
            items_path: findings
            value_field: id
            label_field: summary
          comment: { policy: optional, message: Notes for the fixer }

      - id: fix
        name: Fix the selected findings
        type: agent
        prompt: |
          /dovo-code review --fix {{ steps.triage.outputs.selected }}

          Follow .agents/skills/dovo-code/SKILL.md if the slash command is not recognized.
          Do not commit, stage or push.
          Notes: {{ steps.triage.outputs.comment }}
        tools: { allow_all: true }
        timeout_seconds: 3600

      # Commits only when the fix changed files, with the message the fixer
      # wrote; a change without one fails the step rather than committing a
      # message that says nothing.
      - id: commit-fixes
        name: Commit the review fixes
        run: |
          set -eu
          git add -A
          if git diff --cached --quiet; then rm -f .agentic/fix-commit-msg; exit 0; fi
          test -s .agentic/fix-commit-msg || { echo "the fix changed files but wrote no .agentic/fix-commit-msg" >&2; exit 1; }
          uv run python scripts/check_commit_msg.py .agentic/fix-commit-msg
          git commit -q -F .agentic/fix-commit-msg
          rm .agentic/fix-commit-msg
        timeout_seconds: 300
        on_failure: prompt_user

  # Written last, from everything committed, so the PR text matches the code
  # the final review saw rather than the code before the fix rounds.
  - id: pr-describe
    name: Describe the PR from the reviewed branch
    type: agent
    prompt: |
      Follow .agents/skills/pr-prep/SKILL.md (or run /pr-prep) to draft only .agentic/pr-title
      and .agentic/pr-description, overwriting both. The change implements issue ${{ inputs.issue }}.
      Everything is already committed, so read it with `git log --oneline origin/main..HEAD` and
      `git diff origin/main...HEAD` instead of the uncommitted diff, and ignore `.dovo/run`. The
      skill's stop when nothing is uncommitted does not apply here: always rewrite both files.
      Do not touch .agentic/commit-msg or .agentic/pr-branch, and do not commit, stage or push.
    tools: { allow_all: true }
    timeout_seconds: 900
    artifacts:
      - { name: pr-description, path: .agentic/pr-description }

  # A command step, not an agent step: it inherits the host environment, so git
  # reaches the user's SSH agent, which agent steps never see.
  - id: push
    name: Push and open the PR
    run: uv run python scripts/pr.py
    timeout_seconds: 600

  # Pauses on failure rather than finishing without the comment: retry after a
  # GitHub error, or continue when the publisher refused a review that no
  # longer matches the PR head (a fix landed after the final review).
  - id: post-review
    name: Post the final review to the PR
    run: uv run python scripts/publish_review.py --pr "$(head -n 1 .agentic/pr-branch)"
    timeout_seconds: 120
    on_failure: prompt_user
