version: 1
name: feature-dev
id: feature-dev
description: Plan and review a GitHub issue until approved, implement it after approval, review and fix until approved, then optionally open a PR
summary: Issue to reviewed PR with human gates

inputs:
  issue:
    type: string
    description: GitHub issue number to implement
    required: true
    aliases: ["-i", "--issue"]

steps:
  - id: plan
    name: Plan the issue
    type: agent
    prompt: |
      /dovo-plan ${{ inputs.issue }}

      Follow .agents/skills/dovo-plan/SKILL.md if the slash command is not recognized.
      Write the plan to .agentic/plan.md and stop; do not implement anything.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts: [{ name: plan, path: .agentic/plan.md }]

  - id: plan-loop
    name: Review the plan until approved
    type: loop
    max_iterations: 2
    until:
      - steps.plan-verdict.exit_code == 0
    on_max_iterations: prompt_user
    do:
      - id: plan-review
        name: Review the plan
        type: agent
        prompt: |
          /dovo-plan-review

          Follow .agents/skills/dovo-plan-review/SKILL.md if the slash command is not recognized.
          Review .agentic/plan.md and write findings to .agentic/plan-review.md.
          Write APPROVE to .agentic/plan-verdict.txt if there are zero blocking findings; otherwise write CHANGES_REQUIRED.
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts: [{ name: plan-review, path: .agentic/plan-review.md }]

      - id: plan-verdict
        name: Check the plan review verdict
        run: grep -qx APPROVE .agentic/plan-verdict.txt 2>/dev/null || grep -qx "\*\*Verdict:\*\* APPROVE" .agentic/plan-review.md
        on_failure: continue

      - id: approve-review
        name: Approve the plan review
        type: ask
        interaction:
          mode: confirm
          message: Approve the plan review for issue ${{ inputs.issue }}?
          artifact: plan-review
          comment: { policy: optional, message: Instructions for folding in findings }
          options:
            - { value: "approve", label: "Approve" }
            - { value: "stop", label: "Stop here", fail: true }

      - id: fold-findings
        name: Fold findings into the plan
        type: agent
        prompt: |
          Check the review verdict in .agentic/plan-verdict.txt or .agentic/plan-review.md.
          If the review verdict is APPROVE and there are no blocking findings:
            Do nothing; the plan is already approved.
          Otherwise:
            Update .agentic/plan.md to address all findings in .agentic/plan-review.md.
            Instructions from the approver: {{ steps.approve-review.outputs.comment }}
            Do not implement any code, commit or push. Only update .agentic/plan.md.
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts: [{ name: plan, path: .agentic/plan.md }]

  - id: approve-plan
    name: Approve the plan
    type: ask
    interaction:
      mode: confirm
      message: Approve this plan for issue ${{ inputs.issue }}?
      artifact: plan
      comment: { policy: optional, message: Instructions for the implementer }

  - id: code-loop
    name: Implement until the quality gate passes
    type: loop
    max_iterations: 3
    until:
      - steps.code.outputs.status != "unfixable"
      - steps.code.outputs.status != "timeout"
      - steps.code.outputs.status != "provider_error"
      - steps.code.outputs.status != "blocked"
      - steps.verify.exit_code == 0
    on_max_iterations: prompt_user
    do:
      - id: code
        name: Implement the plan
        type: agent
        prompt: |
          /dovo-code

          Follow .agents/skills/dovo-code/SKILL.md if the slash command is not recognized.
          Implement .agentic/plan.md. Do not commit, stage or push.
          Instructions from the approver: {{ steps.approve-plan.outputs.comment }}
          If .agentic/gate.log exists, a previous attempt left the working tree in a failing
          state: read it, keep the existing work and fix what it reports.
        tools: { allow_all: true }
        timeout_seconds: 3600

      - id: verify
        name: Run the quality gate
        run: uv run dovo run quality > .agentic/gate.log 2>&1
        timeout_seconds: 1800
        on_failure: continue

  - id: review-loop
    name: Review and fix until approved
    type: loop
    max_iterations: 3
    until:
      - steps.verdict.exit_code == 0
      - steps.triage.outputs.selected_count == 0
    on_max_iterations: prompt_user
    do:
      - id: review
        name: Review the change
        type: agent
        prompt: |
          /dovo-review

          Follow .agents/skills/dovo-review/SKILL.md if the slash command is not recognized.
          Review the uncommitted changes and write .agentic/review.md, .agentic/review.json
          and .agentic/verdict.txt.
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts: [{ name: review, path: .agentic/review.json }]

      - id: verdict
        name: Check the review verdict
        run: grep -qx APPROVE .agentic/verdict.txt
        on_failure: continue

      - id: triage
        name: Choose the findings to fix
        type: ask
        interaction:
          mode: multiselect
          message: Which findings should be fixed?
          options_from:
            artifact: review
            file: .agentic/review.json
            items_path: findings
            value_field: id
            label_field: summary
          comment: { policy: optional, message: Notes for the fixer }

      - id: fix
        name: Fix the selected findings
        type: agent
        prompt: |
          /dovo-code review --fix {{ steps.triage.outputs.selected }}

          Follow .agents/skills/dovo-code/SKILL.md if the slash command is not recognized.
          Do not commit, stage or push.
          Notes: {{ steps.triage.outputs.comment }}
        tools: { allow_all: true }
        timeout_seconds: 3600

  - id: open-pr
    name: Open a pull request?
    type: ask
    interaction:
      mode: confirm
      message: Review approved. Commit, push and open a pull request for issue ${{ inputs.issue }}?
      options:
        - { value: "yes", label: Open a PR }
        - { value: "no", label: Stop here }

  - id: pr-prep
    name: Draft the commit and PR text
    type: agent
    prompt: |
      The user's answer to "open a PR?" was: {{ steps.open-pr.outputs.selected }}
      If it is not "yes", do nothing and report that you did nothing.
      Otherwise run /pr-prep (follow .agents/skills/pr-prep/SKILL.md if the slash
      command is not recognized). The change implements issue ${{ inputs.issue }}.
      Dovo commits the working tree before each agent step, so read the change with
      `git diff $(git merge-base HEAD origin/main)` instead of the uncommitted diff, and
      ignore `.dovo/run`. Also write .agentic/pr-branch: one line, a new branch name
      `<username>/<short-description>`, with the username your own branches use.
    tools: { allow_all: true }
    timeout_seconds: 900

  # A command step, not an agent step: it inherits the host environment, so git
  # reaches the user's SSH agent, which agent steps never see.
  - id: push
    name: Commit, push and open the PR
    env:
      OPEN_PR: "{{ steps.open-pr.outputs.selected }}"
    run: |
      set -eu
      if [ "$OPEN_PR" != "yes" ]; then echo "Not opening a PR."; exit 0; fi
      branch=$(head -n 1 .agentic/pr-branch)
      git fetch -q origin main
      git switch -q -c "$branch"
      git reset -q --soft "$(git merge-base HEAD origin/main)"
      git rm -r -q --cached --ignore-unmatch .dovo/run
      uv run python scripts/pr.py
    timeout_seconds: 600
