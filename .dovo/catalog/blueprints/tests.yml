version: 1
name: tests
id: tests
description: Run the test suite, or part of it, against the working tree.
summary: Scoped test run for quick feedback; the full gate is `quality`
use_worktree: false

inputs:
  path:
    type: string
    description: Test files, directories or node ids to run, separated by spaces
    default: tests/
    aliases: ["-p", "--path"]
  fast_fail:
    type: boolean
    description: Stop at the first failure
    default: false
    aliases: ["-x", "--fast-fail"]
  coverage:
    type: boolean
    description: Print a coverage report (report only; the coverage floor is enforced by `quality`)
    default: false
    aliases: ["-c", "--coverage"]

steps:
  - id: tests
    name: Run tests
    env:
      TEST_PATH: "${{ inputs.path }}"
      FAST_FAIL: "${{ inputs.fast_fail }}"
      COVERAGE: "${{ inputs.coverage }}"
      COLUMNS: "160"
      PYTHONIOENCODING: utf-8
    run: |
      # Dovo's per-step variables leak into the test process and break tests that
      # assert they are unset; clear them so the suite sees a plain environment.
      unset_args=$(env | sed -n 's/^\(DOVO_\(STEP\|STEPS\|ITERATION\|BLUEPRINT\|PREVIOUS\|TEMP\|RUNNER\|OUTPUT\)[A-Z_]*\)=.*/-u \1/p' | tr '\n' ' ')
      # Split the paths on whitespace, with globbing off so a node id's brackets stay literal.
      set -f
      set -- $TEST_PATH
      set +f
      case "$FAST_FAIL" in [Tt]rue) set -- "$@" -x ;; esac
      case "$COVERAGE" in [Tt]rue) set -- "$@" --cov=dovo --cov-report=term-missing --cov-fail-under=0 ;; esac
      basetemp=$(mktemp -d /tmp/dovo-pytest.XXXXXX) || exit 1
      # Remove the per-run base temp however the step ends; the signal traps make
      # dash run the EXIT trap when the runner sends TERM on timeout or cancel.
      trap 'rm -rf "$basetemp"' EXIT
      trap 'exit 143' TERM
      trap 'exit 130' INT
      trap 'exit 129' HUP
      env $unset_args uv run python -m pytest "$@" --basetemp="$basetemp"
    timeout_seconds: 900
