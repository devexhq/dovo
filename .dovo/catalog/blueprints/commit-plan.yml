version: 1
name: commit-plan
id: commit-plan
description: Copy plan from .agentic/plan.md into worktree-plans repository and commit/push upstream
summary: Commit and push plan to worktree-plans repo
use_sandbox: false

inputs:
  issue:
    type: string
    description: GitHub issue ID for the plan
    required: true
    aliases: ["-i", "--issue"]

steps:
  - id: copy-plan
    name: Copy plan to worktree-plans repository
    run: "mkdir -p /home/luckner/workspace/devexhq/worktree-plans/plans && cp .agentic/plan.md /home/luckner/workspace/devexhq/worktree-plans/plans/${{ inputs.issue }}-plan.md"

  - id: stage-plan
    name: Stage plan in worktree-plans
    run: "git -C /home/luckner/workspace/devexhq/worktree-plans add plans/${{ inputs.issue }}-plan.md"

  - id: commit-plan
    name: Commit plan in worktree-plans
    run: "git -C /home/luckner/workspace/devexhq/worktree-plans diff --cached --quiet || git -C /home/luckner/workspace/devexhq/worktree-plans commit -m 'docs(plan): add plan for issue ${{ inputs.issue }}'"

  - id: push-plan
    name: Push plan upstream
    run: "git -C /home/luckner/workspace/devexhq/worktree-plans push origin HEAD:main"
