version: 1
name: pr-fix
id: pr-fix
description: Run one round of fixes on a pull request's open feedback, fixing only the items you pick.
summary: One fix round on a pull request

# Review threads are read and replied on through GitHub's REST API. Whether a
# thread is resolved, and resolving it, use GitHub's GraphQL API unless
# DOVO_GITHUB_THREADS=claude-cloud selects the routes a Claude Code cloud
# session's GitHub proxy adds, for environments that refuse GraphQL. Pass it
# through to the review step too:
#   DOVO_GITHUB_THREADS=claude-cloud dovo run pr-fix -p <n> --env-passthrough DOVO_GITHUB_THREADS

inputs:
  pr:
    type: string
    description: Number of the pull request to address feedback on
    required: true
    aliases: ["-p", "--pr"]

steps:
  # Stops the run (errors 2-5) before anything is collected. Runs from the
  # run's base, then leaves the worktree detached at the pull request's head,
  # so every later step runs the pull request's own code. It first copies the
  # base's reply scripts into .agentic/tools/, and the steps below run them
  # from there: a head that predates a change this blueprint relies on still
  # gets the scripts that match it.
  - id: restore
    name: Restore the run's state and collect feedback
    run: uv run python scripts/pr_feedback.py --pr "$PR"
    env: { PR: "${{ inputs.pr }}" }
    timeout_seconds: 300
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }
      - { name: feedback, path: .agentic/feedback.json }

  - id: triage
    name: Draft the triage of the feedback
    type: agent
    prompt: |
      /dovo-code feedback --triage

      Follow .agents/skills/dovo-code/SKILL.md if the slash command is not recognized.
      Write .agentic/triage.json for every item in .agentic/feedback.json.
      Do not edit any other file, commit, stage or push.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: triage-json, path: .agentic/triage.json }

  # Checks .agentic/triage.json and renders .agentic/triage.md and the
  # .agentic/triage-options.json the person picks from, one option per item
  # labelled with its triage line. An invalid triage fails this step and
  # stops the run before the pick.
  - id: render-triage
    name: Check the triage and render it for picking
    run: uv run python .agentic/tools/reply_threads.py --render-triage
    timeout_seconds: 300
    artifacts:
      - { name: triage, path: .agentic/triage.md }
      - { name: triage-options, path: .agentic/triage-options.json }

  # With no feedback item there is no option, and the run continues with
  # nothing picked.
  - id: pick-fixes
    name: Pick the feedback to fix
    type: ask
    interaction:
      mode: multiselect
      message: >-
        Which feedback items on pull request ${{ inputs.pr }} do you want fixed? Each option shows
        the triage's proposal. A ticked item is fixed. An unticked item the triage proposed to fix is
        deferred and its thread left open; any other unticked item keeps its dismiss or defer and
        that reply is posted. To stop before anything is posted, cancel the run.
      artifact: triage
      options_from:
        artifact: triage-options
        file: .agentic/triage-options.json
        items_path: items
        value_field: id
        label_field: label
      comment: { policy: optional, message: Notes for the fixer }

  # Rewrites .agentic/triage.json to the picks, so the fixer and the reply act
  # on exactly what the person picked.
  - id: apply-picks
    name: Settle the triage to the picked items
    run: uv run python .agentic/tools/reply_threads.py --apply-picks "$PICKED"
    env: { PICKED: "{{ steps.pick-fixes.outputs.selected }}" }
    timeout_seconds: 300
    artifacts:
      - { name: triage-json, path: .agentic/triage.json }
      - { name: triage, path: .agentic/triage.md }

  # Installed at the pull request's head, which restore checked out, before
  # the fixer writes code, so its first test run finds every project dependency.
  - id: sync
    name: Install the project's dependencies
    run: uv sync --all-extras
    timeout_seconds: 900

  # A triage with no fix item makes every step up to the reply a no-op: the
  # fixer changes nothing, the gate is skipped and there is nothing to commit or push.
  - id: fix-loop
    name: Fix until the quality gate passes
    type: loop
    max_iterations: 5
    until:
      - steps.fix.outputs.status not in ["unfixable", "timeout", "provider_error", "blocked"]
      - steps.verify.exit_code == 0
    on_max_iterations: prompt_user
    do:
      - id: fix
        name: Fix the approved fix items
        type: agent
        prompt: |
          /dovo-code feedback

          Follow .agents/skills/dovo-code/SKILL.md if the slash command is not recognized.
          Fix the fix items of the picked triage in .agentic/triage.json.
          Do not commit, stage or push.
          Run only scoped checks on what you changed: ruff and ty on the changed files and
          `uv run dovo run tests --path "<test paths>"` on the tests they touch. Do not run
          `uv run dovo run quality` or the whole suite: the next step runs the full gate.
          Notes: {{ steps.pick-fixes.outputs.comment || 'none' }}
          If .agentic/gate.log exists, a previous attempt left the working tree in a failing
          state: read it, keep the existing work and fix what it reports.
        tools: { allow_all: true }
        timeout_seconds: 3600
        artifacts:
          - { name: implementation-report, path: .agentic/implementation-report.md }

      - id: verify
        name: Run the quality gate
        run: '[ -z "$(git status --porcelain)" ] || uv run dovo run quality > .agentic/gate.log 2>&1'
        timeout_seconds: 1800
        on_failure: continue

  - id: commit-fixes
    uses: commit-fixes

  # A command step: it inherits the host environment, so git reaches the
  # user's SSH agent. Never forced: a rejected push pauses with git's message.
  - id: push
    name: Push the fixes to the pull request
    run: git push -q origin "HEAD:refs/heads/$(head -n 1 .agentic/pr-branch)"
    timeout_seconds: 300
    on_failure: prompt_user

  # Replies once on each triaged review thread with its outcome, resolves the
  # fixed and dismissed ones, and posts one outcome comment for the review's
  # findings outside the diff. A retry skips what is already posted, so it
  # posts only what is missing.
  - id: reply
    name: Reply on and resolve the addressed review threads
    run: uv run python .agentic/tools/reply_threads.py
    timeout_seconds: 300
    on_failure: prompt_user

  - id: review
    name: Review the pull request
    type: agent
    prompt: |
      /dovo-review ${{ inputs.pr }}

      Follow .agents/skills/dovo-review/SKILL.md if the slash command is not recognized.
      Review pull request ${{ inputs.pr }} and write .agentic/review.md, .agentic/review.json
      and .agentic/verdict.txt. Do not post: the next step does.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts: [{ name: review, path: ".agentic/review.*" }]

  - id: post-review
    uses: post-review
