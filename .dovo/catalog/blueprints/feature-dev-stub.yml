version: 1
name: feature-dev-stub
id: feature-dev-stub
description: Stub of feature-dev for end-to-end testing; every agent step writes short fixed files instead of planning, coding or reviewing
summary: feature-dev wiring with stub agents

# Mirrors feature-dev.yml step for step (loops, asks, artifacts, interpolation),
# but each agent step runs one fixed shell command. The plan starts with open
# question OQ-1, and folding any plan finding adds OQ-2, so the questions are
# asked against the folded plan. Every loop fails its first round and passes
# its second, so the retry paths run too:
#   plan-review-loop  round 1 has findings B1 and B2, round 2 has none
#   code-loop         attempt 1 fails the stub gate, attempt 2 passes
#   review-loop       round 1 has findings F1 and F2, round 2 approves with no findings
# Nothing is committed or pushed; the push step is a dry run that stops before
# scripts/pr.py.

inputs:
  issue:
    type: string
    description: GitHub issue number to pretend to implement
    required: true
    aliases: ["-i", "--issue"]

steps:
  - id: reset
    name: Clear stub outputs from earlier runs
    run: >-
      mkdir -p .agentic &&
      rm -f .agentic/plan.md .agentic/plan.json .agentic/plan-review.md
      .agentic/plan-review.json .agentic/plan-review-declined.json .agentic/gate.log .agentic/review.md .agentic/review.json .agentic/verdict.txt
      .agentic/stub-*

  - id: plan
    name: Plan the issue (stub)
    type: agent
    prompt: |
      This is a stub step for testing a workflow. Do not read files, explore or plan.
      Run exactly this bash command, then reply "done" and stop:

      printf '# Stub plan for issue %s\n\n- Phase 1: stub change\n- OQ-1: stub question\n' '${{ inputs.issue }}' > .agentic/plan.md; echo '{"issue": "${{ inputs.issue }}", "plan": ".agentic/plan.md", "open_questions": [{"id": "OQ-1", "summary": "Stub open question (assumed: stub answer)", "assumed": "Stub assumed answer"}]}' > .agentic/plan.json
    tools: { allow_all: true }
    timeout_seconds: 300
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  - id: plan-review-loop
    name: Review and fold until no findings are picked (stub)
    type: loop
    max_iterations: 5
    until:
      - steps.triage-plan.outputs.selected_count == 0
    on_max_iterations: prompt_user
    do:
      - id: plan-review
        name: Review the plan (stub)
        type: agent
        prompt: |
          This is a stub step for testing a workflow. Do not read files, explore or review.
          Run exactly this bash command, then reply "done" and stop:

          if [ -f .agentic/plan-review.json ]; then v=APPROVE; j='{"verdict": "APPROVE", "findings": []}'; else v=CHANGES_REQUIRED; j='{"verdict": "CHANGES_REQUIRED", "findings": [{"id": "B1", "severity": "BLOCKER", "summary": "Stub plan finding one"}, {"id": "B2", "severity": "MAJOR", "summary": "Stub plan finding two"}]}'; fi; echo "$j" > .agentic/plan-review.json; printf '# Stub plan review\n\n**Verdict:** %s\n' "$v" > .agentic/plan-review.md
        tools: { allow_all: true }
        timeout_seconds: 300
        artifacts:
          - { name: plan-review, path: .agentic/plan-review.md }
          - { name: plan-findings, path: .agentic/plan-review.json }

      - id: triage-plan
        name: Choose the plan review findings to address
        type: ask
        interaction:
          mode: multiselect
          message: Which plan review findings should be folded into the plan for issue ${{ inputs.issue }}? Pick none to finish the review.
          artifact: plan-review
          options_from:
            artifact: plan-findings
            file: .agentic/plan-review.json
            items_path: findings
            value_field: id
            label_field: summary
          comment: { policy: optional, message: Instructions for folding in the findings }

      # Folding any finding adds open question OQ-2, so the questions asked
      # after the loop reflect the folded findings.
      - id: fold-findings
        name: Fold the chosen findings into the plan (stub)
        type: agent
        prompt: |
          This is a stub step for testing a workflow. Do not read files, explore or edit the plan.
          Run exactly these bash commands, then reply "done" and stop:

          if [ '{{ steps.triage-plan.outputs.selected }}' = '[]' ]; then echo "nothing to fold"; exit 0; fi
          cat >> .agentic/plan.md <<'STUB_EOF'

          ## Folded findings (stub)

          Findings: {{ steps.triage-plan.outputs.selected }}; instructions: {{ steps.triage-plan.outputs.comment }}
          - OQ-2: stub question raised by a folded finding
          STUB_EOF
          echo '{"issue": "${{ inputs.issue }}", "plan": ".agentic/plan.md", "open_questions": [{"id": "OQ-1", "summary": "Stub open question (assumed: stub answer)", "assumed": "Stub assumed answer"}, {"id": "OQ-2", "summary": "Stub question raised by a folded finding (assumed: stub answer)", "assumed": "Stub assumed answer"}]}' > .agentic/plan.json
          echo '{"declined": [{"id": "stub", "summary": "Findings not in {{ steps.triage-plan.outputs.selected }}"}]}' > .agentic/plan-review-declined.json
        tools: { allow_all: true }
        timeout_seconds: 300
        artifacts:
          - { name: plan, path: .agentic/plan.md }
          - { name: plan-questions, path: .agentic/plan.json }

  - id: answer-questions
    name: Answer the plan's open questions
    type: ask
    interaction:
      mode: multiselect
      message: Which open questions do you want to answer instead of accepting the plan's assumed answer?
      artifact: plan
      options_from:
        artifact: plan-questions
        file: .agentic/plan.json
        items_path: open_questions
        value_field: id
        label_field: summary
      comment: { policy: optional, message: "Your answers, one per selected question (e.g. OQ-1: show them)" }

  - id: fold-answers
    name: Fold the answers into the plan (stub)
    type: agent
    prompt: |
      This is a stub step for testing a workflow. Do not read files, explore or edit the plan.
      Run exactly these bash commands, then reply "done" and stop:

      if [ '{{ steps.answer-questions.outputs.selected }}' = '[]' ]; then echo "nothing to fold"; exit 0; fi
      cat >> .agentic/plan.md <<'STUB_EOF'

      ## Folded answers (stub)

      Questions: {{ steps.answer-questions.outputs.selected }}; answers: {{ steps.answer-questions.outputs.comment }}
      STUB_EOF
      echo '{"issue": "${{ inputs.issue }}", "plan": ".agentic/plan.md", "open_questions": []}' > .agentic/plan.json
    tools: { allow_all: true }
    timeout_seconds: 300
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  - id: approve-plan
    name: Approve the plan
    type: ask
    interaction:
      mode: confirm
      message: Approve this plan for issue ${{ inputs.issue }}?
      artifact: plan
      comment: { policy: optional, message: Instructions for the implementer }

  - id: code-loop
    name: Implement until the stub gate passes
    type: loop
    max_iterations: 5
    until:
      - steps.code.outputs.status != "unfixable"
      - steps.code.outputs.status != "timeout"
      - steps.code.outputs.status != "provider_error"
      - steps.code.outputs.status != "blocked"
      - steps.verify.exit_code == 0
    on_max_iterations: prompt_user
    do:
      - id: code
        name: Implement the plan (stub)
        type: agent
        prompt: |
          This is a stub step for testing a workflow. Do not read files, explore or write code.
          Run exactly this bash command, then reply "done" and stop:

          cat >> .agentic/stub-code.log <<'STUB_EOF'
          attempt; approver comment: {{ steps.approve-plan.outputs.comment }}
          STUB_EOF
        tools: { allow_all: true }
        timeout_seconds: 300

      - id: verify
        name: Run the stub quality gate (passes from the second attempt)
        run: >-
          n=$(grep -c '^attempt' .agentic/stub-code.log);
          echo "stub gate: attempt $n" > .agentic/gate.log;
          [ "$n" -ge 2 ]
        timeout_seconds: 60
        on_failure: continue

  - id: review-loop
    name: Review and fix until approved (stub)
    type: loop
    max_iterations: 5
    until:
      - steps.verdict.exit_code == 0
      - steps.triage.outputs.selected_count == 0
    on_max_iterations: prompt_user
    do:
      - id: review
        name: Review the change (stub)
        type: agent
        prompt: |
          This is a stub step for testing a workflow. Do not read files, explore or review.
          Run exactly this bash command, then reply "done" and stop:

          if [ -f .agentic/review.json ]; then v=APPROVE; j='{"findings": []}'; else v=CHANGES_REQUIRED; j='{"findings": [{"id": "F1", "summary": "Stub finding one"}, {"id": "F2", "summary": "Stub finding two"}]}'; fi; echo "$j" > .agentic/review.json; printf '# Stub review\n\n**Verdict:** %s\n' "$v" > .agentic/review.md; echo "$v" > .agentic/verdict.txt
        tools: { allow_all: true }
        timeout_seconds: 300
        artifacts: [{ name: review, path: .agentic/review.json }]

      - id: verdict
        name: Check the review verdict
        run: grep -qx APPROVE .agentic/verdict.txt
        on_failure: continue

      - id: triage
        name: Choose the findings to fix
        type: ask
        interaction:
          mode: multiselect
          message: Which findings should be fixed?
          options_from:
            artifact: review
            file: .agentic/review.json
            items_path: findings
            value_field: id
            label_field: summary
          comment: { policy: optional, message: Notes for the fixer }

      - id: fix
        name: Fix the selected findings (stub)
        type: agent
        prompt: |
          This is a stub step for testing a workflow. Do not read files, explore or fix anything.
          Run exactly this bash command, then reply "done" and stop:

          cat >> .agentic/stub-fix.log <<'STUB_EOF'
          fixed: {{ steps.triage.outputs.selected }}; notes: {{ steps.triage.outputs.comment }}
          STUB_EOF
        tools: { allow_all: true }
        timeout_seconds: 300

  - id: open-pr
    name: Open a pull request?
    type: ask
    interaction:
      mode: confirm
      message: Review approved. Commit, push and open a pull request for issue ${{ inputs.issue }}? (stub; nothing is pushed)
      options:
        - { value: "yes", label: Open a PR }
        - { value: "no", label: Stop here }

  - id: pr-prep
    name: Draft the commit and PR text (stub)
    type: agent
    prompt: |
      This is a stub step for testing a workflow. Do not commit, push, open a PR, read files or explore.
      Run exactly this bash command, then reply "done" and stop:

      printf 'open-pr answer: %s\nissue: %s\n' '{{ steps.open-pr.outputs.selected }}' '${{ inputs.issue }}' > .agentic/stub-push.md; printf 'chore(stub): stub commit\n' > .agentic/commit-msg; printf 'chore(stub): stub PR\n' > .agentic/pr-title; printf 'Stub PR description\n' > .agentic/pr-description; printf 'stub/feature-dev-${{ inputs.issue }}\n' > .agentic/pr-branch
    tools: { allow_all: true }
    timeout_seconds: 300

  # Same shape as feature-dev's push step, but it stops before committing:
  # it squashes onto the merge base on the run branch, drops .dovo/run, shows
  # what would be committed and checks that git reaches origin over SSH.
  - id: push
    name: Commit, push and open the PR (stub; dry run)
    env:
      OPEN_PR: "{{ steps.open-pr.outputs.selected }}"
    run: |
      set -eu
      if [ "$OPEN_PR" != "yes" ]; then echo "Not opening a PR."; exit 0; fi
      for f in commit-msg pr-title pr-description pr-branch; do test -s ".agentic/$f"; done
      echo "would push branch: $(head -n 1 .agentic/pr-branch)"
      git fetch -q origin main
      git reset -q --soft "$(git merge-base HEAD origin/main)"
      git rm -r -q --cached --ignore-unmatch .dovo/run
      git diff --cached --stat
      git ls-remote -q origin refs/heads/main > /dev/null && echo "origin reachable over the host's git auth"
    timeout_seconds: 120
