version: 1
name: feature-dev-stub
id: feature-dev-stub
description: Stub of feature-dev for end-to-end testing; every agent step writes short fixed files instead of planning, coding or reviewing
summary: feature-dev wiring with stub agents

# Mirrors feature-dev.yml step for step (loops, asks, artifacts, interpolation),
# but each agent step runs one fixed shell command. Every loop fails its first
# round and passes its second, so the retry paths run too:
#   plan-loop    round 1 CHANGES_REQUIRED, round 2 APPROVE
#   code-loop    attempt 1 fails the stub gate, attempt 2 passes
#   review-loop  round 1 has findings F1 and F2, round 2 approves with no findings
# Nothing is committed or pushed; the push step is a dry run that stops before
# scripts/pr.py.

inputs:
  issue:
    type: string
    description: GitHub issue number to pretend to implement
    required: true
    aliases: ["-i", "--issue"]

steps:
  - id: reset
    name: Clear stub outputs from earlier runs
    run: >-
      mkdir -p .agentic &&
      rm -f .agentic/plan.md .agentic/plan-review.md .agentic/plan-verdict.txt
      .agentic/gate.log .agentic/review.md .agentic/review.json .agentic/verdict.txt
      .agentic/stub-*

  - id: plan
    name: Plan the issue (stub)
    type: agent
    prompt: |
      This is a stub step for testing a workflow. Do not read files, explore or plan.
      Run exactly this bash command, then reply "done" and stop:

      printf '# Stub plan for issue %s\n\n- Phase 1: stub change\n' '${{ inputs.issue }}' > .agentic/plan.md
    tools: { allow_all: true }
    timeout_seconds: 300
    artifacts: [{ name: plan, path: .agentic/plan.md }]

  - id: plan-loop
    name: Review the plan until approved (stub)
    type: loop
    max_iterations: 2
    until:
      - steps.plan-verdict.exit_code == 0
    on_max_iterations: prompt_user
    do:
      - id: plan-review
        name: Review the plan (stub)
        type: agent
        prompt: |
          This is a stub step for testing a workflow. Do not read files, explore or review.
          Run exactly this bash command, then reply "done" and stop:

          if [ -f .agentic/plan-review.md ]; then v=APPROVE; f='- none'; else v=CHANGES_REQUIRED; f='- P1 (blocking): stub finding'; fi; printf '# Stub plan review\n\n**Verdict:** %s\n\n%s\n' "$v" "$f" > .agentic/plan-review.md; echo "$v" > .agentic/plan-verdict.txt
        tools: { allow_all: true }
        timeout_seconds: 300
        artifacts: [{ name: plan-review, path: .agentic/plan-review.md }]

      - id: plan-verdict
        name: Check the plan review verdict
        run: grep -qx APPROVE .agentic/plan-verdict.txt 2>/dev/null || grep -qx "\*\*Verdict:\*\* APPROVE" .agentic/plan-review.md
        on_failure: continue

      - id: approve-review
        name: Approve the plan review
        type: ask
        interaction:
          mode: confirm
          message: Approve the plan review for issue ${{ inputs.issue }}?
          artifact: plan-review
          comment: { policy: optional, message: Instructions for folding in findings }
          options:
            - { value: "approve", label: "Approve" }
            - { value: "stop", label: "Stop here", fail: true }

      - id: fold-findings
        name: Fold findings into the plan (stub)
        type: agent
        prompt: |
          This is a stub step for testing a workflow. Do not read files, explore or edit the plan.
          Run exactly this bash command, then reply "done" and stop:

          cat >> .agentic/plan.md <<'STUB_EOF'

          ## Folded review (stub)

          Approver comment: {{ steps.approve-review.outputs.comment }}
          STUB_EOF
        tools: { allow_all: true }
        timeout_seconds: 300
        artifacts: [{ name: plan, path: .agentic/plan.md }]

  - id: approve-plan
    name: Approve the plan
    type: ask
    interaction:
      mode: confirm
      message: Approve this plan for issue ${{ inputs.issue }}?
      artifact: plan
      comment: { policy: optional, message: Instructions for the implementer }

  - id: code-loop
    name: Implement until the stub gate passes
    type: loop
    max_iterations: 3
    until:
      - steps.code.outputs.status != "unfixable"
      - steps.code.outputs.status != "timeout"
      - steps.code.outputs.status != "provider_error"
      - steps.code.outputs.status != "blocked"
      - steps.verify.exit_code == 0
    on_max_iterations: prompt_user
    do:
      - id: code
        name: Implement the plan (stub)
        type: agent
        prompt: |
          This is a stub step for testing a workflow. Do not read files, explore or write code.
          Run exactly this bash command, then reply "done" and stop:

          cat >> .agentic/stub-code.log <<'STUB_EOF'
          attempt; approver comment: {{ steps.approve-plan.outputs.comment }}
          STUB_EOF
        tools: { allow_all: true }
        timeout_seconds: 300

      - id: verify
        name: Run the stub quality gate (passes from the second attempt)
        run: >-
          n=$(grep -c '^attempt' .agentic/stub-code.log);
          echo "stub gate: attempt $n" > .agentic/gate.log;
          [ "$n" -ge 2 ]
        timeout_seconds: 60
        on_failure: continue

  - id: review-loop
    name: Review and fix until approved (stub)
    type: loop
    max_iterations: 3
    until:
      - steps.verdict.exit_code == 0
      - steps.triage.outputs.selected_count == 0
    on_max_iterations: prompt_user
    do:
      - id: review
        name: Review the change (stub)
        type: agent
        prompt: |
          This is a stub step for testing a workflow. Do not read files, explore or review.
          Run exactly this bash command, then reply "done" and stop:

          if [ -f .agentic/review.json ]; then v=APPROVE; j='{"findings": []}'; else v=CHANGES_REQUIRED; j='{"findings": [{"id": "F1", "summary": "Stub finding one"}, {"id": "F2", "summary": "Stub finding two"}]}'; fi; echo "$j" > .agentic/review.json; printf '# Stub review\n\n**Verdict:** %s\n' "$v" > .agentic/review.md; echo "$v" > .agentic/verdict.txt
        tools: { allow_all: true }
        timeout_seconds: 300
        artifacts: [{ name: review, path: .agentic/review.json }]

      - id: verdict
        name: Check the review verdict
        run: grep -qx APPROVE .agentic/verdict.txt
        on_failure: continue

      - id: triage
        name: Choose the findings to fix
        type: ask
        interaction:
          mode: multiselect
          message: Which findings should be fixed?
          options_from:
            artifact: review
            file: .agentic/review.json
            items_path: findings
            value_field: id
            label_field: summary
          comment: { policy: optional, message: Notes for the fixer }

      - id: fix
        name: Fix the selected findings (stub)
        type: agent
        prompt: |
          This is a stub step for testing a workflow. Do not read files, explore or fix anything.
          Run exactly this bash command, then reply "done" and stop:

          cat >> .agentic/stub-fix.log <<'STUB_EOF'
          fixed: {{ steps.triage.outputs.selected }}; notes: {{ steps.triage.outputs.comment }}
          STUB_EOF
        tools: { allow_all: true }
        timeout_seconds: 300

  - id: open-pr
    name: Open a pull request?
    type: ask
    interaction:
      mode: confirm
      message: Review approved. Commit, push and open a pull request for issue ${{ inputs.issue }}? (stub; nothing is pushed)
      options:
        - { value: "yes", label: Open a PR }
        - { value: "no", label: Stop here }

  - id: pr-prep
    name: Draft the commit and PR text (stub)
    type: agent
    prompt: |
      This is a stub step for testing a workflow. Do not commit, push, open a PR, read files or explore.
      Run exactly this bash command, then reply "done" and stop:

      printf 'open-pr answer: %s\nissue: %s\n' '{{ steps.open-pr.outputs.selected }}' '${{ inputs.issue }}' > .agentic/stub-push.md; printf 'chore(stub): stub commit\n' > .agentic/commit-msg; printf 'chore(stub): stub PR\n' > .agentic/pr-title; printf 'Stub PR description\n' > .agentic/pr-description; printf 'stub/feature-dev-${{ inputs.issue }}\n' > .agentic/pr-branch
    tools: { allow_all: true }
    timeout_seconds: 300

  # Same shape as feature-dev's push step, but it stops before committing:
  # it squashes onto the merge base on the run branch, drops .dovo/run, shows
  # what would be committed and checks that git reaches origin over SSH.
  - id: push
    name: Commit, push and open the PR (stub; dry run)
    env:
      OPEN_PR: "{{ steps.open-pr.outputs.selected }}"
    run: |
      set -eu
      if [ "$OPEN_PR" != "yes" ]; then echo "Not opening a PR."; exit 0; fi
      for f in commit-msg pr-title pr-description pr-branch; do test -s ".agentic/$f"; done
      echo "would push branch: $(head -n 1 .agentic/pr-branch)"
      git fetch -q origin main
      git reset -q --soft "$(git merge-base HEAD origin/main)"
      git rm -r -q --cached --ignore-unmatch .dovo/run
      git diff --cached --stat
      git ls-remote -q origin refs/heads/main > /dev/null && echo "origin reachable over the host's git auth"
    timeout_seconds: 120
