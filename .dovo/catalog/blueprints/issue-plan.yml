# Forked from `ready-issue.yml` and `feature-dev.yml` at `944de0ce`.
# Temporary: an experimental copy for the slice flow, which replaces
# ready-issue's use before planning, feature-dev and the dovo-* skills once it
# works. Compare fixes to either source against this copy and carry them over.
version: 1
name: issue-plan
id: issue-plan
description: Ready a GitHub issue (re-ground it against main, re-check it and, once a person approves, apply the edits and label it dovo:ready), plan it in slices of one PR each with the issue-plan skill, review and challenge the plan once and fold in every finding and fold-routed challenge, answer its open questions, walk the approver through it, then write the feature contract and the work plan into the issue body
summary: Issue to an approved work plan on the ticket, with human gates

inputs:
  issue:
    type: string
    description: GitHub issue number to plan
    required: true
    aliases: ["-i", "--issue"]

steps:
  # --- ready-issue's steps, inlined: a blueprint cannot call another one. ---

  # The session's own worktree, so moving it loses nothing: the check grounds
  # against main as it is now, not the commit the session started from.
  - id: base
    name: Check out origin/main
    run: git fetch -q origin main && git switch -q --detach origin/main
    timeout_seconds: 120

  - id: check
    name: Re-ground and re-check the issue
    type: agent
    prompt: |
      /dovo-issue ready ${{ inputs.issue }}

      Follow the Ready mode section of .agents/skills/dovo-issue/SKILL.md if the slash command is
      not recognized. Write .agentic/issue-ready.md, .agentic/issue-ready.json and
      .agentic/issue-ready-comment.md, plus .agentic/issue-title and .agentic/issue-body.md when the
      verdict is needs_edits. Do not edit the issue, its labels or its comments.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: issue-ready, path: ".agentic/issue-*" }

  # Any verdict but ready means the current body is stale, so a label left from
  # an earlier run is removed and never vouches for it; apply adds it back after
  # the edits. Stops the run before the person is asked unless the verdict is
  # ready or needs_edits: a not_ready issue needs a split, a decision or a
  # closed blocker, which no edit here can supply.
  - id: gate
    name: Stop when the issue needs a person
    run: |
      set -eu
      verdict=$(uv run --quiet python -c 'import json; print(json.load(open(".agentic/issue-ready.json"))["verdict"])')
      echo "Verdict: $verdict"
      [ "$verdict" = "ready" ] && exit 0
      labels=$(gh issue view ${{ inputs.issue }} --json labels --jq '.labels[].name')
      if printf '%s\n' "$labels" | grep -qx 'dovo:ready'; then
        gh issue edit ${{ inputs.issue }} --remove-label dovo:ready
      fi
      [ "$verdict" = "needs_edits" ] && exit 0
      cat .agentic/issue-ready.md
      exit 1
    timeout_seconds: 120

  # Asked on every run, including one with nothing to edit, since a step cannot
  # be skipped; denying stops the run with the issue untouched.
  - id: approve
    name: Approve the edits and the label
    type: ask
    interaction:
      mode: confirm
      message: Apply the proposed edits, if any, to issue ${{ inputs.issue }} and label it dovo:ready?
      artifact: issue-ready

  # A command step: the writes to GitHub run exactly as approved, with the
  # host's gh credentials.
  - id: apply
    name: Apply the edits, label the issue and comment
    run: |
      set -eu
      verdict=$(uv run --quiet python -c 'import json; print(json.load(open(".agentic/issue-ready.json"))["verdict"])')
      if [ "$verdict" = "needs_edits" ]; then
        for proposal in .agentic/issue-title .agentic/issue-body.md; do
          [ -s "$proposal" ] || { echo "Verdict is needs_edits but $proposal is missing or empty; not labelling."; exit 1; }
        done
        gh issue edit ${{ inputs.issue }} --title "$(head -n 1 .agentic/issue-title)" --body-file .agentic/issue-body.md
      elif [ "$verdict" != "ready" ]; then
        echo "Unexpected verdict '$verdict'; not labelling."
        exit 1
      fi
      gh label create dovo:ready --color 0e8a16 --description "Re-grounded against main and ready to plan" --force
      gh issue edit ${{ inputs.issue }} --add-label dovo:ready
      gh issue comment ${{ inputs.issue }} --body-file .agentic/issue-ready-comment.md
    timeout_seconds: 300

  # --- feature-dev's planning half, on the issue-plan skills. feature-dev's
  # `ready` check is dropped: the steps above have just labelled the issue. ---

  - id: plan
    name: Plan the issue in slices
    type: agent
    prompt: |
      /issue-plan ${{ inputs.issue }}

      Follow .agents/skills/issue-plan/SKILL.md if the slash command is not recognized.
      Write the plan to .agentic/plan.md and its open questions, contract and slices to
      .agentic/plan.json, then stop; do not implement anything.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  # One review, folded in whole without asking; the human weighs the result at
  # the open questions and the plan approval that follow.
  - id: plan-review
    name: Review the plan
    type: agent
    prompt: |
      /issue-plan-review

      Follow .agents/skills/issue-plan-review/SKILL.md if the slash command is not recognized.
      Review .agentic/plan.md and write findings to .agentic/plan-review.md and
      .agentic/plan-review.json.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan-review, path: .agentic/plan-review.md }
      - { name: plan-findings, path: .agentic/plan-review.json }

  # Challenges the design rather than its compliance, without reading the
  # review. Challenges routed fold are folded below; those routed ask become
  # open questions, so a human settles every trade-off and issue departure.
  - id: plan-challenge
    name: Challenge the plan's design
    type: agent
    prompt: |
      /dovo-plan-challenge

      Follow .agents/skills/dovo-plan-challenge/SKILL.md if the slash command is not recognized.
      Challenge .agentic/plan.md and write challenges to .agentic/plan-challenge.md and
      .agentic/plan-challenge.json. Do not read .agentic/plan-review.md or .agentic/plan-review.json.
      The plan groups its phases into slices, one PR each, listed under slices in
      .agentic/plan.json. Each slice lands on its own, so challenge how the phases are sliced
      and ordered as well as the design.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan-challenge, path: .agentic/plan-challenge.md }
      - { name: plan-challenges, path: .agentic/plan-challenge.json }

  - id: fold-findings
    name: Fold the review findings and challenges into the plan
    type: agent
    prompt: |
      If .agentic/plan-review.json lists no findings and .agentic/plan-challenge.json lists no
      challenges, change nothing and report that you did nothing.
      Otherwise update .agentic/plan.md and .agentic/plan.json:
        - Address every finding in .agentic/plan-review.json, by id, as each one describes.
        - Fold every challenge in .agentic/plan-challenge.json routed "fold" by planning its
          alternative.
        - For every challenge routed "ask", add an open question, or rewrite the one it
          concerns, that keeps the plan's current answer as the assumed answer and lists the
          challenge's alternative under alternatives. End its summary with
          "(assumed: <plan's answer>; challenged: <alternative>; recommended: <assumed |
          challenged | none>)" and cite the challenge id and its evidence in why.
        - When a challenge contradicts a review finding, fold neither: raise one open question
          that states both positions with their ids.
        - Write every open question in the bulleted form of the plan template in
          docs/agents/planning.md, one fact per bullet. On each question a challenge or a
          conflicting finding raised, add its Challenged, Turns on and Recommended bullets:
            - Re-read the code at every `path:line` the plan and the challenge cite, and the
              issue and its comments, before you weigh them. Base the recommendation only on
              what you confirmed, and drop any evidence that does not hold.
            - Turns on names the one fact or preference the choice depends on, so the human
              can dispute the premise rather than the verdict.
            - Recommend "assumed" or "challenged", or "none" when the choice depends on a
              preference the code cannot settle. Give the strongest point for the side you
              do not recommend. The plan being written against its answer is no reason to
              recommend it.
            - Add a Note for an issue sentence the choice reverses, a follow-up it needs, or
              the test that would pin it.
        - Addressing a finding or challenge may make an open question moot, change its assumed
          answer or raise a new one: remove, rewrite or add entries under Open questions to match.
        - Keep .agentic/plan.json in the shape the issue-plan skill defines
          (`.agents/skills/issue-plan/SKILL.md`), including its contract and slices, and in
          agreement with .agentic/plan.md.
      Do not implement any code, commit or push. Change only .agentic/plan.md and .agentic/plan.json.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  # Asked after the findings are folded in, so every question reflects them.
  - id: answer-questions
    name: Answer the plan's open questions
    type: ask
    interaction:
      mode: multiselect
      message: Which open questions do you want to answer instead of accepting the plan's assumed answer?
      artifact: plan
      options_from:
        artifact: plan-questions
        file: .agentic/plan.json
        items_path: open_questions
        value_field: id
        label_field: summary
      comment: { policy: optional, message: "Your answers, one per selected question (e.g. OQ-1: show them)" }

  - id: fold-answers
    name: Fold the answers into the plan
    type: agent
    prompt: |
      Open questions answered: {{ steps.answer-questions.outputs.selected }}
      Answers: {{ steps.answer-questions.outputs.comment }}

      If the list is empty, change nothing and report that you did nothing.
      Otherwise update .agentic/plan.md and .agentic/plan.json:
        - For each answered question, rewrite the plan against the human's answer, move the
          question from Open questions into Decisions as answered by the human, and remove it
          from open_questions in .agentic/plan.json.
        - Keep .agentic/plan.json in the shape the issue-plan skill defines
          (`.agents/skills/issue-plan/SKILL.md`), including its contract and slices, and in
          agreement with .agentic/plan.md.
      Do not implement any code, commit or push. Change only .agentic/plan.md and .agentic/plan.json.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  # Written after every answer is folded in, so it explains the plan being
  # approved. The approval prompt shows it rather than the plan, which is cut
  # at 200 lines there; the full plan stays in the plan artifact.
  - id: plan-walkthrough
    name: Walk through the plan for the approver
    type: agent
    prompt: |
      /dovo-plan-walkthrough

      Follow .agents/skills/dovo-plan-walkthrough/SKILL.md if the slash command is not recognized.
      Explain .agentic/plan.md to the person approving it and write .agentic/plan-walkthrough.md.
      The plan groups its phases into slices, one PR each, listed under slices in
      .agentic/plan.json: say which phases each slice holds and the order the slices land in.
      Do not change the plan, implement anything, commit or push.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan-walkthrough, path: .agentic/plan-walkthrough.md }

  - id: approve-plan
    name: Approve the plan
    type: ask
    interaction:
      mode: confirm
      message: Approve this plan for issue ${{ inputs.issue }}? The full plan is in the plan artifact.
      artifact: plan-walkthrough
      comment: { policy: optional, message: Instructions for the implementer }

  # feature-dev hands the approver's instructions straight to its code step;
  # here the code runs in later issue-code sessions, which read only the plan
  # artifacts, so the instructions go into the plan. Passed through env so the
  # comment is never parsed as shell.
  - id: keep-instructions
    name: Add the approver's instructions to the plan
    run: |
      set -eu
      [ -n "$APPROVER_INSTRUCTIONS" ] || exit 0
      printf '\n## Instructions from the approver\n\n%s\n' "$APPROVER_INSTRUCTIONS" >> .agentic/plan.md
    env:
      APPROVER_INSTRUCTIONS: "{{ steps.approve-plan.outputs.comment }}"
    timeout_seconds: 120
    artifacts:
      - { name: plan, path: .agentic/plan.md }

  # A command step: the issue body is written by the script alone, with the
  # host's gh credentials. The plan revision is the latest one this session
  # published, which is the plan after every fold, answer and instruction above.
  - id: publish-workplan
    name: Write the feature contract and the work plan to the issue
    run: >-
      uv run python scripts/workplan.py render --issue ${{ inputs.issue }}
      --plan .agentic/plan.json --session "$DOVO_SESSION_ID"
      --revision {{ artifacts.plan.revision }}
    timeout_seconds: 120
    on_failure: prompt_user
