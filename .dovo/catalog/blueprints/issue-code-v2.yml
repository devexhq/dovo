# The slice flow's coding blueprint, run on sdlc v2's prompts and scripts
# (`.dovo/catalog/prompts/sdlc/v2/VERSION.json`): it plans, builds and reviews
# the next slice of the work plan issue-plan-v2 wrote.
#
# Forked from `feature-dev.yml` at `944de0ce`. Compare fixes to feature-dev
# against this copy and carry them over. Step ids, timeouts, failure
# policies and artifact names match feature-dev's wherever the slice flow does
# not change them, so commit-fixes, post-review and pr_feedback.py work on
# slice PRs unchanged, and grade_inputs.py only adds the slice's phase count,
# since the code loop runs one iteration per phase.
version: 1
name: issue-code-v2
id: issue-code-v2
description: Plan, build and review the next slice of an issue's work plan and open its pull request.
summary: Next slice of a work plan to a reviewed PR

inputs:
  issue:
    type: string
    description: GitHub issue number whose work plan holds the slice (the epic, or a plain issue)
    required: true
    aliases: ["-i", "--issue"]

steps:
  # The session's own worktree, so moving it loses nothing: the slice starts
  # from main as it is now, where the previous slice merged.
  - id: base
    name: Check out origin/main
    run: git fetch -q origin main && git switch -q --detach origin/main
    timeout_seconds: 120

  # Picks without claiming or creating an issue. When the slices wait on a person (a blocker still
  # open, a slice not yet merged, a slice's PR in review), `next` lists why in
  # its holds file instead of refusing, and the run holds at a prompt that lists
  # them; once the person has merged or closed what they wait on and answers
  # (or continues a paused run with `dovo resume`), the loop picks again. It
  # still refuses, with its reason on stderr, when a slice is in progress, when
  # an active slice's PR was closed unmerged, or when every slice is merged or
  # handed off; the run stops there. The run's failure line shows only the
  # exit code, so the reason is read with `dovo logs <session> --step next`.
  - id: pick-loop
    name: Pick the next slice once nothing it waits on needs a person
    type: loop
    max_iterations: 5
    # next writes no slice while it holds, so the loop repeats until it picks one.
    until:
      - steps.next.outputs.slice != ""
    on_max_iterations: prompt_user
    do:
      - id: next
        name: Pick the next slice
        run: >-
          uv run python .dovo/catalog/scripts/sdlc/v2/workplan.py next --issue ${{ inputs.issue }}
          --hold .agentic/next-hold.json
        timeout_seconds: 300
        artifacts:
          - { name: next-hold, path: .agentic/next-hold.json }

      # Skipped when a slice was picked, which lists no hold.
      - id: next-hold
        name: Wait for a person to unblock a slice
        type: ask
        when:
          - "!(length(artifacts.next-hold.content.holds) == 0)"
        interaction:
          mode: multiselect
          message: >-
            No slice of issue ${{ inputs.issue }} can start yet; each slice below says what it waits
            on. Merge or close it on GitHub, then select the slices you unblocked to pick again. To
            stop for now, press Ctrl-C: the run stays paused, and `dovo resume` asks again.
          artifact: next-hold
          options_from:
            artifact: next-hold
            file: .agentic/next-hold.json
            items_path: holds
            value_field: id
            label_field: label

  # The latest revisions of the session the work plan points at: the planning
  # session, or the code session of the last slice that amended the plan.
  - id: load-plan
    name: Load the plan
    uses: dovo/download-artifact
    env:
      ARTIFACT_NAME: plan
      ARTIFACT_DEST: .
      ARTIFACT_SESSION_ID: "{{ steps.next.outputs.plan_session }}"

  - id: load-plan-questions
    name: Load the plan's JSON
    uses: dovo/download-artifact
    env:
      ARTIFACT_NAME: plan-questions
      ARTIFACT_DEST: .
      ARTIFACT_SESSION_ID: "{{ steps.next.outputs.plan_session }}"

  # The slice starts here. On a plan of two or more slices a slice with no
  # issue of its own gets one: a sub-issue of the issue in the short issue
  # format, built from the issue's description and the plan's decisions,
  # recorded on its work plan row and linked. Its pull request closes it, and
  # the issue closes with the last slice. A one-slice plan's slice is worked on
  # the issue itself, and its pull request closes it. Writes `issue`, the issue
  # the slice is worked on, and `closing_lines`, the lines its pull request ends
  # with. A run that stops later leaves the sub-issue for the next run, which
  # picks the same slice and reuses it.
  - id: start
    name: Start the slice on its own sub-issue when the plan has two or more slices
    run: >-
      uv run python .dovo/catalog/scripts/sdlc/v2/workplan.py start --issue ${{ inputs.issue }}
      --slice {{ steps.next.outputs.slice }} --plan .agentic/plan.json
    timeout_seconds: 300

  # A slice issue-plan-v2 phased, the one slice of its plan, was approved there
  # with its phase files, and its row names that session. The phased plan is
  # coded from only while it still holds: the slice is worked on the issue it
  # was phased for, no landed slice has amended the plan since (so the session
  # load-plan read from is that session), and the description is the one it
  # was phased against. Otherwise phased_session is empty and this run phases
  # the slice again, which also re-confirms decisions the edit made stale.
  - id: phased-check
    name: Check whether the slice's phased plan still holds
    run: |
      set -eu
      sha=$(uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py body-sha --issue {{ steps.start.outputs.issue }})
      uv run --quiet python .dovo/catalog/scripts/sdlc/v2/workplan.py phased --issue ${{ inputs.issue }} \
        --slice {{ steps.next.outputs.slice }} --body-sha "$sha"
    timeout_seconds: 120

  # load-plan already read that session's plan and plan-questions, so only the
  # phase files are loaded; the planning steps below are then skipped. A plan
  # grounded behind main is coded from as approved, with a note.
  - id: load-phased-plan
    name: Load the slice's approved phase files when its phased plan holds
    when:
      - steps.phased-check.outputs.phased_session != ""
    run: |
      set -eu
      uv run dovo artifacts download "{{ steps.phased-check.outputs.phased_session }}" phases --dest .
      grounded=$(uv run --quiet python -c 'import json; print(json.load(open(".agentic/plan.json")).get("grounded_at") or "")')
      if [ -n "$grounded" ] && git cat-file -e "$grounded^{commit}" 2>/dev/null; then
        behind=$(git rev-list --count "$grounded..HEAD")
        [ "$behind" = 0 ] || echo "Note: the phased plan was grounded at $grounded, $behind commits behind main; it is coded from as approved."
      fi
    timeout_seconds: 300

  # The plan step rewrites .agentic/plan.{md,json} in place, so the epic plan
  # this run starts from is kept beside them: slice planning (and a retry of
  # it) starts from the copy, the slice plan's review diffs the contract and
  # slices against it, and land compares the contract with it to tell whether
  # the slice amended it. The copy records on the slice the issue `start` says
  # it is worked on, when that is its own issue, since `start` or `split-out`
  # may have given it one after the downloaded plan was written, and later
  # steps read the slice's `child` from plan.json.
  - id: keep-epic-plan
    name: Keep the epic plan this run starts from
    run: |
      cp .agentic/plan.md .agentic/epic-plan.md
      uv run --quiet python -c '
      import json, sys
      plan = json.load(open(".agentic/plan.json"))
      issue = int(sys.argv[2])
      for row in plan["slices"]:
          if row["id"] == sys.argv[1] and issue != plan.get("issue"):
              row["child"] = issue
      json.dump(plan, open(".agentic/epic-plan.json", "w"), indent=2)
      ' "{{ steps.next.outputs.slice }}" "{{ steps.start.outputs.issue }}"
    timeout_seconds: 120

  # --- The ready check's gate steps, run on the issue the slice is worked on.
  # They are skipped when that issue needs no check: a slice's own sub-issue,
  # which is ready from the issue's approved plan, or the issue itself while
  # it is labelled dovo:ready for its description as it is (the check that
  # labelled it recorded the description's body_sha on the slice's work plan
  # row). ---

  - id: ready-state
    name: Check whether the slice's issue needs a ready check
    run: |
      set -eu
      sha=$(uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py body-sha --issue {{ steps.start.outputs.issue }})
      uv run --quiet python .dovo/catalog/scripts/sdlc/v2/workplan.py ready-state --issue ${{ inputs.issue }} \
        --slice {{ steps.next.outputs.slice }} --body-sha "$sha"
    timeout_seconds: 120

  # A not_ready issue needs a person: a split, a decision, a fixed section or a
  # closed blocker, which no edit here can supply. Rather than failing, the run
  # holds at a prompt that lists the findings, so the person settles them on
  # GitHub and answers (or leaves the run paused and continues it later with
  # `dovo resume`). The loop then re-runs the check, since the gate reads the
  # verdict the check wrote, and ends once the verdict is anything but
  # not_ready.
  - id: ready-loop
    name: Check the slice's issue until no person needs to settle it
    type: loop
    max_iterations: 5
    when:
      - steps.ready-state.outputs.ready != "true"
    until:
      - steps.gate.outputs.verdict != "not_ready"
    on_max_iterations: prompt_user
    do:
      # Each check grounds against main as it is now, including a blocker
      # merged while the run was held.
      - id: ready-base
        name: Check out origin/main for the check
        run: git fetch -q origin main && git switch -q --detach origin/main
        timeout_seconds: 120

      - id: check
        name: Re-ground and re-check the slice's issue
        type: agent
        prompt: |
          Follow .dovo/catalog/prompts/sdlc/v2/issue-ready.md for issue {{ steps.start.outputs.issue }}, the issue issue-code-v2 works slice {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }} on. The slice's `outcomes` in .agentic/epic-plan.json are the outcomes it delivers. Write .agentic/issue-ready.md and .agentic/issue-ready.json.
          Do not edit the issue, its labels or its comments.
          Findings of the previous check a person says they settled: {{ steps.hold.outputs.selected || 'none' }}
          Their notes: {{ steps.hold.outputs.comment || 'none' }}
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts:
          - { name: issue-ready, path: ".agentic/issue-*" }

      # Any verdict but ready means the current body is stale, so a label left
      # from an earlier run is removed and never vouches for it; apply adds it
      # back. Lists what a person must settle: every finding of a not_ready
      # verdict.
      - id: gate
        name: List what a person must settle on the slice's issue
        run: |
          set -eu
          verdict=$(uv run --quiet python -c 'import json; print(json.load(open(".agentic/issue-ready.json"))["verdict"])')
          echo "Verdict: $verdict"
          echo "verdict=$verdict" >> "$DOVO_OUTPUT"
          if [ "$verdict" != "ready" ]; then
            labels=$(gh issue view {{ steps.start.outputs.issue }} --json labels --jq '.labels[].name')
            if printf '%s\n' "$labels" | grep -qx 'dovo:ready'; then
              gh issue edit {{ steps.start.outputs.issue }} --remove-label dovo:ready
            fi
          fi
          uv run --quiet python - <<'PY'
          import json
          report = json.load(open(".agentic/issue-ready.json"))
          findings = report["findings"] if report["verdict"] == "not_ready" else []
          holds = [{"id": f["id"], "label": f"{f['id']} ({f['kind']}): {f['summary']} Fix: {f['fix']}"} for f in findings]
          if report["verdict"] == "not_ready" and not holds:
              holds = [{"id": "report", "label": "The check is not_ready but lists no finding; read its report."}]
          json.dump({"holds": holds}, open(".agentic/issue-hold.json", "w"), indent=2)
          PY
          if [ "$verdict" = "not_ready" ]; then cat .agentic/issue-ready.md; fi
        timeout_seconds: 120
        artifacts:
          - { name: issue-hold, path: .agentic/issue-hold.json }
          - { name: issue-ready-report, path: .agentic/issue-ready.md }

      - id: hold
        name: Wait for a person to settle the slice's issue's findings
        type: ask
        when:
          - steps.gate.outputs.verdict == "not_ready"
        interaction:
          mode: multiselect
          message: >-
            Issue {{ steps.start.outputs.issue }}, which slice {{ steps.next.outputs.slice }} is worked on,
            is not ready to plan, and only a person can settle why: the check's findings are listed below,
            and its report is attached. Settle them on GitHub (a split, a decision, a fixed section,
            a closed blocker), then select the ones you settled to re-check the issue. To stop for
            now, press Ctrl-C: the run stays paused, and `dovo resume` asks again.
          artifact: issue-ready-report
          options_from:
            artifact: issue-hold
            file: .agentic/issue-hold.json
            items_path: holds
            value_field: id
            label_field: label
          comment: { policy: optional, message: "What you changed, for the re-check" }

  # Skipped, with apply, when the issue needed no check, so a slice's own
  # sub-issue asks for no approval. Skipped too when the ready loop ran out of
  # rounds on a verdict that is not ready, whose findings the gate's last
  # issue-hold lists; apply then refuses. Either way, denying or refusing
  # stops the run with the issue untouched. A hold file the condition cannot
  # read shows the approval rather than skipping it.
  - id: approve
    name: Approve the label
    type: ask
    when:
      - steps.ready-state.outputs.ready != "true"
      - "!(length(artifacts.issue-hold.content.holds) > 0)"
    interaction:
      mode: confirm
      message: >-
        Label issue {{ steps.start.outputs.issue }}, which slice {{ steps.next.outputs.slice }} is worked
        on, dovo:ready? The check's report is attached.
      artifact: issue-ready-report

  # A command step: the label runs exactly as approved, with the host's gh
  # credentials, and no comment is posted. `unchanged` refuses, before the
  # label is added, when the description is no longer the one the check read;
  # the slice's work plan row then records that description's body_sha, so a
  # later run skips the check only while the description it checked is
  # unchanged. It is not guarded on the verdict: a verdict that is not ready
  # reaches it unapproved, and its refusal stops the run.
  - id: apply
    name: Label the slice's issue and record the check in the work plan
    when:
      - steps.ready-state.outputs.ready != "true"
    run: |
      set -eu
      verdict=$(uv run --quiet python -c 'import json; print(json.load(open(".agentic/issue-ready.json"))["verdict"])')
      checked=$(uv run --quiet python -c 'import json; print(json.load(open(".agentic/issue-ready.json")).get("body_sha", ""))')
      if [ "$verdict" != "ready" ]; then
        echo "Unexpected verdict '$verdict'; not labelling."
        exit 1
      fi
      uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py unchanged --issue {{ steps.start.outputs.issue }} --body-sha "$checked"
      gh label create dovo:ready --color 0e8a16 --description "Re-grounded against main and ready to plan" --force
      gh issue edit {{ steps.start.outputs.issue }} --add-label dovo:ready
      uv run --quiet python .dovo/catalog/scripts/sdlc/v2/workplan.py ready --issue ${{ inputs.issue }} \
        --slice {{ steps.next.outputs.slice }} --body-sha "$checked"
    timeout_seconds: 300

  # --- feature-dev's planning half, scoped to the slice:
  # the slice is phased just in time, against main as it is now and the "as
  # landed" reports of the slices before it. The plan artifacts this session
  # publishes hold the slice's plan, with the epic's contract and slices kept
  # as downloaded. For a slice the planning run phased (load-phased-plan), the
  # planning steps, the walkthrough and the approval are skipped, so the run
  # goes on to claim with the plan and phase files approved there. ---

  # main can move while the slice's issue waits for a person above, so the
  # slice is planned against main as it is when planning starts.
  - id: refresh-base
    name: Check out origin/main again
    run: git fetch -q origin main && git switch -q --detach origin/main
    timeout_seconds: 120

  # The decisions of the plan the work plan names, read from the session's
  # artifacts rather than the issue's comments: the epic plan this run
  # downloaded, and for a plan of one slice the issue plan the planning run
  # kept beside it. Each is given while the issue's description is the one the
  # plan was written against, and to confirm otherwise, so the planner neither
  # re-asks a settled question nor misses one the description has since
  # changed under.
  - id: prior-decisions
    name: Read the decisions of the plan the work plan names
    run: |
      set -eu
      session="{{ steps.next.outputs.plan_session }}"
      rm -rf .agentic/prior
      set -- --issue ${{ inputs.issue }} --out .agentic/prior-decisions.json --plan .agentic/epic-plan.json \
        --session "$session" --planned-sha "{{ steps.next.outputs.body_sha }}"
      if uv run dovo artifacts download "$session" epic-plan-questions --dest .agentic/prior; then
        set -- "$@" --plan .agentic/prior/.agentic/epic-plan.json
      else
        echo "Session $session kept no issue plan beside its plan; reading its plan alone."
      fi
      uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py prior-decisions "$@"
    timeout_seconds: 300

  # The "as landed" report of every slice in review or merged, from the code
  # session that landed it (its work plan row names it), each in
  # .agentic/landed/<slice>/.agentic/slice-report.md. The work plan comment
  # holds no report, so the planner reads them here.
  - id: landed-reports
    name: Download the earlier slices' as-landed reports
    run: |
      set -eu
      rm -rf .agentic/landed
      mkdir -p .agentic/landed
      for pair in {{ steps.next.outputs.landed }}; do
        uv run dovo artifacts download "${pair#*=}" slice-report --dest ".agentic/landed/${pair%%=*}" \
          || echo "Slice ${pair%%=*}'s session ${pair#*=} published no slice report."
      done
    timeout_seconds: 600

  # The slice's numbered items with their exact text, read live, since the
  # ready check above writes the issue's only when it re-checks the issue. On a
  # sliced issue they are only the outcomes the slice delivers. The plan cites
  # them by id, and the breakdown quotes them.
  - id: requirements
    name: List the slice's numbered items
    run: >-
      uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py requirements
      --issue {{ steps.start.outputs.issue }} --slice {{ steps.next.outputs.slice }}
      --plan .agentic/epic-plan.json --out .agentic/requirements.json
    timeout_seconds: 120

  # The slice's plan, unless a planning run phased it: written, reviewed once
  # and folded in whole without asking (the human weighs the result at the
  # open questions and the plan approval that follow), then answered and
  # settled. No challenge follows the review: the design was challenged when
  # the issue was planned, and the review holds the slice's phases to the
  # decisions settled then. plan-review, fold-findings, plan-walkthrough and
  # report run at medium effort (CLAUDE_CODE_EFFORT_LEVEL): they check or
  # reshape a plan already written, and long thinking turns were most of their
  # time.
  - id: plan-slice
    name: Plan the slice unless a planning run phased it
    type: if
    condition:
      - steps.phased-check.outputs.phased_session == ""
    then:
      - id: plan
        name: Plan the slice
        type: agent
        prompt: |
          Follow .dovo/catalog/prompts/sdlc/v2/issue-plan.md and its slice-mode file,
          .dovo/catalog/prompts/sdlc/v2/issue-plan-slice.md, in the mode `/issue-plan --slice {{ steps.next.outputs.slice }}`.
          Plan slice {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }}, worked on issue
          {{ steps.start.outputs.issue }}, from the epic plan in .agentic/epic-plan.md and
          .agentic/epic-plan.json.
          Read the decisions of the plan the work plan names from .agentic/prior-decisions.json, and the
          earlier slices' "as landed" reports from .agentic/landed/<slice>/.agentic/slice-report.md.
          Read the slice's numbered items from .agentic/requirements.json, and cite each requirement
          by its id there.
          Write its phases to .agentic/plan.md and .agentic/plan.json, keeping the contract and the
          slices as downloaded, then stop; do not implement anything.
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts:
          - { name: plan, path: .agentic/plan.md }
          - { name: plan-questions, path: .agentic/plan.json }

      - id: plan-review
        name: Review the slice's plan
        type: agent
        env: { CLAUDE_CODE_EFFORT_LEVEL: medium }
        prompt: |
          Follow .dovo/catalog/prompts/sdlc/v2/issue-plan-review.md in the mode `/issue-plan-review --slice {{ steps.next.outputs.slice }}`.
          Review .agentic/plan.md and write findings to .agentic/plan-review.json.
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts:
          - { name: plan-findings, path: .agentic/plan-review.json }

      # Skipped when the review lists no finding; a findings file that cannot
      # be read leaves the fold running.
      - id: fold-findings
        name: Fold the review findings into the slice's plan
        type: agent
        env: { CLAUDE_CODE_EFFORT_LEVEL: medium }
        when:
          - "!(length(artifacts.plan-findings.content.findings) == 0)"
        prompt: |
          Update .agentic/plan.md and .agentic/plan.json:
            - Address every finding in .agentic/plan-review.json, by id, as each one describes.
            - Addressing a finding may make an open question moot, change its assumed answer or
              raise a new one: remove, rewrite or add entries in plan.json `open_questions` to
              match. Open questions live only in plan.json.
            - Keep .agentic/plan.json in the shape Step 5 of
              `.dovo/catalog/prompts/sdlc/v2/issue-plan.md` defines for slice mode, and in agreement with .agentic/plan.md. Never
              change its contract or slices, or the plan's Feature contract and Slices sections,
              other than slice {{ steps.next.outputs.slice }}'s phases: a finding that needs either
              changed becomes an open question whose assumed answer keeps them.
            - Run `uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py questions` and fix
              every problem it names.
          Do not implement any code, commit or push. Change only .agentic/plan.md and .agentic/plan.json.
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts:
          - { name: plan, path: .agentic/plan.md }
          - { name: plan-questions, path: .agentic/plan.json }

      # What the person reads at the prompt below, built from plan.json: the
      # open questions with their assumed answers and recommendations, and the
      # decisions. Holds the run when an open question is malformed; the
      # message names it. The person fixes it in .agentic/plan.json and
      # retries, keeping its id and summary, which the prompt lists from the
      # plan-questions artifact plan or fold-findings published last.
      - id: questions-summary
        name: Summarise the slice plan's open questions and decisions
        run: >-
          uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py questions
          --plan .agentic/plan.json --summary .agentic/plan-summary.md
        timeout_seconds: 120
        on_failure: prompt_user
        artifacts:
          - { name: plan-summary, path: .agentic/plan-summary.md }

      # Asked after the findings are folded in, so every question reflects
      # them. This ask and fold-answers are skipped when the plan has no open
      # question.
      - id: answer-questions
        name: Answer the slice plan's open questions
        type: ask
        when:
          - "!(length(artifacts.plan-questions.content.open_questions) == 0)"
        interaction:
          mode: multiselect
          message: >-
            Which open questions do you want to answer instead of accepting the planner's recommended
            answer? The attached summary gives each one's assumed answer and recommendation. A question
            you do not tick settles to its recommended answer.
          artifact: plan-summary
          options_from:
            artifact: plan-questions
            file: .agentic/plan.json
            items_path: open_questions
            value_field: id
            label_field: summary
          comment: { policy: optional, message: "Your answers, one per selected question (e.g. OQ-1: show them)" }

      # Runs its fold whenever the plan has an open question, ticked or not:
      # every open question leaves as a decision, settled by the human's
      # answer or by the planner's recommended one.
      - id: fold-answers
        name: Settle the slice plan's open questions as decisions
        type: agent
        when:
          - "!(length(artifacts.plan-questions.content.open_questions) == 0)"
        prompt: |
          Follow .dovo/catalog/prompts/sdlc/v2/fold-answers.md.
          Open questions the human ticked: {{ steps.answer-questions.outputs.selected }}
          The human's answers: {{ steps.answer-questions.outputs.comment || 'none' }}
          The plan phases slice {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }}, worked on
          issue {{ steps.start.outputs.issue }}.
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts:
          - { name: plan, path: .agentic/plan.md }
          - { name: plan-questions, path: .agentic/plan.json }

      # Holds the run before the walkthrough when fold-answers left a question
      # open, such as one ticked with no answer, or wrote a malformed
      # decision; the message names which. A failed session cannot resume, so
      # the person settles it in .agentic/plan.json and retries rather than
      # losing the run.
      - id: check-questions
        name: Check that every open question is settled
        run: uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py check-questions --plan .agentic/plan.json --slice {{ steps.next.outputs.slice }}
        timeout_seconds: 120
        on_failure: prompt_user

  # The plan cut into one file per phase, which is all each code-loop agent
  # reads. Written once every question is settled, so the files carry the final
  # decisions, and before the walkthrough, so the person approves them with the
  # plan. A failed check sends the breakdown round again, with the check's
  # message in .agentic/check-breakdown.log. A loop cannot sit in the block
  # above, so it takes the block's condition as its own guard.
  - id: breakdown-loop
    name: Break the slice's plan into phase files until they pass the check
    type: loop
    max_iterations: 3
    when:
      - steps.phased-check.outputs.phased_session == ""
    until:
      - steps.check-breakdown.exit_code == 0
    on_max_iterations: prompt_user
    do:
      - id: breakdown
        name: Break the slice's plan into phase files
        type: agent
        prompt: |
          Follow .dovo/catalog/prompts/sdlc/v2/breakdown.md.
          Break slice {{ steps.next.outputs.slice }} of .agentic/plan.md into .agentic/phases/phase-<n>.json,
          quoting requirements from .agentic/requirements.json, the slice's numbered items of issue
          {{ steps.start.outputs.issue }}.
          Do not change the plan, implement anything, commit or push.
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts:
          - { name: phases, path: ".agentic/phases/phase-*.json" }

      # Writes .agentic/phases/index.json when the files pass.
      - id: check-breakdown
        name: Check the phase files against the plan and the slice's numbered items
        run: |
          set -eu
          if uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py check-breakdown --slice {{ steps.next.outputs.slice }} 2> .agentic/check-breakdown.log; then
            rm -f .agentic/check-breakdown.log
          else
            cat .agentic/check-breakdown.log >&2
            exit 1
          fi
        timeout_seconds: 120
        on_failure: continue

  # Written after every answer is folded in and the plan is broken down, so it
  # explains the plan and phase files being approved. The approval prompt shows
  # it rather than the plan, which is cut at 200 lines there; the full plan
  # stays in the plan artifact and the phase files in the phases artifact.
  # This step and approve-plan are skipped for a slice phased at planning,
  # which was approved there.
  - id: plan-walkthrough
    name: Walk through the slice's plan for the approver
    type: agent
    env: { CLAUDE_CODE_EFFORT_LEVEL: medium }
    when:
      - steps.phased-check.outputs.phased_session == ""
    prompt: |
      Follow .dovo/catalog/prompts/sdlc/v2/plan-walkthrough.md.
      Explain .agentic/plan.md to the person approving it and write .agentic/plan-walkthrough.md.
      The plan phases slice {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }}, worked
      on issue {{ steps.start.outputs.issue }}, within the feature contract and slices approved
      when the issue was sliced: walk through this slice in slice mode, and say which "as
      landed" reports of earlier slices (.agentic/landed/<slice>/.agentic/slice-report.md) shaped
      it. Check the breakdown too: the phase files in
      .agentic/phases/, listed in .agentic/phases/index.json, the only files each phase's code
      agent reads.
      Do not change the plan, implement anything, commit or push.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan-walkthrough, path: .agentic/plan-walkthrough.md }

  # Denying stops the run before claim.
  - id: approve-plan
    name: Approve the slice's plan
    type: ask
    when:
      - steps.phased-check.outputs.phased_session == ""
    interaction:
      mode: confirm
      message: >-
        Approve this plan for slice {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }}
        (worked on issue {{ steps.start.outputs.issue }}) and its phase files? The full plan is in the
        plan artifact, and the phase files in the phases artifact.
      artifact: plan-walkthrough
      comment: { policy: optional, message: Instructions for the implementer }

  # Installed after refresh-base's checkout and before the first agent writes
  # code, so its first test run finds every project dependency. Runs before
  # claim, so a failed install leaves the slice pending.
  - id: sync
    name: Install the project's dependencies
    run: uv sync --all-extras
    timeout_seconds: 900

  # Claimed only once the slice's issue is ready, the slice's plan approved and
  # the dependencies installed, so a run stopped while that issue is held
  # for a person, a plan the person denies, or a failed install leaves the slice
  # pending rather than stuck in progress.
  - id: claim
    name: Claim the slice for this session
    run: >-
      uv run python .dovo/catalog/scripts/sdlc/v2/workplan.py claim --issue ${{ inputs.issue }}
      --slice {{ steps.next.outputs.slice }} --session "$DOVO_SESSION_ID"
    timeout_seconds: 120

  # --- feature-dev's code and review loops, scoped to the slice. ---

  # One phase of the slice per iteration, each in a fresh agent session that
  # learns what earlier phases did from their commits and report entries. A
  # phase is committed on the detached HEAD, and recorded as done in
  # .agentic/code-progress.json, only once its checks passed; failed checks
  # leave it out of done, so the next iteration retries the same phase with
  # gate.log present, and a resumed run starts at the first phase not done.
  # Once every phase is done, code is skipped and the iteration only runs the
  # checks. The checks are scoped to the phase; the full quality gate runs
  # once, in the review loop's first round.
  - id: code-loop
    name: Implement and commit one phase at a time until every phase passes its checks
    type: loop
    max_iterations: 8
    until:
      - >-
        steps.phase.outputs.phase == "done"
        || steps.code.outputs.status not in ["unfixable", "timeout", "provider_error", "blocked"]
      # Reads phase's recorded $DOVO_OUTPUT value, a numeric string compared numerically.
      - steps.phase.outputs.remaining == 0
      - steps.verify.exit_code == 0
    on_max_iterations: prompt_user
    do:
      # Fails, and stops the run before code, when the slice has no phases, the
      # progress record is unreadable or for another slice, or the next phase is
      # not in .agentic/phases/index.json or has no phase file.
      - id: phase
        name: Pick the next unfinished phase
        run: uv run --quiet python .dovo/catalog/scripts/sdlc/v2/code_progress.py next --slice {{ steps.next.outputs.slice }}
        timeout_seconds: 120

      - id: code
        name: Implement the phase
        type: agent
        when:
          - steps.phase.outputs.phase != "done"
        prompt: |
          Follow .dovo/catalog/prompts/sdlc/v2/issue-code.md in the mode `/issue-code --slice {{ steps.next.outputs.slice }} --phase {{ steps.phase.outputs.phase }}`.
          Implement {{ steps.phase.outputs.phase_file }}, phase {{ steps.phase.outputs.phase }} of slice
          {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }}, worked on issue
          {{ steps.start.outputs.issue }}. Open a section of .agentic/plan.md only when an action's `do`
          or a `tests` item names it (`grep -n '^## '`, then a ranged read). Earlier phases are
          already committed. Do not commit, stage or push.
          Instructions from the approver: {{ steps.approve-plan.outputs.comment || 'none' }}
          Read the `## Instructions from the approver` section of .agentic/plan.md too, when it has
          one: it holds the instructions given when the issue was planned.
          Uncommitted changes outside .agentic/ and .dovo/run are an earlier attempt at this
          phase: keep and finish them. If .agentic/gate.log exists, that attempt failed the
          phase's checks: read the log and fix what it reports.
        tools: { allow_all: true }
        timeout_seconds: 3600

      # The phase's checks: format, lint and types over the whole tree, then
      # the tests scoped_tests.py maps from the files the phase changed. Every
      # check runs even after one fails, so gate.log reports them all.
      - id: verify
        name: Run the phase's checks
        run: |
          {
            failed=0
            uv run ruff format --check . || failed=1
            uv run ruff check . || failed=1
            uv run ty check src tests e2e .dovo/catalog/scripts || failed=1
            paths=$(uv run --quiet python .dovo/catalog/scripts/sdlc/v2/scoped_tests.py) || failed=1
            if [ -n "$paths" ]; then
              uv run dovo run tests --path "$paths" || failed=1
            fi
            exit "$failed"
          } > .agentic/gate.log 2>&1
        timeout_seconds: 1800
        on_failure: continue

      # Commits the phase without pushing, then records it as done: commit
      # first, so a phase is in done only once its changes are committed. A
      # phase that changed nothing is recorded with no commit. A failed commit
      # (no or a rejected .agentic/phase-commit-msg included) pauses for the
      # person and leaves the phase out of done. The passing gate.log is
      # deleted before the commit, so gate.log exists only after failed checks,
      # even when a failed commit sends the same phase round again.
      - id: checkpoint
        name: Commit the phase and record it as done
        run: |
          set -eu
          phase="{{ steps.phase.outputs.phase }}"
          if [ "{{ steps.verify.status }}" != completed ] || [ "$phase" = done ]; then exit 0; fi
          rm -f .agentic/gate.log
          git rm -r -q --cached --ignore-unmatch .dovo/run
          git add -A
          if ! git diff --cached --quiet; then
            test -s .agentic/phase-commit-msg || { echo "phase $phase changed files but wrote no .agentic/phase-commit-msg" >&2; exit 1; }
            uv run --quiet python scripts/check_commit_msg.py .agentic/phase-commit-msg
            git commit -q -F .agentic/phase-commit-msg
          fi
          uv run --quiet python .dovo/catalog/scripts/sdlc/v2/code_progress.py record --slice {{ steps.next.outputs.slice }} --phase "$phase"
          rm -f .agentic/phase-commit-msg
        timeout_seconds: 300
        on_failure: prompt_user

  - id: pr-prep
    name: Draft the commit message and branch name
    type: agent
    prompt: |
      Follow .dovo/catalog/prompts/sdlc/v2/pr-prep.md. The change implements slice {{ steps.next.outputs.slice }} of
      issue ${{ inputs.issue }}, worked on issue {{ steps.start.outputs.issue }}.
      The code loop committed each phase, so read the change with
      `git log --oneline origin/main..HEAD` and `git diff origin/main...HEAD`, plus `git status`
      for anything left uncommitted, and ignore `.dovo/run` and `.agentic/`. The prompt's stop
      when nothing is uncommitted does not apply here: always write .agentic/commit-msg, which
      commits whatever is still uncommitted, if anything. The commit message and branch name are
      used now; `pr-describe` rewrites the PR title and description after review. Also write
      .agentic/pr-branch: one line, a new branch name `<username>/<short-description>`, with the
      username your own branches use.
    tools: { allow_all: true }
    timeout_seconds: 900

  # A command step: it puts the phase commits on the PR branch, created at
  # HEAD, and commits whatever the code loop left uncommitted, so each review
  # round reviews, and stamps, a real commit. With nothing left it makes no
  # commit. Nothing is squashed later: the PR's commits are the phase commits,
  # in phase order, then this one when there is one. A retry after a failure
  # stays on the branch the first attempt created, and a branch name that
  # already exists elsewhere still fails the switch.
  - id: commit
    name: Put the phase commits on the PR branch and commit what remains
    run: |
      set -eu
      branch=$(head -n 1 .agentic/pr-branch)
      git fetch -q origin main
      [ "$(git branch --show-current)" = "$branch" ] || git switch -q -c "$branch"
      git rm -r -q --cached --ignore-unmatch .dovo/run
      git add -A
      if git diff --cached --quiet; then exit 0; fi
      git commit -q -F .agentic/commit-msg
    timeout_seconds: 300
    on_failure: prompt_user

  # Fixes every blocker and warning without asking, until a review reports
  # none or sets action needs_human or replan, which only a person can settle:
  # the run then opens the PR and the posted review carries that decision.
  # Suggestions and nits stay in the posted review for the human. The round
  # that ends the loop still runs the fixer, which then changes nothing. After
  # the last round the run still opens the PR, and the posted review lists what
  # is left.
  - id: review-loop
    name: Review and fix until no blockers or warnings remain or a person must decide
    type: loop
    max_iterations: 3
    until:
      # The review needs a person, or lists no blocker or warning. A review.json
      # the condition cannot read leaves the loop going.
      - >-
        artifacts.review-findings.content.action in ["needs_human", "replan"]
        || (contains(artifacts.review-findings.content.findings.*.severity, "BLOCKER") == false
        && contains(artifacts.review-findings.content.findings.*.severity, "WARNING") == false)
      # A round whose fixer changed files, a gate repair included, needs a fresh
      # review: post-review refuses a review of a commit that is no longer the head.
      - steps.fix-verify.exit_code == 0
      - steps.fix-verify.outputs.changed == "false"
    on_max_iterations: continue
    do:
      - id: review
        name: Review the change
        type: agent
        prompt: |
          Follow .dovo/catalog/prompts/sdlc/v2/issue-review.md in the mode `/issue-review --slice {{ steps.next.outputs.slice }}`.
          Review the commits on this branch against origin/main as slice
          {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }}, worked on issue
          {{ steps.start.outputs.issue }}, and write .agentic/review.md, .agentic/review.json
          and .agentic/verdict.txt. Do not read .agentic/implementation-report.md.
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts:
          - { name: review, path: ".agentic/review.*" }
          - { name: review-findings, path: .agentic/review.json }

      - id: fix
        name: Fix the blockers and warnings
        type: agent
        prompt: |
          Follow .dovo/catalog/prompts/sdlc/v2/issue-code.md in the mode `/issue-code review --tiers blockers,warnings`.
          If .agentic/review.json lists no BLOCKER or WARNING findings, or its action is
          needs_human or replan, fix no findings. If .agentic/fix-gate.log exists, the last
          round's quality gate failed: fix what it reports, and add a line
          `- quality gate: <what changed, with path>` to .agentic/fix-commit-msg. When you
          changed nothing, report that you did nothing. Do not commit, stage or push.
        tools: { allow_all: true }
        timeout_seconds: 3600

      # The code loop and the fixer run only scoped checks, so the full gate
      # runs here, always in the first round. A later round that changed
      # nothing skips it unless the last round's gate failed. A failure in the
      # first round, with or without fixes, goes to the next round's fixer in
      # fix-gate.log. stdout is only the JSON object `until` reads; the gate's
      # own output goes to fix-gate.log.
      - id: fix-verify
        name: Run the quality gate on the change and its fixes
        run: |
          if [ -n "$(git status --porcelain -- . ':!.dovo/run')" ]; then changed=true; else changed=false; fi
          printf '{"changed": "%s"}\n' "$changed"
          if [ "$DOVO_ITERATION_INDEX" != 1 ] && [ ! -e .agentic/fix-gate.log ] && [ "$changed" = false ]; then
            echo "The fixer changed nothing; the gate the last round passed still holds." >&2
            exit 0
          fi
          if uv run dovo run quality > .agentic/fix-gate.log 2>&1; then rm .agentic/fix-gate.log; else exit 1; fi
        timeout_seconds: 1800
        on_failure: continue

      - id: commit-fixes
        uses: commit-fixes

  # fix-gate.log is left only when the last gate on the fixes failed, which a
  # loop that ran out of rounds lets through. Unresolved findings still publish.
  # The implementation report is published here, once, after the code and fix
  # loops have written their last entry; no later step reads it.
  - id: fix-gate
    name: Stop before publishing when the change fails the quality gate
    run: |
      if [ -e .agentic/fix-gate.log ]; then
        echo "The change fails the quality gate; fix .agentic/fix-gate.log before resuming." >&2
        tail -n 40 .agentic/fix-gate.log >&2
        exit 1
      fi
    on_failure: prompt_user
    artifacts:
      - { name: implementation-report, path: .agentic/implementation-report.md, required: false }

  # Written from everything committed, so it reports the code the final review
  # saw. The plan is republished whether or not it changed: land repoints the
  # work plan at this session only when its slice rows or its contract differ
  # from the epic's, and then the next slice is planned from this session's plan.
  # The sweep drafts stay in the worktree, where land reads them through
  # sweep.json; they are not published, since most slices write none.
  - id: report
    name: Report how the slice departed from the plan and draft the sweep
    type: agent
    env: { CLAUDE_CODE_EFFORT_LEVEL: medium }
    prompt: |
      Compare `git diff origin/main...HEAD` with slice {{ steps.next.outputs.slice }} of
      .agentic/plan.md and .agentic/plan.json, with issue ${{ inputs.issue }} and with issue
      {{ steps.start.outputs.issue }}, which the slice is worked on (the same issue unless the slice
      has its own). Read them with `gh issue view`.

      1. Write .agentic/slice-report.md with bullets under the headings Departures, Later slices
         affected and Deferred, omitting a heading with nothing under it. Every deferred item
         names the slice or issue that owns it.
      2. Later slices are phased only when they come up, from this plan when it is amended, so
         amend what they will be planned against:
         - If a later slice's row is now wrong (its title, dependencies or outcomes), amend that
           row in the Slices section of .agentic/plan.md and in .agentic/plan.json. When a later
           slice has its own issue (its `child`) whose description this change makes false, the
           sweep below corrects that issue too.
         - If this slice landed a convention, exemplar, ownership row, lint gate or decision
           differently from the contract, or made a contract sentence false, amend the Feature
           contract section of .agentic/plan.md and the contract in .agentic/plan.json to match
           what landed. Never reverse a decision settled by the user (`settled_by.kind` `user`):
           report it under Departures instead.
         Keep plan.json in the shape Step 5 of `.dovo/catalog/prompts/sdlc/v2/issue-plan.md` defines,
         and say under Later slices affected what was amended. Never change this slice or an
         earlier one.
      3. Find the open issues whose body this change makes false: the epic's open sub-issues,
         the issues the feature contract maps, and any open issue citing code this change moved,
         renamed or removed. Leave out issue ${{ inputs.issue }}, whose description stays what a
         person wrote, and issue {{ steps.start.outputs.issue }}, which this PR references. For each one:
         - Fetch its body once with `gh issue view <n> --json body` and take the sha256 of the
           `body` string, UTF-8 encoded, exactly as that JSON returns it (no newline added).
         - Write .agentic/sweep/<n>.md: the whole body with only the false sentences corrected.
         - Write .agentic/sweep/<n>.comment.md: one short paragraph naming slice
           {{ steps.next.outputs.slice }} of #${{ inputs.issue }} and each sentence changed.
      4. Write .agentic/sweep.json: a JSON array with one object per issue from step 3, with the
         keys issue (a number), expected_body_sha256, body_file and comment_file. The file paths
         are relative to .agentic/, as in "sweep/1060.md". Write [] when no issue is affected.

      Do not edit any issue, and do not commit, stage or push.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: slice-report, path: .agentic/slice-report.md }
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }
      - { name: sweep, path: .agentic/sweep.json }

  # Written last, from everything committed, so the PR text matches the code
  # the final review saw rather than the code before the fix rounds.
  - id: pr-describe
    name: Describe the PR from the reviewed branch
    type: agent
    prompt: |
      Follow .dovo/catalog/prompts/sdlc/v2/pr-prep.md to draft only .agentic/pr-title
      and .agentic/pr-description, overwriting both. The change implements slice
      {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }}, worked on issue
      {{ steps.start.outputs.issue }}; .agentic/slice-report.md says how it departed from the plan.
      Everything is already committed, so read it with `git log --oneline origin/main..HEAD` and
      `git diff origin/main...HEAD` instead of the uncommitted diff, and ignore `.dovo/run`. The
      prompt's stop when nothing is uncommitted does not apply here: always rewrite both files.
      End .agentic/pr-description with the closing lines between the two markers below, one or
      two of them, exactly as given and in this order, each on a line of its own. Use no other
      closing keyword (Fixes, Closes, Resolves) anywhere else in the description.
      --- closing lines ---
      {{ steps.start.outputs.closing_lines }}
      --- end of closing lines ---
      Do not touch .agentic/commit-msg or .agentic/pr-branch, and do not commit, stage or push.
    tools: { allow_all: true }
    timeout_seconds: 900
    artifacts:
      - { name: pr-description, path: .agentic/pr-description }

  # A command step, not an agent step: it inherits the host environment, so git
  # reaches the user's SSH agent, which agent steps never see.
  - id: push
    name: Push and open the PR
    run: uv run python scripts/pr.py
    timeout_seconds: 600

  # Pauses on failure rather than finishing without the comment: retry after a
  # GitHub error, or continue when the publisher refused a review that no
  # longer matches the PR head (a fix landed after the final review).
  - id: post-review
    uses: post-review

  # A command step: the issue bodies are written by the script alone, with the
  # host's gh credentials. Pauses on failure so a GitHub error can be retried;
  # the PR is already open. The sweep never writes the issue or the slice's own
  # issue, whose descriptions only a person writes: land skips such an entry
  # and names it. The work plan row gets the slice's status and pull request
  # only: the slice report stays in this session's slice-report artifact,
  # which the next slice's run downloads.
  - id: land
    name: Record the slice as landed and apply the sweep
    run: >-
      uv run python .dovo/catalog/scripts/sdlc/v2/workplan.py land --issue ${{ inputs.issue }}
      --slice {{ steps.next.outputs.slice }} --session "$DOVO_SESSION_ID"
      --pr "$(head -n 1 .agentic/pr-url | sed 's#.*/##')"
      --plan .agentic/plan.json --base-plan .agentic/epic-plan.json
      --sweep .agentic/sweep.json
    timeout_seconds: 300
    on_failure: prompt_user

  # land computes the closing lines again from the plan as landed: a report
  # that added a slice, or a slice handed off and closed meanwhile, changes them
  # from the ones `start` gave pr-describe. The PR description is edited only
  # when its closing lines differ, so a "Closes" line is never missing or wrong.
  # A closing line for the issue or the slice's own issue under any GitHub
  # closing keyword is replaced; one inside a code block or naming another
  # issue is kept.
  - id: pr-links
    name: Correct the PR's closing lines to the plan as landed
    run: >-
      uv run python .dovo/catalog/scripts/sdlc/v2/workplan.py pr-links
      --pr "$(head -n 1 .agentic/pr-url | sed 's#.*/##')" --closing-lines "$CLOSING_LINES"
    env:
      CLOSING_LINES: "{{ steps.land.outputs.closing_lines }}"
    timeout_seconds: 120
    on_failure: prompt_user
