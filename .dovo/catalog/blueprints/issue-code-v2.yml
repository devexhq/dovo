# The in-development v2 of `issue-code.yml`, run on sdlc v2's prompts and
# scripts (`.dovo/catalog/prompts/sdlc/v2/VERSION.json`). Never run it on an
# issue a v1 run touches: both write the same work plan.
#
# Forked from `feature-dev.yml` and `ready-issue.yml` at `944de0ce`.
# Temporary: an experimental copy for the slice flow, which replaces
# feature-dev and the dovo-* skills once it works. Compare fixes to either
# source against this copy and carry them over. Step ids, timeouts, failure
# policies and artifact names match feature-dev's wherever the slice flow does
# not change them, so commit-fixes, post-review and pr_feedback.py work on
# slice PRs unchanged, and grade_inputs.py only adds the slice's phase count,
# since the code loop runs one iteration per phase.
version: 1
name: issue-code-v2
id: issue-code-v2
description: Pick the next ready slice of an issue's work plan, holding for a person while every slice waits on one, load the plan from the session that wrote it, ready the slice's child issue if it is not labelled dovo:ready, holding for a person and re-checking it while it is not ready, plan the slice's phases just in time and review, challenge, answer and approve that plan, claim the slice, implement the slice one phase per agent session and commit each phase once it passes the quality gate, review and fix blockers and warnings until none remain or only a person can settle them, report how the slice departed from the plan, then open a PR that closes the child issue, post the final review and record the slice as landed in the work plan
summary: Next slice of a work plan to a reviewed PR

inputs:
  issue:
    type: string
    description: GitHub issue number whose work plan holds the slice (the epic, or a plain issue)
    required: true
    aliases: ["-i", "--issue"]

steps:
  # The session's own worktree, so moving it loses nothing: the slice starts
  # from main as it is now, where the previous slice merged.
  - id: base
    name: Check out origin/main
    run: git fetch -q origin main && git switch -q --detach origin/main
    timeout_seconds: 120

  # Picks without claiming. When the slices wait on a person (a blocker still
  # open, a slice not yet merged, a slice's PR in review), `next` lists why in
  # its holds file instead of refusing, and the run holds at a prompt that lists
  # them; once the person has merged or closed what they wait on and answers
  # (or continues a paused run with `dovo resume`), the loop picks again. It
  # still refuses, with its reason on stderr, when a slice is in progress, when
  # an active slice's PR was closed unmerged, or when every slice is merged; the
  # run stops there. The run's failure line shows only the exit code, so the
  # reason is read with `dovo logs <session> --step next`.
  - id: pick-loop
    name: Pick the next slice once nothing it waits on needs a person
    type: loop
    max_iterations: 5
    until:
      # Workaround for #1141: a failed picked is recorded as ignored with exit
      # code 0, so only its status shows the failure. Revert to
      # `steps.picked.exit_code == 0` when #1141 lands.
      - steps.picked.status == "completed"
    on_max_iterations: prompt_user
    do:
      - id: next
        name: Pick the next slice
        run: >-
          uv run python .dovo/catalog/scripts/sdlc/v2/workplan.py next --issue ${{ inputs.issue }}
          --hold .agentic/next-hold.json
        timeout_seconds: 300
        artifacts:
          - { name: next-hold, path: .agentic/next-hold.json }

      # No prompt is shown when a slice was picked.
      - id: next-hold
        name: Wait for a person to unblock a slice
        type: ask
        interaction:
          mode: multiselect
          message: >-
            No slice of issue ${{ inputs.issue }} can start yet; each slice below says what it waits
            on. Merge or close it on GitHub, then select the slices you unblocked to pick again. To
            stop for now, press Ctrl-C: the run stays paused, and `dovo resume` asks again.
          artifact: next-hold
          options_from:
            artifact: next-hold
            file: .agentic/next-hold.json
            items_path: holds
            value_field: id
            label_field: label

      # Fails, and so repeats the loop, only when next held instead of picking.
      - id: picked
        name: Pick again unless a slice was picked
        run: test -n "{{ steps.next.outputs.slice }}"
        timeout_seconds: 60
        on_failure: continue

  # The latest revisions of the session the work plan points at: the planning
  # session, or the code session of the last slice that amended the plan.
  - id: load-plan
    name: Load the plan
    uses: dovo/download-artifact
    env:
      ARTIFACT_NAME: plan
      ARTIFACT_DEST: .
      ARTIFACT_SESSION_ID: "{{ steps.next.outputs.plan_session }}"

  - id: load-plan-questions
    name: Load the plan's JSON
    uses: dovo/download-artifact
    env:
      ARTIFACT_NAME: plan-questions
      ARTIFACT_DEST: .
      ARTIFACT_SESSION_ID: "{{ steps.next.outputs.plan_session }}"

  # The plan step rewrites .agentic/plan.{md,json} in place, so the epic plan
  # this run starts from is kept beside them: slice planning (and a retry of
  # it) starts from the copy, the slice plan's review diffs the contract and
  # slices against it, and land checks the epic's contract three ways with it.
  # The copy records the child `next` picked on the slice, since a child
  # `next` created from the slice's stub is still `null` in the downloaded plan,
  # and every later step reads the child from plan.json.
  - id: keep-epic-plan
    name: Keep the epic plan this run starts from
    run: |
      cp .agentic/plan.md .agentic/epic-plan.md
      uv run --quiet python -c '
      import json, sys
      plan = json.load(open(".agentic/plan.json"))
      for row in plan["slices"]:
          if row["id"] == sys.argv[1]:
              row["child"], row["stub"] = int(sys.argv[2]), None
      json.dump(plan, open(".agentic/epic-plan.json", "w"), indent=2)
      ' "{{ steps.next.outputs.slice }}" "{{ steps.next.outputs.child }}"
    timeout_seconds: 120

  # --- ready-issue's gate steps, run on the slice's child issue. A step cannot
  # be skipped, so each of them passes straight through when the child is
  # already labelled dovo:ready. ---

  - id: child-ready
    name: Check whether the child issue is labelled dovo:ready
    run: |
      set -eu
      labels=$(gh issue view {{ steps.next.outputs.child }} --json labels --jq '.labels[].name')
      if printf '%s\n' "$labels" | grep -qx 'dovo:ready'; then
        echo "Issue {{ steps.next.outputs.child }} is labelled dovo:ready."
        echo "labelled=true" >> "$DOVO_OUTPUT"
      else
        echo "Issue {{ steps.next.outputs.child }} is not labelled dovo:ready; readying it."
        echo "labelled=false" >> "$DOVO_OUTPUT"
      fi
    timeout_seconds: 120

  # A not_ready child needs a person: a size label, a split, a decision or a
  # closed blocker, which no edit here can supply. Rather than failing, the run
  # holds at a prompt that lists the findings, so the person settles them on
  # GitHub and answers (or leaves the run paused and continues it later with
  # `dovo resume`). The loop then re-runs the check, since the gate reads the
  # verdict the check wrote, and ends once the verdict is ready or needs_edits.
  - id: ready-loop
    name: Check the child issue until no person needs to settle it
    type: loop
    max_iterations: 5
    until:
      # Workaround for #1141: a failed settled is recorded as ignored with exit
      # code 0, so only its status shows the failure. Revert to
      # `steps.settled.exit_code == 0` when #1141 lands.
      - steps.settled.status == "completed"
    on_max_iterations: prompt_user
    do:
      # Each check grounds against main as it is now, including a blocker
      # merged while the run was held.
      - id: ready-base
        name: Check out origin/main for the check
        run: git fetch -q origin main && git switch -q --detach origin/main
        timeout_seconds: 120

      - id: check
        name: Re-ground and re-check the child issue
        type: agent
        prompt: |
          Child issue already labelled dovo:ready: {{ steps.child-ready.outputs.labelled }}

          If that is true, write only .agentic/issue-ready.md, containing the one line
          "Issue #{{ steps.next.outputs.child }} is already labelled dovo:ready; not re-checked.",
          and stop. Otherwise run:

          Follow the Ready mode section of .dovo/catalog/prompts/sdlc/v2/issue-ready.md for issue {{ steps.next.outputs.child }}. Write .agentic/issue-ready.md, .agentic/issue-ready.json and
          .agentic/issue-ready-comment.md, plus .agentic/issue-title and .agentic/issue-body.md when the
          verdict is needs_edits. Do not edit the issue, its labels or its comments.
          Findings of the previous check a person says they settled, if any: {{ steps.hold.outputs.selected }}
          Their notes: {{ steps.hold.outputs.comment }}
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts:
          - { name: issue-ready, path: ".agentic/issue-*" }

      # Any verdict but ready means the current body is stale, so a label left
      # from an earlier run is removed and never vouches for it; apply adds it
      # back after the edits. Lists what a person must settle: every finding of a
      # not_ready verdict, and nothing otherwise.
      - id: gate
        name: List what a person must settle on the child issue
        run: |
          set -eu
          if [ "{{ steps.child-ready.outputs.labelled }}" = "true" ]; then
            echo "Already labelled dovo:ready."
            echo "verdict=labelled" >> "$DOVO_OUTPUT"
            printf '{"holds": []}\n' > .agentic/issue-hold.json
            exit 0
          fi
          verdict=$(uv run --quiet python -c 'import json; print(json.load(open(".agentic/issue-ready.json"))["verdict"])')
          echo "Verdict: $verdict"
          echo "verdict=$verdict" >> "$DOVO_OUTPUT"
          if [ "$verdict" != "ready" ]; then
            labels=$(gh issue view {{ steps.next.outputs.child }} --json labels --jq '.labels[].name')
            if printf '%s\n' "$labels" | grep -qx 'dovo:ready'; then
              gh issue edit {{ steps.next.outputs.child }} --remove-label dovo:ready
            fi
          fi
          uv run --quiet python - <<'PY'
          import json
          report = json.load(open(".agentic/issue-ready.json"))
          findings = report["findings"] if report["verdict"] == "not_ready" else []
          holds = [{"id": f["id"], "label": f"{f['id']} ({f['kind']}): {f['summary']} Fix: {f['fix']}"} for f in findings]
          if report["verdict"] == "not_ready" and not holds:
              holds = [{"id": "report", "label": "The check is not_ready but lists no finding; read its report."}]
          json.dump({"holds": holds}, open(".agentic/issue-hold.json", "w"), indent=2)
          PY
          if [ "$verdict" = "not_ready" ]; then cat .agentic/issue-ready.md; fi
        timeout_seconds: 120
        artifacts:
          - { name: issue-hold, path: .agentic/issue-hold.json }
          - { name: issue-ready-report, path: .agentic/issue-ready.md }

      # No prompt is shown when the gate lists nothing.
      - id: hold
        name: Wait for a person to settle the child issue's findings
        type: ask
        interaction:
          mode: multiselect
          message: >-
            Child issue {{ steps.next.outputs.child }} of slice {{ steps.next.outputs.slice }} is not
            ready to plan, and only a person can settle why: the check's findings are listed below,
            and its report is attached. Settle them on GitHub (a size label, a split, a decision, a
            closed blocker), then select the ones you settled to re-check the issue. To stop for
            now, press Ctrl-C: the run stays paused, and `dovo resume` asks again.
          artifact: issue-ready-report
          options_from:
            artifact: issue-hold
            file: .agentic/issue-hold.json
            items_path: holds
            value_field: id
            label_field: label
          comment: { policy: optional, message: "What you changed, for the re-check" }

      # Fails, and so repeats the loop, only when the verdict was not_ready.
      - id: settled
        name: Re-check the child issue unless no person was needed
        run: test "{{ steps.gate.outputs.verdict }}" != "not_ready"
        timeout_seconds: 60
        on_failure: continue

  # Asked on every run, including one where the child is already labelled,
  # since a step cannot be skipped; denying stops the run with the issue
  # untouched.
  - id: approve
    name: Approve the edits and the label
    type: ask
    interaction:
      mode: confirm
      message: >-
        Apply the proposed edits, if any, to child issue {{ steps.next.outputs.child }} and label it
        dovo:ready? Already labelled: {{ steps.child-ready.outputs.labelled }} (when true, nothing is applied).
      artifact: issue-ready

  # A command step: the writes to GitHub run exactly as approved, with the
  # host's gh credentials.
  - id: apply
    name: Apply the edits, label the child issue and comment
    run: |
      set -eu
      [ "{{ steps.child-ready.outputs.labelled }}" = "true" ] && { echo "Already labelled dovo:ready; nothing to apply."; exit 0; }
      verdict=$(uv run --quiet python -c 'import json; print(json.load(open(".agentic/issue-ready.json"))["verdict"])')
      if [ "$verdict" = "needs_edits" ]; then
        for proposal in .agentic/issue-title .agentic/issue-body.md; do
          [ -s "$proposal" ] || { echo "Verdict is needs_edits but $proposal is missing or empty; not labelling."; exit 1; }
        done
        gh issue edit {{ steps.next.outputs.child }} --title "$(head -n 1 .agentic/issue-title)" --body-file .agentic/issue-body.md
      elif [ "$verdict" != "ready" ]; then
        echo "Unexpected verdict '$verdict'; not labelling."
        exit 1
      fi
      gh label create dovo:ready --color 0e8a16 --description "Re-grounded against main and ready to plan" --force
      gh issue edit {{ steps.next.outputs.child }} --add-label dovo:ready
      gh issue comment {{ steps.next.outputs.child }} --body-file .agentic/issue-ready-comment.md
    timeout_seconds: 300

  # --- issue-plan.yml's planning half (feature-dev's), scoped to the slice:
  # the slice is phased just in time, against main as it is now and the "as
  # landed" reports of the slices before it. The plan artifacts this session
  # publishes hold the slice's plan, with the epic's contract and slices kept
  # as downloaded. ---

  # main can move while the child issue waits for a person above, so the
  # slice is planned against main as it is when planning starts.
  - id: refresh-base
    name: Check out origin/main again
    run: git fetch -q origin main && git switch -q --detach origin/main
    timeout_seconds: 120

  - id: plan
    name: Plan the slice
    type: agent
    prompt: |
      Follow .dovo/catalog/prompts/sdlc/v2/issue-plan.md in the mode `/issue-plan --slice {{ steps.next.outputs.slice }}`.
      Plan slice {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }}, tracked by issue
      {{ steps.next.outputs.child }}, from the epic plan in .agentic/epic-plan.md and
      .agentic/epic-plan.json.
      Write its phases to .agentic/plan.md and .agentic/plan.json, keeping the contract and the
      slices as downloaded, then stop; do not implement anything.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  # One review, folded in whole without asking; the human weighs the result at
  # the open questions and the plan approval that follow.
  - id: plan-review
    name: Review the slice's plan
    type: agent
    prompt: |
      Follow .dovo/catalog/prompts/sdlc/v2/issue-plan-review.md in the mode `/issue-plan-review --slice {{ steps.next.outputs.slice }}`.
      Review .agentic/plan.md and write findings to .agentic/plan-review.md and
      .agentic/plan-review.json.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan-review, path: .agentic/plan-review.md }
      - { name: plan-findings, path: .agentic/plan-review.json }

  # Challenges the design rather than its compliance, without reading the
  # review. Challenges routed fold are folded below; those routed ask become
  # open questions, so a human settles every trade-off and issue departure.
  - id: plan-challenge
    name: Challenge the slice plan's design
    type: agent
    prompt: |
      Follow .dovo/catalog/prompts/sdlc/v2/plan-challenge.md.
      Challenge .agentic/plan.md and write challenges to .agentic/plan-challenge.md and
      .agentic/plan-challenge.json. Do not read .agentic/plan-review.md or .agentic/plan-review.json.
      The plan phases slice {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }}, one PR,
      tracked by issue {{ steps.next.outputs.child }}. Its feature contract and its slices table
      were approved when the issue was sliced and bind it: challenge the slice's phases against
      them, and route "ask" any challenge that would change the contract or another slice.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan-challenge, path: .agentic/plan-challenge.md }
      - { name: plan-challenges, path: .agentic/plan-challenge.json }

  - id: fold-findings
    name: Fold the review findings and challenges into the slice's plan
    type: agent
    prompt: |
      If .agentic/plan-review.json lists no findings and .agentic/plan-challenge.json lists no
      challenges, change nothing and report that you did nothing.
      Otherwise update .agentic/plan.md and .agentic/plan.json:
        - Address every finding in .agentic/plan-review.json, by id, as each one describes.
        - Fold every challenge in .agentic/plan-challenge.json routed "fold" by planning its
          alternative.
        - For every challenge routed "ask", add an open question, or rewrite the one it
          concerns, that keeps the plan's current answer as the assumed answer and lists the
          challenge's alternative under alternatives. End its summary with
          "(assumed: <plan's answer>; challenged: <alternative>; recommended: <assumed |
          challenged | none>)" and cite the challenge id and its evidence in why.
        - When a challenge contradicts a review finding, fold neither: raise one open question
          that states both positions with their ids.
        - Write every open question in the bulleted form of the plan template in
          docs/agents/planning.md, one fact per bullet. On each question a challenge or a
          conflicting finding raised, add its Challenged, Turns on and Recommended bullets:
            - Re-read the code at every `path:line` the plan and the challenge cite, and the
              issue and its comments, before you weigh them. Base the recommendation only on
              what you confirmed, and drop any evidence that does not hold.
            - Turns on names the one fact or preference the choice depends on, so the human
              can dispute the premise rather than the verdict.
            - Recommend "assumed" or "challenged", or "none" when the choice depends on a
              preference the code cannot settle. Give the strongest point for the side you
              do not recommend. The plan being written against its answer is no reason to
              recommend it.
            - Add a Note for an issue sentence the choice reverses, a follow-up it needs, or
              the test that would pin it.
        - Addressing a finding or challenge may make an open question moot, change its assumed
          answer or raise a new one: remove, rewrite or add entries under Open questions to match.
        - Keep .agentic/plan.json in the shape the issue-plan prompt defines for slice mode
          (`.dovo/catalog/prompts/sdlc/v2/issue-plan.md`), and in agreement with .agentic/plan.md. Never
          change its contract or slices, or the plan's Feature contract and Slices sections,
          other than slice {{ steps.next.outputs.slice }}'s phases: a finding or challenge that
          needs either changed becomes an open question whose assumed answer keeps them.
      Do not implement any code, commit or push. Change only .agentic/plan.md and .agentic/plan.json.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  # Asked after the findings are folded in, so every question reflects them.
  - id: answer-questions
    name: Answer the slice plan's open questions
    type: ask
    interaction:
      mode: multiselect
      message: Which open questions do you want to answer instead of accepting the plan's assumed answer?
      artifact: plan
      options_from:
        artifact: plan-questions
        file: .agentic/plan.json
        items_path: open_questions
        value_field: id
        label_field: summary
      comment: { policy: optional, message: "Your answers, one per selected question (e.g. OQ-1: show them)" }

  # Always runs its fold, ticked or not: every open question leaves as a
  # decision, settled by the human's answer or by the plan's assumed one.
  - id: fold-answers
    name: Settle the slice plan's open questions as decisions
    type: agent
    prompt: |
      Follow .dovo/catalog/prompts/sdlc/v2/fold-answers.md.
      Open questions the human ticked: {{ steps.answer-questions.outputs.selected }}
      The human's answers: {{ steps.answer-questions.outputs.comment }}
      The plan phases slice {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }}, tracked
      by child issue {{ steps.next.outputs.child }}.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }

  # Stops the run before the walkthrough when fold-answers left a question
  # open or wrote a malformed decision; the message names which.
  - id: check-questions
    name: Check that every open question is settled
    run: uv run --quiet python .dovo/catalog/scripts/sdlc/v2/plan.py check-questions --plan .agentic/plan.json
    timeout_seconds: 120

  # Written after every answer is folded in, so it explains the plan being
  # approved. The approval prompt shows it rather than the plan, which is cut
  # at 200 lines there; the full plan stays in the plan artifact.
  - id: plan-walkthrough
    name: Walk through the slice's plan for the approver
    type: agent
    prompt: |
      Follow .dovo/catalog/prompts/sdlc/v2/plan-walkthrough.md.
      Explain .agentic/plan.md to the person approving it and write .agentic/plan-walkthrough.md.
      The plan phases slice {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }}, tracked
      by issue {{ steps.next.outputs.child }}, within the feature contract and slices approved
      when the issue was sliced: explain this slice's phases, and say which "as landed" reports
      of earlier slices shaped them.
      Do not change the plan, implement anything, commit or push.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: plan-walkthrough, path: .agentic/plan-walkthrough.md }

  - id: approve-plan
    name: Approve the slice's plan
    type: ask
    interaction:
      mode: confirm
      message: >-
        Approve this plan for slice {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }}
        (child issue {{ steps.next.outputs.child }})? The full plan is in the plan artifact.
      artifact: plan-walkthrough
      comment: { policy: optional, message: Instructions for the implementer }

  # Installed after refresh-base's checkout and before the first agent writes
  # code, so its first test run finds every project dependency. Runs before
  # claim, so a failed install leaves the slice pending.
  - id: sync
    name: Install the project's dependencies
    run: uv sync --all-extras
    timeout_seconds: 900

  # Claimed only once the child issue is ready, the slice's plan approved and
  # the dependencies installed, so a run stopped while its child issue is held
  # for a person, a plan the person denies, or a failed install leaves the slice
  # pending rather than stuck in progress.
  - id: claim
    name: Claim the slice for this session
    run: >-
      uv run python .dovo/catalog/scripts/sdlc/v2/workplan.py claim --issue ${{ inputs.issue }}
      --slice {{ steps.next.outputs.slice }} --session "$DOVO_SESSION_ID"
    timeout_seconds: 120

  # --- feature-dev's code and review loops, scoped to the slice. ---

  # One phase of the slice per iteration, each in a fresh agent session that
  # learns what earlier phases did from their commits and report entries. A
  # phase is committed on the detached HEAD, and recorded as done in
  # .agentic/code-progress.json, only once its gate passed; a failed gate
  # leaves it out of done, so the next iteration retries the same phase with
  # gate.log present, and a resumed run starts at the first phase not done.
  - id: code-loop
    name: Implement and commit one phase at a time until every phase passes the quality gate
    type: loop
    max_iterations: 8
    until:
      - steps.code.outputs.status != "unfixable"
      - steps.code.outputs.status != "timeout"
      - steps.code.outputs.status != "provider_error"
      - steps.code.outputs.status != "blocked"
      # Read from phase's stdout JSON; its $DOVO_OUTPUT lines feed the templates.
      - steps.phase.outputs.remaining == 0
      # Workaround for #1141: a failed verify is recorded as ignored with exit
      # code 0, so only its status shows the failure. Revert to
      # `steps.verify.exit_code == 0` when #1141 lands.
      - steps.verify.status == "completed"
    on_max_iterations: prompt_user
    do:
      # Fails, and stops the run before code, when the slice has no phases or
      # the progress record is unreadable or for another slice.
      - id: phase
        name: Pick the next unfinished phase
        run: uv run --quiet python .dovo/catalog/scripts/sdlc/v2/code_progress.py next --slice {{ steps.next.outputs.slice }}
        timeout_seconds: 120

      - id: code
        name: Implement the phase
        type: agent
        prompt: |
          Follow .dovo/catalog/prompts/sdlc/v2/issue-code.md in the mode `/issue-code --slice {{ steps.next.outputs.slice }} --phase {{ steps.phase.outputs.phase }}`.
          Implement only phase {{ steps.phase.outputs.phase }} of slice
          {{ steps.next.outputs.slice }} of .agentic/plan.md for issue ${{ inputs.issue }}; its
          child issue is {{ steps.next.outputs.child }}. Earlier phases are already committed. Do
          not commit, stage or push.
          Instructions from the approver: {{ steps.approve-plan.outputs.comment }}
          Uncommitted changes outside .agentic/ and .dovo/run are an earlier attempt at this
          phase: keep and finish them. If .agentic/gate.log exists, that attempt failed the
          quality gate: read the log and fix what it reports.
        tools: { allow_all: true }
        timeout_seconds: 3600
        artifacts: [{ name: implementation-report, path: .agentic/implementation-report.md }]

      - id: verify
        name: Run the quality gate
        run: uv run dovo run quality > .agentic/gate.log 2>&1
        timeout_seconds: 1800
        on_failure: continue

      # Commits the phase without pushing, then records it as done: commit
      # first, so a phase is in done only once its changes are committed. A
      # phase that changed nothing is recorded with no commit. A failed commit
      # (no or a rejected .agentic/phase-commit-msg included) pauses for the
      # person and leaves the phase out of done. The passing gate.log is
      # deleted before the commit, so gate.log exists only after a failed gate,
      # even when a failed commit sends the same phase round again.
      - id: checkpoint
        name: Commit the phase and record it as done
        run: |
          set -eu
          phase="{{ steps.phase.outputs.phase }}"
          if [ "{{ steps.verify.status }}" != completed ] || [ "$phase" = done ]; then exit 0; fi
          rm -f .agentic/gate.log
          git rm -r -q --cached --ignore-unmatch .dovo/run
          git add -A
          if ! git diff --cached --quiet; then
            test -s .agentic/phase-commit-msg || { echo "phase $phase changed files but wrote no .agentic/phase-commit-msg" >&2; exit 1; }
            uv run --quiet python scripts/check_commit_msg.py .agentic/phase-commit-msg
            git commit -q -F .agentic/phase-commit-msg
          fi
          uv run --quiet python .dovo/catalog/scripts/sdlc/v2/code_progress.py record --slice {{ steps.next.outputs.slice }} --phase "$phase"
          rm -f .agentic/phase-commit-msg
        timeout_seconds: 300
        on_failure: prompt_user

  - id: pr-prep
    name: Draft the commit message and branch name
    type: agent
    prompt: |
      Follow .dovo/catalog/prompts/sdlc/v2/pr-prep.md. The change implements slice {{ steps.next.outputs.slice }} of
      issue ${{ inputs.issue }}, tracked by issue {{ steps.next.outputs.child }}.
      The code loop committed each phase, so read the change with
      `git log --oneline origin/main..HEAD` and `git diff origin/main...HEAD`, plus `git status`
      for anything left uncommitted, and ignore `.dovo/run` and `.agentic/`. The prompt's stop
      when nothing is uncommitted does not apply here: always write .agentic/commit-msg, which
      commits whatever is still uncommitted, if anything. The commit message and branch name are
      used now; `pr-describe` rewrites the PR title and description after review. Also write
      .agentic/pr-branch: one line, a new branch name `<username>/<short-description>`, with the
      username your own branches use.
    tools: { allow_all: true }
    timeout_seconds: 900

  # A command step: it puts the phase commits on the PR branch, created at
  # HEAD, and commits whatever the code loop left uncommitted, so each review
  # round reviews, and stamps, a real commit. With nothing left it makes no
  # commit. Nothing is squashed later: the PR's commits are the phase commits,
  # in phase order, then this one when there is one. A retry after a failure
  # stays on the branch the first attempt created, and a branch name that
  # already exists elsewhere still fails the switch.
  - id: commit
    name: Put the phase commits on the PR branch and commit what remains
    run: |
      set -eu
      branch=$(head -n 1 .agentic/pr-branch)
      git fetch -q origin main
      [ "$(git branch --show-current)" = "$branch" ] || git switch -q -c "$branch"
      git rm -r -q --cached --ignore-unmatch .dovo/run
      git add -A
      if git diff --cached --quiet; then exit 0; fi
      git commit -q -F .agentic/commit-msg
    timeout_seconds: 300
    on_failure: prompt_user

  # Fixes every blocker and warning without asking, until a review reports
  # none or sets action needs_human or replan, which only a person can settle:
  # the run then opens the PR and the posted review carries that decision.
  # Suggestions and nits stay in the posted review for the human. The round
  # that ends the loop still runs the fixer, which then changes nothing. After
  # the last round the run still opens the PR, and the posted review lists what
  # is left.
  - id: review-loop
    name: Review and fix until no blockers or warnings remain or a person must decide
    type: loop
    max_iterations: 3
    until:
      # Workaround for #1141: a failed remaining is recorded as ignored with
      # exit code 0, so only its status shows the failure. Revert to
      # `steps.remaining.exit_code == 0` when #1141 lands.
      - steps.remaining.status == "completed"
      # A round whose fixer changed files, a gate repair included, needs a fresh
      # review: post-review refuses a review of a commit that is no longer the head.
      - steps.fix-verify.status == "completed"
      - steps.fix-verify.outputs.changed == "false"
    on_max_iterations: continue
    do:
      - id: review
        name: Review the change
        type: agent
        prompt: |
          Follow .dovo/catalog/prompts/sdlc/v2/issue-review.md in the mode `/issue-review --slice {{ steps.next.outputs.slice }}`.
          Review the commits on this branch against origin/main as slice
          {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }}, tracked by issue
          {{ steps.next.outputs.child }}, and write .agentic/review.md, .agentic/review.json
          and .agentic/verdict.txt. Do not read .agentic/implementation-report.md.
        tools: { allow_all: true }
        timeout_seconds: 1800
        artifacts: [{ name: review, path: ".agentic/review.*" }]

      - id: remaining
        name: Check for blockers and warnings an agent can fix
        run: >-
          uv run python -c 'import json, sys;
          review = json.load(open(".agentic/review.json"));
          needs_person = review.get("action") in ("needs_human", "replan");
          sys.exit(not needs_person and any(f["severity"] in ("BLOCKER", "WARNING") for f in review["findings"]))'
        on_failure: continue

      - id: fix
        name: Fix the blockers and warnings
        type: agent
        prompt: |
          Follow .dovo/catalog/prompts/sdlc/v2/issue-code.md in the mode `/issue-code review --tiers blockers,warnings`.
          If .agentic/review.json lists no BLOCKER or WARNING findings, or its action is
          needs_human or replan, fix no findings. If .agentic/fix-gate.log exists, the last
          round's fixes failed the quality gate: fix what it reports, and add a line
          `- quality gate: <what changed, with path>` to .agentic/fix-commit-msg. When you
          changed nothing, report that you did nothing. Do not commit, stage or push.
        tools: { allow_all: true }
        timeout_seconds: 3600
        artifacts: [{ name: implementation-report, path: .agentic/implementation-report.md }]

      # The fixer runs only scoped checks, so the full gate runs here. A round
      # that changed nothing skips it unless the last round's gate failed.
      # stdout is only the JSON object `until` reads; the gate's own output goes
      # to fix-gate.log.
      - id: fix-verify
        name: Run the quality gate on the fixes
        run: |
          if [ -n "$(git status --porcelain -- . ':!.dovo/run')" ]; then changed=true; else changed=false; fi
          printf '{"changed": "%s"}\n' "$changed"
          if [ ! -e .agentic/fix-gate.log ] && [ "$changed" = false ]; then
            echo "The fixer changed nothing; the gate the code loop passed still holds." >&2
            exit 0
          fi
          if uv run dovo run quality > .agentic/fix-gate.log 2>&1; then rm .agentic/fix-gate.log; else exit 1; fi
        timeout_seconds: 1800
        on_failure: continue

      - id: commit-fixes
        uses: commit-fixes

  # fix-gate.log is left only when the last gate on the fixes failed, which a
  # loop that ran out of rounds lets through. Unresolved findings still publish.
  - id: fix-gate
    name: Stop before publishing when the fixes fail the quality gate
    run: |
      if [ -e .agentic/fix-gate.log ]; then
        echo "The review fixes fail the quality gate; fix .agentic/fix-gate.log before resuming." >&2
        tail -n 40 .agentic/fix-gate.log >&2
        exit 1
      fi
    on_failure: prompt_user

  # Written from everything committed, so it reports the code the final review
  # saw. The plan is republished whether or not it changed: land repoints the
  # work plan at this session only when its slice rows or its contract differ
  # from the epic's, and then the next slice is planned from this session's plan.
  # The sweep drafts stay in the worktree, where land reads them through
  # sweep.json; they are not published, since most slices write none.
  - id: report
    name: Report how the slice departed from the plan and draft the sweep
    type: agent
    prompt: |
      Compare `git diff origin/main...HEAD` with slice {{ steps.next.outputs.slice }} of
      .agentic/plan.md and .agentic/plan.json, with issue ${{ inputs.issue }} and with its child
      issue {{ steps.next.outputs.child }}. Read both issues with `gh issue view`.

      1. Write .agentic/slice-report.md with bullets under the headings Departures, Later slices
         affected and Deferred, omitting a heading with nothing under it. Every deferred item
         names the slice or issue that owns it.
      2. Later slices are phased only when they come up, from this plan when it is amended, so
         amend what they will be planned against:
         - If a later slice's row is now wrong (its title, dependencies or stub), amend that row
           in the Slices section of .agentic/plan.md and in .agentic/plan.json. A later slice
           whose child issue already exists is corrected through the sweep below, not its stub.
         - If this slice landed a convention, exemplar, ownership row, lint gate or decision
           differently from the contract, or made a contract sentence false, amend the Feature
           contract section of .agentic/plan.md and the contract in .agentic/plan.json to match
           what landed. Never reverse a decision settled by the user (`settled_by.kind` `user`):
           report it under Departures instead.
         - If this slice settled one of the epic's open questions (listed under Decisions in the
           epic's Feature contract, `gh issue view ${{ inputs.issue }} --json body`), add a
           decision to the contract whose `id` is that question's id (such as `OQ-2`), with the
           answer that landed and `settled_by` naming this slice. land then drops the question
           from the epic's open questions; a question with no such decision stays open.
         Keep plan.json in the shape the issue-plan prompt defines (`.dovo/catalog/prompts/sdlc/v2/issue-plan.md`),
         and say under Later slices affected what was amended. Never change this slice or an
         earlier one.
      3. Find the open issues whose body this change makes false: the epic's open sub-issues,
         the issues the feature contract maps, and any open issue citing code this change moved,
         renamed or removed. Leave out issue ${{ inputs.issue }}, whose body the work plan script
         owns, and child issue {{ steps.next.outputs.child }}, which this PR closes. For each one:
         - Fetch its body once with `gh issue view <n> --json body` and take the sha256 of the
           `body` string, UTF-8 encoded, exactly as that JSON returns it (no newline added).
         - Write .agentic/sweep/<n>.md: the whole body with only the false sentences corrected.
         - Write .agentic/sweep/<n>.comment.md: one short paragraph naming slice
           {{ steps.next.outputs.slice }} of #${{ inputs.issue }} and each sentence changed.
      4. Write .agentic/sweep.json: a JSON array with one object per issue from step 3, with the
         keys issue (a number), expected_body_sha256, body_file and comment_file. The file paths
         are relative to .agentic/, as in "sweep/1060.md". Write [] when no issue is affected.

      Do not edit any issue, and do not commit, stage or push.
    tools: { allow_all: true }
    timeout_seconds: 1800
    artifacts:
      - { name: slice-report, path: .agentic/slice-report.md }
      - { name: plan, path: .agentic/plan.md }
      - { name: plan-questions, path: .agentic/plan.json }
      - { name: sweep, path: .agentic/sweep.json }

  # Written last, from everything committed, so the PR text matches the code
  # the final review saw rather than the code before the fix rounds.
  - id: pr-describe
    name: Describe the PR from the reviewed branch
    type: agent
    prompt: |
      Follow .dovo/catalog/prompts/sdlc/v2/pr-prep.md to draft only .agentic/pr-title
      and .agentic/pr-description, overwriting both. The change implements slice
      {{ steps.next.outputs.slice }} of issue ${{ inputs.issue }}, tracked by issue
      {{ steps.next.outputs.child }}; .agentic/slice-report.md says how it departed from the plan.
      Everything is already committed, so read it with `git log --oneline origin/main..HEAD` and
      `git diff origin/main...HEAD` instead of the uncommitted diff, and ignore `.dovo/run`. The
      prompt's stop when nothing is uncommitted does not apply here: always rewrite both files.
      End .agentic/pr-description with the closing lines between the two markers below, one or
      two of them, exactly as given and in this order, each on a line of its own. Use no other
      closing keyword (Fixes, Closes, Resolves) anywhere else in the description.
      --- closing lines ---
      {{ steps.next.outputs.closing_lines }}
      --- end of closing lines ---
      Do not touch .agentic/commit-msg or .agentic/pr-branch, and do not commit, stage or push.
    tools: { allow_all: true }
    timeout_seconds: 900
    artifacts:
      - { name: pr-description, path: .agentic/pr-description }

  # A command step, not an agent step: it inherits the host environment, so git
  # reaches the user's SSH agent, which agent steps never see.
  - id: push
    name: Push and open the PR
    run: uv run python scripts/pr.py
    timeout_seconds: 600

  # Pauses on failure rather than finishing without the comment: retry after a
  # GitHub error, or continue when the publisher refused a review that no
  # longer matches the PR head (a fix landed after the final review).
  - id: post-review
    uses: post-review

  # A command step: the issue bodies are written by the script alone, with the
  # host's gh credentials. Pauses on failure so a GitHub error can be retried;
  # the PR is already open.
  - id: land
    name: Record the slice as landed and apply the sweep
    run: >-
      uv run python .dovo/catalog/scripts/sdlc/v2/workplan.py land --issue ${{ inputs.issue }}
      --slice {{ steps.next.outputs.slice }} --session "$DOVO_SESSION_ID"
      --pr "$(head -n 1 .agentic/pr-url | sed 's#.*/##')"
      --report .agentic/slice-report.md --plan .agentic/plan.json --base-plan .agentic/epic-plan.json
      --sweep .agentic/sweep.json
    timeout_seconds: 300
    on_failure: prompt_user
