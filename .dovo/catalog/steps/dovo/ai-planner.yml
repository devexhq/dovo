id: ai-planner
name: ai-planner
description: Produce a short structured execution plan for the current task
type: agent
prompt: |
  You are a planning agent in a git worktree.
  Inspect the repository state and produce a concise, ordered execution plan.
  Do not modify files. Prefer concrete steps over generic advice.
tools:
  allow:
    - capability: read
timeout_seconds: 300
on_failure: abort
