id: post-review
name: Post the review to the PR
description: >-
  Post the reviewed commit's findings as one pull request review, inline where the diff
  allows and in the review body otherwise, then post or update the pull request's one
  dovo-review comment from .agentic/review.json and review.md, stamped with this run's dovo
  session, for the pull request whose URL is the first line of .agentic/pr-url
type: command
command: uv run python scripts/publish_review.py --pr "$(head -n 1 .agentic/pr-url)" --session "$DOVO_SESSION_ID"
timeout_seconds: 120
on_failure: prompt_user
