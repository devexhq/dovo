name: pre-commit
description: Run the pre-commit process, lint, format, tests
use_sandbox: false

steps:
  - id: check-lint
    name: Lint code
    run: uv run ruff check --fix .
    on_failure: abort

  - id: check-format
    name: Format check
    run: uv run ruff format .
    on_failure: abort

  - id: run-tests
    name: Run tests
    run: uv run inv test
    on_failure: abort
