version: "1.0"
name: "review-fix"
id: "review-fix"
description: "Iteratively remediate review findings until trigger passes"
timeout_seconds: 600

steps:
  - id: dev-cycle
    type: loop
    max_iterations: 5
    until:
      - "steps.review-check.exit_code == 0"
    on_max_iterations: prompt_user
    do:
      - id: review-check
        run: dovo-internal-review-check
        on_failure: continue

      - id: ai-remediate
        uses: dovo/ai-code-patcher
        on_failure: abort
