[pytest]
testpaths = e2e
python_files = test_*.py
python_classes = *Tests Test*
python_functions = test_*
addopts = -q --strict-markers --strict-config
markers =
    e2e: End-to-end tests invoking the installed dovo binary
    llm: Tests requiring live LLM provider execution
    fixture: Tests requiring a cloned fixture workspace
    slow: Long-running scenario tests
filterwarnings =
    error
